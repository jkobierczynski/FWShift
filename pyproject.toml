[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fwshift"
description = "FWShift: multi-vendor firewall policy converter, auditor and zone matrix (PAN-OS, FortiOS, Check Point, Cisco ASA, Cisco Secure Firewall, Sophos Firewall, pfSense, iptables) with a lossiness report"
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Jurgen Kobierczynski" }]
keywords = ["firewall", "migration", "palo alto", "pan-os", "fortinet", "fortigate", "fortios", "check point", "cisco", "asa", "secure firewall", "firepower", "ftd", "fmc", "fdm", "sophos", "sfos", "xg", "pfsense", "iptables", "audit", "shadowed rules", "zone matrix", "iec 62443", "zones and conduits"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Telecommunications Industry",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking :: Firewalls",
]
dependencies = []
dynamic = ["version"]

[project.optional-dependencies]
dev = ["pytest>=7", "mypy>=1.8"]

[project.scripts]
fwshift = "fwshift.cli:main"

[tool.setuptools.dynamic]
version = { attr = "fwshift.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
strict = true
files = ["src/fwshift"]
