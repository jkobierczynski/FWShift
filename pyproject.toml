[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fwshift"
description = "Converts firewall policies between 25 platforms (PAN-OS, FortiOS, Check Point, Cisco, Juniper, cloud security groups, Linux and more), says rule by rule how faithful the result is, and audits policies against a zone and conduit model"
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Jurgen Kobierczynski" }]
keywords = ["firewall", "migration", "palo alto", "pan-os", "fortinet", "fortigate", "fortios", "check point", "cisco", "asa", "secure firewall", "firepower", "ftd", "fmc", "fdm", "sophos", "sfos", "xg", "pfsense", "sonicwall", "sonicos", "watchguard", "fireware", "barracuda", "cloudgen", "juniper", "srx", "junos", "iptables", "nftables", "nsx", "aws", "azure", "google cloud", "terraform", "mikrotik", "routeros", "opnsense", "forcepoint", "ios", "huawei", "stormshield", "meraki", "audit", "shadowed rules", "zone matrix", "iec 62443", "zones and conduits"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Telecommunications Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Networking :: Firewalls",
]
dependencies = []
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/jkobierczynski/FWShift"
Documentation = "https://github.com/jkobierczynski/FWShift/blob/HEAD/docs/MANUAL.md"
Changelog = "https://github.com/jkobierczynski/FWShift/blob/HEAD/DEVELOPMENT.md"
Issues = "https://github.com/jkobierczynski/FWShift/issues"
Source = "https://github.com/jkobierczynski/FWShift"

[project.optional-dependencies]
dev = ["pytest>=7", "mypy>=1.8"]

[project.scripts]
fwshift = "fwshift.cli:main"

[tool.setuptools.dynamic]
version = { attr = "fwshift.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
strict = true
files = ["src/fwshift"]
