[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fwshift"
description = "FWShift: multi-vendor firewall policy converter (PAN-OS, FortiOS, Check Point, iptables) with a lossiness report"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Jurgen Kobierczynski" }]
keywords = ["firewall", "migration", "palo alto", "pan-os", "fortinet", "fortigate", "fortios", "check point", "iptables"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Telecommunications Industry",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking :: Firewalls",
]
dependencies = []
dynamic = ["version"]

[project.optional-dependencies]
dev = ["pytest>=7", "mypy>=1.8"]

[project.scripts]
fwshift = "fwshift.cli:main"

[tool.setuptools.dynamic]
version = { attr = "fwshift.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
strict = true
files = ["src/fwshift"]
