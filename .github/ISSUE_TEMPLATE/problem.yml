name: Something does not work
description: A conversion, an audit or a loader that fails or gives a wrong result
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not paste or attach a configuration, a report or an output file from a real network, anonymised or not.**
        Addresses, names, comments and the shape of a policy tell an attacker a lot, and FWShift's test data is
        synthetic by rule. Describe the problem in words, or with a few lines you write yourself using addresses from
        192.0.2.0/24, 198.51.100.0/24, 203.0.113.0/24, 10.0.0.0/8 or 2001:db8::/32.
  - type: input
    id: version
    attributes:
      label: FWShift version
      description: The output of `fwshift --version`.
      placeholder: fwshift 0.31.1
    validations:
      required: true
  - type: input
    id: platforms
    attributes:
      label: Source and target
      description: The platforms and their versions, and the command you ran (without file names that say something).
      placeholder: "PAN-OS 11.1 to FortiOS 7.4: fwshift convert running.xml --to fortios"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
      description: The error message as FWShift printed it, or the finding codes of the report, and what the target did with the output.
    validations:
      required: true
  - type: textarea
    id: lines
    attributes:
      label: A minimal example (optional)
      description: A few lines you wrote yourself, with the addresses named above, that show the problem.
      render: text
  - type: checkboxes
    id: data
    attributes:
      label: Data
      options:
        - label: Nothing in this report comes from a real configuration.
          required: true
