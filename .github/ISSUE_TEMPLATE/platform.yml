name: The output was loaded on a device
description: What a firewall or management server accepted or refused (the most useful report there is)
labels: ["validation"]
body:
  - type: markdown
    attributes:
      value: |
        Every platform except iptables and nftables is written from documentation (see "Verified, and not" in
        DEVELOPMENT.md). What a real device does with the output settles that. **Do not paste a configuration from a
        real network**: load one of the sample conversions in `tests/data/expected`, or describe what happened.
  - type: input
    id: version
    attributes:
      label: FWShift version
      placeholder: fwshift 0.31.1
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and software version
      placeholder: "FortiGate VM, FortiOS 7.4.4"
    validations:
      required: true
  - type: input
    id: file
    attributes:
      label: What was loaded
      description: A file of tests/data/expected, or the platforms of a conversion of your own.
      placeholder: tests/data/expected/panos_to_fortios.conf
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What the device accepted and refused
      description: The commands or objects it refused, with its messages, and what the policy looked like afterwards.
    validations:
      required: true
