ASA Version 9.12(4)
!
hostname edge-fw
names
name 10.20.0.50 legacy-app
!
interface GigabitEthernet0/0
 nameif outside
 security-level 0
 ip address 203.0.113.2 255.255.255.0
!
interface GigabitEthernet0/1
 nameif inside
 security-level 100
 ip address 10.10.0.1 255.255.0.0
 ipv6 address 2001:db8:10::1/64
!
interface GigabitEthernet0/2
 nameif dmz
 security-level 50
 ip address 10.20.0.1 255.255.255.0
!
interface GigabitEthernet0/3
 nameif guest
 security-level 10
 ip address 10.30.0.1 255.255.255.0
!
interface Management0/0
 management-only
 nameif mgmt
 security-level 100
 ip address 192.168.1.1 255.255.255.0
!
object network web-srv
 host 10.20.0.10
 description Public web server
object network mail-srv
 host 10.20.0.25
object network inside-net
 subnet 10.10.0.0 255.255.0.0
object network inside-v6
 subnet 2001:db8:10::/64
object network admin-range
 range 10.10.5.10 10.10.5.20
object network updates
 fqdn v4 updates.example.com
object network web-public
 host 203.0.113.10
object network branch-net
 subnet 10.99.0.0 255.255.0.0
object network guest-pool
 range 203.0.113.100 203.0.113.110
object service app-8443
 service tcp destination eq 8443
object service svc-http
 service tcp source eq www
object service svc-http-alt
 service tcp source eq 8080
object-group network dmz-servers
 description Servers in the DMZ
 network-object object web-srv
 network-object object mail-srv
 network-object host legacy-app
object-group network internal
 network-object object inside-net
 network-object 10.40.0.0 255.255.0.0
 group-object dmz-servers
object-group service web-ports tcp
 port-object eq www
 port-object eq https
 port-object range 8000 8010
object-group service mail-services
 service-object tcp destination eq smtp
 service-object tcp destination eq 587
 service-object object app-8443
object-group service dns-ntp
 service-object tcp-udp destination eq domain
 service-object udp destination eq ntp
object-group protocol tcp-udp
 protocol-object tcp
 protocol-object udp
object-group icmp-type ping-types
 icmp-object echo
 icmp-object echo-reply
!
access-list outside_access_in remark Published web server
access-list outside_access_in extended permit tcp any object web-srv eq 8080
access-list outside_access_in extended permit object-group mail-services any object mail-srv log
access-list outside_access_in extended permit icmp any any object-group ping-types
access-list outside_access_in extended deny ip any any log
access-list inside_access_in extended permit object-group dns-ntp object inside-net any
access-list inside_access_in extended permit tcp object-group internal any object-group web-ports
access-list inside_access_in extended permit tcp object admin-range object-group dmz-servers eq ssh
access-list inside_access_in remark Software updates during office hours
access-list inside_access_in extended permit tcp object inside-net object updates eq https time-range business-hours
access-list inside_access_in extended permit ip object inside-v6 any6
access-list inside_access_in extended permit object-group tcp-udp object inside-net host legacy-app eq sip
access-list inside_access_in extended permit tcp user LOCAL\alice object inside-net any eq 3389
access-list inside_access_in extended deny tcp any any eq telnet inactive
access-list inside_access_in extended permit icmp object inside-net any echo
access-list dmz_access_in extended permit udp object-group dmz-servers any eq domain
access-list dmz_access_in extended permit tcp object mail-srv gt 1023 any eq smtp
access-list dmz_access_in extended deny ip any object inside-net
access-list dmz_access_in extended permit tcp object web-srv any eq https
access-list vpn_split standard permit 10.10.0.0 255.255.0.0
access-list branch_vpn extended permit ip 10.10.0.0 255.255.0.0 10.99.0.0 255.255.0.0
!
nat (inside,outside) source static inside-net inside-net destination static branch-net branch-net no-proxy-arp route-lookup description VPN to the branch
nat (dmz,outside) source static web-srv web-public service svc-http-alt svc-http
!
object network mail-srv
 nat (dmz,outside) static 203.0.113.25
object network inside-net
 nat (inside,outside) dynamic interface
!
nat (guest,outside) after-auto source dynamic any pat-pool guest-pool
!
access-group outside_access_in in interface outside
access-group inside_access_in in interface inside
access-group dmz_access_in in interface dmz
route outside 0.0.0.0 0.0.0.0 203.0.113.1 1
route inside 10.40.0.0 255.255.0.0 10.10.0.254 1
crypto map outside_map 10 match address branch_vpn
crypto map outside_map interface outside
time-range business-hours
 periodic weekdays 8:00 to 18:00
!
: end
