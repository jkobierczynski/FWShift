#TMSH-VERSION: 17.1.0
# Synthetic configuration of a BIG-IP with AFM in Firewall mode (FWShift test data). Addresses are from
# RFC 1918, RFC 5737 and RFC 3849 only.

sys db tm.fw.defaultaction {
    value "drop"
}
sys db tm.rejectunmatched {
    value "true"
}
net vlan /Common/external {
    interfaces {
        1.1 { }
    }
    tag 4094
}
net vlan /Common/internal {
    interfaces {
        1.2 { }
    }
    tag 4093
}
net vlan /Common/dmz {
    interfaces {
        1.3 { }
    }
    tag 4092
}
net route-domain /Common/0 {
    fw-enforced-policy /Common/rd0_policy
    id 0
    vlans {
        /Common/dmz
        /Common/external
        /Common/internal
    }
}
net self /Common/self_external {
    address 203.0.113.2/24
    allow-service none
    fw-enforced-policy /Common/self_policy
    traffic-group /Common/traffic-group-local-only
    vlan /Common/external
}
net self /Common/self_internal {
    address 10.10.0.2/16
    allow-service {
        default
    }
    traffic-group /Common/traffic-group-local-only
    vlan /Common/internal
}
security firewall address-list /Common/blocklist {
    addresses {
        198.51.100.0/24 { }
        203.0.113.200-203.0.113.220 { }
    }
    description "sources that are never let in"
}
security firewall address-list /Common/admins {
    addresses {
        10.10.5.0/24 {
            description "jump hosts"
        }
        10.10.6.10 { }
        2001:db8:10:5::/64 { }
    }
}
security firewall address-list /Common/web_servers {
    addresses {
        203.0.113.10 { }
        2001:db8:203::10 { }
    }
}
security firewall address-list /Common/inside {
    address-lists {
        /Common/admins
    }
    addresses {
        10.10.0.0/16 { }
    }
}
security firewall address-list /Common/partners {
    fqdns {
        partner.example.com { }
    }
    geo {
        NL { }
    }
}
security firewall port-list /Common/web_ports {
    ports {
        80 { }
        443 { }
    }
}
security firewall port-list /Common/mgmt_ports {
    port-lists {
        /Common/web_ports
    }
    ports {
        22 { }
        8443 { }
    }
}
security firewall schedule /Common/office_hours {
    daily-hour-end 18:00
    daily-hour-start 08:00
}
security firewall rule-list /Common/outbound_rules {
    rules {
        allow_dns_out {
            action accept-decisively
            ip-protocol udp
            source {
                vlans {
                    /Common/internal
                }
            }
            destination {
                ports {
                    53 { }
                }
            }
        }
        allow_web_out {
            action accept-decisively
            ip-protocol tcp
            source {
                address-lists {
                    /Common/inside
                }
                vlans {
                    /Common/internal
                }
            }
            destination {
                port-lists {
                    /Common/web_ports
                }
            }
            log yes
        }
    }
}
security firewall policy /Common/global_policy {
    rules {
        block_bad {
            action drop
            source {
                address-lists {
                    /Common/blocklist
                }
            }
            log yes
        }
        admins_continue {
            action accept
            source {
                address-lists {
                    /Common/admins
                }
            }
            description "admins skip the rest of the global rules"
        }
        reject_telnet {
            action reject
            ip-protocol tcp
            destination {
                ports {
                    23 { }
                }
            }
        }
        ping_in {
            action accept-decisively
            ip-protocol icmp
            icmp {
                8:0 { }
            }
            destination {
                address-lists {
                    /Common/web_servers
                }
            }
        }
        old_rule {
            action accept-decisively
            ip-protocol tcp
            destination {
                ports {
                    21 { }
                }
            }
            status disabled
        }
        office_ssh {
            action accept-decisively
            ip-protocol tcp
            source {
                vlans {
                    /Common/internal
                }
            }
            destination {
                address-lists {
                    /Common/web_servers
                }
                ports {
                    22 { }
                }
            }
            schedule /Common/office_hours
            status scheduled
        }
        partners_in {
            action accept-decisively
            ip-protocol tcp
            source {
                address-lists {
                    /Common/partners
                }
            }
            destination {
                port-lists {
                    /Common/mgmt_ports
                }
            }
        }
        inspect_irule {
            action accept
            ip-protocol tcp
            destination {
                ports {
                    8080 { }
                }
            }
            irule /Common/flow_check
        }
    }
}
security firewall policy /Common/rd0_policy {
    rules {
        outbound {
            rule-list /Common/outbound_rules
        }
        dmz_no_inside {
            action drop
            source {
                vlans {
                    /Common/dmz
                }
            }
            destination {
                address-lists {
                    /Common/inside
                }
            }
        }
    }
}
security firewall policy /Common/web_policy {
    rules {
        web_in {
            action accept
            ip-protocol tcp
            destination {
                port-lists {
                    /Common/web_ports
                }
            }
        }
        ping_vs {
            action accept
            ip-protocol icmp
        }
        web6_in {
            action accept
            ip-protocol tcp
            source {
                addresses {
                    2001:db8:ff::/48 { }
                }
            }
        }
    }
}
security firewall policy /Common/dns_policy {
    rules {
        dns_from_partners {
            action accept
            ip-protocol udp
            source {
                addresses {
                    192.0.2.0/24 { }
                }
            }
        }
    }
}
security firewall policy /Common/self_policy {
    rules {
        bgp_peer {
            action accept
            ip-protocol tcp
            source {
                addresses {
                    203.0.113.1 { }
                }
            }
        }
    }
}
security firewall policy /Common/next_policy {
    rules {
        test_only {
            action drop
            ip-protocol tcp
            destination {
                ports {
                    3389 { }
                }
            }
        }
    }
}
security firewall global-rules {
    enforced-policy /Common/global_policy
    staged-policy /Common/next_policy
}
security firewall management-ip-rules {
    rules {
        mgmt_ssh {
            action accept
            ip-protocol tcp
            destination {
                ports {
                    22 { }
                }
            }
        }
    }
}
ltm rule /Common/flow_check {
when FLOW_INIT {
    if { [IP::client_addr] equals "10.10.9.9" } {
        log local0. "odd \{ brace"
        drop
    }
}
}
ltm pool /Common/web_pool {
    members {
        /Common/10.20.0.11:443 {
            address 10.20.0.11
        }
    }
}
ltm virtual /Common/vs_web {
    destination /Common/203.0.113.10:443
    fw-enforced-policy /Common/web_policy
    ip-protocol tcp
    mask 255.255.255.255
    pool /Common/web_pool
    profiles {
        /Common/tcp { }
    }
    source 0.0.0.0/0
    source-address-translation {
        type automap
    }
    translate-address enabled
    translate-port enabled
    vlans {
        /Common/external
    }
    vlans-enabled
}
ltm virtual /Common/vs_web_http {
    destination /Common/203.0.113.10:http
    ip-protocol tcp
    mask 255.255.255.255
    reject
    source 0.0.0.0/0
    vlans {
        /Common/external
    }
    vlans-enabled
}
ltm virtual /Common/vs_web6 {
    destination /Common/2001:db8:203::10.443
    fw-enforced-policy /Common/web_policy
    ip-protocol tcp
    mask ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
    source ::/0
    translate-address disabled
    vlans {
        /Common/external
    }
    vlans-enabled
}
ltm virtual /Common/vs_dns {
    destination /Common/203.0.113.53:domain
    fw-enforced-policy /Common/dns_policy
    ip-protocol udp
    mask 255.255.255.255
    source 0.0.0.0/0
    translate-address disabled
}
ltm virtual /Common/vs_old_app {
    destination /Common/203.0.113.60:8080
    disabled
    ip-protocol tcp
    mask 255.255.255.255
    source 0.0.0.0/0
}
ltm virtual /Common/vs_outbound {
    destination /Common/0.0.0.0:any
    ip-forward
    mask any
    source 0.0.0.0/0
    translate-address disabled
    translate-port disabled
    vlans {
        /Common/internal
        /Common/dmz
    }
    vlans-enabled
}
ltm virtual /Common/vs_inbound_dmz {
    destination /Common/192.168.50.0:any
    ip-forward
    mask 255.255.255.0
    source 0.0.0.0/0
    translate-address disabled
    translate-port disabled
    vlans {
        /Common/internal
    }
    vlans-disabled
}
