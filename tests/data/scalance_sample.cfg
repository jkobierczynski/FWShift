! Synthetic SCALANCE SC646-2C CLI configuration, written for the FWShift tests.
! Addresses are from RFC 1918, RFC 5737 and RFC 3849.
configure terminal
system name cell-fw-01.example.net
vlan 1
name production
exit
vlan 2
name office
exit
vlan 3
name dmz
exit
interface vlan 1
ip address 192.168.10.1 255.255.255.0
exit
interface vlan 2
ip address 198.51.100.2 255.255.255.0
exit
interface vlan 3
ip address 192.168.30.1 255.255.255.0
exit
ip route 10.20.0.0 255.255.0.0 192.168.10.254
firewall
idle timeout tcp 3600
service name OPC-UA proto tcp src all dst port 4840
service name S7COMM proto tcp src all dst port 102
service name MODBUS proto tcp src all dst port 502
service name SYSLOG proto udp src all dst port 514
service name HIGHPORTS proto tcp src range 1024 - 65535 dst range 8000 - 8100
service name HTTPS proto udp src all dst port 443
service name HTTPS set prot tcp
icmp name PING type 8 code 0 ver ipv4
icmp name PING6 type 128 code 0 ver ipv6
icmp name UNREACH type 3 code 4 ver ipv4
proto name GRE num 47
ipv4rule from vlan 2 to vlan 1 srcip 198.51.100.10 dstip 192.168.10.20 action acc service OPC-UA log info prior 10
ipv4rule from vlan 2 to vlan 1 srcip 198.51.100.0/24 dstip 192.168.10.0/24 action drop service S7COMM log war prior 5
ipv4rule from vlan 2 to vlan 1 srcip 198.51.100.40-198.51.100.49 dstip 192.168.10.30 action acc service MODBUS log no prior 20
ipv4rule from vlan 1 to vlan 2 srcip 192.168.10.0/24 dstip 198.51.100.200 action acc service SYSLOG
ipv4rule from vlan 1 to vlan 2 srcip 192.168.10.0/24 dstip 0.0.0.0/0 action acc service PING log no prior 30
ipv4rule from vlan 2 to vlan 3 srcip 0.0.0.0/0 dstip 192.168.30.10 action acc service HTTPS log info prior 40
ipv4rule from vlan 2 to vlan 3 srcip 0.0.0.0/0 dstip 192.168.30.64 - 192.168.30.67 action acc service HIGHPORTS prior 40
ipv4rule from vlan 3 to vlan 1 srcip 192.168.30.0/24 dstip 192.168.10.0/24 action rej log cri prior 50
ipv4rule from vlan 1 to vlan 3 srcip 192.168.10.0/24 dstip 192.168.30.0/24 action acc service GRE prior 50
ipv4rule from vlan 1 to device srcip 192.168.10.0/24 dstip 192.168.10.1 action acc service OPC-UA prior 1
ipv4rule from vlan 2 to vlan 1 srcip DYNAMIC dstip 192.168.10.40 action acc service MODBUS prior 60
ipv4rule from vlan 2 to vlan 1 srcip 0.0.0.0/0 dstip 192.168.10.50 action acc service ENIP prior 60
ipv4rule from ipsecALL to vlan 1 srcip 10.30.0.0/16 dstip 192.168.10.0/24 action acc service S7COMM log info prior 70
ipv4rule from vlan 2 to vlan 1 srcip 198.51.100.77 dstip 192.168.10.60 action acc service OPC-UA prior 80
ipv4rule idx 14 set ruleset maintenance
ipv4rule from vlan 3 to vlan 2 srcip 192.168.30.0/24 dstip 0.0.0.0/0 action acc service UNREACH log no prior 90
ipv6rule from vlan 2 to vlan 1 srcip 2001:db8:2::/64 dstip 2001:db8:1::10 action acc service OPC-UA log info prior 10
ipv6rule from vlan 1 to vlan 2 srcip 2001:db8:1::/64 dstip ::/0 action acc service PING6 prior 20
prerule ssh ipv4 int vlan 1 enabled
prerule https ipv4 int vlan 2 disabled
ruleset name maintenance
exit
firewallnat
napt srcint vlan 2 proto tcp type ipv4 dstip auto transip 192.168.30.10 dstport 8443 transport 443
napt srcint vlan 2 proto udp type ipv4 dstip 198.51.100.5 transip 192.168.10.20 dstport 4840 transport 4840
netmap destination srcint vlan 2 dstint vlan 3 type ipv4 srcip 0.0.0.0/0 dstip 198.51.100.64/30 transip 192.168.30.64/30
src-nat srcint vlan 1 dstint vlan 2 type ipv4 srcip 192.168.10.0/24 dstip 0.0.0.0/0 transip 198.51.100.3
masquerading vlan 2
exit
end
