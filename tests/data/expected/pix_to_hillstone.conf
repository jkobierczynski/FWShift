policy-global
  rule id 10000
    name "FWS_outside_in-1"
    action permit
    src-zone "FWS_outside"
    dst-zone "dmz"
    src-addr "Any"
    dst-ip 203.0.113.10/32
    service "FWS_web-ports"
    description "Published servers, by their global addresses"
  exit
  rule id 10001
    name "FWS_outside_in-2"
    action permit
    src-zone "FWS_outside"
    dst-zone "dmz"
    src-addr "Any"
    dst-ip 203.0.113.25/32
