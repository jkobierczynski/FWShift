ip vrouter "trust-vr"
  dnatrule id 10000 from "FWS_nat-nat0-inside-1-from" to "FWS_nat-nat0-inside-1-to" service "Any" no-trans
  snatrule id 10000 from "FWS_nat-nat0-inside-1-from" to "FWS_nat-nat0-inside-1-to" service "Any" no-trans
  snatrule id 10001 from "FWS_nat-static-1-inside" to "Any" service "Any" trans-to address-book "FWS_nat-static-1-outside" mode static
  dnatrule id 10001 from "Any" to "FWS_nat-static-1-outside" service "Any" trans-to "FWS_nat-static-1-inside"
  snatrule id 10002 from "FWS_nat-static-2-inside" to "Any" service "Any" trans-to address-book "FWS_nat-static-2-outside" mode static
  dnatrule id 10002 from "Any" to "FWS_nat-static-2-outside" service "Any" trans-to "FWS_nat-static-2-inside"
  dnatrule id 10003 from "FWS_nat-static-4-from" to "Any" service "Any" no-trans
  snatrule id 10003 from "FWS_nat-static-4-from" to "Any" service "Any" no-trans
  dnatrule id 10004 from "FWS_nat-nat0-inside-1-from" to "Any" service "Any" no-trans
  snatrule id 10004 from "FWS_nat-nat0-inside-1-from" to "Any" service "Any" no-trans
  dnatrule id 10005 from "Any" to "FWS_outside-interface" service "FWS_tcp-8443" trans-to "FWS_nat-static-3-dnat" port 443
  snatrule id 10005 from "FWS_nat-nat3-inside-1-from" to "FWS_nat-nat3-inside-1-to" service "Any" eif ethernet0 trans-to address-book "FWS_nat-nat3-inside-1-pool" mode dynamicport
  snatrule id 10006 from "FWS_nat-nat2-inside-from" to "Any" service "Any" eif ethernet0 trans-to address-book "FWS_nat-nat2-inside-pool" mode dynamicip
  snatrule id 10007 from "Any" to "Any" service "Any" eif ethernet0 trans-to eif-ip mode dynamicport
  snatrule id 10008 from "Any" to "Any" service "Any" eif ethernet2 trans-to address-book "FWS_nat-nat1-inside-dmz-pool" mode dynamicport
  snatrule id 10009 from "FWS_nat-nat1-partner-from" to "Any" service "Any" eif ethernet0 trans-to eif-ip mode dynamicport
exit
end
