configure
zone "FWS_eth1"
  description "eth1"
exit
zone "FWS_eth0"
  description "eth0"
exit
zone "FWS_eth2"
  description "eth2"
exit
zone "FWS_eth3"
  description "eth3"
exit
address "FWS_blocked"
  ip 192.0.2.128/25
  ip 198.51.100.66/32
exit
service "FWS_tcp-80_443"
  tcp dst-port 80
  tcp dst-port 443
exit
service "FWS_tcp-53_udp-53"
  tcp dst-port 53
  udp dst-port 53
exit
service "FWS_tcp-25"
  tcp dst-port 25
exit
service "FWS_ip-47"
  protocol 47
exit
service "FWS_tcp-22_3389"
  tcp dst-port 22
  tcp dst-port 3389
exit
address "FWS_admins"
  range 10.10.5.10 10.10.5.20
exit
service "FWS_icmp-8"
  icmp type 8
exit
service "FWS_tcp-502"
  tcp dst-port 502
exit
service "FWS_tcp-8443"
  tcp dst-port 8443
exit
service "FWS_tcp-25_443"
  tcp dst-port 25
  tcp dst-port 443
exit
address "FWS_dmz_v6_v6" ipv6
  ip 2001:db8:20::10/128
  ip 2001:db8:20::25/128
exit
address "FWS_not-10.0.0.0_8"
  range 0.0.0.0 9.255.255.255
  range 11.0.0.0 255.255.255.255
exit
service "FWS_tcp-443"
  tcp dst-port 443
exit
address "FWS_nat-Web_DNAT-to"
  ip 203.0.113.10/32
exit
address "FWS_nat-Web_DNAT-dnat"
  ip 10.20.0.10/32
exit
address "FWS_nat-Mail_DNAT-to"
  ip 203.0.113.25/32
exit
address "FWS_nat-Mail_DNAT-dnat"
  ip 10.20.0.25/32
exit
address "FWS_nat-No_NAT_to_partner-from"
  ip 10.10.0.0/16
exit
address "FWS_nat-No_NAT_to_partner-to"
  ip 10.99.0.0/16
exit
address "FWS_nat-DMZ_out-from"
  ip 10.20.0.0/24
exit
address "FWS_nat-DMZ_out-pool"
  ip 198.51.100.20/30
exit
policy-global
  rule id 10000
    disable
    name "FWS_Banned_by_fail2ban"
    action deny
    src-addr "Any"
    dst-addr "Any"
    service "Any"
  exit
  rule id 10001
    name "FWS_Block_bad_hosts"
    action deny
    src-addr "FWS_blocked"
    dst-addr "Any"
    service "Any"
  exit
  rule id 10002
    name "FWS_Guests_stay_in"
    action deny
    src-zone "FWS_eth1"
    dst-zone "FWS_eth0"
    src-ip 10.10.200.0/24
    dst-addr "Any"
    service "Any"
  exit
  rule id 10003
    name "FWS_LAN_web"
    action permit
    src-zone "FWS_eth1"
    dst-zone "FWS_eth0"
    src-addr "Any"
    dst-addr "Any"
    service "FWS_tcp-80_443"
  exit
  rule id 10004
    name "FWS_LAN_web_v6"
    action permit
    src-zone "FWS_eth1"
    dst-zone "FWS_eth0"
    src-addr "IPv6-any"
    dst-addr "IPv6-any"
    service "FWS_tcp-80_443"
  exit
  rule id 10005
    name "FWS_LAN_DNS"
    action permit
    src-zone "FWS_eth1"
    dst-zone "FWS_eth0"
    src-addr "Any"
    dst-addr "Any"
    service "FWS_tcp-53_udp-53"
  exit
  rule id 10006
    name "FWS_LAN_DNS_v6"
    action permit
    src-zone "FWS_eth1"
    dst-zone "FWS_eth0"
    src-addr "IPv6-any"
    dst-addr "IPv6-any"
    service "FWS_tcp-53_udp-53"
  exit
  rule id 10007
    disable
    name "FWS_Rate_limited_mail"
    action permit
    src-zone "FWS_eth1"
    dst-zone "FWS_eth0"
    src-addr "Any"
    dst-addr "Any"
    service "FWS_tcp-25"
  exit
  rule id 10008
    disable
    name "FWS_Rate_limited_mail_v6"
    action permit
    src-zone "FWS_eth1"
    dst-zone "FWS_eth0"
    src-addr "IPv6-any"
    dst-addr "IPv6-any"
    service "FWS_tcp-25"
  exit
  rule id 10009
    name "FWS_Partner_tunnel"
    action permit
    src-zone "FWS_eth1"
    dst-zone "FWS_eth0"
    src-addr "Any"
    dst-addr "Any"
    service "FWS_ip-47"
  exit
  rule id 10010
    name "FWS_Partner_tunnel_v6"
    action permit
    src-zone "FWS_eth1"
    dst-zone "FWS_eth0"
    src-addr "IPv6-any"
    dst-addr "IPv6-any"
    service "FWS_ip-47"
  exit
  rule id 10011
    name "FWS_Admins_2"
    action permit
    src-zone "FWS_eth1"
    dst-zone "FWS_eth2"
    src-addr "FWS_admins"
    dst-ip 10.20.0.0/24
    service "FWS_tcp-22_3389"
  exit
  rule id 10012
    name "FWS_Ping_the_DMZ"
    action permit
    src-zone "FWS_eth1"
    dst-zone "FWS_eth2"
    src-addr "Any"
    dst-addr "Any"
    service "FWS_icmp-8"
  exit
  rule id 10013
    name "FWS_SCADA_to_PLCs"
    action permit
    src-zone "FWS_eth1"
    dst-zone "FWS_eth3"
    src-ip 10.10.7.15/32
    dst-ip 10.30.1.0/24
    service "FWS_tcp-502"
  exit
  rule id 10014
    name "FWS_OT_no_internet"
    action deny
    src-zone "FWS_eth3"
    dst-zone "FWS_eth0"
    src-addr "Any"
    dst-addr "Any"
    service "Any"
    log session-start
    log policy-deny
  exit
  rule id 10015
    name "FWS_OT_no_internet_v6"
    action deny
    src-zone "FWS_eth3"
    dst-zone "FWS_eth0"
    src-addr "IPv6-any"
    dst-addr "IPv6-any"
    service "Any"
    log session-start
    log policy-deny
  exit
  rule id 10016
    name "FWS_Inbound_web"
    action permit
    src-zone "FWS_eth0"
    dst-zone "FWS_eth2"
    src-addr "Any"
    dst-ip 10.20.0.10/32
    dst-ip 203.0.113.10/32
    service "FWS_tcp-8443"
  exit
  rule id 10017
    name "FWS_Inbound_mail"
    action permit
    src-zone "FWS_eth0"
    dst-zone "FWS_eth2"
    src-addr "Any"
    dst-ip 10.20.0.25/32
    dst-ip 203.0.113.25/32
    service "FWS_tcp-25"
  exit
  rule id 10018
    name "FWS_Inbound_IPv6_v6"
    action permit
    src-zone "FWS_eth0"
    dst-zone "FWS_eth2"
    src-addr "IPv6-any"
    dst-addr "FWS_dmz_v6_v6"
    service "FWS_tcp-25_443"
  exit
  rule id 10019
    name "FWS_DMZ_updates"
    action permit
    src-zone "FWS_eth2"
    dst-zone "FWS_eth0"
    src-addr "Any"
    dst-addr "FWS_not-10.0.0.0_8"
    service "FWS_tcp-80_443"
  exit
  rule id 10020
    disable
    name "FWS_ICMPv6_basics_v6"
    action permit
    src-addr "IPv6-any"
    dst-addr "IPv6-any"
    service "Any"
  exit
exit
ip vrouter "trust-vr"
  dnatrule id 10000 from "Any" to "FWS_nat-Web_DNAT-to" service "FWS_tcp-443" trans-to "FWS_nat-Web_DNAT-dnat" port 8443
  dnatrule id 10001 from "Any" to "FWS_nat-Mail_DNAT-to" service "Any" trans-to "FWS_nat-Mail_DNAT-dnat"
  dnatrule id 10002 from "FWS_nat-No_NAT_to_partner-from" to "FWS_nat-No_NAT_to_partner-to" service "Any" no-trans
  snatrule id 10000 from "FWS_nat-No_NAT_to_partner-from" to "FWS_nat-No_NAT_to_partner-to" service "Any" no-trans
  snatrule id 10001 from "FWS_nat-DMZ_out-from" to "Any" service "Any" eif eth0 trans-to address-book "FWS_nat-DMZ_out-pool" mode dynamicport
  snatrule id 10002 from "FWS_nat-No_NAT_to_partner-from" to "Any" service "Any" eif eth0 trans-to eif-ip mode dynamicport
exit
end
