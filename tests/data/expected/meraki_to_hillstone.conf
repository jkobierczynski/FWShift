ip vrouter "trust-vr"
  dnatrule id 10000 from "Any" to "FWS_nat-NAT_vpn-portal-to" service "FWS_tcp_8443" trans-to "FWS_nat-NAT_vpn-portal-dnat" port 443
  snatrule id 10000 from "FWS_nat-NAT_mail-inside" to "Any" service "Any" trans-to address-book "FWS_nat-NAT_mail-outside" mode static
  dnatrule id 10001 from "Any" to "FWS_nat-NAT_mail-outside" service "Any" trans-to "FWS_nat-NAT_mail-inside"
  dnatrule id 10002 from "Any" to "FWS_nat-NAT_scada-view-to" service "FWS_tcp_9443" trans-to "FWS_nat-NAT_scada-view-dnat" port 443
  snatrule id 10001 from "Any" to "Any" service "Any" eif wan trans-to eif-ip mode dynamicport
exit
end
