configure
zone "FWS_guest"
  description "guest"
exit
address "FWS_watched"
  ip 192.0.2.66/32
  ip 198.51.100.0/24
exit
address "FWS_watched_v6" ipv6
  ip 2001:db8:10::/48
exit
service "FWS_web-all"
  tcp dst-port 80
  tcp dst-port 443
  tcp dst-port 8080 8081
exit
address "FWS_lan-net"
  ip 10.10.0.0/16
exit
service "FWS_junos-https"
  tcp dst-port 443
exit
address "FWS_updates"
  host "updates.example.com"
exit
service "FWS_app-ping"
  icmp type 8
exit
service "FWS_app-web-alt"
  tcp dst-port 8080 8081
exit
address "FWS_web-srv"
  ip 10.20.0.80/32
exit
service "FWS_junos-smtp"
  tcp dst-port 25
exit
service "FWS_app-mail-sub"
  tcp dst-port 587
  tcp dst-port 465
exit
address "FWS_mail-srv"
  ip 10.20.0.25/32
exit
service "FWS_junos-ssh"
  tcp dst-port 22
exit
address "FWS_admin-range"
  range 10.10.5.10 10.10.5.20
exit
address "FWS_dmz-net__dmz-book_"
  ip 10.20.0.0/24
exit
service "FWS_app-gre"
  protocol 47
exit
address "FWS_not-servers"
  range 0.0.0.0 10.20.0.24
  range 10.20.0.26 10.20.0.79
  range 10.20.0.81 255.255.255.255
exit
address "FWS_lan-net__dmz-book_"
  ip 10.20.0.64/26
exit
service "FWS_junos-dns-udp"
  udp dst-port 53
exit
service "FWS_app-ntp"
  udp dst-port 123
exit
service "FWS_junos-http"
  tcp dst-port 80
exit
address "FWS_bad"
  ip 192.0.2.66/32
  ip 198.51.100.0/24
exit
service "FWS_app-high"
  tcp dst-port 1000 2000 src-port 1024 65535
exit
address "FWS_nat-inbound_static-mail-to"
  ip 203.0.113.25/32
exit
address "FWS_nat-inbound_static-mail-dnat"
  ip 10.20.0.25/32
exit
service "FWS_NAT_from-internet_dnat-web"
  tcp dst-port 80
  udp dst-port 80
exit
address "FWS_nat-from-internet_dnat-web-to"
  ip 203.0.113.10/32
exit
address "FWS_nat-from-internet_dnat-web-dnat"
  ip 10.20.0.80/32
exit
address "FWS_nat-trust-out_snat-lan-from"
  ip 10.10.0.0/16
exit
address "FWS_nat-dmz-out_snat-dmz-from"
  ip 10.20.0.0/24
exit
address "FWS_nat-dmz-out_snat-dmz-pool"
  range 203.0.113.50 203.0.113.59
exit
policy-global
  rule id 10000
    name "FWS_block-bad"
    action deny
    src-zone "trust"
    dst-zone "untrust"
    src-addr "Any"
    dst-addr "FWS_watched"
    service "Any"
    log session-start
    log policy-deny
  exit
  rule id 10001
    name "FWS_block-bad_v6"
    action deny
    src-zone "trust"
    dst-zone "untrust"
    src-addr "IPv6-any"
    dst-addr "FWS_watched_v6"
    service "Any"
    log session-start
    log policy-deny
  exit
  rule id 10002
    name "FWS_web-out"
    action permit
    src-zone "trust"
    dst-zone "untrust"
    src-addr "FWS_lan-net"
    dst-addr "Any"
    service "FWS_web-all"
    log session-end
    description "web for the office"
  exit
  rule id 10003
    name "FWS_updates_2"
    action permit
    src-zone "trust"
    dst-zone "untrust"
    src-addr "FWS_lan-net"
    dst-addr "FWS_updates"
    service "FWS_junos-https"
  exit
  rule id 10004
    name "FWS_ping-out"
    action permit
    src-zone "trust"
    dst-zone "untrust"
    src-addr "Any"
    dst-addr "Any"
    service "FWS_app-ping"
  exit
  rule id 10005
    name "FWS_ping-out_v6"
    action permit
    src-zone "trust"
    dst-zone "untrust"
    src-addr "IPv6-any"
    dst-addr "IPv6-any"
    service "FWS_app-ping"
  exit
  rule id 10006
    name "FWS_web-in"
    action permit
    src-zone "untrust"
    dst-zone "dmz"
    src-addr "Any"
    dst-addr "FWS_web-srv"
    dst-ip 203.0.113.10/32
    service "FWS_app-web-alt"
  exit
  rule id 10007
    name "FWS_mail-in"
    action permit
    src-zone "untrust"
    dst-zone "dmz"
    src-addr "Any"
    dst-addr "FWS_mail-srv"
    dst-ip 203.0.113.25/32
    service "FWS_junos-smtp"
    service "FWS_app-mail-sub"
  exit
  rule id 10008
    name "FWS_admin"
    action permit
    src-zone "trust"
    dst-zone "dmz"
    src-addr "FWS_admin-range"
    dst-addr "FWS_dmz-net__dmz-book_"
    service "FWS_junos-ssh"
  exit
  rule id 10009
    name "FWS_not-servers_2"
    action permit
    src-zone "trust"
    dst-zone "dmz"
    src-addr "FWS_not-servers"
    dst-addr "FWS_lan-net__dmz-book_"
    service "FWS_app-gre"
  exit
  rule id 10010
    disable
    name "FWS_dmz-out"
    action permit
    src-zone "dmz"
    dst-zone "untrust"
    src-addr "FWS_dmz-net__dmz-book_"
    dst-addr "Any"
    service "FWS_junos-dns-udp"
    service "FWS_app-ntp"
  exit
  rule id 10011
    disable
    name "FWS_guest-web"
    action permit
    src-zone "FWS_guest"
    dst-zone "untrust"
    src-addr "Any"
    dst-addr "Any"
    service "FWS_junos-http"
  exit
  rule id 10012
    disable
    name "FWS_guest-ping"
    action permit
    src-zone "FWS_guest"
    dst-zone "untrust"
    src-addr "Any"
    dst-addr "Any"
    service "Any"
  exit
  rule id 10013
    disable
    name "FWS_guest-ping_v6"
    action permit
    src-zone "FWS_guest"
    dst-zone "untrust"
    src-addr "IPv6-any"
    dst-addr "IPv6-any"
    service "Any"
  exit
  rule id 10014
    name "FWS_intra"
    action permit
    src-zone "trust"
    dst-zone "trust"
    src-addr "Any"
    dst-addr "Any"
    service "Any"
  exit
  rule id 10015
    name "FWS_intra_v6"
    action permit
    src-zone "trust"
    dst-zone "trust"
    src-addr "IPv6-any"
    dst-addr "IPv6-any"
    service "Any"
  exit
  rule id 10016
    name "FWS_global-block"
    action deny
    src-addr "FWS_bad"
    dst-addr "Any"
    service "Any"
  exit
  rule id 10017
    name "FWS_global-ntp"
    action permit
    src-zone "trust"
    dst-zone "untrust"
    src-addr "Any"
    dst-addr "Any"
    service "FWS_app-ntp"
    service "FWS_app-high"
  exit
  rule id 10018
    name "FWS_global-ntp_v6"
    action permit
    src-zone "trust"
    dst-zone "untrust"
    src-addr "IPv6-any"
    dst-addr "IPv6-any"
    service "FWS_app-ntp"
    service "FWS_app-high"
  exit
exit
ip vrouter "trust-vr"
  dnatrule id 10000 from "Any" to "FWS_nat-inbound_static-mail-to" service "Any" trans-to "FWS_nat-inbound_static-mail-dnat"
  dnatrule id 10001 from "Any" to "FWS_nat-from-internet_dnat-web-to" service "FWS_NAT_from-internet_dnat-web" trans-to "FWS_nat-from-internet_dnat-web-dnat" port 8080
  snatrule id 10000 from "FWS_nat-inbound_static-mail-dnat" to "Any" service "Any" trans-to address-book "FWS_nat-inbound_static-mail-to" mode static
  snatrule id 10001 from "FWS_nat-trust-out_snat-lan-from" to "Any" service "Any" eif ge-0/0/0.0 trans-to eif-ip mode dynamicport
  snatrule id 10002 from "FWS_nat-dmz-out_snat-dmz-from" to "Any" service "Any" eif ge-0/0/0.0 trans-to address-book "FWS_nat-dmz-out_snat-dmz-pool" mode dynamicport
exit
end
