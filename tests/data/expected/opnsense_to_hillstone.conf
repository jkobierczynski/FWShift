configure
zone "FWS_WAN"
  description "WAN"
exit
zone "FWS_LAN"
  description "LAN"
exit
zone "FWS_DMZ"
  description "DMZ"
exit
zone "FWS_GUEST"
  description "GUEST"
exit
zone "FWS_VPNSITE"
  description "VPNSITE"
exit
zone "FWS_OpenVPN"
  description "OpenVPN"
exit
address "FWS_Blocklist"
  range 198.51.100.0 198.51.100.6
  range 198.51.100.8 198.51.100.255
  ip 203.0.113.128/25
exit
address "FWS_GUEST_net"
  ip 192.168.30.0/24
exit
service "FWS_tcp-25"
  tcp dst-port 25
exit
service "FWS_tcp-udp-5060"
  tcp dst-port 5060
  udp dst-port 5060
exit
address "FWS_WAN_address"
  ip 203.0.113.2/32
exit
service "FWS_tcp-22"
  tcp dst-port 22
exit
address "FWS_WebServers"
  ip 172.16.20.10/32
exit
address "FWS_WebServers_v6" ipv6
  ip 2001:db8:20::10/128
exit
service "FWS_tcp-udp-53"
  tcp dst-port 53
  udp dst-port 53
exit
service "FWS_icmp-echoreq"
  icmp type 8
exit
address "FWS_INSIDE_net"
  ip 172.16.20.0/24
  ip 192.168.10.0/24
exit
address "FWS_LAN_net"
  ip 192.168.10.0/24
exit
address "FWS_LAN_net_IPv6_v6" ipv6
  ip 2001:db8:10::/64
exit
service "FWS_WebPorts"
  tcp dst-port 80
  tcp dst-port 443
  tcp dst-port 8000 8080
exit
address "FWS_DMZ_net"
  ip 172.16.20.0/24
exit
address "FWS_not-LAN_net"
  range 0.0.0.0 192.168.9.255
  range 192.168.11.0 255.255.255.255
exit
address "FWS_DMZ_net_IPv6_v6" ipv6
  ip 2001:db8:20::/64
exit
service "FWS_tcp-443"
  tcp dst-port 443
exit
address "FWS_WebServers_IPv4"
  ip 172.16.20.10/32
exit
address "FWS_Updates"
  range 192.0.2.10 192.0.2.13
  host "updates.example.net"
exit
address "FWS_Servers_all"
  ip 172.16.20.10/32
  ip 172.16.20.20/32
exit
address "FWS_Servers_all_v6" ipv6
  ip 2001:db8:20::10/128
exit
address "FWS_Inside_nets"
  ip 172.16.20.0/24
  ip 192.168.10.0/24
exit
address "FWS_Inside_nets_v6" ipv6
  ip 2001:db8:10::/64
  ip 2001:db8:20::/64
exit
service "FWS_tcp"
  tcp dst-port 0 65535
exit
service "FWS_udp-123"
  udp dst-port 123
exit
service "FWS_tcp-2222"
  tcp dst-port 2222
exit
address "FWS_nat-SSH_to_bastion-dnat"
  ip 172.16.20.10/32
exit
address "FWS_nat-Voice_from_the_partner-from"
  ip 198.51.100.0/24
exit
address "FWS_nat-Voice_from_the_partner-dnat"
  ip 172.16.20.20/32
exit
address "FWS_nat-Mail_relay_1_1_-_inbound-to"
  ip 203.0.113.50/32
exit
address "FWS_nat-Mail_relay_1_1_-_inbound-dnat"
  ip 172.16.20.50/32
exit
address "FWS_nat-DMZ_leaves_as_.10-from"
  ip 172.16.20.0/24
exit
address "FWS_nat-DMZ_leaves_as_.10-pool"
  ip 203.0.113.10/32
exit
address "FWS_nat-Guests_leave_as_.30-from"
  ip 192.168.30.0/24
exit
address "FWS_nat-Guests_leave_as_.30-pool"
  ip 203.0.113.30/32
exit
address "FWS_nat-Automatic_outbound_NAT_on_WAN-from"
  ip 127.0.0.0/8
  ip 172.16.20.0/24
  ip 192.168.10.0/24
  ip 192.168.30.0/24
exit
policy-global
  rule id 10000
    name "FWS_Never_to_the_blocklist__floating__1"
    action deny
    dst-zone "FWS_WAN"
    src-addr "Any"
    dst-addr "FWS_Blocklist"
    service "Any"
    log session-start
    log policy-deny
  exit
  rule id 10001
    name "FWS_Never_to_the_blocklist__floating__2"
    action deny
    dst-zone "FWS_DMZ"
    src-addr "Any"
    dst-addr "FWS_Blocklist"
    service "Any"
    log session-start
    log policy-deny
  exit
  rule id 10002
    disable
    name "FWS_Never_to_the_blocklist__floating__2_1"
    action deny
    dst-zone "FWS_WAN"
    src-addr "Any"
    dst-ip 0.0.0.0/32
    service "Any"
    log session-start
    log policy-deny
  exit
  rule id 10003
    disable
    name "FWS_Never_to_the_blocklist__floating__2_2"
    action deny
    dst-zone "FWS_DMZ"
    src-addr "Any"
    dst-ip 0.0.0.0/32
    service "Any"
    log session-start
    log policy-deny
  exit
  rule id 10004
    disable
    name "FWS_Guests_never_to_the_blocklist"
    action deny
    dst-zone "FWS_WAN"
    src-addr "FWS_GUEST_net"
    dst-addr "FWS_Blocklist"
    service "Any"
    log session-start
    log policy-deny
  exit
  rule id 10005
    name "FWS_DMZ_may_not_send_mail_out__received-on_"
    action deny
    src-zone "FWS_DMZ"
    dst-zone "FWS_WAN"
    src-addr "Any"
    dst-addr "Any"
    service "FWS_tcp-25"
  exit
  rule id 10006
    name "FWS_Voice_from_the_partner_-_pass"
    action permit
    src-zone "FWS_WAN"
    src-ip 198.51.100.0/24
    dst-ip 172.16.20.20/32
    dst-addr "FWS_WAN_address"
    service "FWS_tcp-udp-5060"
    description "what the port forward passes by itself (filter rule association 'Pass')"
  exit
  rule id 10007
    name "FWS_Block_private_networks_from_WAN"
    action deny
    src-zone "FWS_WAN"
    src-ip 10.0.0.0/8
    src-ip 172.16.0.0/12
    src-ip 192.168.0.0/16
    src-ip 100.64.0.0/10
    src-ip 169.254.0.0/16
    dst-addr "Any"
    service "Any"
    description "what 'Block private networks' of the interface does on OPNsense"
  exit
  rule id 10008
    name "FWS_Block_private_networks_from_WAN_v6"
    action deny
    src-zone "FWS_WAN"
    src-ip fd00::/8
    src-ip fe80::/10
    dst-addr "IPv6-any"
    service "Any"
    description "what 'Block private networks' of the interface does on OPNsense"
  exit
  rule id 10009
    name "FWS_VPN_users_to_the_web_servers_1"
    action permit
    src-zone "FWS_OpenVPN"
    src-addr "Any"
    dst-addr "FWS_WebServers"
    service "FWS_tcp-22"
  exit
  rule id 10010
    name "FWS_VPN_users_to_the_web_servers_2"
    action permit
    src-zone "FWS_VPNSITE"
    src-addr "Any"
    dst-addr "FWS_WebServers"
    service "FWS_tcp-22"
  exit
  rule id 10011
    name "FWS_No_outside_resolver__group__1"
    action deny
    src-zone "FWS_LAN"
    src-addr "Any"
    dst-ip 192.0.2.53/32
    service "FWS_tcp-udp-53"
  exit
  rule id 10012
    name "FWS_No_outside_resolver__group__2"
    action deny
    src-zone "FWS_DMZ"
    src-addr "Any"
    dst-ip 192.0.2.53/32
    service "FWS_tcp-udp-53"
  exit
  rule id 10013
    name "FWS_Inside_may_ping__old_kind__1"
    action permit
    src-zone "FWS_LAN"
    src-addr "FWS_INSIDE_net"
    dst-addr "Any"
    service "FWS_icmp-echoreq"
  exit
  rule id 10014
    name "FWS_Inside_may_ping__old_kind__2"
    action permit
    src-zone "FWS_DMZ"
    src-addr "FWS_INSIDE_net"
    dst-addr "Any"
    service "FWS_icmp-echoreq"
  exit
  rule id 10015
    name "FWS_Default_allow_LAN_to_any_rule"
    action permit
    src-zone "FWS_LAN"
    src-addr "FWS_LAN_net"
    dst-addr "Any"
    service "Any"
  exit
  rule id 10016
    name "FWS_Default_allow_LAN_to_any_rule_v6"
    action permit
    src-zone "FWS_LAN"
    src-addr "FWS_LAN_net_IPv6_v6"
    src-ip fe80::/10
    dst-addr "IPv6-any"
    service "Any"
  exit
  rule id 10017
    name "FWS_Web_publishing"
    action permit
    src-zone "FWS_WAN"
    src-addr "Any"
    dst-addr "FWS_WebServers"
    service "FWS_WebPorts"
    log session-start
    log session-end
  exit
  rule id 10018
    name "FWS_Web_publishing_v6"
    action permit
    src-zone "FWS_WAN"
    src-addr "IPv6-any"
    dst-addr "FWS_WebServers_v6"
    service "FWS_WebPorts"
    log session-start
    log session-end
  exit
  rule id 10019
    disable
    name "FWS_DMZ_anywhere_but_LAN__disabled_"
    action permit
    src-zone "FWS_DMZ"
    src-addr "FWS_DMZ_net"
    dst-addr "FWS_not-LAN_net"
    service "Any"
  exit
  rule id 10020
    disable
    name "FWS_DMZ_ICMPv6_v6"
    action permit
    src-zone "FWS_DMZ"
    src-addr "FWS_DMZ_net_IPv6_v6"
    src-ip fe80::/10
    dst-addr "IPv6-any"
    service "Any"
  exit
  rule id 10021
    name "FWS_Servers_fetch_updates"
    action permit
    src-zone "FWS_DMZ"
    src-addr "FWS_WebServers_IPv4"
    dst-addr "FWS_Updates"
    service "FWS_tcp-443"
  exit
  rule id 10022
    name "FWS_Servers_fetch_updates_2"
    action permit
    src-zone "FWS_DMZ"
    src-addr "FWS_WebServers_IPv4"
    dst-addr "FWS_Servers_all"
    service "FWS_tcp-443"
  exit
  rule id 10023
    name "FWS_Servers_fetch_updates_3"
    action permit
    src-zone "FWS_DMZ"
    src-ip 172.16.20.20/32
    dst-addr "FWS_Updates"
    service "FWS_tcp-443"
  exit
  rule id 10024
    name "FWS_Servers_fetch_updates_4"
    action permit
    src-zone "FWS_DMZ"
    src-ip 172.16.20.20/32
    dst-addr "FWS_Servers_all"
    service "FWS_tcp-443"
  exit
  rule id 10025
    name "FWS_Guests_stay_out"
    action deny
    src-zone "FWS_GUEST"
    src-addr "Any"
    dst-addr "FWS_Inside_nets"
    service "Any"
    log session-start
    log policy-deny
  exit
  rule id 10026
    name "FWS_Guests_to_the_portal__no_protocol__both_IP_versions_"
    action permit
    src-zone "FWS_GUEST"
    src-addr "FWS_GUEST_net"
    dst-ip 192.0.2.80/32
    service "Any"
  exit
  rule id 10027
    disable
    name "FWS_DMZ_anywhere_but_LAN__disabled__2"
    action permit
    src-zone "FWS_DMZ"
    src-addr "FWS_DMZ_net"
    dst-addr "FWS_not-LAN_net"
    service "Any"
  exit
  rule id 10028
    disable
    name "FWS_Guests_interactive__tos_"
    action permit
    src-zone "FWS_GUEST"
    src-addr "FWS_GUEST_net"
    dst-addr "Any"
    service "FWS_tcp"
  exit
  rule id 10029
    name "FWS_VPN_users_to_LAN_web__old_kind__1"
    action permit
    src-zone "FWS_OpenVPN"
    src-addr "Any"
    dst-addr "FWS_LAN_net"
    service "FWS_tcp-443"
  exit
  rule id 10030
    name "FWS_VPN_users_to_LAN_web__old_kind__2"
    action permit
    src-zone "FWS_VPNSITE"
    src-addr "Any"
    dst-addr "FWS_LAN_net"
    service "FWS_tcp-443"
  exit
  rule id 10031
    name "FWS_SSH_to_bastion__rule_the_port_forward_registers_"
    action permit
    src-zone "FWS_WAN"
    src-addr "Any"
    dst-ip 172.16.20.10/32
    dst-addr "FWS_WAN_address"
    service "FWS_tcp-22"
  exit
  rule id 10032
    name "FWS_LAN_to_test_net__not_quick_"
    action deny
    src-zone "FWS_LAN"
    src-addr "Any"
    dst-ip 198.51.100.0/24
    service "Any"
  exit
  rule id 10033
    name "FWS_Time_for_everyone__floating__not_quick__1"
    action permit
    src-zone "FWS_WAN"
    src-addr "Any"
    dst-ip 192.0.2.123/32
    service "FWS_udp-123"
  exit
  rule id 10034
    name "FWS_Time_for_everyone__floating__not_quick__2"
    action permit
    src-zone "FWS_LAN"
    src-addr "Any"
    dst-ip 192.0.2.123/32
    service "FWS_udp-123"
  exit
  rule id 10035
    name "FWS_Time_for_everyone__floating__not_quick__3"
    action permit
    src-zone "FWS_DMZ"
    src-addr "Any"
    dst-ip 192.0.2.123/32
    service "FWS_udp-123"
  exit
  rule id 10036
    name "FWS_Time_for_everyone__floating__not_quick__4"
    action permit
    src-zone "FWS_GUEST"
    src-addr "Any"
    dst-ip 192.0.2.123/32
    service "FWS_udp-123"
  exit
exit
ip vrouter "trust-vr"
  dnatrule id 10000 from "Any" to "FWS_WAN_address" service "FWS_tcp-2222" trans-to "FWS_nat-SSH_to_bastion-dnat" port 22
  dnatrule id 10001 from "FWS_nat-Voice_from_the_partner-from" to "FWS_WAN_address" service "FWS_tcp-udp-5060" trans-to "FWS_nat-Voice_from_the_partner-dnat"
  dnatrule id 10002 from "Any" to "FWS_nat-Mail_relay_1_1_-_inbound-to" service "Any" trans-to "FWS_nat-Mail_relay_1_1_-_inbound-dnat"
  snatrule id 10000 from "FWS_nat-Mail_relay_1_1_-_inbound-dnat" to "Any" service "Any" eif wan trans-to address-book "FWS_nat-Mail_relay_1_1_-_inbound-to" mode static
  snatrule id 10001 from "FWS_nat-DMZ_leaves_as_.10-from" to "Any" service "Any" eif wan trans-to address-book "FWS_nat-DMZ_leaves_as_.10-pool" mode dynamicport
  snatrule id 10002 from "FWS_nat-Guests_leave_as_.30-from" to "Any" service "Any" eif wan trans-to address-book "FWS_nat-Guests_leave_as_.30-pool" mode dynamicport
  snatrule id 10003 from "FWS_nat-Automatic_outbound_NAT_on_WAN-from" to "Any" service "Any" eif wan trans-to eif-ip mode dynamicport
exit
end
