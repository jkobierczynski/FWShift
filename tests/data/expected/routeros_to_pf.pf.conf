# Generated by FWShift - review the conversion report before loading this.
# A ruleset for the pf anchor "fwshift" (OpenBSD; FreeBSD 15 and later). Check it with
# 'pfctl -vnf FILE -a fwshift', load it with 'pfctl -a fwshift -f FILE': nothing outside the anchor changes.
# The main ruleset decides where the anchor is evaluated: it needs a line 'anchor "fwshift"'.

# The interface (or interface group) of each zone.
fws_if_DMZ = "DMZ"
fws_if_LAN = "LAN"
fws_if_GUEST = "GUEST"
fws_if_WAN = "WAN"

# Tables.
table <fws_admins> const { 192.168.10.50/31 192.168.10.52/30 192.168.10.56/30 }
table <fws_dmz_web> const { 172.16.20.10 172.16.20.11 }
table <fws_mirrors> const { updates.example.com 192.0.2.80 }

# What arrives on the interface of a zone is marked with the zone.
match in on $fws_if_DMZ tag fws_DMZ
match in on $fws_if_LAN tag fws_LAN
match in on $fws_if_GUEST tag fws_GUEST
match in on $fws_if_WAN tag fws_WAN

# Destination NAT, first match, and what the rules may allow is let in: they decide when it leaves.
pass in quick on $fws_if_WAN inet proto tcp from any to 203.0.113.3 port 8443 rdr-to 172.16.20.10 port 443 label "publish web"
pass in quick on $fws_if_WAN inet proto tcp from any to 203.0.113.4 port 25 rdr-to 172.16.20.11 label "publish mail"
pass in quick on { $fws_if_DMZ $fws_if_LAN $fws_if_GUEST $fws_if_WAN } proto tcp from <fws_admins> to <fws_dmz_web> port 22 label "ssh from the admins"
pass in quick on { $fws_if_DMZ $fws_if_LAN $fws_if_GUEST $fws_if_WAN } proto tcp from <fws_admins> to <fws_dmz_web> port { 80 443 8000:8080 } label "web for everyone"
pass in quick on { $fws_if_DMZ $fws_if_LAN $fws_if_GUEST $fws_if_WAN } inet proto tcp from ! <fws_admins> to <fws_dmz_web> port { 80 443 8000:8080 } label "web for everyone-2"
pass in quick on { $fws_if_DMZ $fws_if_LAN $fws_if_GUEST $fws_if_WAN } inet proto icmp from <fws_admins> to ! self icmp-type 8 code 0 label "ping _echo_ only"
pass in quick on { $fws_if_DMZ $fws_if_LAN $fws_if_GUEST $fws_if_WAN } inet proto icmp from ! <fws_admins> to ! self icmp-type 8 code 0 label "ping _echo_ only-2"
pass in quick on $fws_if_LAN inet proto tcp from any to <fws_mirrors> port { 80 443 } label "LAN to the package mirrors"
pass in quick on $fws_if_GUEST inet proto udp from any to ! self port 53 label "guest DNS, either port"
pass in quick on $fws_if_GUEST inet proto udp from any port 53 to ! self label "guest DNS, either port-2"
pass in quick on $fws_if_GUEST inet from any to ! self label "guests to the internet"
pass in quick on $fws_if_WAN proto tcp from any to 203.0.113.3 port 8443 label "defconf: drop all from WAN not DSTNATed (allows publish web)"
pass in quick on $fws_if_WAN proto tcp from any to 203.0.113.4 port 25 label "defconf: drop all from WAN not DSTNATed (allows publish mail)"
pass in quick on { $fws_if_DMZ $fws_if_LAN $fws_if_GUEST $fws_if_WAN } inet6 proto icmp6 from any to ! self icmp6-type 128 label "ICMPv6 echo"
pass in quick on { $fws_if_DMZ $fws_if_LAN $fws_if_GUEST $fws_if_WAN } proto tcp from 2001:db8:99::/48 to 2001:db8:10::/64 port 443 label "the partners reach the web servers of the LAN by HTTPS and noth"
pass in quick on $fws_if_DMZ from any to ! self label "default"
pass in quick on $fws_if_LAN from any to ! self label "default"
pass in quick on $fws_if_GUEST from any to ! self label "default"
pass in quick on $fws_if_WAN from any to ! self label "default"

# The rules, first match, when the traffic leaves: the tag says the zone it came from.
# FWSHIFT disabled, see the report: "defconf: accept in ipsec policy" from any to any; source 0.0.0.0/0; destination any; service any; action allow
# FWSHIFT disabled, see the report: "banned scanners" from any to any; source 0.0.0.0/0; destination any; service any; action drop
match out on $fws_if_DMZ proto tcp from <fws_admins> to <fws_dmz_web> port 22 tagged fws_DMZ tag fws_ok_DMZ label "ssh from the admins"
match out on $fws_if_DMZ proto tcp from <fws_admins> to <fws_dmz_web> port 22 tagged fws_LAN tag fws_ok_LAN label "ssh from the admins"
match out on $fws_if_DMZ proto tcp from <fws_admins> to <fws_dmz_web> port 22 tagged fws_GUEST tag fws_ok_GUEST label "ssh from the admins"
match out on $fws_if_DMZ proto tcp from <fws_admins> to <fws_dmz_web> port 22 tagged fws_WAN tag fws_ok_WAN label "ssh from the admins"
match out on $fws_if_DMZ proto tcp from <fws_admins> to <fws_dmz_web> port { 80 443 8000:8080 } tagged fws_DMZ tag fws_ok_DMZ label "web for everyone"
match out on $fws_if_DMZ proto tcp from <fws_admins> to <fws_dmz_web> port { 80 443 8000:8080 } tagged fws_LAN tag fws_ok_LAN label "web for everyone"
match out on $fws_if_DMZ proto tcp from <fws_admins> to <fws_dmz_web> port { 80 443 8000:8080 } tagged fws_GUEST tag fws_ok_GUEST label "web for everyone"
match out on $fws_if_DMZ proto tcp from <fws_admins> to <fws_dmz_web> port { 80 443 8000:8080 } tagged fws_WAN tag fws_ok_WAN label "web for everyone"
match out on $fws_if_DMZ inet proto tcp from ! <fws_admins> to <fws_dmz_web> port { 80 443 8000:8080 } tagged fws_DMZ tag fws_ok_DMZ label "web for everyone-2"
match out on $fws_if_DMZ inet proto tcp from ! <fws_admins> to <fws_dmz_web> port { 80 443 8000:8080 } tagged fws_LAN tag fws_ok_LAN label "web for everyone-2"
match out on $fws_if_DMZ inet proto tcp from ! <fws_admins> to <fws_dmz_web> port { 80 443 8000:8080 } tagged fws_GUEST tag fws_ok_GUEST label "web for everyone-2"
match out on $fws_if_DMZ inet proto tcp from ! <fws_admins> to <fws_dmz_web> port { 80 443 8000:8080 } tagged fws_WAN tag fws_ok_WAN label "web for everyone-2"
match out on $fws_if_DMZ inet proto icmp from <fws_admins> to any icmp-type 8 code 0 tagged fws_DMZ tag fws_ok_DMZ label "ping _echo_ only"
match out on $fws_if_DMZ inet proto icmp from <fws_admins> to any icmp-type 8 code 0 tagged fws_LAN tag fws_ok_LAN label "ping _echo_ only"
match out on $fws_if_DMZ inet proto icmp from <fws_admins> to any icmp-type 8 code 0 tagged fws_GUEST tag fws_ok_GUEST label "ping _echo_ only"
match out on $fws_if_DMZ inet proto icmp from <fws_admins> to any icmp-type 8 code 0 tagged fws_WAN tag fws_ok_WAN label "ping _echo_ only"
match out on $fws_if_DMZ inet proto icmp from ! <fws_admins> to any icmp-type 8 code 0 tagged fws_DMZ tag fws_ok_DMZ label "ping _echo_ only-2"
match out on $fws_if_DMZ inet proto icmp from ! <fws_admins> to any icmp-type 8 code 0 tagged fws_LAN tag fws_ok_LAN label "ping _echo_ only-2"
match out on $fws_if_DMZ inet proto icmp from ! <fws_admins> to any icmp-type 8 code 0 tagged fws_GUEST tag fws_ok_GUEST label "ping _echo_ only-2"
match out on $fws_if_DMZ inet proto icmp from ! <fws_admins> to any icmp-type 8 code 0 tagged fws_WAN tag fws_ok_WAN label "ping _echo_ only-2"
# disabled in the source: "old partner access" from any to DMZ; source partners; destination any; service not tcp-any; action allow
# disabled in the source: "old partner access-2" from any to DMZ; source partners; destination any; service tcp-0-21,23-65535; action allow
match out on $fws_if_DMZ inet proto tcp from <fws_admins> to any tagged fws_DMZ tag fws_x10_DMZ
block return out quick on $fws_if_DMZ inet from <fws_admins> to any tagged fws_DMZ label "nothing but TCP"
match out tagged fws_x10_DMZ tag fws_DMZ
match out on $fws_if_DMZ inet proto tcp from <fws_admins> to any tagged fws_LAN tag fws_x10_LAN
block return out quick on $fws_if_DMZ inet from <fws_admins> to any tagged fws_LAN label "nothing but TCP"
match out tagged fws_x10_LAN tag fws_LAN
match out on $fws_if_DMZ inet proto tcp from <fws_admins> to any tagged fws_GUEST tag fws_x10_GUEST
block return out quick on $fws_if_DMZ inet from <fws_admins> to any tagged fws_GUEST label "nothing but TCP"
match out tagged fws_x10_GUEST tag fws_GUEST
match out on $fws_if_DMZ inet proto tcp from <fws_admins> to any tagged fws_WAN tag fws_x10_WAN
block return out quick on $fws_if_DMZ inet from <fws_admins> to any tagged fws_WAN label "nothing but TCP"
match out tagged fws_x10_WAN tag fws_WAN
match out on $fws_if_DMZ inet proto tcp from ! <fws_admins> to any tagged fws_DMZ tag fws_x11_DMZ
block return out quick on $fws_if_DMZ inet from ! <fws_admins> to any tagged fws_DMZ label "nothing but TCP-2"
match out tagged fws_x11_DMZ tag fws_DMZ
match out on $fws_if_DMZ inet proto tcp from ! <fws_admins> to any tagged fws_LAN tag fws_x11_LAN
block return out quick on $fws_if_DMZ inet from ! <fws_admins> to any tagged fws_LAN label "nothing but TCP-2"
match out tagged fws_x11_LAN tag fws_LAN
match out on $fws_if_DMZ inet proto tcp from ! <fws_admins> to any tagged fws_GUEST tag fws_x11_GUEST
block return out quick on $fws_if_DMZ inet from ! <fws_admins> to any tagged fws_GUEST label "nothing but TCP-2"
match out tagged fws_x11_GUEST tag fws_GUEST
match out on $fws_if_DMZ inet proto tcp from ! <fws_admins> to any tagged fws_WAN tag fws_x11_WAN
block return out quick on $fws_if_DMZ inet from ! <fws_admins> to any tagged fws_WAN label "nothing but TCP-2"
match out tagged fws_x11_WAN tag fws_WAN
# FWSHIFT disabled, see the report: "rest of the DMZ" from any to DMZ; source admins; destination not 172.16.20.0/25; service any; action drop
# FWSHIFT disabled, see the report: "rest of the DMZ-2" from any to DMZ; source 0.0.0.0-192.168.10.49,192.168.10.60-255.255.255.255; destination not 172.16.20.0/25; service not tcp-any; action drop
# FWSHIFT disabled, see the report: "rest of the DMZ-3" from any to DMZ; source 0.0.0.0-192.168.10.49,192.168.10.60-255.255.255.255; destination not 172.16.20.0/25; service tcp-0-21,23-65535; action drop
match out inet proto tcp from any to <fws_mirrors> port { 80 443 } tagged fws_LAN tag fws_ok_LAN label "LAN to the package mirrors"
block return-rst out quick inet proto tcp from any to any port { 80 443 } tagged fws_GUEST label "no other web from guests"
match out on $fws_if_WAN inet proto udp from any to any port 53 tagged fws_GUEST tag fws_ok_GUEST label "guest DNS, either port"
match out on $fws_if_WAN inet proto udp from any port 53 to any tagged fws_GUEST tag fws_ok_GUEST label "guest DNS, either port-2"
match out log on $fws_if_WAN inet from any to any tagged fws_GUEST tag fws_ok_GUEST label "guests to the internet"
# FWSHIFT disabled, see the report: "office hours for staff" from LAN to WAN; source 192.168.10.0/25; destination any; service any; action allow
block drop out log quick inet from any to any tagged fws_GUEST label "no guests elsewhere"
match out proto tcp from any to 203.0.113.3 port 8443 tagged fws_WAN tag fws_ok_WAN label "defconf: drop all from WAN not DSTNATed (allows publish web)"
match out proto tcp from any to 203.0.113.4 port 25 tagged fws_WAN tag fws_ok_WAN label "defconf: drop all from WAN not DSTNATed (allows publish mail)"
block drop out quick inet from any to any tagged fws_WAN label "defconf: drop all from WAN not DSTNATed"
match out inet6 proto icmp6 from any to any icmp6-type 128 tagged fws_DMZ tag fws_ok_DMZ label "ICMPv6 echo"
match out inet6 proto icmp6 from any to any icmp6-type 128 tagged fws_LAN tag fws_ok_LAN label "ICMPv6 echo"
match out inet6 proto icmp6 from any to any icmp6-type 128 tagged fws_GUEST tag fws_ok_GUEST label "ICMPv6 echo"
match out inet6 proto icmp6 from any to any icmp6-type 128 tagged fws_WAN tag fws_ok_WAN label "ICMPv6 echo"
match out proto tcp from 2001:db8:99::/48 to 2001:db8:10::/64 port 443 tagged fws_DMZ tag fws_ok_DMZ label "the partners reach the web servers of the LAN by HTTPS and noth"
match out proto tcp from 2001:db8:99::/48 to 2001:db8:10::/64 port 443 tagged fws_LAN tag fws_ok_LAN label "the partners reach the web servers of the LAN by HTTPS and noth"
match out proto tcp from 2001:db8:99::/48 to 2001:db8:10::/64 port 443 tagged fws_GUEST tag fws_ok_GUEST label "the partners reach the web servers of the LAN by HTTPS and noth"
match out proto tcp from 2001:db8:99::/48 to 2001:db8:10::/64 port 443 tagged fws_WAN tag fws_ok_WAN label "the partners reach the web servers of the LAN by HTTPS and noth"
block drop out quick inet6 from any to any tagged fws_DMZ label "drop everything else not coming from LAN"
block drop out quick inet6 from any to any tagged fws_GUEST label "drop everything else not coming from LAN"
block drop out quick inet6 from any to any tagged fws_WAN label "drop everything else not coming from LAN"

# What no rule decided: the default of the source.
match out tagged fws_DMZ tag fws_ok_DMZ
match out tagged fws_LAN tag fws_ok_LAN
match out tagged fws_GUEST tag fws_ok_GUEST
match out tagged fws_WAN tag fws_ok_WAN

# Source NAT, first match, of what the rules allowed.
match out on $fws_if_WAN inet from any to any tagged fws_ok_DMZ nat-to ($fws_if_WAN) tag fws_nat label "defconf: masquerade"
match out on $fws_if_WAN inet6 from any to any tagged fws_ok_DMZ nat-to ($fws_if_WAN) tag fws_nat label "defconf: masquerade"
match out on $fws_if_WAN inet from any to any tagged fws_ok_LAN nat-to ($fws_if_WAN) tag fws_nat label "defconf: masquerade"
match out on $fws_if_WAN inet6 from any to any tagged fws_ok_LAN nat-to ($fws_if_WAN) tag fws_nat label "defconf: masquerade"
match out on $fws_if_WAN inet from any to any tagged fws_ok_GUEST nat-to ($fws_if_WAN) tag fws_nat label "defconf: masquerade"
match out on $fws_if_WAN inet6 from any to any tagged fws_ok_GUEST nat-to ($fws_if_WAN) tag fws_nat label "defconf: masquerade"
match out on $fws_if_WAN inet from any to any tagged fws_ok_WAN nat-to ($fws_if_WAN) tag fws_nat label "defconf: masquerade"
match out on $fws_if_WAN inet6 from any to any tagged fws_ok_WAN nat-to ($fws_if_WAN) tag fws_nat label "defconf: masquerade"

# Pass what the rules allowed.
pass out quick tagged fws_ok_DMZ
pass out quick tagged fws_ok_LAN
pass out quick tagged fws_ok_GUEST
pass out quick tagged fws_ok_WAN
pass out quick tagged fws_nat
