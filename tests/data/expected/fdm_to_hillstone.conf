configure
zone "FWS_outside_zone"
  description "outside_zone"
exit
zone "FWS_inside_zone"
  description "inside_zone"
exit
zone "FWS_iot"
  description "iot"
exit
address "FWS_iot-net"
  ip 10.41.0.0/24
exit
address "FWS_office-lan"
  ip 10.40.0.0/24
exit
address "FWS_nas-public"
  ip 192.0.2.10/32
exit
service "FWS_web"
  tcp dst-port 80
  tcp dst-port 443
exit
service "FWS_DNS_over_UDP"
  udp dst-port 53
exit
service "FWS_HTTPS"
  tcp dst-port 443
exit
address "FWS_vendor-cloud"
  host "telemetry.example.net"
exit
service "FWS_nas-web"
  tcp dst-port 5001
exit
address "FWS_nas"
  ip 10.40.0.10/32
exit
address "FWS_outside-interface"
  ip 192.0.2.2/32
exit
service "FWS_rdp"
  tcp dst-port 3389
exit
service "FWS_echo-request"
  icmp type 8
exit
service "FWS_gre"
  protocol 47
exit
address "FWS_office-devices"
  ip 10.40.0.10/32
  range 10.40.0.200 10.40.0.220
exit
address "FWS_head-office-v6_v6" ipv6
  ip 2001:db8:1::/48
exit
service "FWS_udp-src-53-dst-1024-65535"
  udp dst-port 1024 65535 src-port 53
exit
service "FWS_port-unreachable"
  icmp type 3 code 3 3
exit
address "FWS_printers"
  range 10.40.0.200 10.40.0.220
exit
service "FWS_nas-external"
  tcp dst-port 8443
exit
address "FWS_nat-nas_static-inside"
  ip 10.40.0.10/32
exit
address "FWS_nat-nas_static-outside"
  ip 192.0.2.10/32
exit
policy-global
  rule id 10000
    name "FWS_Block_IoT_to_office"
    action deny
    src-zone "FWS_inside_zone"
    dst-zone "FWS_inside_zone"
    src-addr "FWS_iot-net"
    dst-addr "FWS_office-lan"
    dst-addr "FWS_nas-public"
    service "Any"
    log session-start
    log policy-deny
  exit
  rule id 10001
    name "FWS_Inside_Outside_web"
    action permit
    src-zone "FWS_inside_zone"
    dst-zone "FWS_outside_zone"
    src-addr "FWS_office-lan"
    dst-addr "Any"
    service "FWS_web"
    service "FWS_DNS_over_UDP"
    log session-end
  exit
  rule id 10002
    name "FWS_IoT_telemetry"
    action permit
    src-zone "FWS_inside_zone"
    dst-zone "FWS_outside_zone"
    src-addr "FWS_iot-net"
    dst-addr "FWS_vendor-cloud"
    service "FWS_HTTPS"
    log session-end
  exit
  rule id 10003
    name "FWS_NAS_from_Internet"
    action permit
    src-zone "FWS_outside_zone"
    dst-zone "FWS_inside_zone"
    src-addr "Any"
    dst-addr "FWS_nas"
    dst-addr "FWS_outside-interface"
    dst-addr "FWS_nas-public"
    service "FWS_nas-web"
    log session-end
  exit
  rule id 10004
    name "FWS_DNS_answers"
    action permit
    src-zone "FWS_outside_zone"
    dst-zone "FWS_inside_zone"
    src-addr "Any"
    dst-addr "Any"
    service "FWS_udp-src-53-dst-1024-65535"
  exit
  rule id 10005
    name "FWS_DNS_answers_v6"
    action permit
    src-zone "FWS_outside_zone"
    dst-zone "FWS_inside_zone"
    src-addr "IPv6-any"
    dst-addr "IPv6-any"
    service "FWS_udp-src-53-dst-1024-65535"
  exit
  rule id 10006
    disable
    name "FWS_Staff_streaming"
    action deny
    src-zone "FWS_inside_zone"
    dst-zone "FWS_outside_zone"
    src-addr "Any"
    dst-addr "Any"
    service "Any"
    log policy-deny
  exit
  rule id 10007
    disable
    name "FWS_Staff_streaming_v6"
    action deny
    src-zone "FWS_inside_zone"
    dst-zone "FWS_outside_zone"
    src-addr "IPv6-any"
    dst-addr "IPv6-any"
    service "Any"
    log policy-deny
  exit
  rule id 10008
    disable
    name "FWS_Guests_by_time"
    action permit
    src-zone "FWS_inside_zone"
    dst-zone "FWS_outside_zone"
    src-addr "FWS_printers"
    dst-addr "Any"
    service "FWS_port-unreachable"
    log session-end
  exit
exit
ip vrouter "trust-vr"
  dnatrule id 10000 from "Any" to "FWS_outside-interface" service "FWS_nas-external" trans-to "FWS_nas" port 5001
  snatrule id 10000 from "FWS_nat-nas_static-inside" to "Any" service "Any" trans-to address-book "FWS_nat-nas_static-outside" mode static
  dnatrule id 10001 from "Any" to "FWS_nat-nas_static-outside" service "Any" trans-to "FWS_nat-nas_static-inside"
  snatrule id 10001 from "Any" to "Any" service "Any" eif outside trans-to eif-ip mode dynamicport
exit
end
