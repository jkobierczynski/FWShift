# Generated by FWShift - review the conversion report before loading this.
# A ruleset for the pf anchor "fwshift" (OpenBSD; FreeBSD 15 and later). Check it with
# 'pfctl -vnf FILE -a fwshift', load it with 'pfctl -a fwshift -f FILE': nothing outside the anchor changes.
# The main ruleset decides where the anchor is evaluated: it needs a line 'anchor "fwshift"'.

# The interface (or interface group) of each zone.
fws_if_WAN = "WAN"
fws_if_eth1 = "eth1"
fws_if_eth2 = "eth2"
fws_if_eth3 = "eth3"
fws_if_eth4 = "eth4"

# Tables.
table <fws_Admin_PCs> const { 192.168.10.200/29 192.168.10.208/29 192.168.10.216/30 192.168.10.220 }
table <fws_Servers> const { 172.16.20.10 172.16.20.25 }

# What arrives on the interface of a zone is marked with the zone.
match in on $fws_if_WAN tag fws_WAN
match in on $fws_if_eth1 tag fws_eth1
match in on $fws_if_eth2 tag fws_eth2
match in on $fws_if_eth3 tag fws_eth3
match in on $fws_if_eth4 tag fws_eth4

# Destination NAT, first match, and what the rules may allow is let in: they decide when it leaves.
pass in quick on $fws_if_eth1 proto tcp from 192.168.10.0/24 to 0.0.0.0/0 port 80 label "LAN to Internet - internet.http"
pass in quick on $fws_if_eth1 proto tcp from 192.168.10.0/24 to 0.0.0.0/0 port 443 label "LAN to Internet - internet.https"
pass in quick on $fws_if_eth1 proto { tcp udp } from 192.168.10.0/24 to 0.0.0.0/0 port 53 label "LAN to Internet - standard.dns"
pass in quick on $fws_if_eth1 inet proto icmp from 192.168.10.0/24 to ! self label "LAN to Internet - standard.ping"
pass in quick on $fws_if_WAN proto tcp from 0.0.0.0/0 to 172.16.20.10 port 443 label "Internet to Webserver - internet.https"
pass in quick on $fws_if_eth1 proto tcp from <fws_Admin_PCs> to <fws_Servers> port 22 label "Admin-PCs to Servers - standard.ssh"
pass in quick on $fws_if_eth1 proto tcp from <fws_Admin_PCs> to <fws_Servers> port 3389 label "Admin-PCs to Servers - remote.rdp"
pass in quick on $fws_if_eth2 proto tcp from <fws_Servers> to <fws_Admin_PCs> port 3389 label "Servers to Admin-PCs - remote.rdp"
pass in quick on $fws_if_eth1 proto tcp from 192.168.10.5 to 10.30.0.0/24 port 502 label "Jump-Hosts to OT-Cell - Modbus-TCP (eth1 to eth3)"
pass in quick on $fws_if_eth3 proto tcp from 10.30.0.5 to 10.30.0.0/24 port 502 label "Jump-Hosts to OT-Cell - Modbus-TCP (eth3 to eth3)"
pass in quick on $fws_if_eth1 proto tcp from 192.168.10.0/24 to 172.16.20.25 port 25 label "LAN to Mailserver - internet.smtp"
pass in quick on $fws_if_eth2 proto 47 from 172.16.20.0/24 to 0.0.0.0/0 label "DMZ to Internet - GRE-Tunnel"
pass in quick on $fws_if_eth1 proto tcp from 192.168.10.0/24 to 172.16.20.0/24 port { 80 443 } label "LAN to DMZ - Web"
pass in quick on $fws_if_eth2 proto tcp from 172.16.20.0/24 to 192.168.10.0/24 port { 80 443 } label "DMZ to LAN - Web"
pass in quick on $fws_if_eth2 proto udp from 172.16.20.0/24 to 192.168.10.0/24 port { 500 4500 } label "DMZ to LAN - vpn.ipsec"
pass in quick on $fws_if_eth2 proto 50 from 172.16.20.0/24 to 192.168.10.0/24 label "DMZ to LAN - vpn.ipsec"

# The rules, first match, when the traffic leaves: the tag says the zone it came from.
match out on $fws_if_WAN proto tcp from 192.168.10.0/24 to 0.0.0.0/0 port 80 tagged fws_eth1 tag fws_ok_eth1 label "LAN to Internet - internet.http"
match out on $fws_if_WAN proto tcp from 192.168.10.0/24 to 0.0.0.0/0 port 443 tagged fws_eth1 tag fws_ok_eth1 label "LAN to Internet - internet.https"
match out on $fws_if_WAN proto { tcp udp } from 192.168.10.0/24 to 0.0.0.0/0 port 53 tagged fws_eth1 tag fws_ok_eth1 label "LAN to Internet - standard.dns"
match out on $fws_if_WAN inet proto icmp from 192.168.10.0/24 to any tagged fws_eth1 tag fws_ok_eth1 label "LAN to Internet - standard.ping"
match out on $fws_if_eth2 proto tcp from 0.0.0.0/0 to 172.16.20.10 port 443 tagged fws_WAN tag fws_ok_WAN label "Internet to Webserver - internet.https"
match out on $fws_if_eth2 proto tcp from <fws_Admin_PCs> to <fws_Servers> port 22 tagged fws_eth1 tag fws_ok_eth1 label "Admin-PCs to Servers - standard.ssh"
match out on $fws_if_eth2 proto tcp from <fws_Admin_PCs> to <fws_Servers> port 3389 tagged fws_eth1 tag fws_ok_eth1 label "Admin-PCs to Servers - remote.rdp"
match out on $fws_if_eth1 proto tcp from <fws_Servers> to <fws_Admin_PCs> port 3389 tagged fws_eth2 tag fws_ok_eth2 label "Servers to Admin-PCs - remote.rdp"
match out on $fws_if_eth3 proto tcp from 192.168.10.5 to 10.30.0.0/24 port 502 tagged fws_eth1 tag fws_ok_eth1 label "Jump-Hosts to OT-Cell - Modbus-TCP (eth1 to eth3)"
match out on $fws_if_eth3 proto tcp from 10.30.0.5 to 10.30.0.0/24 port 502 tagged fws_eth3 tag fws_ok_eth3 label "Jump-Hosts to OT-Cell - Modbus-TCP (eth3 to eth3)"
# FWSHIFT disabled, see the report: "HMI to OT-Cell - OPC-UA" from eth3 to eth3; source HMI; destination OT-Cell; service OPC-UA; action allow
# FWSHIFT disabled, see the report: "OT-Cell to HMI - OPC-UA" from eth3 to eth3; source OT-Cell; destination HMI; service OPC-UA; action allow
# disabled in the source: "Monitoring to OT-Cell - standard.ping" from any to eth3; source Monitoring; destination OT-Cell; service standard.ping; action allow
match out on $fws_if_eth2 proto tcp from 192.168.10.0/24 to 172.16.20.25 port 25 tagged fws_eth1 tag fws_ok_eth1 label "LAN to Mailserver - internet.smtp"
# FWSHIFT disabled, see the report: "Branch Sites to LAN - remote.rdp" from any to eth1; source any; destination LAN; service remote.rdp; action allow
# FWSHIFT disabled, see the report: "LAN to Lab-v6 - internet.http" from eth1 to any; source LAN; destination any; service internet.http; action allow
match out on $fws_if_WAN proto 47 from 172.16.20.0/24 to 0.0.0.0/0 tagged fws_eth2 tag fws_ok_eth2 label "DMZ to Internet - GRE-Tunnel"
# FWSHIFT disabled, see the report: "DMZ to Internet - Legacy-App" from eth2 to WAN; source DMZ; destination Internet; service Legacy-App; action allow
# FWSHIFT disabled, see the report: "DMZ to Internet - standard.ssh" from eth2 to WAN; source DMZ; destination Internet; service standard.ssh; action allow
# FWSHIFT disabled, see the report: "Internet to ? - internet.https" from WAN to any; source Internet; destination any; service internet.https; action allow
match out on $fws_if_eth2 proto tcp from 192.168.10.0/24 to 172.16.20.0/24 port { 80 443 } tagged fws_eth1 tag fws_ok_eth1 label "LAN to DMZ - Web"
match out on $fws_if_eth1 proto tcp from 172.16.20.0/24 to 192.168.10.0/24 port { 80 443 } tagged fws_eth2 tag fws_ok_eth2 label "DMZ to LAN - Web"
match out on $fws_if_eth1 proto udp from 172.16.20.0/24 to 192.168.10.0/24 port { 500 4500 } tagged fws_eth2 tag fws_ok_eth2 label "DMZ to LAN - vpn.ipsec"
match out on $fws_if_eth1 proto 50 from 172.16.20.0/24 to 192.168.10.0/24 tagged fws_eth2 tag fws_ok_eth2 label "DMZ to LAN - vpn.ipsec"
# FWSHIFT disabled, see the report: "Printer to DMZ - internet.http" from any to eth2; source any; destination DMZ; service internet.http; action allow

# What no rule decided: the default of the source.
block drop out quick tagged fws_WAN
block drop out quick tagged fws_eth1
block drop out quick tagged fws_eth2
block drop out quick tagged fws_eth3
block drop out quick tagged fws_eth4

# Source NAT, first match, of what the rules allowed.
match out on $fws_if_WAN inet proto tcp from 192.168.10.0/24 to any port 80 tagged fws_ok_eth1 nat-to ($fws_if_WAN) tag fws_nat label "LAN to Internet - internet.http (NAT)"
match out on $fws_if_WAN inet proto tcp from 192.168.10.0/24 to any port 443 tagged fws_ok_eth1 nat-to ($fws_if_WAN) tag fws_nat label "LAN to Internet - internet.https (NAT)"
match out on $fws_if_WAN inet proto { tcp udp } from 192.168.10.0/24 to any port 53 tagged fws_ok_eth1 nat-to ($fws_if_WAN) tag fws_nat label "LAN to Internet - standard.dns (NAT)"
match out on $fws_if_WAN inet proto icmp from 192.168.10.0/24 to any tagged fws_ok_eth1 nat-to ($fws_if_WAN) tag fws_nat label "LAN to Internet - standard.ping (NAT)"
match out on $fws_if_WAN inet proto 47 from 172.16.20.0/24 to any tagged fws_ok_eth2 nat-to ($fws_if_WAN) tag fws_nat label "DMZ to Internet - GRE-Tunnel (NAT)"

# Pass what the rules allowed.
pass out quick tagged fws_ok_WAN
pass out quick tagged fws_ok_eth1
pass out quick tagged fws_ok_eth2
pass out quick tagged fws_ok_eth3
pass out quick tagged fws_ok_eth4
pass out quick tagged fws_nat
