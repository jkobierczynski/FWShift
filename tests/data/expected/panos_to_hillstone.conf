configure
zone "FWS_ot"
  description "ot"
exit
service "FWS_apps-web-browsing-ssl"
  tcp dst-port 80
  tcp dst-port 443
exit
address "FWS_lan-net"
  ip 10.10.0.0/16
exit
service "FWS_apps-dns"
  tcp dst-port 53
  udp dst-port 53
exit
address "FWS_dns-servers"
  range 192.0.2.53 192.0.2.54
exit
service "FWS_service-https"
  tcp dst-port 443
exit
address "FWS_web-public"
  ip 203.0.113.10/32
exit
service "FWS_apps-smtp"
  tcp dst-port 25
exit
address "FWS_mail-public"
  ip 203.0.113.25/32
exit
service "FWS_apps-ssh"
  tcp dst-port 22
exit
address "FWS_admin-range"
  range 10.10.5.10 10.10.5.20
exit
address "FWS_dmz-servers"
  ip 10.20.0.10/32
  ip 10.20.0.25/32
exit
service "FWS_apps-modbus-siemens-s7"
  tcp dst-port 502
  tcp dst-port 102
exit
address "FWS_eng-station"
  ip 10.10.7.15/32
exit
address "FWS_plc-net"
  ip 10.30.1.0/24
exit
service "FWS_web-ports"
  tcp dst-port 80
  tcp dst-port 8080
  tcp dst-port 443
  tcp dst-port 8443
  tcp dst-port 9000 9010
exit
service "FWS_tcp-8443"
  tcp dst-port 8443
exit
address "FWS_web-1"
  ip 10.20.0.10/32
exit
address "FWS_lan6-net_v6" ipv6
  ip 2001:db8:10::/48
exit
address "FWS_updates.example.com"
  host "updates.example.com"
exit
service "FWS_apps-ping"
  icmp type 8
exit
address "FWS_not-10.10.200.0_24"
  range 0.0.0.0 10.10.199.255
  range 10.10.201.0 255.255.255.255
exit
address "FWS_all-servers"
  ip 10.20.0.10/32
  ip 10.20.0.25/32
  range 192.0.2.53 192.0.2.54
exit
service "FWS_udp-syslog-src"
  udp dst-port 514 src-port 1024 65535
exit
address "FWS_partner-net"
  ip 10.99.0.0/16
exit
address "FWS_nat-Mail-Static-inside"
  ip 10.20.0.25/32
exit
address "FWS_nat-Mail-Static-outside"
  ip 203.0.113.25/32
exit
address "FWS_snat-pool"
  ip 198.51.100.20/30
exit
policy-global
  rule id 10000
    name "FWS_Allow-Web-Out"
    action permit
    src-zone "trust"
    dst-zone "untrust"
    src-addr "FWS_lan-net"
    dst-addr "Any"
    service "FWS_apps-web-browsing-ssl"
    log session-end
    description "Outbound web for the office LAN"
  exit
  rule id 10001
    name "FWS_Allow-DNS_1"
    action permit
    src-zone "trust"
    dst-zone "untrust"
    src-addr "Any"
    dst-addr "FWS_dns-servers"
    service "FWS_apps-dns"
    log session-end
  exit
  rule id 10002
    name "FWS_Allow-DNS_2"
    action permit
    src-zone "dmz"
    dst-zone "untrust"
    src-addr "Any"
    dst-addr "FWS_dns-servers"
    service "FWS_apps-dns"
    log session-end
  exit
  rule id 10003
    name "FWS_Inbound-Web"
    action permit
    src-zone "untrust"
    dst-zone "dmz"
    src-addr "Any"
    dst-addr "FWS_web-public"
    service "FWS_service-https"
    log session-start
    log session-end
  exit
  rule id 10004
    name "FWS_Inbound-Mail"
    action permit
    src-zone "untrust"
    dst-zone "dmz"
    src-addr "Any"
    dst-addr "FWS_mail-public"
    service "FWS_apps-smtp"
    log session-end
  exit
  rule id 10005
    disable
    name "FWS_Admin-SSH"
    action permit
    src-zone "trust"
    dst-zone "dmz"
    src-addr "FWS_admin-range"
    dst-addr "FWS_dmz-servers"
    service "FWS_apps-ssh"
    log session-end
  exit
  rule id 10006
    name "FWS_Engineering_to_PLCs"
    action permit
    src-zone "trust"
    dst-zone "FWS_ot"
    src-addr "FWS_eng-station"
    dst-addr "FWS_plc-net"
    service "FWS_apps-modbus-siemens-s7"
    log session-end
  exit
  rule id 10007
    name "FWS_Block-OT-Outbound"
    action deny
    src-zone "FWS_ot"
    dst-zone "untrust"
    src-addr "Any"
    dst-addr "Any"
    service "Any"
    log policy-deny
  exit
  rule id 10008
    name "FWS_Block-OT-Outbound_v6"
    action deny
    src-zone "FWS_ot"
    dst-zone "untrust"
    src-addr "IPv6-any"
    dst-addr "IPv6-any"
    service "Any"
    log policy-deny
  exit
  rule id 10009
    disable
    name "FWS_Block-Torrents"
    action deny
    src-zone "trust"
    dst-zone "untrust"
    src-addr "Any"
    dst-addr "Any"
    service "Any"
    log policy-deny
  exit
  rule id 10010
    disable
    name "FWS_Block-Torrents_v6"
    action deny
    src-zone "trust"
    dst-zone "untrust"
    src-addr "IPv6-any"
    dst-addr "IPv6-any"
    service "Any"
    log policy-deny
  exit
  rule id 10011
    disable
    name "FWS_Block-Region"
    action deny
    dst-zone "untrust"
    src-addr "Any"
    dst-ip 0.0.0.0/32
    service "Any"
    log policy-deny
  exit
  rule id 10012
    name "FWS_App-Server-Ports"
    action permit
    src-zone "trust"
    dst-zone "dmz"
    src-addr "FWS_lan-net"
    dst-addr "FWS_web-1"
    service "FWS_web-ports"
    service "FWS_tcp-8443"
    log session-end
  exit
  rule id 10013
    disable
    name "FWS_Tagged-Servers-Updates"
    action permit
    src-zone "dmz"
    dst-zone "untrust"
    src-ip 0.0.0.0/32
    dst-addr "FWS_updates.example.com"
    service "FWS_service-https"
    log session-end
  exit
  rule id 10014
    name "FWS_Not-From-Guests"
    action permit
    src-zone "trust"
    dst-zone "dmz"
    src-addr "FWS_not-10.10.200.0_24"
    dst-addr "FWS_all-servers"
    service "FWS_apps-ping"
    log session-end
  exit
  rule id 10015
    name "FWS_DMZ-Intrazone"
    action deny
    src-zone "dmz"
    dst-zone "dmz"
    src-addr "Any"
    dst-addr "Any"
    service "Any"
    log policy-deny
  exit
  rule id 10016
    name "FWS_DMZ-Intrazone_v6"
    action deny
    src-zone "dmz"
    dst-zone "dmz"
    src-addr "IPv6-any"
    dst-addr "IPv6-any"
    service "Any"
    log policy-deny
  exit
  rule id 10017
    disable
    name "FWS_Old-Rule"
    action permit
    src-zone "trust"
    dst-zone "untrust"
    src-ip 0.0.0.0/32
    dst-addr "Any"
    service "FWS_udp-syslog-src"
    log session-end
  exit
  rule id 10018
    name "FWS_intrazone_trust"
    action permit
    src-zone "trust"
    dst-zone "trust"
    src-addr "Any"
    dst-addr "Any"
    service "Any"
  exit
  rule id 10019
    name "FWS_intrazone_trust_v6"
    action permit
    src-zone "trust"
    dst-zone "trust"
    src-addr "IPv6-any"
    dst-addr "IPv6-any"
    service "Any"
  exit
  rule id 10020
    name "FWS_intrazone_untrust"
    action permit
    src-zone "untrust"
    dst-zone "untrust"
    src-addr "Any"
    dst-addr "Any"
    service "Any"
  exit
  rule id 10021
    name "FWS_intrazone_untrust_v6"
    action permit
    src-zone "untrust"
    dst-zone "untrust"
    src-addr "IPv6-any"
    dst-addr "IPv6-any"
    service "Any"
  exit
  rule id 10022
    name "FWS_intrazone_ot"
    action permit
    src-zone "FWS_ot"
    dst-zone "FWS_ot"
    src-addr "Any"
    dst-addr "Any"
    service "Any"
  exit
  rule id 10023
    name "FWS_intrazone_ot_v6"
    action permit
    src-zone "FWS_ot"
    dst-zone "FWS_ot"
    src-addr "IPv6-any"
    dst-addr "IPv6-any"
    service "Any"
  exit
exit
ip vrouter "trust-vr"
  dnatrule id 10000 from "FWS_lan-net" to "FWS_partner-net" service "Any" no-trans
  snatrule id 10000 from "FWS_lan-net" to "FWS_partner-net" service "Any" no-trans
  dnatrule id 10001 from "Any" to "FWS_web-public" service "FWS_service-https" trans-to "FWS_web-1" port 8443
  snatrule id 10001 from "FWS_nat-Mail-Static-inside" to "Any" service "Any" trans-to address-book "FWS_nat-Mail-Static-outside" mode static
  dnatrule id 10002 from "Any" to "FWS_nat-Mail-Static-outside" service "Any" trans-to "FWS_nat-Mail-Static-inside"
  snatrule id 10002 from "FWS_dmz-servers" to "Any" service "Any" eif ethernet1/1 trans-to address-book "FWS_snat-pool" mode dynamicport
  snatrule id 10003 from "Any" to "Any" service "Any" eif ethernet1/1 trans-to eif-ip mode dynamicport
exit
end
