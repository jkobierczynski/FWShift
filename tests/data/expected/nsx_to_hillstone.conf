configure
service "FWS_DNS"
  tcp dst-port 53
exit
service "FWS_DNS-UDP"
  udp dst-port 53
exit
address "FWS_LAN"
  ip 10.10.0.0/16
exit
service "FWS_NTP.services"
  udp dst-port 123
exit
address "FWS_Guests"
  ip 10.10.200.0/24
exit
service "FWS_SSH"
  tcp dst-port 22
exit
service "FWS_Web_all"
  tcp dst-port 443
  tcp dst-port 8443
exit
address "FWS_Web_servers"
  ip 10.20.0.10/31
exit
service "FWS_app-8443"
  tcp dst-port 8443
exit
address "FWS_App_servers"
  ip 10.20.1.0/24
exit
service "FWS_MySQL"
  tcp dst-port 3306
exit
address "FWS_DB_servers"
  ip 10.20.2.0/24
exit
address "FWS_DB_servers_v6" ipv6
  ip 2001:db8:20:2::/64
exit
address "FWS_Admins"
  range 10.10.5.10 10.10.5.20
exit
address "FWS_DMZ"
  ip 10.20.0.10/31
  ip 10.20.1.0/24
exit
address "FWS_not-Admins"
  range 0.0.0.0 10.10.5.9
  range 10.10.5.21 255.255.255.255
exit
service "FWS_Modbus"
  tcp dst-port 502
exit
address "FWS_OT_cell"
  ip 10.30.1.0/24
exit
service "FWS_FTP"
  tcp dst-port 21
exit
service "FWS_HTTPS"
  tcp dst-port 443
exit
policy-global
  rule id 10000
    disable
    name "FWS_Block_quarantined"
    action deny
    src-ip 0.0.0.0/32
    dst-addr "Any"
    service "Any"
    log session-start
    log policy-deny
  exit
  rule id 10001
    name "FWS_DNS_to_resolvers"
    action permit
    src-addr "FWS_LAN"
    dst-ip 192.0.2.53/32
    service "FWS_DNS"
    service "FWS_DNS-UDP"
  exit
  rule id 10002
    name "FWS_NTP"
    action permit
    src-addr "Any"
    dst-ip 192.0.2.123/32
    service "FWS_NTP.services"
  exit
  rule id 10003
    name "FWS_Guests_stay_out"
    action deny
    src-addr "FWS_Guests"
    dst-ip 10.0.0.0/8
    service "Any"
  exit
  rule id 10004
    disable
    name "FWS_LAN_block_the_rest"
    action deny
    src-addr "FWS_LAN"
    dst-addr "Any"
    service "FWS_SSH"
  exit
  rule id 10005
    name "FWS_Inbound_web"
    action permit
    src-addr "Any"
    dst-addr "FWS_Web_servers"
    service "FWS_Web_all"
    log session-start
    log session-end
  exit
  rule id 10006
    name "FWS_Web_to_app"
    action permit
    src-addr "FWS_Web_servers"
    dst-addr "FWS_App_servers"
    service "FWS_app-8443"
  exit
  rule id 10007
    disable
    name "FWS_App_to_DB"
    action permit
    src-addr "FWS_App_servers"
    dst-addr "FWS_DB_servers"
    service "FWS_MySQL"
  exit
  rule id 10008
    name "FWS_Admins_SSH"
    action permit
    src-addr "FWS_Admins"
    dst-addr "FWS_DMZ"
    service "FWS_SSH"
  exit
  rule id 10009
    name "FWS_Others_no_SSH"
    action deny
    src-addr "FWS_not-Admins"
    dst-addr "FWS_DMZ"
    service "FWS_SSH"
  exit
  rule id 10010
    name "FWS_Engineering_to_PLCs"
    action permit
    src-ip 10.10.7.15/32
    dst-addr "FWS_OT_cell"
    service "FWS_Modbus"
  exit
  rule id 10011
    name "FWS_FTP_to_partner"
    action permit
    src-addr "FWS_LAN"
    dst-ip 198.51.100.40/32
    service "FWS_FTP"
  exit
  rule id 10012
    disable
    name "FWS_TLS_out"
    action permit
    src-addr "FWS_LAN"
    dst-addr "Any"
    service "FWS_HTTPS"
  exit
  rule id 10013
    disable
    name "FWS_Ping_over_IPv6_v6"
    action permit
    src-addr "IPv6-any"
    dst-addr "IPv6-any"
    service "Any"
  exit
  rule id 10014
    disable
    name "FWS_Old_rule"
    action permit
    src-addr "FWS_LAN"
    dst-addr "FWS_DB_servers"
    service "FWS_MySQL"
  exit
exit
end
