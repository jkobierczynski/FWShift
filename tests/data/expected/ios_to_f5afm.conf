            action drop
            description "no in access list on GigabitEthernet0 / no out access list on GigabitEthernet0/0/3 / the zone-based firewall drops traffic between two zones without a zone pair"
            source {
                vlans {
                    /Common/MGMT
                }
            }
        }
        MGMT__in___no_access_list__MGMT_to_MGMT_ {
            action accept-decisively
            description "FWSHIFT disabled, see the report. no in access list on GigabitEthernet0"
            source {
                vlans {
                    /Common/MGMT
                }
            }
            status disabled
        }
        fwshift_default {
            action drop
            description "FWSHIFT: what no rule of the policy matches"
        }
    }
}
security firewall policy /Common/FWShift {
    rules {
        FWShift_rules {
            rule-list /Common/FWShift_rules
        }
    }
}
