block return out quick on $fws_if_DMZ inet proto tcp from any to 10.20.0.25 port 25 tagged fws_MGMT label "MGMT (in): no access list + DMZ-OUT-20 + no zone pair from MGMT"
block return out quick on $fws_if_DMZ proto tcp from <fws_ADMINS> to <fws_WAN_IN_140___DMZ_OUT_10___Z> port 22 tagged fws_MGMT label "MGMT (in): no access list + DMZ-OUT-30 + no zone pair from MGMT"
block return out quick on $fws_if_DMZ inet proto icmp from any to any icmp-type 8 tagged fws_MGMT label "MGMT (in): no access list + DMZ-OUT-40 + no zone pair from MGMT"
block return out quick on $fws_if_DMZ inet from any to any tagged fws_MGMT label "MGMT (in): no access list + DMZ-OUT-50 (MGMT to DMZ)"
block return out quick on $fws_if_DMZ inet6 from any to any tagged fws_MGMT label "MGMT (in): no access list + no outbound access list + no zone p"
block return out quick on $fws_if_LAB from any to any tagged fws_MGMT label "MGMT (in): no access list + no outbound access list + no zone p"
match out on $fws_if_MGMT from any to any tagged fws_MGMT tag fws_ok_MGMT label "MGMT (in): no access list (MGMT to MGMT)"

# What no rule decided: the default of the source.
block drop out quick tagged fws_OUTSIDE
block drop out quick tagged fws_INSIDE
block drop out quick tagged fws_DMZ
block drop out quick tagged fws_LAB
block drop out quick tagged fws_MGMT

# Source NAT, first match, of what the rules allowed.
match out on $fws_if_OUTSIDE inet from 10.20.0.10 to any tagged fws_ok_INSIDE nat-to 203.0.113.3 static-port tag fws_nat label "nat-176"
match out on $fws_if_OUTSIDE inet from 10.20.0.10 to any tagged fws_ok_DMZ nat-to 203.0.113.3 static-port tag fws_nat label "nat-176"
match out on $fws_if_OUTSIDE inet from <fws_nat_178_src> to any tagged fws_ok_INSIDE nat-to ($fws_if_OUTSIDE) tag fws_nat label "nat-178"
match out on $fws_if_OUTSIDE inet from <fws_nat_178_src> to any tagged fws_ok_DMZ nat-to ($fws_if_OUTSIDE) tag fws_nat label "nat-178"

# Pass what the rules allowed.
pass out quick tagged fws_ok_OUTSIDE
pass out quick tagged fws_ok_INSIDE
pass out quick tagged fws_ok_DMZ
pass out quick tagged fws_ok_LAB
pass out quick tagged fws_ok_MGMT
pass out quick tagged fws_nat
