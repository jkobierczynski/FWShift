configure
zone "FWS_Internal"
  description "Internal"
exit
zone "FWS_External"
  description "External"
exit
service "FWS_SG_Control"
  tcp dst-port 3020 3021
exit
service "FWS_DNS"
  udp dst-port 53
  tcp dst-port 53
exit
address "FWS_dns-01"
  ip 192.168.10.53/32
exit
service "FWS_HTTPS"
  tcp dst-port 443
exit
service "FWS_web-services"
  tcp dst-port 8443
  tcp dst-port 8000 8010
exit
address "FWS_grp-web"
  ip 192.168.10.0/24
exit
service "FWS_SSH"
  tcp dst-port 22
exit
address "FWS_admins"
  range 10.1.5.10 10.1.5.20
exit
address "FWS_net-dmz"
  ip 192.168.10.0/24
exit
address "FWS_net-lan__in_rules_"
  range 10.1.0.1 10.1.255.254
exit
service "FWS_tcp-8443"
  tcp dst-port 8443
exit
address "FWS_pub-web"
  ip 203.0.113.10/32
exit
address "FWS_not-net-dmz"
  range 0.0.0.0 192.168.9.255
  range 192.168.11.0 255.255.255.255
exit
address "FWS_updates.example.com__names_"
  host "updates.example.com"
  host "cdn.example.com"
exit
service "FWS_HTTP"
  tcp dst-port 80
exit
address "FWS_web-01"
  ip 192.168.10.10/31
exit
service "FWS_Echo_Request"
  icmp type 8
exit
address "FWS_grp-inside"
  ip 10.1.0.0/16
  ip 172.16.30.0/24
exit
address "FWS_grp-inside_v6" ipv6
  ip 2001:db8:30::/64
exit
address "FWS_net-guest"
  ip 172.16.30.0/24
exit
address "FWS_net-guest_v6" ipv6
  ip 2001:db8:30::/64
exit
service "FWS_GRE"
  protocol 47
exit
address "FWS_isp-gw"
  ip 198.51.100.1/32
exit
service "FWS_syslog-from-514"
  udp dst-port 514 src-port 514
exit
address "FWS_lan_without_admins"
  range 10.1.0.0 10.1.5.9
  range 10.1.5.21 10.1.255.255
exit
address "FWS_mail-01"
  ip 192.168.10.25/32
exit
address "FWS_mail-01_v6" ipv6
  ip 2001:db8:10::25/128
exit
service "FWS_NetBIOS"
  udp dst-port 137 138
  tcp dst-port 139
exit
service "FWS_Ident"
  tcp dst-port 113
exit
address "FWS_net-lan-v6_v6" ipv6
  ip 2001:db8:20::/64
exit
address "FWS_web-01-v6_v6" ipv6
  ip 2001:db8:10::10/128
exit
address "FWS_nat-publish_web-dnat"
  ip 192.168.10.10/32
exit
address "FWS_nat-lan_out-pool"
  ip 203.0.113.1/32
exit
address "FWS_mail-01_IPv4"
  ip 192.168.10.25/32
exit
address "FWS_nat-mail_static-pool"
  ip 203.0.113.25/32
exit
address "FWS_net-guest_IPv4"
  ip 172.16.30.0/24
exit
policy-global
  rule id 10000
    disable
    name "FWS_Rule__900.0"
    action permit
    src-ip 0.0.0.0/32
    dst-ip 0.0.0.0/32
    service "FWS_SG_Control"
    description "SMC communications (abbreviated)"
  exit
  rule id 10001
    name "FWS_dns_to_resolver"
    action permit
    src-addr "Any"
    dst-addr "FWS_dns-01"
    service "FWS_DNS"
  exit
  rule id 10002
    name "FWS_allow_web"
    action permit
    src-addr "Any"
    dst-addr "FWS_grp-web"
    service "FWS_HTTPS"
    service "FWS_web-services"
    log session-start
    log session-end
  exit
  rule id 10003
    name "FWS_to_admin_sub-policy___admins_in"
    action permit
    src-addr "FWS_admins"
    dst-addr "FWS_net-dmz"
    service "FWS_SSH"
    log session-start
    log session-end
  exit
  rule id 10004
    name "FWS_to_admin_sub-policy___others_out"
    action deny
    src-addr "FWS_net-lan__in_rules_"
    dst-addr "FWS_net-dmz"
    service "FWS_SSH"
    log session-start
    log policy-deny
  exit
  rule id 10005
    name "FWS_refuse_admins_8443"
    action deny
    src-addr "FWS_admins"
    dst-addr "FWS_pub-web"
    service "FWS_tcp-8443"
    log session-start
    log policy-deny
  exit
  rule id 10006
    disable
    name "FWS_old_block"
    action deny
    src-addr "FWS_net-lan__in_rules_"
    dst-addr "Any"
    service "Any"
  exit
  rule id 10007
    name "FWS_internal_zone_out"
    action permit
    src-zone "FWS_Internal"
    src-addr "FWS_net-lan__in_rules_"
    dst-addr "Any"
    service "FWS_web-services"
    log session-start
    log session-end
  exit
  rule id 10008
    name "FWS_not_to_dmz"
    action permit
    src-addr "FWS_net-lan__in_rules_"
    dst-addr "FWS_not-net-dmz"
    service "FWS_HTTPS"
    log session-start
    log session-end
  exit
  rule id 10009
    name "FWS_updates_by_name"
    action permit
    src-addr "FWS_net-lan__in_rules_"
    dst-addr "FWS_updates.example.com__names_"
    service "FWS_HTTPS"
    log session-start
    log session-end
  exit
  rule id 10010
    name "FWS_zone_or_web_host_out"
    action permit
    src-zone "FWS_Internal"
    dst-zone "FWS_External"
    src-addr "Any"
    dst-addr "Any"
    service "FWS_HTTP"
    log session-start
    log session-end
  exit
  rule id 10011
    name "FWS_zone_or_web_host_out__2_"
    action permit
    dst-zone "FWS_External"
    src-addr "FWS_web-01"
    dst-addr "Any"
    service "FWS_HTTP"
    log session-start
    log session-end
  exit
  rule id 10012
    disable
    name "FWS_vpn_only"
    action permit
    src-addr "FWS_net-lan__in_rules_"
    dst-addr "FWS_net-dmz"
    service "Any"
    log session-start
    log session-end
  exit
  rule id 10013
    name "FWS_ping_out"
    action permit
    src-addr "FWS_grp-inside"
    dst-addr "Any"
    service "FWS_Echo_Request"
    log session-start
    log session-end
  exit
  rule id 10014
    disable
    name "FWS_no_social"
    action deny
    src-addr "FWS_net-lan__in_rules_"
    dst-addr "Any"
    service "Any"
    log session-start
    log policy-deny
  exit
  rule id 10015
    disable
    name "FWS_helpdesk_to_dmz"
    action permit
    src-addr "Any"
    dst-addr "FWS_net-dmz"
    service "FWS_SSH"
    log session-start
    log session-end
  exit
  rule id 10016
    disable
    name "FWS_unfinished"
    action permit
    src-addr "FWS_net-lan__in_rules_"
    dst-addr "Any"
    service "FWS_SSH"
    log session-start
    log session-end
  exit
  rule id 10017
    disable
    name "FWS_office_web"
    action permit
    src-addr "FWS_net-lan__in_rules_"
    dst-addr "Any"
    service "FWS_HTTP"
    log session-start
    log session-end
  exit
  rule id 10018
    name "FWS_limited_guests"
    action permit
    src-addr "FWS_net-guest"
    dst-addr "Any"
    service "FWS_HTTPS"
    log session-start
    log session-end
  exit
  rule id 10019
    disable
    name "FWS_block_list"
    action deny
    src-addr "Any"
    dst-addr "Any"
    service "Any"
    log session-start
    log policy-deny
  exit
  rule id 10020
    name "FWS_gre_to_isp"
    action permit
    src-addr "FWS_net-lan__in_rules_"
    dst-addr "FWS_isp-gw"
    service "FWS_GRE"
    log session-start
    log session-end
  exit
  rule id 10021
    name "FWS_lan_but_admins"
    action permit
    src-addr "FWS_lan_without_admins"
    dst-addr "FWS_mail-01"
    service "FWS_syslog-from-514"
    service "FWS_Echo_Request"
    log session-start
    log session-end
  exit
  rule id 10022
    name "FWS_Rule__1021.0"
    action deny
    src-addr "FWS_net-guest"
    dst-addr "FWS_net-lan__in_rules_"
    service "Any"
    log session-start
    log policy-deny
    description "guests stay out"
  exit
  rule id 10023
    name "FWS_drop_netbios"
    action deny
    src-addr "Any"
    dst-addr "Any"
    service "FWS_NetBIOS"
  exit
  rule id 10024
    name "FWS_Rule__902.0"
    action deny
    src-addr "Any"
    dst-addr "Any"
    service "FWS_Ident"
    log session-start
    log policy-deny
  exit
  rule id 10025
    name "FWS_Rule__903.0"
    action deny
    src-addr "Any"
    dst-addr "Any"
    service "Any"
    log session-start
    log policy-deny
  exit
  rule id 10026
    name "FWS_v6_web_v6"
    action permit
    src-addr "FWS_net-lan-v6_v6"
    dst-addr "FWS_web-01-v6_v6"
    service "FWS_HTTPS"
    log session-start
    log session-end
  exit
  rule id 10027
    disable
    name "FWS_v6_ping_v6"
    action permit
    src-addr "FWS_net-lan-v6_v6"
    dst-addr "IPv6-any"
    service "Any"
  exit
  rule id 10028
    name "FWS_v6_mail_v6"
    action permit
    src-addr "IPv6-any"
    dst-addr "FWS_mail-01_v6"
    service "FWS_HTTPS"
    log session-start
    log session-end
  exit
  rule id 10029
    name "FWS_v6_guests_v6"
    action deny
    src-addr "FWS_grp-inside_v6"
    dst-addr "FWS_web-01-v6_v6"
    service "Any"
  exit
  rule id 10030
    name "FWS_Rule__952.0_v6"
    action deny
    src-addr "IPv6-any"
    dst-addr "IPv6-any"
    service "FWS_Ident"
    log session-start
    log policy-deny
  exit
  rule id 10031
    name "FWS_Rule__953.0_v6"
    action deny
    src-addr "IPv6-any"
    dst-addr "IPv6-any"
    service "Any"
    log session-start
    log policy-deny
  exit
exit
ip vrouter "trust-vr"
  dnatrule id 10000 from "Any" to "FWS_pub-web" service "FWS_HTTPS" trans-to "FWS_nat-publish_web-dnat" port 8443
  dnatrule id 10001 from "FWS_net-lan__in_rules_" to "FWS_net-dmz" service "Any" no-trans
  snatrule id 10000 from "FWS_net-lan__in_rules_" to "FWS_net-dmz" service "Any" no-trans
  snatrule id 10001 from "FWS_net-lan__in_rules_" to "Any" service "Any" trans-to address-book "FWS_nat-lan_out-pool" mode dynamicport
  snatrule id 10002 from "FWS_mail-01_IPv4" to "Any" service "Any" trans-to address-book "FWS_nat-mail_static-pool" mode static
exit
end
