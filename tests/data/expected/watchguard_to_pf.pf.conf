# The interface (or interface group) of each zone.
fws_if_External = "External"
fws_if_Trusted = "Trusted"
fws_if_DMZ = "DMZ"
fws_if_Guests = "Guests"
fws_if_Lab = "Lab"

# Tables.
table <fws_Block_Bad_dst> const { 203.0.113.0/25 192.0.2.66 }
table <fws_Admins_1_alm> const { 10.10.5.10/31 10.10.5.12/30 10.10.5.16/30 10.10.5.20 }

# What arrives on the interface of a zone is marked with the zone.
match in on $fws_if_External tag fws_External
match in on $fws_if_Trusted tag fws_Trusted
match in on $fws_if_DMZ tag fws_DMZ
match in on $fws_if_Guests tag fws_Guests
match in on $fws_if_Lab tag fws_Lab

# Destination NAT, first match, and what the rules may allow is let in: they decide when it leaves.
pass in quick on $fws_if_External inet proto tcp from any to 198.51.100.10 port 443 rdr-to 10.20.0.10 label "Web-Public (Web In)"
pass in quick on $fws_if_External inet proto tcp from any to 198.51.100.11 port 25 rdr-to 10.20.0.25 port 2525 label "Mail-Public (Mail In)"
pass in quick on $fws_if_Trusted proto tcp from <fws_Admins_1_alm> to ! self port 22 label "Admin SSH"
pass in quick on { $fws_if_Trusted $fws_if_Guests $fws_if_DMZ } proto tcp from any to ! self port { 80 443 8000:8010 } label "Web Out"
pass in quick on $fws_if_External proto tcp from any to 10.20.0.10 port 443 label "Web In"
pass in quick on $fws_if_External proto tcp from any to 10.20.0.25 port 2525 label "Mail In"
pass in quick on { $fws_if_Trusted $fws_if_Guests } inet proto icmp from any to ! self icmp-type 8 label "Ping"
pass in quick on $fws_if_Lab proto 47 from any to ! self label "Lab Tunnel"

# The rules, first match, when the traffic leaves: the tag says the zone it came from.
block return out quick from any to <fws_Block_Bad_dst> tagged fws_Trusted label "Block Bad"
block return out quick from any to <fws_Block_Bad_dst> tagged fws_Guests label "Block Bad"
match out on $fws_if_External proto tcp from <fws_Admins_1_alm> to any port 22 tagged fws_Trusted tag fws_ok_Trusted label "Admin SSH"
match out on $fws_if_External proto tcp from any to any port { 80 443 8000:8010 } tagged fws_Trusted tag fws_ok_Trusted label "Web Out"
match out on $fws_if_External proto tcp from any to any port { 80 443 8000:8010 } tagged fws_Guests tag fws_ok_Guests label "Web Out"
match out on $fws_if_External proto tcp from any to any port { 80 443 8000:8010 } tagged fws_DMZ tag fws_ok_DMZ label "Web Out"
match out proto tcp from any to 10.20.0.10 port 443 tagged fws_External tag fws_ok_External label "Web In"
match out proto tcp from any to 10.20.0.25 port 2525 tagged fws_External tag fws_ok_External label "Mail In"
# FWSHIFT disabled, see the report: "DMZ Updates" from DMZ to any; source any; destination Update-Site.1.alm; service HTTPS; action allow
# disabled in the source: "Guests Out" from Guests to External; source any; destination any; service DNS; action allow
# FWSHIFT disabled, see the report: "Staff Only" from Trusted to any; source any; destination Web-Server.1.alm; service Staff Only; action allow
match out inet proto icmp from any to any icmp-type 8 tagged fws_Trusted tag fws_ok_Trusted label "Ping"
match out inet proto icmp from any to any icmp-type 8 tagged fws_Guests tag fws_ok_Guests label "Ping"
match out on $fws_if_External proto 47 from any to any tagged fws_Lab tag fws_ok_Lab label "Lab Tunnel"

# What no rule decided: the default of the source.
block drop out quick tagged fws_External
block drop out quick tagged fws_Trusted
block drop out quick tagged fws_DMZ
block drop out quick tagged fws_Guests
block drop out quick tagged fws_Lab

# Source NAT, first match, of what the rules allowed.

# Pass what the rules allowed.
pass out quick tagged fws_ok_External
pass out quick tagged fws_ok_Trusted
pass out quick tagged fws_ok_DMZ
pass out quick tagged fws_ok_Guests
pass out quick tagged fws_ok_Lab
pass out quick tagged fws_nat
