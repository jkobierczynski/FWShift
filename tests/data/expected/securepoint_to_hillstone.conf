configure
zone "FWS_external"
  description "external"
exit
zone "FWS_internal"
  description "internal"
exit
zone "FWS_dmz1"
  description "dmz1"
exit
zone "FWS_vpn-ipsec"
  description "vpn-ipsec"
exit
service "FWS_default-internet"
  tcp dst-port 80
  tcp dst-port 443
  udp dst-port 53
  icmp type 8
  tcp dst-port 21
exit
address "FWS_internal-network"
  ip 192.168.10.0/24
exit
address "FWS_internet"
  ip 0.0.0.0/0
exit
service "FWS_web"
  tcp dst-port 80
  tcp dst-port 443
exit
address "FWS_lan6_v6" ipv6
  ip 2001:db8:10::/64
exit
address "FWS_internet6_v6" ipv6
  ip ::/0
exit
address "FWS_partner-net"
  ip 10.20.0.0/16
exit
service "FWS_https"
  tcp dst-port 443
exit
address "FWS_update-host"
  host "updates.example.com"
exit
service "FWS_icmp-echo-req"
  icmp type 8
exit
address "FWS_admin-pc"
  ip 192.168.10.50/32
exit
service "FWS_ntp-client"
  udp dst-port 123 src-port 1024 65535
exit
address "FWS_webserver"
  ip 172.16.20.10/32
exit
address "FWS_external-interface"
  ip 203.0.113.2/32
exit
service "FWS_extern-https"
  tcp dst-port 8443
exit
service "FWS_smtp"
  tcp dst-port 25
exit
address "FWS_public-mail"
  ip 203.0.113.5/32
exit
service "FWS_ssh"
  tcp dst-port 22
exit
address "FWS_servers"
  ip 172.16.20.10/32
  ip 172.16.20.25/32
exit
address "FWS_dmz1-network"
  ip 172.16.20.0/24
exit
service "FWS_app-ports"
  tcp dst-port 8000 8010
exit
service "FWS_gre"
  protocol 47
exit
address "FWS_printers"
  range 192.168.10.200 192.168.10.220
exit
address "FWS_mailserver"
  ip 172.16.20.25/32
exit
policy-global
  rule id 10000
    name "FWS_rule-1"
    action permit
    src-zone "FWS_internal"
    dst-zone "FWS_external"
    src-addr "FWS_internal-network"
    dst-addr "FWS_internet"
    service "FWS_default-internet"
    log session-end
    description "LAN to the internet"
  exit
  rule id 10001
    name "FWS_rule-4_v6"
    action permit
    src-zone "FWS_internal"
    dst-zone "FWS_external"
    src-addr "FWS_lan6_v6"
    dst-addr "FWS_internet6_v6"
    service "FWS_web"
    description "LAN IPv6 web"
  exit
  rule id 10002
    name "FWS_rule-10"
    action permit
    src-zone "FWS_vpn-ipsec"
    dst-zone "FWS_internal"
    src-addr "FWS_partner-net"
    dst-addr "FWS_internal-network"
    service "Any"
    description "VPN partner, not hidden"
  exit
  rule id 10003
    name "FWS_rule-11"
    action permit
    src-zone "FWS_internal"
    dst-zone "FWS_external"
    src-addr "FWS_internal-network"
    dst-addr "FWS_update-host"
    service "FWS_https"
  exit
  rule id 10004
    name "FWS_rule-13"
    action permit
    src-zone "FWS_internal"
    src-addr "FWS_admin-pc"
    dst-addr "Any"
    service "FWS_icmp-echo-req"
    description "ping from the admin"
  exit
  rule id 10005
    disable
    name "FWS_rule-14"
    action permit
    src-zone "FWS_internal"
    dst-zone "FWS_vpn-ipsec"
    src-addr "FWS_internal-network"
    dst-addr "FWS_partner-net"
    service "FWS_ntp-client"
  exit
  rule id 10006
    disable
    name "FWS_rule-15_v6"
    action permit
    src-zone "FWS_internal"
    dst-zone "FWS_external"
    src-addr "FWS_lan6_v6"
    dst-addr "FWS_internet6_v6"
    service "Any"
  exit
  rule id 10007
    name "FWS_rule-18"
    action deny
    src-zone "FWS_external"
    dst-zone "FWS_dmz1"
    src-addr "FWS_internet"
    dst-addr "FWS_webserver"
    dst-addr "FWS_external-interface"
    service "FWS_https"
    description "a rule above the forward sees the server"
  exit
  rule id 10008
    name "FWS_rule-2"
    action permit
    src-zone "FWS_external"
    dst-zone "FWS_dmz1"
    src-addr "FWS_internet"
    dst-addr "FWS_external-interface"
    service "FWS_extern-https"
    log session-end
    description "publish the web server"
  exit
  rule id 10009
    name "FWS_rule-6"
    action permit
    src-zone "FWS_external"
    dst-zone "FWS_dmz1"
    src-addr "FWS_internet"
    dst-addr "FWS_public-mail"
    service "FWS_smtp"
    description "publish the mail server"
  exit
  rule id 10010
    name "FWS_rule-7"
    action permit
    src-zone "FWS_internal"
    dst-zone "FWS_dmz1"
    src-addr "FWS_admin-pc"
    dst-addr "FWS_servers"
    service "FWS_ssh"
    log session-end
    description "administration"
  exit
  rule id 10011
    name "FWS_rule-7-2"
    action permit
    src-zone "FWS_vpn-ipsec"
    dst-zone "FWS_dmz1"
    src-addr "FWS_partner-net"
    dst-addr "FWS_servers"
    service "FWS_ssh"
    log session-end
    description "administration"
  exit
  rule id 10012
    name "FWS_rule-8"
    action permit
    src-zone "FWS_dmz1"
    dst-zone "FWS_external"
    src-addr "FWS_dmz1-network"
    dst-addr "FWS_internet"
    service "Any"
  exit
  rule id 10013
    name "FWS_rule-12"
    action permit
    src-zone "FWS_internal"
    dst-zone "FWS_dmz1"
    src-addr "FWS_internal-network"
    dst-addr "FWS_dmz1-network"
    service "FWS_app-ports"
  exit
  rule id 10014
    disable
    name "FWS_rule-16"
    action permit
    src-zone "FWS_internal"
    dst-zone "FWS_dmz1"
    src-addr "FWS_internal-network"
    dst-addr "FWS_webserver"
    service "FWS_gre"
  exit
  rule id 10015
    name "FWS_rule-3"
    action deny
    src-zone "FWS_internal"
    dst-zone "FWS_external"
    src-addr "FWS_printers"
    dst-addr "FWS_internet"
    service "Any"
    description "printers stay inside"
  exit
  rule id 10016
    disable
    name "FWS_rule-9"
    action deny
    src-zone "FWS_internal"
    dst-zone "FWS_external"
    src-addr "FWS_internal-network"
    dst-ip 0.0.0.0/32
    service "Any"
    log policy-deny
    description "a region"
  exit
  rule id 10017
    name "FWS_rule-17"
    action deny
    src-zone "FWS_internal"
    dst-zone "FWS_dmz1"
    src-addr "FWS_internal-network"
    dst-addr "FWS_mailserver"
    service "FWS_smtp"
    description "only the mail server sends"
  exit
exit
ip vrouter "trust-vr"
  snatrule id 10000 from "FWS_internal-network" to "Any" service "FWS_default-internet" eif eth0 trans-to eif-ip mode dynamicport
  dnatrule id 10000 from "FWS_partner-net" to "FWS_internal-network" service "Any" no-trans
  snatrule id 10001 from "FWS_partner-net" to "FWS_internal-network" service "Any" no-trans
  dnatrule id 10001 from "Any" to "FWS_external-interface" service "FWS_extern-https" trans-to "FWS_webserver" port 443
  dnatrule id 10002 from "Any" to "FWS_public-mail" service "FWS_smtp" trans-to "FWS_mailserver"
  snatrule id 10002 from "FWS_dmz1-network" to "Any" service "Any" eif eth0 trans-to eif-ip mode dynamicport
exit
end
