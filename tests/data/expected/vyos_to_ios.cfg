!
! Put each interface in its zone; this changes traffic at once (between zones only what the policies let
! through passes; between an interface in a zone and one in none nothing does):
! interface eth1.20
!  zone-member security FWS-GUEST
! interface eth1
!  zone-member security FWS-LAN
! interface eth0
!  zone-member security FWS-WAN
! interface eth2
!  zone-member security FWS-DMZ
! interface wg0
!  zone-member security FWS-VPN
! interface br0
!  zone-member security FWS-br0
!
! NAT, which changes traffic at once on interfaces with ip nat inside or outside:
! ip access-list extended FWS-NAT1
!  permit ip 192.168.10.0 0.0.0.255 any
!  permit ip 192.168.20.0 0.0.0.255 any
! ip nat inside source list FWS-NAT1 interface eth0 overload
! ip access-list extended FWS-NAT2
!  permit ip 192.168.30.0 0.0.0.255 any
! ip nat pool FWS-NAT2-POOL 203.0.113.20 203.0.113.20 prefix-length 30
! ip nat inside source list FWS-NAT2 pool FWS-NAT2-POOL overload
! (the interfaces of zone FWS-WAN: ip nat outside)
