configure
zone "FWS_port1_1"
  description "port1_1"
exit
zone "FWS_port1_2"
  description "port1_2"
exit
zone "FWS_port1_3"
  description "port1_3"
exit
zone "FWS_vlan20"
  description "vlan20"
exit
address "FWS_not-10.10.0.0_24"
  range 0.0.0.0 10.9.255.255
  range 10.10.1.0 255.255.255.255
exit
service "FWS_tcp-502"
  tcp dst-port 502
exit
address "FWS_plc-line1"
  ip 10.10.0.20/32
exit
service "FWS_icmp-type8"
  icmp type 8
exit
service "FWS_tcp"
  tcp dst-port 0 65535
exit
service "FWS_udp-53-from-1024-65535"
  udp dst-port 53 src-port 1024 65535
exit
service "FWS_tcp-1433"
  tcp dst-port 1433
exit
address "FWS_historian"
  ip 10.20.0.50/32
exit
service "FWS_tcp-80_443_8000-8010"
  tcp dst-port 80
  tcp dst-port 443
  tcp dst-port 8000 8010
exit
service "FWS_tcp-443"
  tcp dst-port 443
exit
service "FWS_esp"
  protocol 50
exit
service "FWS_tcp-22"
  tcp dst-port 22
exit
address "FWS_nat-1to1nat-1-inside"
  ip 10.30.0.64/28
exit
address "FWS_nat-1to1nat-1-outside"
  ip 192.0.2.64/28
exit
address "FWS_nat-doublenat-1-from"
  ip 10.10.0.30/32
exit
address "FWS_nat-doublenat-1-to"
  ip 172.16.20.40/32
exit
address "FWS_nat-doublenat-1-dnat"
  ip 10.20.0.40/32
exit
address "FWS_nat-doublenat-1-pool"
  ip 172.16.10.30/32
exit
service "FWS_tcp-8080"
  tcp dst-port 8080
exit
address "FWS_nat-dnat-1-to"
  ip 192.0.2.10/32
exit
address "FWS_nat-dnat-1-dnat"
  ip 10.30.0.10/32
exit
address "FWS_nat-masq-1-from"
  ip 10.10.0.0/24
exit
policy-global
  rule id 10000
    name "FWS_rule-30"
    action deny
    src-zone "FWS_port1_2"
    src-addr "FWS_not-10.10.0.0_24"
    dst-addr "Any"
    service "Any"
    description "anti-spoof-cell"
  exit
  rule id 10001
    name "FWS_rule-10"
    action permit
    src-zone "FWS_vlan20"
    src-ip 10.20.0.0/24
    dst-ip 10.10.0.0/24
    dst-ip 172.16.10.30/32
    service "FWS_tcp-502"
    description "scada-to-cell"
  exit
  rule id 10002
    disable
    name "FWS_rule-20"
    action permit
    src-zone "FWS_vlan20"
    src-ip 10.20.0.0/24
    dst-addr "FWS_plc-line1"
    service "FWS_tcp-502"
    description "modbus-enforced"
  exit
  rule id 10003
    name "FWS_rule-40"
    action permit
    src-zone "FWS_port1_3"
    src-addr "Any"
    dst-addr "Any"
    service "FWS_icmp-type8"
    description "ping-dmz"
  exit
  rule id 10004
    name "FWS_rule-40-2"
    action permit
    dst-zone "FWS_port1_3"
    src-addr "Any"
    dst-addr "Any"
    service "FWS_icmp-type8"
    description "ping-dmz"
  exit
  rule id 10005
    disable
    name "FWS_rule-100"
    action deny
    src-zone "FWS_port1_2"
    src-ip 10.10.0.0/24
    dst-addr "Any"
    service "FWS_tcp"
    description "syn-only"
  exit
  rule id 10006
    name "FWS_rule-50"
    action permit
    src-zone "FWS_port1_2"
    dst-zone "FWS_port1_1"
    src-ip 10.10.0.0/24
    dst-ip 198.51.100.53/32
    service "FWS_udp-53-from-1024-65535"
    log session-start
    log session-end
    description "dns-out"
  exit
  rule id 10007
    name "FWS_rule-130"
    action permit
    src-zone "FWS_port1_2"
    src-ip 10.10.0.0/24
    dst-addr "FWS_historian"
    service "FWS_tcp-1433"
    description "cell-to-historian"
  exit
  rule id 10008
    name "FWS_rule-60"
    action permit
    src-zone "FWS_port1_1"
    src-addr "Any"
    dst-ip 10.30.0.10/32
    dst-ip 192.0.2.10/32
    service "FWS_tcp-80_443_8000-8010"
    description "web-dmz"
  exit
  rule id 10009
    name "FWS_rule-110"
    action deny
    src-zone "FWS_port1_1"
    src-ip 198.51.100.0/24
    dst-addr "Any"
    service "Any"
    description "block-partner"
  exit
  rule id 10010
    name "FWS_rule-150"
    action permit
    src-zone "FWS_port1_3"
    src-ip 10.30.0.64/28
    dst-addr "Any"
    service "FWS_tcp-443"
    description "dmz-servers-out"
  exit
  rule id 10011
    disable
    name "FWS_rule-70"
    action permit
    src-zone "FWS_port1_1"
    src-ip 203.0.113.0/24
    dst-ip 10.30.0.20/32
    service "FWS_esp"
    description "vpn-esp"
  exit
  rule id 10012
    name "FWS_rule-90"
    action deny
    src-zone "FWS_port1_1"
    src-addr "Any"
    dst-addr "Any"
    service "Any"
    log session-start
    log policy-deny
    description "wan-reject"
  exit
  rule id 10013
    disable
    name "FWS_rule-80"
    action permit
    src-ip 10.30.0.0/24
    dst-ip 10.20.0.0/24
    dst-ip 172.16.20.40/32
    service "FWS_tcp-22"
    description "spare"
  exit
exit
ip vrouter "trust-vr"
  snatrule id 10000 from "FWS_nat-1to1nat-1-inside" to "Any" service "Any" trans-to address-book "FWS_nat-1to1nat-1-outside" mode static
  dnatrule id 10000 from "Any" to "FWS_nat-1to1nat-1-outside" service "Any" trans-to "FWS_nat-1to1nat-1-inside"
  dnatrule id 10001 from "FWS_nat-doublenat-1-from" to "FWS_nat-doublenat-1-to" service "Any" trans-to "FWS_nat-doublenat-1-dnat"
  snatrule id 10001 from "FWS_nat-doublenat-1-from" to "FWS_nat-doublenat-1-to" service "Any" eif vlan/20 trans-to address-book "FWS_nat-doublenat-1-pool" mode static
  dnatrule id 10002 from "FWS_nat-doublenat-1-dnat" to "FWS_nat-doublenat-1-pool" service "Any" trans-to "FWS_nat-doublenat-1-from"
  snatrule id 10002 from "FWS_nat-doublenat-1-dnat" to "FWS_nat-doublenat-1-pool" service "Any" eif 1/2 trans-to address-book "FWS_nat-doublenat-1-to" mode static
  dnatrule id 10003 from "Any" to "FWS_nat-dnat-1-to" service "FWS_tcp-8080" trans-to "FWS_nat-dnat-1-dnat" port 80
  snatrule id 10003 from "FWS_nat-masq-1-from" to "Any" service "Any" eif 1/1 trans-to eif-ip mode dynamicport
exit
end
