configure
zone "FWS_Untrust"
  description "Untrust"
exit
zone "FWS_DMZ"
  description "DMZ"
exit
zone "FWS_Servers"
  description "Servers"
exit
zone "FWS_Lab"
  description "Lab"
exit
zone "FWS_Trust"
  description "Trust"
exit
service "FWS_web"
  tcp dst-port 80
  tcp dst-port 443
  tcp dst-port 8080 8081
exit
service "FWS_dns-split"
  udp dst-port 53
  tcp dst-port 53
exit
address "FWS_lan"
  ip 10.10.0.0/16
exit
service "FWS_SSH"
  tcp dst-port 22
exit
address "FWS_admins"
  ip 10.10.5.0/28
exit
address "FWS_partner-net"
  ip 198.51.100.0/24
exit
address "FWS_bad-host"
  ip 192.0.2.66/32
exit
service "FWS_HTTP"
  tcp dst-port 80
exit
service "FWS_HTTPS"
  tcp dst-port 443
exit
address "FWS_MIP_203.0.113.10_"
  ip 203.0.113.10/32
exit
address "FWS_VIP_203.0.113.20_"
  ip 203.0.113.20/32
exit
service "FWS_tcp-8080"
  tcp dst-port 8080 8081
exit
address "FWS_MIP_203.0.113.24_"
  ip 203.0.113.24/29
exit
service "FWS_SMTP"
  tcp dst-port 25
exit
address "FWS_not-blocked"
  range 0.0.0.0 192.0.2.65
  range 192.0.2.67 198.51.99.255
  range 198.51.101.0 255.255.255.255
exit
address "FWS_mail1"
  ip 10.20.0.25/32
exit
service "FWS_hi-src"
  tcp dst-port 9000 src-port 1024 2000
exit
address "FWS_web1"
  ip 10.20.0.10/32
exit
address "FWS_db-net"
  ip 10.30.0.0/24
exit
address "FWS_app1"
  ip 10.30.0.24/32
exit
address "FWS_printer__Trust_"
  ip 10.10.9.9/32
exit
address "FWS_dmz-servers"
  ip 10.20.0.10/32
  ip 10.20.0.25/32
exit
address "FWS_lan-v6_v6" ipv6
  ip 2001:db8:10::/64
exit
service "FWS_PING"
  icmp type 8
exit
address "FWS_updates"
  host "updates.example.com"
exit
service "FWS_esp"
  protocol 50
exit
service "FWS_echo-only"
  icmp type 8 code 0 0
exit
address "FWS_ntp-servers"
  ip 192.0.2.123/32
exit
address "FWS_DIP_4_"
  range 203.0.113.100 203.0.113.120
exit
address "FWS_nat-mip-203.0.113.10-inside"
  ip 10.20.0.10/32
exit
address "FWS_nat-mip-203.0.113.10-outside"
  ip 203.0.113.10/32
exit
address "FWS_nat-mip-203.0.113.24-inside"
  ip 10.30.0.24/29
exit
address "FWS_nat-mip-203.0.113.24-outside"
  ip 203.0.113.24/29
exit
address "FWS_nat-vip-203.0.113.20-80-dnat"
  ip 10.20.0.20/32
exit
service "FWS_tcp-8443"
  tcp dst-port 8443
exit
address "FWS_nat-vip-203.0.113.20-8443-dnat"
  ip 10.20.0.21/32
exit
policy-global
  rule id 10000
    name "FWS_intrazone-DMZ"
    action permit
    src-zone "FWS_DMZ"
    dst-zone "FWS_DMZ"
    src-addr "Any"
    dst-addr "Any"
    service "Any"
    description "ScreenOS: traffic inside zone DMZ, which does not block it, passes without a policy"
  exit
  rule id 10001
    name "FWS_intrazone-DMZ_v6"
    action permit
    src-zone "FWS_DMZ"
    dst-zone "FWS_DMZ"
    src-addr "IPv6-any"
    dst-addr "IPv6-any"
    service "Any"
    description "ScreenOS: traffic inside zone DMZ, which does not block it, passes without a policy"
  exit
  rule id 10002
    name "FWS_intrazone-Lab"
    action permit
    src-zone "FWS_Lab"
    dst-zone "FWS_Lab"
    src-addr "Any"
    dst-addr "Any"
    service "Any"
    description "ScreenOS: traffic inside zone Lab, which does not block it, passes without a policy"
  exit
  rule id 10003
    name "FWS_intrazone-Lab_v6"
    action permit
    src-zone "FWS_Lab"
    dst-zone "FWS_Lab"
    src-addr "IPv6-any"
    dst-addr "IPv6-any"
    service "Any"
    description "ScreenOS: traffic inside zone Lab, which does not block it, passes without a policy"
  exit
  rule id 10004
    name "FWS_intrazone-Trust"
    action permit
    src-zone "FWS_Trust"
    dst-zone "FWS_Trust"
    src-addr "Any"
    dst-addr "Any"
    service "Any"
    description "ScreenOS: traffic inside zone Trust, which does not block it, passes without a policy"
  exit
  rule id 10005
    name "FWS_intrazone-Trust_v6"
    action permit
    src-zone "FWS_Trust"
    dst-zone "FWS_Trust"
    src-addr "IPv6-any"
    dst-addr "IPv6-any"
    service "Any"
    description "ScreenOS: traffic inside zone Trust, which does not block it, passes without a policy"
  exit
  rule id 10006
    name "FWS_lan-out"
    action permit
    src-zone "FWS_Trust"
    dst-zone "FWS_Untrust"
    src-addr "FWS_lan"
    dst-addr "Any"
    service "FWS_web"
    service "FWS_dns-split"
    log session-end
  exit
  rule id 10007
    name "FWS_policy-2"
    action permit
    src-zone "FWS_Trust"
    dst-zone "FWS_Untrust"
    src-addr "FWS_admins"
    dst-addr "FWS_partner-net"
    service "FWS_SSH"
    log session-end
  exit
  rule id 10008
    name "FWS_policy-3"
    action permit
    src-zone "FWS_Trust"
    dst-zone "FWS_Untrust"
    src-addr "FWS_lan"
    dst-addr "Any"
    service "Any"
  exit
  rule id 10009
    name "FWS_policy-20"
    action deny
    src-zone "FWS_Untrust"
    dst-zone "FWS_DMZ"
    src-addr "FWS_bad-host"
    dst-addr "Any"
    service "Any"
  exit
  rule id 10010
    name "FWS_web-in"
    action permit
    src-zone "FWS_Untrust"
    dst-zone "FWS_DMZ"
    src-addr "Any"
    dst-addr "FWS_MIP_203.0.113.10_"
    service "FWS_HTTP"
    service "FWS_HTTPS"
    log session-end
  exit
  rule id 10011
    name "FWS_policy-5"
    action permit
    src-zone "FWS_Untrust"
    dst-zone "FWS_DMZ"
    src-addr "Any"
    dst-addr "FWS_VIP_203.0.113.20_"
    service "FWS_HTTP"
  exit
  rule id 10012
    name "FWS_policy-6"
    action permit
    src-zone "FWS_Untrust"
    dst-zone "FWS_Servers"
    src-addr "FWS_partner-net"
    dst-addr "FWS_MIP_203.0.113.24_"
    service "FWS_tcp-8080"
  exit
  rule id 10013
    name "FWS_policy-7"
    action permit
    src-zone "FWS_Untrust"
    dst-zone "FWS_DMZ"
    src-addr "FWS_not-blocked"
    dst-addr "FWS_mail1"
    service "FWS_SMTP"
    log session-end
  exit
  rule id 10014
    name "FWS_policy-8"
    action permit
    src-zone "FWS_DMZ"
    dst-zone "FWS_Servers"
    src-addr "FWS_web1"
    dst-addr "FWS_db-net"
    dst-addr "FWS_app1"
    service "FWS_hi-src"
  exit
  rule id 10015
    disable
    name "FWS_policy-9"
    action deny
    src-zone "FWS_Trust"
    dst-zone "FWS_Trust"
    src-addr "FWS_lan"
    dst-addr "FWS_printer__Trust_"
    service "Any"
  exit
  rule id 10016
    name "FWS_policy-10"
    action permit
    src-zone "FWS_Servers"
    dst-zone "FWS_Servers"
    src-addr "FWS_db-net"
    dst-addr "FWS_db-net"
    service "Any"
  exit
  rule id 10017
    name "FWS_policy-11"
    action permit
    src-zone "FWS_Trust"
    dst-zone "FWS_DMZ"
    src-addr "FWS_admins"
    dst-addr "FWS_dmz-servers"
    service "FWS_SSH"
  exit
  rule id 10018
    disable
    name "FWS_policy-12"
    action permit
    src-zone "FWS_Trust"
    dst-zone "FWS_Lab"
    src-addr "Any"
    dst-addr "Any"
    service "FWS_PING"
  exit
  rule id 10019
    disable
    name "FWS_policy-12_v6"
    action permit
    src-zone "FWS_Trust"
    dst-zone "FWS_Lab"
    src-addr "IPv6-any"
    dst-addr "IPv6-any"
    service "FWS_PING"
  exit
  rule id 10020
    disable
    name "FWS_policy-13"
    action permit
    src-zone "FWS_Trust"
    dst-zone "FWS_Untrust"
    src-addr "Any"
    dst-addr "FWS_updates"
    service "Any"
  exit
  rule id 10021
    disable
    name "FWS_policy-14"
    action permit
    src-zone "FWS_Trust"
    dst-zone "FWS_Untrust"
    src-addr "FWS_lan"
    dst-addr "FWS_partner-net"
    service "FWS_esp"
  exit
  rule id 10022
    disable
    name "FWS_policy-15"
    action permit
    src-zone "FWS_Lab"
    dst-zone "FWS_Untrust"
    src-addr "Any"
    dst-addr "Any"
    service "FWS_HTTP"
  exit
  rule id 10023
    disable
    name "FWS_policy-15_v6"
    action permit
    src-zone "FWS_Lab"
    dst-zone "FWS_Untrust"
    src-addr "IPv6-any"
    dst-addr "IPv6-any"
    service "FWS_HTTP"
  exit
  rule id 10024
    disable
    name "FWS_policy-16"
    action deny
    src-zone "FWS_DMZ"
    src-addr "Any"
    dst-addr "Any"
    service "Any"
  exit
  rule id 10025
    disable
    name "FWS_policy-16_v6"
    action deny
    src-zone "FWS_DMZ"
    src-addr "IPv6-any"
    dst-addr "IPv6-any"
    service "Any"
  exit
  rule id 10026
    name "FWS_policy-19"
    action permit
    src-zone "FWS_Trust"
    dst-zone "FWS_DMZ"
    src-addr "Any"
    dst-addr "FWS_web1"
    service "FWS_HTTP"
  exit
  rule id 10027
    name "FWS_policy-17"
    action permit
    src-addr "Any"
    dst-addr "FWS_ntp-servers"
    service "FWS_echo-only"
  exit
  rule id 10028
    name "FWS_policy-18"
    action deny
    src-addr "Any"
    dst-addr "Any"
    service "Any"
    log policy-deny
  exit
  rule id 10029
    name "FWS_policy-18_v6"
    action deny
    src-addr "IPv6-any"
    dst-addr "IPv6-any"
    service "Any"
    log policy-deny
  exit
exit
ip vrouter "trust-vr"
  snatrule id 10000 from "FWS_lan" to "Any" service "FWS_web" eif ethernet0/0 trans-to address-book "FWS_DIP_4_" mode dynamicport
  snatrule id 10001 from "FWS_lan" to "Any" service "FWS_dns-split" eif ethernet0/0 trans-to address-book "FWS_DIP_4_" mode dynamicport
  snatrule id 10002 from "FWS_lan" to "Any" service "Any" eif ethernet0/0 trans-to eif-ip mode dynamicport
  snatrule id 10003 from "FWS_nat-mip-203.0.113.10-inside" to "Any" service "Any" trans-to address-book "FWS_nat-mip-203.0.113.10-outside" mode static
  dnatrule id 10000 from "Any" to "FWS_nat-mip-203.0.113.10-outside" service "Any" trans-to "FWS_nat-mip-203.0.113.10-inside"
  snatrule id 10004 from "FWS_nat-mip-203.0.113.24-inside" to "Any" service "Any" trans-to address-book "FWS_nat-mip-203.0.113.24-outside" mode static
  dnatrule id 10001 from "Any" to "FWS_nat-mip-203.0.113.24-outside" service "Any" trans-to "FWS_nat-mip-203.0.113.24-inside"
  dnatrule id 10002 from "Any" to "FWS_VIP_203.0.113.20_" service "FWS_HTTP" trans-to "FWS_nat-vip-203.0.113.20-80-dnat"
  dnatrule id 10003 from "Any" to "FWS_VIP_203.0.113.20_" service "FWS_tcp-8443" trans-to "FWS_nat-vip-203.0.113.20-8443-dnat" port 443
  snatrule id 10005 from "Any" to "Any" service "Any" eif ethernet0/0 trans-to eif-ip mode dynamicport
exit
end
