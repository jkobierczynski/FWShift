configure
zone "FWS_lan"
  description "lan"
exit
zone "FWS_wan1"
  description "wan1"
exit
zone "FWS_wan2"
  description "wan2"
exit
service "FWS_tcp-502"
  tcp dst-port 502
exit
service "FWS_tcp-23"
  tcp dst-port 23
exit
service "FWS_tcp-443"
  tcp dst-port 443
exit
address "FWS_wan1-address"
  ip 203.0.113.2/32
exit
service "FWS_udp-20000-20010-from-1024-65535"
  udp dst-port 20000 20010 src-port 1024 65535
exit
service "FWS_tcp-8080-8090"
  tcp dst-port 8080 8090
exit
service "FWS_tcp-22"
  tcp dst-port 22
exit
service "FWS_tcp-8443"
  tcp dst-port 8443
exit
address "FWS_nat-ip_nat_1-dnat"
  ip 192.168.127.50/32
exit
address "FWS_nat-ip_nat_2-inside"
  ip 192.168.127.60/32
exit
address "FWS_nat-ip_nat_2-outside"
  ip 198.51.100.60/32
exit
address "FWS_nat-ip_nat_3-from"
  range 192.168.127.1 192.168.127.199
exit
policy-global
  rule id 10000
    name "FWS_firewall_1"
    action permit
    src-zone "FWS_lan"
    dst-zone "FWS_wan1"
    src-range 192.168.127.10 192.168.127.20
    dst-ip 172.16.40.5/32
    service "FWS_tcp-502"
  exit
  rule id 10001
    name "FWS_firewall_2"
    action deny
    src-zone "FWS_wan1"
    dst-zone "FWS_lan"
    src-addr "Any"
    dst-addr "Any"
    service "FWS_tcp-23"
  exit
  rule id 10002
    name "FWS_firewall_3"
    action permit
    src-zone "FWS_wan1"
    dst-zone "FWS_lan"
    src-ip 198.51.100.0/24
    dst-ip 192.168.127.50/32
    dst-addr "FWS_wan1-address"
    service "FWS_tcp-443"
  exit
  rule id 10003
    name "FWS_firewall_4"
    action permit
    src-zone "FWS_lan"
    dst-zone "FWS_wan2"
    src-ip 192.168.127.30/32
    dst-addr "Any"
    service "FWS_udp-20000-20010-from-1024-65535"
  exit
  rule id 10004
    name "FWS_firewall_5"
    action permit
    src-zone "FWS_lan"
    src-addr "Any"
    dst-addr "Any"
    service "ICMP"
  exit
  rule id 10005
    disable
    name "FWS_firewall_6"
    action permit
    src-zone "FWS_wan2"
    dst-zone "FWS_lan"
    src-addr "Any"
    dst-addr "Any"
    service "Any"
  exit
  rule id 10006
    disable
    name "FWS_firewall_7"
    action permit
    src-zone "FWS_lan"
    dst-zone "FWS_wan1"
    src-addr "Any"
    dst-addr "Any"
    service "Any"
  exit
  rule id 10007
    disable
    name "FWS_firewall_8"
    action permit
    src-zone "FWS_wan2"
    dst-zone "FWS_lan"
    src-addr "Any"
    dst-range 192.168.127.60 192.168.127.69
    dst-ip 198.51.100.60/32
    service "FWS_tcp-8080-8090"
  exit
  rule id 10008
    name "FWS_firewall_9"
    action deny
    src-zone "FWS_lan"
    src-range 192.168.127.200 192.168.127.250
    dst-addr "Any"
    service "Any"
  exit
  rule id 10009
    name "FWS_firewall_10"
    action permit
    src-zone "FWS_wan2"
    dst-zone "FWS_lan"
    src-addr "Any"
    dst-ip 192.168.127.60/32
    dst-ip 198.51.100.60/32
    service "FWS_tcp-22"
  exit
  default-action permit
exit
ip vrouter "trust-vr"
  dnatrule id 10000 from "Any" to "FWS_wan1-address" service "FWS_tcp-8443" trans-to "FWS_nat-ip_nat_1-dnat" port 443
  snatrule id 10000 from "FWS_nat-ip_nat_2-inside" to "Any" service "Any" trans-to address-book "FWS_nat-ip_nat_2-outside" mode static
  dnatrule id 10001 from "Any" to "FWS_nat-ip_nat_2-outside" service "Any" trans-to "FWS_nat-ip_nat_2-inside"
  snatrule id 10001 from "FWS_nat-ip_nat_3-from" to "Any" service "Any" eif wan1 trans-to eif-ip mode dynamicport
exit
end
