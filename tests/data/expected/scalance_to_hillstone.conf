configure
zone "FWS_vlan1"
  description "vlan1"
exit
zone "FWS_vlan2"
  description "vlan2"
exit
zone "FWS_vlan3"
  description "vlan3"
exit
zone "FWS_ipsecALL"
  description "ipsecALL"
exit
service "FWS_SYSLOG"
  udp dst-port 514
exit
service "FWS_S7COMM"
  tcp dst-port 102
exit
service "FWS_OPC-UA"
  tcp dst-port 4840
exit
service "FWS_MODBUS"
  tcp dst-port 502
exit
service "FWS_PING"
  icmp type 8 code 0 0
exit
service "FWS_HTTPS"
  tcp dst-port 443
exit
service "FWS_HIGHPORTS"
  tcp dst-port 8000 8100 src-port 1024 65535
exit
service "FWS_GRE"
  protocol 47
exit
service "FWS_UNREACH"
  icmp type 3 code 4 4
exit
service "FWS_tcp-8443"
  tcp dst-port 8443
exit
address "FWS_nat-napt_1-to"
  ip 198.51.100.2/32
exit
address "FWS_nat-napt_1-dnat"
  ip 192.168.30.10/32
exit
service "FWS_udp-4840"
  udp dst-port 4840
exit
address "FWS_nat-napt_2-to"
  ip 198.51.100.5/32
exit
address "FWS_nat-napt_2-dnat"
  ip 192.168.10.20/32
exit
address "FWS_nat-netmap_destination_1-to"
  ip 198.51.100.64/30
exit
address "FWS_nat-netmap_destination_1-dnat"
  ip 192.168.30.64/30
exit
address "FWS_nat-src-nat_1-from"
  ip 192.168.10.0/24
exit
address "FWS_nat-src-nat_1-pool"
  ip 198.51.100.3/32
exit
policy-global
  rule id 10000
    name "FWS_ipv4rule_4"
    action permit
    src-zone "FWS_vlan1"
    dst-zone "FWS_vlan2"
    src-ip 192.168.10.0/24
    dst-ip 198.51.100.200/32
    service "FWS_SYSLOG"
  exit
  rule id 10001
    name "FWS_ipv4rule_2"
    action deny
    src-zone "FWS_vlan2"
    dst-zone "FWS_vlan1"
    src-ip 198.51.100.0/24
    dst-ip 192.168.10.0/24
    service "FWS_S7COMM"
    log policy-deny
  exit
  rule id 10002
    name "FWS_ipv4rule_1"
    action permit
    src-zone "FWS_vlan2"
    dst-zone "FWS_vlan1"
    src-ip 198.51.100.10/32
    dst-ip 192.168.10.20/32
    service "FWS_OPC-UA"
    log session-end
  exit
  rule id 10003
    name "FWS_ipv4rule_3"
    action permit
    src-zone "FWS_vlan2"
    dst-zone "FWS_vlan1"
    src-range 198.51.100.40 198.51.100.49
    dst-ip 192.168.10.30/32
    service "FWS_MODBUS"
  exit
  rule id 10004
    name "FWS_ipv4rule_5"
    action permit
    src-zone "FWS_vlan1"
    dst-zone "FWS_vlan2"
    src-ip 192.168.10.0/24
    dst-addr "Any"
    service "FWS_PING"
  exit
  rule id 10005
    name "FWS_ipv4rule_6"
    action permit
    src-zone "FWS_vlan2"
    dst-zone "FWS_vlan3"
    src-addr "Any"
    dst-ip 192.168.30.10/32
    dst-ip 198.51.100.2/32
    service "FWS_HTTPS"
    log session-end
  exit
  rule id 10006
    name "FWS_ipv4rule_7"
    action permit
    src-zone "FWS_vlan2"
    dst-zone "FWS_vlan3"
    src-addr "Any"
    dst-ip 192.168.30.64/30
    dst-ip 198.51.100.64/30
    service "FWS_HIGHPORTS"
  exit
  rule id 10007
    name "FWS_ipv4rule_8"
    action deny
    src-zone "FWS_vlan3"
    dst-zone "FWS_vlan1"
    src-ip 192.168.30.0/24
    dst-ip 192.168.10.0/24
    service "Any"
    log policy-deny
  exit
  rule id 10008
    name "FWS_ipv4rule_9"
    action permit
    src-zone "FWS_vlan1"
    dst-zone "FWS_vlan3"
    src-ip 192.168.10.0/24
    dst-ip 192.168.30.0/24
    service "FWS_GRE"
  exit
  rule id 10009
    disable
    name "FWS_ipv4rule_11"
    action permit
    src-zone "FWS_vlan2"
    dst-zone "FWS_vlan1"
    src-addr "Any"
    dst-ip 192.168.10.40/32
    service "FWS_MODBUS"
  exit
  rule id 10010
    disable
    name "FWS_ipv4rule_12"
    action permit
    src-zone "FWS_vlan2"
    dst-zone "FWS_vlan1"
    src-addr "Any"
    dst-ip 192.168.10.50/32
    service "Any"
  exit
  rule id 10011
    name "FWS_ipv4rule_13"
    action permit
    src-zone "FWS_ipsecALL"
    dst-zone "FWS_vlan1"
    src-ip 10.30.0.0/16
    dst-ip 192.168.10.0/24
    service "FWS_S7COMM"
    log session-end
  exit
  rule id 10012
    disable
    name "FWS_ipv4rule_14"
    action permit
    src-zone "FWS_vlan2"
    dst-zone "FWS_vlan1"
    src-ip 198.51.100.77/32
    dst-ip 192.168.10.60/32
    service "FWS_OPC-UA"
  exit
  rule id 10013
    name "FWS_ipv4rule_15"
    action permit
    src-zone "FWS_vlan3"
    dst-zone "FWS_vlan2"
    src-ip 192.168.30.0/24
    dst-addr "Any"
    service "FWS_UNREACH"
  exit
  rule id 10014
    name "FWS_ipv6rule_1_v6"
    action permit
    src-zone "FWS_vlan2"
    dst-zone "FWS_vlan1"
    src-ip 2001:db8:2::/64
    dst-ip 2001:db8:1::10/128
    service "FWS_OPC-UA"
    log session-end
  exit
  rule id 10015
    disable
    name "FWS_ipv6rule_2_v6"
    action permit
    src-zone "FWS_vlan1"
    dst-zone "FWS_vlan2"
    src-ip 2001:db8:1::/64
    dst-addr "IPv6-any"
    service "Any"
  exit
  rule id 10016
    name "FWS_intrazone_vlan1"
    action permit
    src-zone "FWS_vlan1"
    dst-zone "FWS_vlan1"
    src-addr "Any"
    dst-addr "Any"
    service "Any"
  exit
  rule id 10017
    name "FWS_intrazone_vlan1_v6"
    action permit
    src-zone "FWS_vlan1"
    dst-zone "FWS_vlan1"
    src-addr "IPv6-any"
    dst-addr "IPv6-any"
    service "Any"
  exit
  rule id 10018
    name "FWS_intrazone_vlan2"
    action permit
    src-zone "FWS_vlan2"
    dst-zone "FWS_vlan2"
    src-addr "Any"
    dst-addr "Any"
    service "Any"
  exit
  rule id 10019
    name "FWS_intrazone_vlan2_v6"
    action permit
    src-zone "FWS_vlan2"
    dst-zone "FWS_vlan2"
    src-addr "IPv6-any"
    dst-addr "IPv6-any"
    service "Any"
  exit
  rule id 10020
    name "FWS_intrazone_vlan3"
    action permit
    src-zone "FWS_vlan3"
    dst-zone "FWS_vlan3"
    src-addr "Any"
    dst-addr "Any"
    service "Any"
  exit
  rule id 10021
    name "FWS_intrazone_vlan3_v6"
    action permit
    src-zone "FWS_vlan3"
    dst-zone "FWS_vlan3"
    src-addr "IPv6-any"
    dst-addr "IPv6-any"
    service "Any"
  exit
  rule id 10022
    name "FWS_intrazone_ipsecALL"
    action permit
    src-zone "FWS_ipsecALL"
    dst-zone "FWS_ipsecALL"
    src-addr "Any"
    dst-addr "Any"
    service "Any"
  exit
  rule id 10023
    name "FWS_intrazone_ipsecALL_v6"
    action permit
    src-zone "FWS_ipsecALL"
    dst-zone "FWS_ipsecALL"
    src-addr "IPv6-any"
    dst-addr "IPv6-any"
    service "Any"
  exit
exit
ip vrouter "trust-vr"
  dnatrule id 10000 from "Any" to "FWS_nat-napt_1-to" service "FWS_tcp-8443" trans-to "FWS_nat-napt_1-dnat" port 443
  dnatrule id 10001 from "Any" to "FWS_nat-napt_2-to" service "FWS_udp-4840" trans-to "FWS_nat-napt_2-dnat"
  dnatrule id 10002 from "Any" to "FWS_nat-netmap_destination_1-to" service "Any" trans-to "FWS_nat-netmap_destination_1-dnat"
  snatrule id 10000 from "FWS_nat-src-nat_1-from" to "Any" service "Any" eif vlan2 trans-to address-book "FWS_nat-src-nat_1-pool" mode dynamicport
  snatrule id 10001 from "Any" to "Any" service "Any" eif vlan2 trans-to eif-ip mode dynamicport
exit
end
