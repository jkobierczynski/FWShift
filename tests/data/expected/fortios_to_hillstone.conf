configure
zone "FWS_lan"
  description "lan"
exit
zone "FWS_wan1"
  description "wan1"
exit
zone "FWS_ot"
  description "ot"
exit
service "FWS_Web_Access"
  tcp dst-port 80
  tcp dst-port 443
exit
service "FWS_DNS"
  tcp dst-port 53
  udp dst-port 53
exit
address "FWS_lan-net"
  ip 10.10.0.0/15
exit
service "FWS_basic-net"
  tcp dst-port 53
  udp dst-port 53
  icmp type 8
exit
service "FWS_app-ports"
  tcp dst-port 8080
  tcp dst-port 8443
  tcp dst-port 9000 9010
exit
address "FWS_vip-web"
  ip 203.0.113.10/32
exit
service "FWS_SMTP"
  tcp dst-port 25
exit
address "FWS_vip-mail"
  ip 203.0.113.25/32
exit
service "FWS_SSH"
  tcp dst-port 22
exit
address "FWS_admin-range"
  range 10.10.5.10 10.10.5.20
exit
address "FWS_dmz-servers"
  ip 10.20.0.10/32
  ip 10.20.0.25/32
exit
service "FWS_HTTPS"
  tcp dst-port 443
exit
address "FWS_updates.example.com"
  host "updates.example.com"
exit
service "FWS_MODBUS"
  tcp dst-port 502
exit
address "FWS_scada-server"
  ip 10.10.7.15/32
exit
address "FWS_plc-net"
  ip 10.30.1.0/24
exit
service "FWS_GRE"
  protocol 47
exit
service "FWS_syslog-from-high"
  udp dst-port 514 src-port 1024 65535
exit
address "FWS_10.99.0.0_16"
  ip 10.99.0.0/16
exit
address "FWS_lan6-net_v6" ipv6
  ip 2001:db8:10::/48
exit
service "FWS_HTTP"
  tcp dst-port 80
exit
address "FWS_web-1"
  ip 10.20.0.10/32
exit
service "FWS_TIMESTAMP"
  icmp type 13
exit
address "FWS_nat-vip-web-dnat"
  ip 10.20.0.10/32
exit
address "FWS_nat-vip-mail-dnat"
  ip 10.20.0.25/32
exit
policy-global
  rule id 10000
    name "FWS_LAN_to_Internet"
    action permit
    src-zone "FWS_lan"
    dst-zone "FWS_wan1"
    src-addr "FWS_lan-net"
    dst-addr "Any"
    service "FWS_Web_Access"
    service "FWS_DNS"
    log session-end
  exit
  rule id 10001
    name "FWS_LAN_basics"
    action permit
    src-zone "FWS_lan"
    dst-zone "FWS_wan1"
    src-addr "Any"
    dst-addr "Any"
    service "FWS_basic-net"
  exit
  rule id 10002
    name "FWS_Inbound_web"
    action permit
    src-zone "FWS_wan1"
    dst-zone "dmz"
    src-addr "Any"
    dst-addr "FWS_vip-web"
    service "FWS_app-ports"
    log session-start
    log session-end
  exit
  rule id 10003
    name "FWS_Inbound_mail"
    action permit
    src-zone "FWS_wan1"
    dst-zone "dmz"
    src-addr "Any"
    dst-addr "FWS_vip-mail"
    service "FWS_SMTP"
  exit
  rule id 10004
    disable
    name "FWS_Admins_to_DMZ"
    action permit
    src-zone "FWS_lan"
    dst-zone "dmz"
    src-addr "FWS_admin-range"
    dst-addr "FWS_dmz-servers"
    service "FWS_SSH"
  exit
  rule id 10005
    disable
    name "FWS_Block_geo"
    action deny
    dst-zone "FWS_wan1"
    src-addr "Any"
    dst-ip 0.0.0.0/32
    service "Any"
    log policy-deny
  exit
  rule id 10006
    name "FWS_DMZ_out_via_pool"
    action permit
    src-zone "dmz"
    dst-zone "FWS_wan1"
    src-addr "FWS_dmz-servers"
    dst-addr "FWS_updates.example.com"
    service "FWS_HTTPS"
  exit
  rule id 10007
    name "FWS_SCADA_to_PLCs"
    action permit
    src-zone "FWS_lan"
    dst-zone "FWS_ot"
    src-addr "FWS_scada-server"
    dst-addr "FWS_plc-net"
    service "FWS_MODBUS"
    log session-end
    description "Engineering access to the controllers"
  exit
  rule id 10008
    name "FWS_OT_no_internet"
    action deny
    src-zone "FWS_ot"
    dst-zone "FWS_wan1"
    src-addr "Any"
    dst-addr "Any"
    service "Any"
    log policy-deny
  exit
  rule id 10009
    name "FWS_Partner_tunnel"
    action permit
    src-zone "FWS_lan"
    dst-zone "FWS_wan1"
    src-addr "FWS_lan-net"
    dst-addr "FWS_10.99.0.0_16"
    service "FWS_GRE"
    service "FWS_syslog-from-high"
  exit
  rule id 10010
    name "FWS_LAN_v6_out_v6"
    action permit
    src-zone "FWS_lan"
    dst-zone "FWS_wan1"
    src-addr "FWS_lan6-net_v6"
    dst-addr "IPv6-any"
    service "FWS_HTTPS"
  exit
  rule id 10011
    disable
    name "FWS_policy-12"
    action permit
    src-zone "FWS_lan"
    dst-zone "dmz"
    src-addr "FWS_lan-net"
    dst-addr "FWS_web-1"
    service "FWS_HTTP"
  exit
  rule id 10012
    disable
    name "FWS_Not_web"
    action permit
    src-zone "dmz"
    dst-zone "FWS_wan1"
    src-addr "FWS_web-1"
    dst-addr "Any"
    service "Any"
  exit
  rule id 10013
    name "FWS_Timestamp_probes"
    action permit
    src-zone "FWS_lan"
    dst-zone "dmz"
    src-addr "FWS_admin-range"
    dst-addr "FWS_dmz-servers"
    service "FWS_TIMESTAMP"
  exit
exit
ip vrouter "trust-vr"
  dnatrule id 10000 from "Any" to "FWS_vip-web" service "FWS_HTTPS" trans-to "FWS_nat-vip-web-dnat" port 8443
  dnatrule id 10001 from "Any" to "FWS_vip-mail" service "Any" trans-to "FWS_nat-vip-mail-dnat"
  snatrule id 10000 from "FWS_lan-net" to "Any" service "Any" eif wan1 trans-to eif-ip mode dynamicport
  snatrule id 10001 from "Any" to "Any" service "Any" eif wan1 trans-to eif-ip mode dynamicport
exit
end
