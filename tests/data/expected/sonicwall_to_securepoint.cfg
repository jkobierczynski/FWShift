# Securepoint UTM: commands of its CLI (spcli), written by FWShift. They add network objects, services and the
# rule group 'fwshift' with its rules, and delete nothing. Lines that start with '#' are not commands: leave them
# out when loading (grep -v '^#'). Nothing applies until 'system update rule', nothing is kept over a restart until
# 'system config save': run both yourself after reading the report (section 10 of the manual).
node new name "net-0.0.0.0_0" address "0.0.0.0/0" zone "LAN"
node new name "Bad Net One" address "203.0.113.0/25" zone "WAN"
node new name "Bad Host" address "192.0.2.66/32" zone "WAN"
node group new name "Bad Networks" nodes [ "Bad Net One" "Bad Host" ]
service new name "SSH" proto "tcp" dst-ports [ "22" ] src-ports [ ]
node new name "Admin PCs-1" address "10.10.5.10/31" zone "LAN"
node new name "Admin PCs-2" address "10.10.5.12/30" zone "LAN"
node new name "Admin PCs-3" address "10.10.5.16/30" zone "LAN"
node new name "Admin PCs-4" address "10.10.5.20/32" zone "LAN"
node group new name "Admin PCs" nodes [ "Admin PCs-1" "Admin PCs-2" "Admin PCs-3" "Admin PCs-4" ]
node new name "net-0.0.0.0_0-WAN" address "0.0.0.0/0" zone "WAN"
service new name "HTTP" proto "tcp" dst-ports [ "80" ] src-ports [ ]
service new name "HTTPS" proto "tcp" dst-ports [ "443" ] src-ports [ ]
service new name "HTTPS Alt" proto "tcp" dst-ports [ "8443" ] src-ports [ ]
service group new name "Web Services" services [ "HTTP" "HTTPS" "HTTPS Alt" ]
service new name "GRE Tunnel" proto "gre" 
node new name "Web Public" address "198.51.100.10/32" zone "DMZ"
service new name "SMTP Alt" proto "tcp" dst-ports [ "2525" ] src-ports [ ]
node new name "Partner Net" address "192.0.2.128/26" zone "WAN"
node group new name "Partners" nodes [ "Partner Net" "Bad Net One" "Bad Host" ]
node new name "Mail Public" address "198.51.100.11/32" zone "DMZ"
node new name "net-0.0.0.0_0-DMZ" address "0.0.0.0/0" zone "DMZ"
service new name "Media" proto "udp" dst-ports [ "16384-16484" ] src-ports [ ]
node new name "Web Server" address "10.20.0.10/32" zone "DMZ"
node new name "Database" address "10.30.0.5/32" zone "Servers"
node new name "net-___0" address "::/0" zone "LAN"
node new name "net-___0-WAN" address "::/0" zone "WAN"
node group new name "any-LAN" nodes [ "net-0.0.0.0_0" "net-___0" ]
node new name "any-v6-DMZ" address "::/0" zone "DMZ"
node group new name "any-DMZ" nodes [ "net-0.0.0.0_0-DMZ" "any-v6-DMZ" ]
node group new name "any-WAN" nodes [ "net-0.0.0.0_0-WAN" "net-___0-WAN" ]
node new name "any-v4-Servers" address "0.0.0.0/0" zone "Servers"
node new name "any-v6-Servers" address "::/0" zone "Servers"
node group new name "any-Servers" nodes [ "any-v4-Servers" "any-v6-Servers" ]
node new name "any-v4-VPN" address "0.0.0.0/0" zone "VPN"
node new name "any-v6-VPN" address "::/0" zone "VPN"
node group new name "any-VPN" nodes [ "any-v4-VPN" "any-v6-VPN" ]
node new name "X0 Subnet" address "10.10.0.0/16" zone "LAN"
node new name "X0 Subnet-WAN" address "10.10.0.0/16" zone "WAN"
node new name "X0 Subnet-DMZ" address "10.10.0.0/16" zone "DMZ"
node new name "X0 Subnet-Servers" address "10.10.0.0/16" zone "Servers"
node new name "X0 Subnet-VPN" address "10.10.0.0/16" zone "VPN"
rule group new name "fwshift"
rule new group "fwshift" src "net-0.0.0.0_0" dst "Bad Networks" service "any" comment "LAN to WAN #1" flags [ "DROP" "LOG_ALL" ]
rule new group "fwshift" src "Admin PCs" dst "net-0.0.0.0_0-WAN" service "SSH" comment "Admins out by SSH" flags [ "ACCEPT" "LOG_ALL" ]
rule new group "fwshift" src "net-0.0.0.0_0" dst "net-0.0.0.0_0-WAN" service "Web Services" comment "LAN to WAN #3" flags [ "ACCEPT" "LOG_ALL" ]
# rule new group "fwshift" src "net-0.0.0.0_0" dst "net-0.0.0.0_0-WAN" service "GRE Tunnel" comment "LAN to WAN #4" flags [ "ACCEPT" "LOG_ALL" ]
rule new group "fwshift" src "net-0.0.0.0_0" dst "net-0.0.0.0_0-WAN" service "any" comment "LAN to WAN #5" flags [ "ACCEPT" "LOG_ALL" ]
rule new group "fwshift" src "net-0.0.0.0_0-WAN" dst "Web Public" service "HTTPS" comment "Web server from the internet" flags [ "ACCEPT" "LOG_ALL" ]
rule new group "fwshift" src "Partners" dst "Mail Public" service "SMTP Alt" comment "Mail from partners" flags [ "ACCEPT" "LOG_ALL" ]
rule new group "fwshift" src "net-0.0.0.0_0-WAN" dst "net-0.0.0.0_0-DMZ" service "any" comment "WAN to DMZ #3" flags [ "DROP" "LOG_ALL" ]
rule new group "fwshift" src "net-0.0.0.0_0-WAN" dst "net-0.0.0.0_0" service "any" comment "WAN to LAN #1" flags [ "DROP" "LOG_ALL" ]
rule new group "fwshift" src "Web Server" dst "Database" service "Media" comment "Web server to the database" flags [ "ACCEPT" "LOG_ALL" ]
# not written: Administrators to the DMZ (source user match Admins is not converted)
# not written: Updates in working hours (schedule 'Work Hours' is not converted; the rule would apply at all times; the destination holds host name 'updates.example.com'; that a network object of the UTM takes a host name is not documented)
rule new group "fwshift" src "net-___0" dst "net-___0-WAN" service "any" comment "IPv6 out" flags [ "ACCEPT" "LOG_ALL" ]
rule new group "fwshift" src "any-LAN" dst "any-DMZ" service "any" comment "default LAN to DMZ" flags [ "ACCEPT" ]
rule new group "fwshift" src "any-DMZ" dst "any-WAN" service "any" comment "default DMZ to WAN" flags [ "ACCEPT" ]
rule new group "fwshift" src "any-Servers" dst "any-WAN" service "any" comment "default Servers to WAN" flags [ "ACCEPT" ]
rule new group "fwshift" src "any-Servers" dst "any-DMZ" service "any" comment "default Servers to DMZ" flags [ "ACCEPT" ]
rule new group "fwshift" src "any-LAN" dst "any-LAN" service "any" comment "fwshift-default" flags [ "ACCEPT" ]
rule new group "fwshift" src "any-Servers" dst "any-Servers" service "any" comment "fwshift-default" flags [ "ACCEPT" ]
rule new group "fwshift" src "any-VPN" dst "any-VPN" service "any" comment "fwshift-default" flags [ "ACCEPT" ]
rule new group "fwshift" src "X0 Subnet" dst "any-WAN" service "any" comment "Default NAT" flags [ "DROP" "HIDENAT" ] nat_node "WAN-interface"
rule new group "fwshift" src "X0 Subnet-WAN" dst "any-WAN" service "any" comment "Default NAT" flags [ "DROP" "HIDENAT" ] nat_node "WAN-interface"
rule new group "fwshift" src "X0 Subnet-DMZ" dst "any-WAN" service "any" comment "Default NAT" flags [ "DROP" "HIDENAT" ] nat_node "WAN-interface"
rule new group "fwshift" src "X0 Subnet-Servers" dst "any-WAN" service "any" comment "Default NAT" flags [ "DROP" "HIDENAT" ] nat_node "WAN-interface"
rule new group "fwshift" src "X0 Subnet-VPN" dst "any-WAN" service "any" comment "Default NAT" flags [ "DROP" "HIDENAT" ] nat_node "WAN-interface"
