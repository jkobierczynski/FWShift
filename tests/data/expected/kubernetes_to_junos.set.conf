set security policies global policy not_isolated__from_pods description "what no policy decides is allowed to and from pods"
set security policies global policy not_isolated__from_pods match source-address all-pods
set security policies global policy not_isolated__from_pods match destination-address any
set security policies global policy not_isolated__from_pods match application any
set security policies global policy not_isolated__from_pods then permit
set security policies global policy not_isolated__to_pods description "what no policy decides is allowed to and from pods"
set security policies global policy not_isolated__to_pods match source-address any
set security policies global policy not_isolated__to_pods match destination-address all-pods
set security policies global policy not_isolated__to_pods match application any
set security policies global policy not_isolated__to_pods then permit
