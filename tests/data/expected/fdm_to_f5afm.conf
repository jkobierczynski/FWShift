# Generated by FWShift: a network firewall policy for BIG-IP AFM. Read the report first: what is written
# disabled or not converted is listed there. Copy the file to the BIG-IP, then:
#
#   tmsh load sys config merge file /var/tmp/THIS_FILE verify     checks it, changes nothing
#   tmsh load sys config merge file /var/tmp/THIS_FILE            creates the objects and the policy
#
# It creates address lists, port lists, the rule list /Common/FWShift_rules and the policy /Common/FWShift, and
# enforces the policy nowhere. Objects of the same name are changed by the merge: check that none exists.
# Attach the policy to a context yourself, for example:
#   tmsh modify security firewall global-rules enforced-policy /Common/FWShift
#   tmsh modify net route-domain /Common/0 fw-enforced-policy /Common/FWShift
#   tmsh modify ltm virtual /Common/VS fw-enforced-policy /Common/FWShift
# The BIG-IP lets through only traffic that a virtual server takes.
security firewall address-list /Common/any-ipv4 {
    addresses {
        0.0.0.0/0 { }
    }
}
security firewall address-list /Common/any-ipv6 {
    addresses {
        ::/0 { }
    }
}
security firewall address-list /Common/office-lan {
    addresses {
        10.40.0.0/24 { }
    }
    description "Branch office"
}
security firewall address-list /Common/iot-net {
    addresses {
        10.41.0.0/24 { }
    }
}
security firewall address-list /Common/nas {
    addresses {
        10.40.0.10 { }
    }
}
security firewall address-list /Common/nas-public {
    addresses {
        192.0.2.10 { }
    }
}
security firewall address-list /Common/printers {
    addresses {
        10.40.0.200/29 { }
        10.40.0.208/29 { }
        10.40.0.216/30 { }
        10.40.0.220 { }
    }
}
security firewall address-list /Common/head-office-v6 {
    addresses {
        2001:db8:1::/48 { }
    }
}
security firewall address-list /Common/vendor-cloud {
    fqdns {
        telemetry.example.net { }
    }
}
security firewall address-list /Common/outside-interface {
    addresses {
        192.0.2.2 { }
    }
    description "address of interface outside when the configuration was read"
}
security firewall address-list /Common/office-devices {
    address-lists {
        /Common/nas
        /Common/printers
    }
}
security firewall port-list /Common/HTTPS {
    ports {
        443 { }
    }
}
security firewall port-list /Common/HTTP {
    ports {
        80 { }
    }
}
security firewall port-list /Common/rdp {
    ports {
        3389 { }
    }
}
security firewall port-list /Common/nas-web {
    ports {
        5001 { }
    }
}
security firewall port-list /Common/nas-external {
    ports {
        8443 { }
    }
}
security firewall port-list /Common/DNS_over_UDP {
    ports {
        53 { }
    }
}
security firewall port-list /Common/udp-high {
    ports {
        1024-65535 { }
    }
}
security firewall rule-list /Common/FWShift_rules {
    rules {
        Block_IoT_to_office {
            action drop
            log yes
            source {
                address-lists {
                    /Common/iot-net
                }
                vlans {
                    /Common/inside_zone
                }
            }
            destination {
                address-lists {
                    /Common/office-lan
                    /Common/nas-public
                }
            }
        }
        Inside_Outside_web {
            action accept-decisively
            description "FWSHIFT disabled, see the report."
            ip-protocol udp
            log yes
            source {
                address-lists {
                    /Common/office-lan
                }
                vlans {
                    /Common/inside_zone
                }
            }
            destination {
                port-lists {
                    /Common/DNS_over_UDP
                }
            }
            status disabled
        }
        Inside_Outside_web_2 {
            action accept-decisively
            description "FWSHIFT disabled, see the report."
            ip-protocol tcp
            log yes
            source {
                address-lists {
                    /Common/office-lan
                }
                vlans {
                    /Common/inside_zone
                }
            }
            destination {
                ports {
                    80 { }
                    443 { }
                }
            }
            status disabled
        }
        IoT_telemetry {
            action accept-decisively
            description "FWSHIFT disabled, see the report."
            ip-protocol tcp
            log yes
            source {
                address-lists {
                    /Common/iot-net
                }
                vlans {
                    /Common/inside_zone
                }
            }
            destination {
                address-lists {
                    /Common/vendor-cloud
                }
                port-lists {
                    /Common/HTTPS
                }
            }
            status disabled
        }
        NAS_from_Internet {
            action accept-decisively
            description "FWSHIFT disabled, see the report."
            ip-protocol tcp
            log yes
            source {
                vlans {
                    /Common/outside_zone
                }
            }
            destination {
                address-lists {
                    /Common/nas
                    /Common/outside-interface
                    /Common/nas-public
                }
                port-lists {
                    /Common/nas-web
                }
            }
            status disabled
        }
        Head_office_v6 {
            action accept-decisively
            ip-protocol tcp
            source {
                address-lists {
                    /Common/head-office-v6
                }
                vlans {
                    /Common/outside_zone
                }
            }
            destination {
                address-lists {
                    /Common/office-devices
                    /Common/nas-public
                }
                port-lists {
                    /Common/rdp
                }
            }
        }
        Head_office_v6_2 {
            action accept-decisively
            ip-protocol gre
            source {
                address-lists {
                    /Common/head-office-v6
                }
                vlans {
                    /Common/outside_zone
                }
            }
            destination {
                address-lists {
                    /Common/office-devices
                    /Common/nas-public
                }
            }
        }
        Head_office_v6_3 {
            action accept-decisively
            icmp {
                8 { }
            }
            ip-protocol icmp
            source {
                address-lists {
                    /Common/head-office-v6
                }
                vlans {
                    /Common/outside_zone
                }
            }
            destination {
                address-lists {
                    /Common/office-devices
                    /Common/nas-public
                }
            }
        }
        DNS_answers {
            action accept-decisively
            description "FWSHIFT disabled, see the report."
            ip-protocol udp
            source {
                ports {
                    53 { }
                }
                vlans {
                    /Common/outside_zone
                }
            }
            destination {
                ports {
                    1024-65535 { }
                }
            }
            status disabled
        }
        Staff_streaming {
            action drop
            description "FWSHIFT disabled, see the report."
            log yes
            source {
                vlans {
                    /Common/inside_zone
                }
            }
            status disabled
        }
        Guests_by_time {
            action accept-decisively
            description "FWSHIFT disabled, see the report."
            icmp {
                3:3 { }
            }
            ip-protocol icmp
            log yes
            source {
                address-lists {
                    /Common/printers
                }
                vlans {
                    /Common/inside_zone
                }
            }
            status disabled
        }
        fwshift_default {
            action drop
            description "FWSHIFT: what no rule of the policy matches"
        }
    }
}
security firewall policy /Common/FWShift {
    rules {
        FWShift_rules {
            rule-list /Common/FWShift_rules
        }
    }
}
