configure
zone "FWS_outside"
  description "outside"
exit
zone "FWS_inside"
  description "inside"
exit
zone "FWS_guest"
  description "guest"
exit
service "FWS_tcp-8080"
  tcp dst-port 8080
exit
address "FWS_web-srv"
  ip 10.20.0.10/32
exit
address "FWS_web-public"
  ip 203.0.113.10/32
exit
service "FWS_mail-services"
  tcp dst-port 8443
  tcp dst-port 25
  tcp dst-port 587
exit
address "FWS_mail-srv"
  ip 10.20.0.25/32
exit
service "FWS_dns-ntp"
  tcp dst-port 53
  udp dst-port 53
  udp dst-port 123
exit
address "FWS_inside-net"
