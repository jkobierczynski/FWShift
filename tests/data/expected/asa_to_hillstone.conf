exit
service "FWS_web-ports"
  tcp dst-port 80
  tcp dst-port 443
  tcp dst-port 8000 8010
exit
address "FWS_internal"
  ip 10.10.0.0/16
  ip 10.20.0.10/32
  ip 10.20.0.25/32
  ip 10.20.0.50/32
  ip 10.40.0.0/16
exit
service "FWS_tcp-22"
  tcp dst-port 22
exit
address "FWS_admin-range"
  range 10.10.5.10 10.10.5.20
exit
address "FWS_dmz-servers"
  ip 10.20.0.10/32
  ip 10.20.0.25/32
  ip 10.20.0.50/32
exit
service "FWS_tcp-443"
  tcp dst-port 443
exit
address "FWS_updates"
  host "updates.example.com"
exit
address "FWS_inside-v6_v6" ipv6
  ip 2001:db8:10::/64
exit
service "FWS_tcp-udp-5060"
