exit
service "FWS_udp-53"
  udp dst-port 53
exit
service "FWS_tcp-src-1024-65535-dst-25"
  tcp dst-port 25 src-port 1024 65535
exit
address "FWS_branch-net"
  ip 10.99.0.0/16
exit
service "FWS_tcp-80"
  tcp dst-port 80
exit
address "FWS_nat-nat-mail-srv-inside"
  ip 10.20.0.25/32
exit
address "FWS_nat-nat-mail-srv-outside"
  ip 203.0.113.25/32
exit
address "FWS_guest-pool"
  range 203.0.113.100 203.0.113.110
exit
policy-global
