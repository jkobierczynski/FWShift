ip vrouter "trust-vr"
  dnatrule id 10000 from "FWS_inside-net" to "FWS_branch-net" service "Any" no-trans
  snatrule id 10000 from "FWS_inside-net" to "FWS_branch-net" service "Any" no-trans
  dnatrule id 10001 from "Any" to "FWS_web-public" service "FWS_tcp-80" trans-to "FWS_web-srv" port 8080
  snatrule id 10001 from "FWS_nat-nat-mail-srv-inside" to "Any" service "Any" trans-to address-book "FWS_nat-nat-mail-srv-outside" mode static
  dnatrule id 10002 from "Any" to "FWS_nat-nat-mail-srv-outside" service "Any" trans-to "FWS_nat-nat-mail-srv-inside"
  snatrule id 10002 from "FWS_inside-net" to "Any" service "Any" eif GigabitEthernet0/0 trans-to eif-ip mode dynamicport
  snatrule id 10003 from "Any" to "Any" service "Any" eif GigabitEthernet0/0 trans-to address-book "FWS_guest-pool" mode dynamicport
exit
end
