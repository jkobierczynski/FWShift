# Put the interfaces in their zones (this changes traffic at once):
#   zone FWS_nsg-web: no interface is known
#   zone FWS_nsg-app: no interface is known
#   zone FWS_nsg-db: no interface is known
#   zone FWS_outside: no interface is known
# Written disabled:
#   nsg-web:https-in: references 'Internet': dynamic address group, members are not known statically; 'Internet' holds members only its platform knows
#   nsg-web:AllowVnetInBound: references 'VirtualNetwork': dynamic address group, members are not known statically; 'VirtualNetwork' holds members only its platform knows
#   nsg-web:no-internet: references 'Internet': dynamic address group, members are not known statically; 'Internet' holds members only its platform knows
#   nsg-web:AllowVnetOutBound: references 'VirtualNetwork': dynamic address group, members are not known statically; 'VirtualNetwork' holds members only its platform knows
#   nsg-web:AllowInternetOutBound: references 'Internet': dynamic address group, members are not known statically; 'Internet' holds members only its platform knows
#   nsg-app:icmp-vnet: references 'VirtualNetwork': dynamic address group, members are not known statically; 'VirtualNetwork' holds members only its platform knows
#   nsg-app:AllowVnetInBound: references 'VirtualNetwork': dynamic address group, members are not known statically; 'VirtualNetwork' holds members only its platform knows
