configure
service "FWS_shop-db-in-1"
  tcp dst-port 0 65535
exit
service "FWS_tcp-5432"
  tcp dst-port 5432
exit
address "FWS_shop-app_members"
  ip 10.30.2.20/31
exit
address "FWS_shop"
  ip 10.30.0.0/16
exit
address "FWS_shop_v6" ipv6
  ip 2001:db8:30::/56
exit
address "FWS_shop-db_members"
  ip 10.30.3.30/32
exit
service "FWS_tcp-8080"
  tcp dst-port 8080
exit
address "FWS_shop-web_members"
  ip 10.30.1.10/32
exit
address "FWS_shop-web_members_v6" ipv6
  ip 2001:db8:30:1::10/128
exit
service "FWS_tcp-443"
  tcp dst-port 443
exit
address "FWS_shop-web"
  ip 10.30.1.10/32
exit
address "FWS_shop-web_v6" ipv6
  ip 2001:db8:30:1::10/128
exit
service "FWS_tcp-80"
  tcp dst-port 80
exit
service "FWS_tcp-22"
  tcp dst-port 22
exit
address "FWS_shop-bastion"
  ip 10.30.9.5/32
exit
service "FWS_icmp-3-4"
  icmp type 3 code 4 4
exit
address "FWS_shop-app"
  ip 10.30.2.20/31
exit
address "FWS_shop-db"
  ip 10.30.3.30/32
exit
address "FWS_corp-offices"
  ip 198.51.100.0/25
  ip 203.0.113.64/26
exit
address "FWS_nat-public-192.0.2.10-inside"
  ip 10.30.1.10/32
exit
address "FWS_nat-public-192.0.2.10-outside"
  ip 192.0.2.10/32
exit
address "FWS_nat-public-192.0.2.5-inside"
  ip 10.30.9.5/32
exit
address "FWS_nat-public-192.0.2.5-outside"
  ip 192.0.2.5/32
exit
policy-global
  rule id 10000
    name "FWS_shop-db-in-shop-db"
    action deny
    src-ip 10.30.1.0/24
    dst-ip 10.30.3.0/24
    service "FWS_shop-db-in-1"
    description "denied by network ACL acl-0a1b2c3d4e5f63031 where traffic enters subnet subnet-0a1b2c3d4e5f63013"
  exit
  rule id 10001
    disable
    name "FWS_shop-db-in-shop-db-2"
    action deny
    src-range 0.0.0.0 10.29.255.255
    src-range 10.31.0.0 255.255.255.255
    dst-ip 10.30.3.0/24
    service "Any"
    description "denied by network ACL acl-0a1b2c3d4e5f63031 where traffic enters subnet subnet-0a1b2c3d4e5f63013"
  exit
  rule id 10002
    disable
    name "FWS_shop-db-in-shop-db-3"
    action deny
    src-ip 10.30.0.0/24
    src-ip 10.30.2.0/24
    src-range 10.30.4.0 10.30.255.255
    dst-ip 10.30.3.0/24
    service "Any"
    description "denied by network ACL acl-0a1b2c3d4e5f63031 where traffic enters subnet subnet-0a1b2c3d4e5f63013"
  exit
  rule id 10003
    disable
    name "FWS_shop-db-in-shop-db-4"
    action deny
    src-ip 10.30.1.0/24
    dst-ip 10.30.3.0/24
    service "Any"
    description "denied by network ACL acl-0a1b2c3d4e5f63031 where traffic enters subnet subnet-0a1b2c3d4e5f63013"
  exit
  rule id 10004
    name "FWS_shop-app-to-shop-db"
    action permit
    src-ip 10.30.2.20/31
    dst-ip 10.30.3.30/32
    service "FWS_tcp-5432"
    description "outbound rule of shop-app and inbound rule of shop-db"
  exit
  rule id 10005
    name "FWS_shop-app-outbound-rest"
    action deny
    src-addr "FWS_shop-app_members"
    dst-addr "FWS_shop"
    dst-ip 192.0.2.10/32
    dst-ip 192.0.2.5/32
    service "Any"
    description "what the outbound rules of shop-app do not allow inside the VPC"
  exit
  rule id 10006
    name "FWS_shop-db-outbound-rest"
    action deny
    src-addr "FWS_shop-db_members"
    dst-addr "FWS_shop"
    dst-ip 192.0.2.10/32
    dst-ip 192.0.2.5/32
    service "Any"
    description "what the outbound rules of shop-db do not allow inside the VPC"
  exit
  rule id 10007
    name "FWS_shop-web-to-shop-app"
    action permit
    src-ip 10.30.1.10/32
    dst-ip 10.30.2.20/31
    service "FWS_tcp-8080"
    description "outbound rule of shop-web and inbound rule of shop-app"
  exit
  rule id 10008
    name "FWS_shop-web-outbound-rest"
    action deny
    src-addr "FWS_shop-web_members"
    dst-addr "FWS_shop"
    dst-ip 192.0.2.10/32
    dst-ip 192.0.2.5/32
    service "Any"
    description "what the outbound rules of shop-web do not allow inside the VPC"
  exit
  rule id 10009
    name "FWS_shop-web-outbound-rest_v6"
    action deny
    src-addr "FWS_shop-web_members_v6"
    dst-addr "FWS_shop_v6"
    service "Any"
    description "what the outbound rules of shop-web do not allow inside the VPC"
  exit
  rule id 10010
    name "FWS_shop-web-in-1"
    action permit
    src-addr "Any"
    dst-addr "FWS_shop-web"
    dst-ip 192.0.2.10/32
    service "FWS_tcp-443"
    description "https"
  exit
  rule id 10011
    name "FWS_shop-web-in-2_v6"
    action permit
    src-addr "IPv6-any"
    dst-addr "FWS_shop-web_v6"
    service "FWS_tcp-443"
    description "https"
  exit
  rule id 10012
    name "FWS_shop-web-in-3"
    action permit
    src-addr "Any"
    dst-addr "FWS_shop-web"
    dst-ip 192.0.2.10/32
    service "FWS_tcp-80"
    description "http"
  exit
  rule id 10013
    name "FWS_shop-web-in-4"
    action permit
    src-addr "FWS_shop-bastion"
    dst-addr "FWS_shop-web"
    dst-ip 192.0.2.10/32
    service "FWS_tcp-22"
    description "ssh from bastion"
  exit
  rule id 10014
    name "FWS_shop-web-in-5"
    action permit
    src-ip 10.0.0.0/8
    dst-addr "FWS_shop-web"
    dst-ip 192.0.2.10/32
    service "FWS_icmp-3-4"
    description "fragmentation needed"
  exit
  rule id 10015
    name "FWS_shop-app-in-1"
    action permit
    src-addr "FWS_shop-web"
    dst-addr "FWS_shop-app"
    service "FWS_tcp-8080"
    description "from web"
  exit
  rule id 10016
    name "FWS_shop-app-in-2"
    action permit
    src-addr "FWS_shop-bastion"
    dst-addr "FWS_shop-app"
    service "FWS_tcp-22"
    description "ssh"
  exit
  rule id 10017
    name "FWS_shop-app-in-3"
    action permit
    src-addr "FWS_shop-app"
    dst-addr "FWS_shop-app"
    service "Any"
    description "cluster"
  exit
  rule id 10018
    name "FWS_shop-bastion-in-1"
    action permit
    src-ip 198.51.100.0/24
    dst-addr "FWS_shop-bastion"
    dst-ip 192.0.2.5/32
    service "FWS_tcp-22"
    description "admins"
  exit
  rule id 10019
    name "FWS_shop-bastion-in-3"
    action permit
    src-ip 198.51.100.0/24
    dst-addr "FWS_shop-bastion"
    dst-ip 192.0.2.5/32
    service "ICMP"
  exit
  rule id 10020
    disable
    name "FWS_shop-bastion-in-4"
    action permit
    src-ip 0.0.0.0/32
    dst-addr "FWS_shop-bastion"
    dst-ip 192.0.2.5/32
    service "FWS_tcp-22"
    description "audit account"
  exit
  rule id 10021
    name "FWS_shop-db-in-1_2"
    action permit
    src-ip 10.30.2.0/24
    dst-addr "FWS_shop-db"
    service "FWS_tcp-5432"
    description "postgres"
  exit
  rule id 10022
    name "FWS_shop-db-in-2"
    action permit
    src-ip 10.30.9.0/24
    dst-addr "FWS_shop-db"
    service "FWS_tcp-5432"
    description "postgres"
  exit
  rule id 10023
    name "FWS_shop-web-out-2"
    action permit
    src-addr "FWS_shop-web"
    dst-addr "FWS_corp-offices"
    service "FWS_tcp-443"
    description "to the offices"
  exit
exit
ip vrouter "trust-vr"
  snatrule id 10000 from "FWS_nat-public-192.0.2.10-inside" to "Any" service "Any" trans-to address-book "FWS_nat-public-192.0.2.10-outside" mode static
  dnatrule id 10000 from "Any" to "FWS_nat-public-192.0.2.10-outside" service "Any" trans-to "FWS_nat-public-192.0.2.10-inside"
  snatrule id 10001 from "FWS_nat-public-192.0.2.5-inside" to "Any" service "Any" trans-to address-book "FWS_nat-public-192.0.2.5-outside" mode static
  dnatrule id 10001 from "Any" to "FWS_nat-public-192.0.2.5-outside" service "Any" trans-to "FWS_nat-public-192.0.2.5-inside"
exit
end
