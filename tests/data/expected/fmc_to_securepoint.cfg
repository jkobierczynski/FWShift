service group new name "Branch IPv6" services [ "HTTPS" "echo6" ]
node new name "branch-v6" address "2001:db8:10::/48" zone "outside"
node new name "net-2001_db8_20__10_128" address "2001:db8:20::10/128" zone "dmz"
node new name "web-srv-pub" address "203.0.113.10/32" zone "firewall-outside"
