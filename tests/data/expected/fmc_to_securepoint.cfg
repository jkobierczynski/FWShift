node new name "any-v6-outside" address "::/0" zone "outside"
node group new name "any-outside" nodes [ "any-v4-outside" "any-v6-outside" ]
node new name "any-v4-inside" address "0.0.0.0/0" zone "inside"
node new name "any-v6-inside" address "::/0" zone "inside"
node group new name "any-inside" nodes [ "any-v4-inside" "any-v6-inside" ]
node new name "any-v4-dmz" address "0.0.0.0/0" zone "dmz"
node new name "any-v6-dmz" address "::/0" zone "dmz"
node group new name "any-dmz" nodes [ "any-v4-dmz" "any-v6-dmz" ]
service new name "gre" proto "gre" 
node new name "partner-net" address "198.51.100.0/24" zone "outside"
node new name "web-srv" address "10.20.0.10/32" zone "dmz"
