# Securepoint UTM: commands of its CLI (spcli), written by FWShift. They add network objects, services and the
# rule group 'fwshift' with its rules, and delete nothing. Lines that start with '#' are not commands: leave them
# out when loading (grep -v '^#'). Nothing applies until 'system update rule', nothing is kept over a restart until
# 'system config save': run both yourself after reading the report (section 10 of the manual).
service new name "backup" proto "tcp" dst-ports [ "10000" ] src-ports [ ]
node new name "lan-net" address "10.10.0.0/24" zone "inside"
node new name "mail-srv" address "10.20.0.25/32" zone "dmz"
node new name "mail-srv-pub" address "203.0.113.25/32" zone "dmz"
node group new name "pre-backup-dst" nodes [ "mail-srv" "mail-srv-pub" ]
