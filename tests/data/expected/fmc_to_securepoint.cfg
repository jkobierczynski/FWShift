service group new name "Inbound web" services [ "HTTP" "HTTPS" ]
service new name "smtp_2" proto "tcp" dst-ports [ "25" ] src-ports [ ]
service new name "SSH" proto "tcp" dst-ports [ "22" ] src-ports [ ]
service new name "echo" proto "icmp" icmp-types [ "8" ]
service group new name "mgmt" services [ "SSH" "echo" ]
node new name "admin-pcs-1" address "10.10.0.100/30" zone "inside"
node new name "admin-pcs-2" address "10.10.0.104/29" zone "inside"
