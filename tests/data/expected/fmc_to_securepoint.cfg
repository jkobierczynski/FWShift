service new name "proto-41" proto "ipv6" 
service new name "udp-3544" proto "udp" dst-ports [ "3544" ] src-ports [ ]
service group new name "prefilter-default-block-tunnels" services [ "gre" "ipinip" "proto-41" "udp-3544" ]
node new name "ot-net" address "10.30.0.0/24" zone "inside"
service new name "HTTP" proto "tcp" dst-ports [ "80" ] src-ports [ ]
service new name "HTTPS" proto "tcp" dst-ports [ "443" ] src-ports [ ]
service new name "web-alt" proto "tcp" dst-ports [ "8080-8081" ] src-ports [ ]
