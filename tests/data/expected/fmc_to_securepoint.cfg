rule group new name "fwshift"
rule new group "fwshift" src "lan-net" dst "pre-backup-dst" service "backup" comment "pre-backup" flags [ "ACCEPT" ]
rule new group "fwshift" src "IPv4-Private-10.0.0.0-8" dst "any-outside" service "any" comment "pre-spoofed" flags [ "DROP" "LOG_ALL" ]
rule new group "fwshift" src "IPv4-Private-10.0.0.0-8" dst "any-inside" service "any" comment "pre-spoofed" flags [ "DROP" "LOG_ALL" ]
rule new group "fwshift" src "IPv4-Private-10.0.0.0-8" dst "any-dmz" service "any" comment "pre-spoofed" flags [ "DROP" "LOG_ALL" ]
rule new group "fwshift" src "partner-net" dst "web-srv" service "gre" comment "pre-partner-gre" flags [ "ACCEPT" ]
rule new group "fwshift" src "web-srv" dst "partner-net" service "gre" comment "pre-partner-gre-reverse" flags [ "ACCEPT" ]
rule new group "fwshift" src "any-outside" dst "any-outside" service "prefilter-default-block-tunnels" comment "prefilter-default-block-tunnels" flags [ "DROP" ]
rule new group "fwshift" src "any-outside" dst "any-inside" service "prefilter-default-block-tunnels" comment "prefilter-default-block-tunnels" flags [ "DROP" ]
rule new group "fwshift" src "any-outside" dst "any-dmz" service "prefilter-default-block-tunnels" comment "prefilter-default-block-tunnels" flags [ "DROP" ]
rule new group "fwshift" src "any-inside" dst "any-outside" service "prefilter-default-block-tunnels" comment "prefilter-default-block-tunnels" flags [ "DROP" ]
rule new group "fwshift" src "any-inside" dst "any-inside" service "prefilter-default-block-tunnels" comment "prefilter-default-block-tunnels" flags [ "DROP" ]
rule new group "fwshift" src "any-inside" dst "any-dmz" service "prefilter-default-block-tunnels" comment "prefilter-default-block-tunnels" flags [ "DROP" ]
rule new group "fwshift" src "any-dmz" dst "any-outside" service "prefilter-default-block-tunnels" comment "prefilter-default-block-tunnels" flags [ "DROP" ]
rule new group "fwshift" src "any-dmz" dst "any-inside" service "prefilter-default-block-tunnels" comment "prefilter-default-block-tunnels" flags [ "DROP" ]
rule new group "fwshift" src "any-dmz" dst "any-dmz" service "prefilter-default-block-tunnels" comment "prefilter-default-block-tunnels" flags [ "DROP" ]
rule new group "fwshift" src "ot-net" dst "any-outside" service "any" comment "Block OT outbound" flags [ "DROP" "LOG_ALL" ]
rule new group "fwshift" src "lan-net" dst "any-outside" service "web" comment "LAN web" flags [ "ACCEPT" "LOG_ALL" ]
rule new group "fwshift" src "lan-net" dst "any-outside" service "LAN DNS and NTP" comment "LAN DNS and NTP" flags [ "ACCEPT" ]
# not written: Updates (the destination holds host name 'updates.example.com'; that a network object of the UTM takes a host name is not documented)
rule new group "fwshift" src "any-outside" dst "web-srv" service "Inbound web" comment "Inbound web" flags [ "ACCEPT" "LOG_ALL" ]
rule new group "fwshift" src "any-outside" dst "pre-backup-dst" service "smtp_2" comment "Inbound mail" flags [ "ACCEPT" "LOG_ALL" ]
rule new group "fwshift" src "admin-pcs" dst "Admin access-dst" service "mgmt" comment "Admin access" flags [ "ACCEPT" "LOG_ALL" ]
# not written: Helpdesk RDP (source user match CORP\helpdesk is not converted)
# not written: Staff social media (not converted: an application condition)
rule new group "fwshift" src "partner-net" dst "web-srv" service "Partner service" comment "Partner service" flags [ "ACCEPT" "LOG_ALL" ]
rule new group "fwshift" src "Uncategorised web-src" dst "any-outside" service "Inbound web" comment "Uncategorised web" flags [ "DROP" "LOG_ALL" ]
# rule new group "fwshift" src "any-inside" dst "any-outside" service "tcp-21" comment "Old FTP" flags [ "ACCEPT" "LOG_ALL" ]
rule new group "fwshift" src "any-outside" dst "net-10.20.0.53_32" service "udp-src-53-dst-1024-65535" comment "DNS answers to resolver" flags [ "ACCEPT" ]
rule new group "fwshift" src "branch-v6" dst "net-2001_db8_20__10_128" service "Branch IPv6" comment "Branch IPv6" flags [ "ACCEPT" "LOG_ALL" ]
rule new group "fwshift" src "any-inside" dst "any-outside" service "echo" comment "Ping out" flags [ "ACCEPT" ]
rule new group "fwshift" src "any-inside" dst "any-inside" service "echo" comment "Ping out" flags [ "ACCEPT" ]
rule new group "fwshift" src "any-inside" dst "any-dmz" service "echo" comment "Ping out" flags [ "ACCEPT" ]
rule new group "fwshift" src "any-dmz" dst "any-outside" service "echo" comment "Ping out" flags [ "ACCEPT" ]
rule new group "fwshift" src "any-dmz" dst "any-inside" service "echo" comment "Ping out" flags [ "ACCEPT" ]
rule new group "fwshift" src "any-dmz" dst "any-dmz" service "echo" comment "Ping out" flags [ "ACCEPT" ]
rule new group "fwshift" src "any-inside" dst "any-outside" service "any" comment "Reset the rest from inside" flags [ "REJECT" "LOG_ALL" ]
rule new group "fwshift" src "any-inside" dst "any-inside" service "any" comment "Reset the rest from inside" flags [ "REJECT" "LOG_ALL" ]
rule new group "fwshift" src "any-inside" dst "any-dmz" service "any" comment "Reset the rest from inside" flags [ "REJECT" "LOG_ALL" ]
rule new group "fwshift" src "lan-net" dst "partner-net" service "any" comment "nat-1" flags [ "DROP" "HIDENAT_EXCLUDE" ]
rule new group "fwshift" src "any-v4-outside" dst "web-srv" service "any" comment "nat-2" flags [ "DROP" "DESTNAT" ] nat_node "web-srv-pub" nat_service "any"
rule new group "fwshift" src "any-outside" dst "web-srv" service "nat-3-port" comment "nat-3" flags [ "DROP" "DESTNAT" ] nat_node "outside-interface" nat_service "tcp-8443"
rule new group "fwshift" src "dmz-net" dst "any-outside" service "any" comment "nat-dmz-net" flags [ "DROP" "HIDENAT" ] nat_node "outside-interface"
rule new group "fwshift" src "internal" dst "any-outside" service "any" comment "nat-after-auto-1" flags [ "DROP" "HIDENAT" ] nat_node "outside-interface"
