match out on $fws_if_eth0 inet proto 47 from any to any tagged fws_eth1 tag fws_ok_eth1 label "Partner tunnel"

# What no rule decided: the default of the source.
block drop out quick tagged fws_eth1
block drop out quick tagged fws_eth0
block drop out quick tagged fws_eth2
block drop out quick tagged fws_eth3

# Source NAT, first match, of what the rules allowed.
match out on $fws_if_eth0 inet from 10.10.0.0/16 to 10.99.0.0/16 tagged fws_ok_eth1 tag fws_nat label "No NAT to partner"
match out on $fws_if_eth0 inet from 10.10.0.0/16 to 10.99.0.0/16 tagged fws_ok_eth0 tag fws_nat label "No NAT to partner"
match out on $fws_if_eth0 inet from 10.10.0.0/16 to 10.99.0.0/16 tagged fws_ok_eth2 tag fws_nat label "No NAT to partner"
match out on $fws_if_eth0 inet from 10.10.0.0/16 to 10.99.0.0/16 tagged fws_ok_eth3 tag fws_nat label "No NAT to partner"
match out on $fws_if_eth0 inet from 10.20.0.0/24 to any tagged fws_ok_eth1 nat-to 198.51.100.20/30 tag fws_nat label "DMZ out"
match out on $fws_if_eth0 inet from 10.20.0.0/24 to any tagged fws_ok_eth0 nat-to 198.51.100.20/30 tag fws_nat label "DMZ out"
match out on $fws_if_eth0 inet from 10.20.0.0/24 to any tagged fws_ok_eth2 nat-to 198.51.100.20/30 tag fws_nat label "DMZ out"
match out on $fws_if_eth0 inet from 10.20.0.0/24 to any tagged fws_ok_eth3 nat-to 198.51.100.20/30 tag fws_nat label "DMZ out"
match out on $fws_if_eth0 inet from 10.10.0.0/16 to any tagged fws_ok_eth1 nat-to ($fws_if_eth0) tag fws_nat label "LAN out"
match out on $fws_if_eth0 inet from 10.10.0.0/16 to any tagged fws_ok_eth0 nat-to ($fws_if_eth0) tag fws_nat label "LAN out"
match out on $fws_if_eth0 inet from 10.10.0.0/16 to any tagged fws_ok_eth2 nat-to ($fws_if_eth0) tag fws_nat label "LAN out"
match out on $fws_if_eth0 inet from 10.10.0.0/16 to any tagged fws_ok_eth3 nat-to ($fws_if_eth0) tag fws_nat label "LAN out"

# Pass what the rules allowed.
pass out quick tagged fws_ok_eth1
pass out quick tagged fws_ok_eth0
pass out quick tagged fws_ok_eth2
