# The interface (or interface group) of each zone.
fws_if_eth1 = "eth1"
fws_if_eth0 = "eth0"
fws_if_eth2 = "eth2"
fws_if_eth3 = "eth3"

# Tables.
table <fws_Admins_SSH_src> const { 10.10.5.10/31 10.10.5.12/30 10.10.5.16/30 10.10.5.20 }

# What arrives on the interface of a zone is marked with the zone.
match in on $fws_if_eth1 tag fws_eth1
match in on $fws_if_eth0 tag fws_eth0
match in on $fws_if_eth2 tag fws_eth2
match in on $fws_if_eth3 tag fws_eth3

# Destination NAT, first match, and what the rules may allow is let in: they decide when it leaves.
pass in quick on $fws_if_eth0 inet proto tcp from any to 203.0.113.10 port 443 rdr-to 10.20.0.10 port 8443 label "Web DNAT"
pass in quick on $fws_if_eth0 inet from any to 203.0.113.25 rdr-to 10.20.0.25 label "Mail DNAT"
pass in quick on $fws_if_eth1 inet proto tcp from any to ! self port { 80 443 } label "LAN web"
pass in quick on $fws_if_eth1 inet proto udp from any to ! self port 53 label "LAN DNS"
pass in quick on $fws_if_eth1 inet proto tcp from any to ! self port 53 label "LAN DNS-2"
pass in quick on $fws_if_eth0 proto tcp from any to 10.20.0.10 port 8443 label "Inbound web"
pass in quick on $fws_if_eth0 proto tcp from any to 10.20.0.25 port 25 label "Inbound mail"
pass in quick on $fws_if_eth1 proto tcp from <fws_Admins_SSH_src> to 10.20.0.0/24 port 22 label "Admins SSH"
pass in quick on $fws_if_eth1 proto tcp from <fws_Admins_SSH_src> to 10.20.0.0/24 port 3389 label "Admins RDP"
pass in quick on $fws_if_eth1 proto tcp from 10.10.7.15 to 10.30.1.0/24 port 502 label "SCADA to PLCs"
pass in quick on $fws_if_eth2 inet proto tcp from any to ! 10.0.0.0/8 port { 80 443 } label "DMZ updates"
pass in quick on $fws_if_eth1 inet proto icmp from any to ! self icmp-type 8 label "Ping the DMZ"
pass in quick on $fws_if_eth1 inet proto 47 from any to ! self label "Partner tunnel"

# The rules, first match, when the traffic leaves: the tag says the zone it came from.
block drop out quick from 198.51.100.66 to any tagged fws_eth1 label "Block bad host"
block drop out quick from 198.51.100.66 to any tagged fws_eth0 label "Block bad host"
block drop out quick from 198.51.100.66 to any tagged fws_eth2 label "Block bad host"
block drop out quick from 198.51.100.66 to any tagged fws_eth3 label "Block bad host"
block drop out quick on $fws_if_eth0 from 10.10.200.0/24 to any tagged fws_eth1 label "Guests stay in"
match out on $fws_if_eth0 inet proto tcp from any to any port { 80 443 } tagged fws_eth1 tag fws_ok_eth1 label "LAN web"
match out on $fws_if_eth0 inet proto udp from any to any port 53 tagged fws_eth1 tag fws_ok_eth1 label "LAN DNS"
match out on $fws_if_eth0 inet proto tcp from any to any port 53 tagged fws_eth1 tag fws_ok_eth1 label "LAN DNS-2"
match out on $fws_if_eth2 proto tcp from any to 10.20.0.10 port 8443 tagged fws_eth0 tag fws_ok_eth0 label "Inbound web"
match out on $fws_if_eth2 proto tcp from any to 10.20.0.25 port 25 tagged fws_eth0 tag fws_ok_eth0 label "Inbound mail"
match out on $fws_if_eth2 proto tcp from <fws_Admins_SSH_src> to 10.20.0.0/24 port 22 tagged fws_eth1 tag fws_ok_eth1 label "Admins SSH"
match out on $fws_if_eth2 proto tcp from <fws_Admins_SSH_src> to 10.20.0.0/24 port 3389 tagged fws_eth1 tag fws_ok_eth1 label "Admins RDP"
match out on $fws_if_eth3 proto tcp from 10.10.7.15 to 10.30.1.0/24 port 502 tagged fws_eth1 tag fws_ok_eth1 label "SCADA to PLCs"
block return out log quick on $fws_if_eth0 inet from any to any tagged fws_eth3 label "OT no internet"
match out on $fws_if_eth0 inet proto tcp from any to ! 10.0.0.0/8 port { 80 443 } tagged fws_eth2 tag fws_ok_eth2 label "DMZ updates"
# FWSHIFT disabled, see the report: "Rate limited mail" from eth1 to eth0; source 0.0.0.0/0; destination any; service tcp-25; action allow
