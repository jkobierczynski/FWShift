security firewall rule-list /Common/FWShift_rules {
    rules {
        BLOCK-BAD {
            action drop
            description "known bad networks"
            log yes
            source {
                address-lists {
                    /Common/Blocked-Nets__IPv4_
                }
            }
            destination {
                addresses {
                    0.0.0.0/0 { }
                }
            }
        }
        BLOCK-BAD-V6 {
            action drop
            log yes
            source {
                address-lists {
                    /Common/Blocked-Nets__IPv6_
                }
            }
            destination {
                addresses {
                    ::/0 { }
                }
            }
        }
        ADMIN-SSH__port2_ {
            action accept-decisively
            ip-protocol tcp
            log yes
            source {
                address-lists {
                    /Common/Admin-Hosts__port2_
                }
                vlans {
                    /Common/port2
                }
            }
            destination {
                address-lists {
                    /Common/DMZ-Servers
                }
                port-lists {
                    /Common/SSH
                }
            }
        }
        ADMIN-SSH__port1_ {
            action accept-decisively
            ip-protocol tcp
            log yes
            source {
                address-lists {
                    /Common/Admin-Hosts__port1_
                }
                vlans {
                    /Common/port1
                }
            }
            destination {
                address-lists {
                    /Common/DMZ-Servers
                }
                port-lists {
                    /Common/SSH
                }
            }
        }
        LAN-2-INTERNET {
            action accept-decisively
            ip-protocol tcp
            log yes
            source {
                address-lists {
                    /Common/Office-LAN
                }
            }
            destination {
                addresses {
                    0.0.0.0/0 { }
                }
                port-lists {
                    /Common/HTTP_S
                }
            }
        }
        WEB-IN {
            action accept-decisively
            description "FWSHIFT disabled, see the report."
            ip-protocol tcp
            log yes
            source {
                addresses {
                    0.0.0.0/0 { }
                }
            }
            destination {
                address-lists {
                    /Common/Public-Web
                }
                port-lists {
                    /Common/HTTP_S
                }
            }
            status disabled
        }
        SERVER-SYNC {
            action accept-decisively
            ip-protocol tcp
            log yes
            source {
                address-lists {
                    /Common/DMZ-Servers
                }
            }
            destination {
                address-lists {
                    /Common/Office-LAN
                }
                ports {
                    80 { }
                    443 { }
                    8080 { }
                }
            }
        }
        SERVER-SYNC__back_ {
            action accept-decisively
            ip-protocol tcp
            log yes
            source {
                address-lists {
                    /Common/Office-LAN
                }
            }
            destination {
                address-lists {
                    /Common/DMZ-Servers
                }
                ports {
                    80 { }
                    443 { }
                    8080 { }
                }
            }
        }
        DNS-OUT {
            action accept-decisively
            ip-protocol tcp
            log yes
            source {
                address-lists {
                    /Common/Server-Group
                }
            }
            destination {
                addresses {
                    0.0.0.0/0 { }
                }
                ports {
                    53 { }
                }
            }
            status disabled
        }
        DNS-OUT_2 {
            action accept-decisively
            ip-protocol udp
            log yes
            source {
                address-lists {
                    /Common/Server-Group
                }
            }
            destination {
                addresses {
                    0.0.0.0/0 { }
                }
                ports {
                    53 { }
                }
            }
            status disabled
        }
        PING-ALL {
            action accept-decisively
            ip-protocol icmp
            log yes
            source {
                address-lists {
                    /Common/Office-LAN
                }
            }
            destination {
                addresses {
                    0.0.0.0/0 { }
                }
            }
        }
        UPDATES {
            action accept-decisively
            ip-protocol tcp
            log yes
            source {
                address-lists {
                    /Common/DMZ-Servers
                }
            }
            destination {
                address-lists {
                    /Common/Updates__IPv4_
                }
                port-lists {
                    /Common/HTTP_S
                }
            }
        }
        V6-WEB {
            action accept-decisively
            ip-protocol tcp
            log yes
            source {
                addresses {
                    ::/0 { }
                }
            }
            destination {
                address-lists {
                    /Common/V6-Servers
                }
                port-lists {
                    /Common/HTTP_S
                }
            }
        }
        DENY-LAN-DMZ {
            action reject
            log yes
            source {
                address-lists {
                    /Common/Office-LAN
                }
            }
            destination {
                address-lists {
                    /Common/DMZ-Servers
                }
            }
        }
        GRE-LAB {
            action accept-decisively
            ip-protocol gre
            log yes
            source {
                address-lists {
                    /Common/Office-LAN
                }
            }
            destination {
                address-lists {
                    /Common/Mail-Server
                }
            }
        }
        TO-LAB {
            action drop
            description "FWSHIFT disabled, see the report."
            log yes
            source {
                address-lists {
                    /Common/Office-LAN
                }
            }
            destination {
                addresses {
                    0.0.0.0/0 { }
                }
            }
            status disabled
        }
        ODD {
            action accept-decisively
            description "FWSHIFT disabled, see the report."
            ip-protocol tcp
            log yes
            source {
                address-lists {
                    /Common/Office-LAN
                }
                ports {
                    1024-65535 { }
                }
            }
            destination {
                addresses {
                    0.0.0.0/0 { }
                }
                ports {
                    1000-2000 { }
                }
            }
            status disabled
        }
        BLOCKALL {
            action drop
            log yes
            source {
                addresses {
                    0.0.0.0/0 { }
                }
            }
            destination {
                addresses {
                    0.0.0.0/0 { }
                }
            }
        }
        fwshift_default {
            action drop
            description "FWSHIFT: what no rule of the policy matches"
        }
    }
}
security firewall policy /Common/FWShift {
    rules {
        FWShift_rules {
            rule-list /Common/FWShift_rules
        }
    }
}
