configure
zone "FWS_InternalZone"
  description "InternalZone"
exit
zone "FWS_ExternalZone"
  description "ExternalZone"
exit
service "FWS_domain-udp"
  udp dst-port 53
exit
service "FWS_domain-tcp"
  tcp dst-port 53
exit
address "FWS_lan-net"
  ip 10.10.0.0/16
exit
address "FWS_dmz-net"
  ip 10.20.0.0/24
exit
address "FWS_dns-servers"
  range 192.0.2.53 192.0.2.54
exit
address "FWS_dns-servers_v6" ipv6
  ip 2001:db8:53::54/128
exit
service "FWS_ssh"
  tcp dst-port 22
exit
address "FWS_admin-range"
  range 10.10.5.10 10.10.5.20
exit
address "FWS_dmz-servers"
  ip 10.20.0.10/32
  ip 10.20.0.25/32
  ip 203.0.113.10/32
exit
service "FWS_http"
  tcp dst-port 80
exit
service "FWS_https"
  tcp dst-port 443
exit
address "FWS_guest-net"
  ip 10.10.200.0/24
exit
address "FWS_not-dns-servers"
  range 0.0.0.0 192.0.2.52
  range 192.0.2.55 255.255.255.255
exit
address "FWS_not-dns-servers_v6" ipv6
  range :: 2001:db8:53::53
  range 2001:db8:53::55 ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
exit
address "FWS_plc-net"
  ip 10.30.1.0/24
exit
address "FWS_.updates.example.com"
  host "updates.example.com"
exit
service "FWS_syslog-from-high"
  udp dst-port 514 src-port 1024 65535
exit
address "FWS_lan6-net_v6" ipv6
  ip 2001:db8:10::/48
exit
address "FWS_web-1"
  ip 10.20.0.10/32
exit
address "FWS_web-1_valid_address"
  ip 203.0.113.10/32
exit
service "FWS_app-ports"
  tcp dst-port 443
  tcp dst-port 9000 9010
exit
service "FWS_smtp"
  tcp dst-port 25
exit
address "FWS_mail-1"
  ip 10.20.0.25/32
exit
service "FWS_echo-request"
  icmp type 8
exit
service "FWS_gre"
  protocol 47
exit
address "FWS_gw-edge"
  ip 198.51.100.1/32
exit
service "FWS_ident"
  tcp dst-port 113
exit
service "FWS_tcp-2525"
  tcp dst-port 2525
exit
address "FWS_mail-public"
  ip 203.0.113.25/32
exit
address "FWS_nat-out"
  ip 198.51.100.20/32
exit
policy-global
  rule id 10000
    name "FWS_DNS"
    action permit
    src-addr "FWS_lan-net"
    src-addr "FWS_dmz-net"
    dst-addr "FWS_dns-servers"
    service "FWS_domain-udp"
    service "FWS_domain-tcp"
    log session-end
    description "Name resolution"
  exit
  rule id 10001
    name "FWS_rule-2"
    action permit
    src-addr "FWS_admin-range"
    dst-addr "FWS_dmz-servers"
    service "FWS_ssh"
    log session-end
  exit
  rule id 10002
    name "FWS_Web_out"
    action permit
    src-zone "FWS_InternalZone"
    dst-zone "FWS_ExternalZone"
    src-addr "Any"
    dst-addr "Any"
    service "FWS_http"
    service "FWS_https"
    log session-end
  exit
  rule id 10003
    name "FWS_Web_out_v6"
    action permit
    src-zone "FWS_InternalZone"
    dst-zone "FWS_ExternalZone"
    src-addr "IPv6-any"
    dst-addr "IPv6-any"
    service "FWS_http"
    service "FWS_https"
    log session-end
  exit
  rule id 10004
    name "FWS_Guests_stay_out"
    action deny
    src-addr "FWS_guest-net"
    dst-addr "FWS_not-dns-servers"
    service "Any"
    log policy-deny
  exit
  rule id 10005
    disable
    name "FWS_Social"
    action permit
    src-addr "FWS_lan-net"
    dst-addr "Any"
    service "Any"
    log session-end
  exit
  rule id 10006
    disable
    name "FWS_Admins"
    action permit
    src-ip 0.0.0.0/32
    dst-addr "FWS_plc-net"
    service "Any"
    log session-end
  exit
  rule id 10007
    name "FWS_PLC_access"
    action permit
    src-addr "FWS_admin-range"
    dst-addr "FWS_plc-net"
    service "FWS_https"
    service "FWS_ssh"
    log session-end
    description "Operators from the office, vendor support from anywhere"
  exit
  rule id 10008
    disable
    name "FWS_PLC_access__plc-operators_"
    action permit
    src-addr "FWS_lan-net"
    dst-addr "FWS_plc-net"
    service "FWS_https"
    service "FWS_ssh"
    log session-end
    description "Operators from the office, vendor support from anywhere"
  exit
  rule id 10009
    disable
    name "FWS_PLC_access__vendor-support_"
    action permit
    src-addr "Any"
    dst-addr "FWS_plc-net"
    service "FWS_https"
    service "FWS_ssh"
    log session-end
    description "Operators from the office, vendor support from anywhere"
  exit
  rule id 10010
    disable
    name "FWS_DMZ_users"
    action permit
    src-addr "FWS_dmz-net"
    dst-addr "Any"
    service "FWS_https"
    log session-end
  exit
  rule id 10011
    disable
    name "FWS_Updates"
    action permit
    src-addr "FWS_dmz-servers"
    dst-addr "FWS_.updates.example.com"
    service "FWS_https"
    log session-end
  exit
  rule id 10012
    disable
    name "FWS_Old_rule"
    action permit
    src-ip 0.0.0.0/32
    dst-addr "Any"
    service "FWS_syslog-from-high"
    log session-end
  exit
  rule id 10013
    disable
    name "FWS_Partners"
    action permit
    src-addr "FWS_lan-net"
    dst-addr "FWS_plc-net"
    service "Any"
    log session-end
  exit
  rule id 10014
    name "FWS_IPv6_out_v6"
    action permit
    src-addr "FWS_lan6-net_v6"
    dst-addr "IPv6-any"
    service "FWS_https"
  exit
  rule id 10015
    name "FWS_Public_web"
    action permit
    src-addr "Any"
    dst-addr "FWS_web-1"
    dst-addr "FWS_web-1_valid_address"
    service "FWS_https"
    log session-end
    description "web-1 has automatic static NAT"
  exit
  rule id 10016
    name "FWS_DMZ_access___Web_in"
    action permit
    src-addr "Any"
    dst-ip 10.20.0.10/32
    service "FWS_app-ports"
    log session-end
  exit
  rule id 10017
    name "FWS_DMZ_access___Mail_in"
    action permit
    src-addr "Any"
    dst-addr "FWS_mail-1"
    service "FWS_smtp"
    log session-end
  exit
  rule id 10018
    name "FWS_DMZ_access___Ping_from_LAN"
    action permit
    src-addr "FWS_lan-net"
    dst-addr "FWS_dmz-net"
    service "FWS_echo-request"
  exit
  rule id 10019
    name "FWS_DMZ_access__cleanup_of_DMZ-Layer_"
    action deny
    src-addr "Any"
    dst-addr "FWS_dmz-net"
    service "Any"
    description "implicit cleanup of inline layer DMZ-Layer"
  exit
  rule id 10020
    name "FWS_Tunnels"
    action permit
    src-addr "Any"
    dst-addr "FWS_gw-edge"
    service "FWS_gre"
    log session-end
  exit
  rule id 10021
    name "FWS_No_ident"
    action deny
    src-addr "Any"
    dst-addr "Any"
    service "FWS_ident"
    log policy-deny
  exit
  rule id 10022
    name "FWS_No_ident_v6"
    action deny
    src-addr "IPv6-any"
    dst-addr "IPv6-any"
    service "FWS_ident"
    log policy-deny
  exit
  rule id 10023
    name "FWS_Cleanup_rule"
    action deny
    src-addr "Any"
    dst-addr "Any"
    service "Any"
    log policy-deny
  exit
  rule id 10024
    name "FWS_Cleanup_rule_v6"
    action deny
    src-addr "IPv6-any"
    dst-addr "IPv6-any"
    service "Any"
    log policy-deny
  exit
exit
ip vrouter "trust-vr"
  snatrule id 10000 from "FWS_web-1" to "Any" service "Any" trans-to address-book "FWS_web-1_valid_address" mode static
  dnatrule id 10000 from "Any" to "FWS_web-1_valid_address" service "Any" trans-to "FWS_web-1"
  dnatrule id 10001 from "FWS_plc-net" to "FWS_plc-net" service "Any" no-trans
  snatrule id 10001 from "FWS_plc-net" to "FWS_plc-net" service "Any" no-trans
  dnatrule id 10002 from "FWS_lan-net" to "FWS_dmz-net" service "Any" no-trans
  snatrule id 10002 from "FWS_lan-net" to "FWS_dmz-net" service "Any" no-trans
  dnatrule id 10003 from "Any" to "FWS_mail-public" service "FWS_tcp-2525" trans-to "FWS_mail-1" port 25
  snatrule id 10003 from "FWS_dmz-net" to "Any" service "Any" trans-to address-book "FWS_nat-out" mode dynamicport
exit
end
