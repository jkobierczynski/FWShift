                    10.10.5.24/29 { }
                    10.10.5.32/27 { }
                    10.10.5.64/26 { }
                    10.10.5.128/25 { }
                    10.10.6.0/23 { }
                    10.10.8.0/21 { }
                    10.10.16.0/20 { }
                    10.10.32.0/19 { }
                    10.10.64.0/18 { }
                    10.10.128.0/17 { }
                    10.11.0.0/16 { }
                    10.12.0.0/14 { }
                    10.16.0.0/12 { }
                    10.32.0.0/11 { }
                    10.64.0.0/10 { }
                    10.128.0.0/9 { }
                    11.0.0.0/8 { }
