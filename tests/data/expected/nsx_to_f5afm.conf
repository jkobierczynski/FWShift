        Block_quarantined {
            action drop
            description "FWSHIFT disabled, see the report."
            log yes
            source {
                address-lists {
                    /Common/Quarantine
                }
            }
            status disabled
        }
        DNS_to_resolvers {
            action accept-decisively
            ip-protocol tcp
            source {
                address-lists {
                    /Common/LAN
                }
            }
            destination {
                addresses {
                    192.0.2.53 { }
                }
                port-lists {
                    /Common/DNS
                }
            }
        }
        DNS_to_resolvers_2 {
            action accept-decisively
            ip-protocol udp
            source {
                address-lists {
                    /Common/LAN
