# Generated by FWShift: a network firewall policy for BIG-IP AFM. Read the report first: what is written
# disabled or not converted is listed there. Copy the file to the BIG-IP, then:
#
#   tmsh load sys config merge file /var/tmp/THIS_FILE verify     checks it, changes nothing
#   tmsh load sys config merge file /var/tmp/THIS_FILE            creates the objects and the policy
#
# It creates address lists, port lists, the rule list /Common/FWShift_rules and the policy /Common/FWShift, and
# enforces the policy nowhere. Objects of the same name are changed by the merge: check that none exists.
# Attach the policy to a context yourself, for example:
#   tmsh modify security firewall global-rules enforced-policy /Common/FWShift
#   tmsh modify net route-domain /Common/0 fw-enforced-policy /Common/FWShift
#   tmsh modify ltm virtual /Common/VS fw-enforced-policy /Common/FWShift
# The BIG-IP lets through only traffic that a virtual server takes.
security firewall address-list /Common/TRUSTED {
    addresses {
        10.8.0.0/24 { }
        192.168.1.0/25 { }
    }
    description "VyOS firewall group network-group TRUSTED"
}
security firewall address-list /Common/NAS {
    addresses {
        192.168.1.20/31 { }
    }
    description "VyOS firewall group address-group NAS"
}
security firewall port-list /Common/tcp-32400 {
    ports {
        32400 { }
    }
}
security firewall port-list /Common/tcp-8443 {
    ports {
        8443 { }
    }
}
security firewall port-list /Common/tcp-25 {
    ports {
        25 { }
    }
}
security firewall rule-list /Common/FWShift_rules {
    rules {
        no_media_from_the_guests {
            action drop
            description "VyOS firewall name LAN_OUT rule 10 (forward-5.WAN_IN-30>forward-15.LAN_OUT-10)"
            ip-protocol tcp
            source {
                addresses {
                    192.168.10.0/24 { }
                }
                vlans {
                    /Common/pppoe0
                }
            }
            destination {
                addresses {
                    192.168.1.30 { }
                }
                port-lists {
                    /Common/tcp-32400
                }
            }
        }
        plex_to_the_media_box {
            action accept-decisively
            description "VyOS firewall name WAN_IN rule 30, then ipv4 forward filter default-action accept (forward-5.WAN_IN-30)"
            ip-protocol tcp
            source {
                vlans {
                    /Common/pppoe0
                }
            }
            destination {
                addresses {
                    192.168.1.30 { }
                }
                port-lists {
                    /Common/tcp-32400
                }
            }
        }
        ping_the_nas {
            action accept-decisively
            description "VyOS firewall name WAN_IN rule 40, then ipv4 forward filter default-action accept (forward-5.WAN_IN-40)"
            icmp {
                8 { }
            }
            ip-protocol icmp
            source {
                vlans {
                    /Common/pppoe0
                }
            }
            destination {
                address-lists {
                    /Common/NAS
                }
            }
        }
        old_rule {
            action accept-decisively
            description "VyOS firewall name WAN_IN rule 50 (forward-5.WAN_IN-50)"
            ip-protocol tcp
            source {
                vlans {
                    /Common/pppoe0
                }
            }
            destination {
                addresses {
                    192.168.1.40 { }
                }
            }
            status disabled
        }
        syn_to_the_mail_server {
            action accept-decisively
            description "VyOS firewall name WAN_IN rule 60, then ipv4 forward filter default-action accept (forward-5.WAN_IN-60)"
            ip-protocol tcp
            source {
                vlans {
                    /Common/pppoe0
                }
            }
            destination {
                addresses {
                    192.168.1.25 { }
                }
                port-lists {
                    /Common/tcp-25
                }
            }
        }
        no_media_from_the_guests-2 {
            action drop
            description "FWSHIFT disabled, see the report. VyOS firewall name LAN_OUT rule 10 (forward-5.WAN_IN-70>forward-15.LAN_OUT-10)"
            ip-protocol tcp
            source {
                addresses {
                    192.168.10.0/24 { }
                }
                vlans {
                    /Common/pppoe0
                }
            }
            destination {
                ports {
                    8096-8097 { }
                    32400 { }
                }
            }
            status disabled
        }
        no_media_from_the_guests-2_2 {
            action drop
            description "FWSHIFT disabled, see the report. VyOS firewall name LAN_OUT rule 10 (forward-5.WAN_IN-70>forward-15.LAN_OUT-10)"
            ip-protocol udp
            source {
                addresses {
                    192.168.10.0/24 { }
                }
                vlans {
                    /Common/pppoe0
                }
            }
            destination {
                ports {
                    8096-8097 { }
                    32400 { }
                }
            }
            status disabled
        }
        sessions_of_the_voip_box {
            action accept-decisively
            description "FWSHIFT disabled, see the report. VyOS firewall name WAN_IN rule 70, then ipv4 forward filter default-action accept (forward-5.WAN_IN-70)"
            source {
                addresses {
                    0.0.0.0/0 { }
                }
                vlans {
                    /Common/pppoe0
                }
            }
            status disabled
        }
        forward-5.default {
            action drop
            description "VyOS firewall name WAN_IN default-action drop"
            source {
                addresses {
                    0.0.0.0/0 { }
                }
                vlans {
                    /Common/pppoe0
                }
            }
        }
        no_way_into_the_LAN {
            action drop
            description "VyOS firewall name GUEST_IN rule 10 (forward-10.GUEST_IN-10)"
            log yes
            source {
                vlans {
                    /Common/eth1.10
                }
            }
            destination {
                address-lists {
                    /Common/TRUSTED
                }
            }
        }
        only_web_and_dns_out {
            action drop
            description "VyOS firewall name GUEST_IN rule 20 (forward-10.GUEST_IN-20)"
            ip-protocol tcp
            source {
                addresses {
                    0.0.0.0/0 { }
                }
                vlans {
                    /Common/eth1.10
                }
            }
            destination {
                ports {
                    0-52 { }
                    54-79 { }
                    81-442 { }
                    444-65535 { }
                }
            }
        }
        only_web_and_dns_out_2 {
            action drop
            description "VyOS firewall name GUEST_IN rule 20 (forward-10.GUEST_IN-20)"
            ip-protocol udp
            source {
                addresses {
                    0.0.0.0/0 { }
                }
                vlans {
                    /Common/eth1.10
                }
            }
            destination {
                ports {
                    0-52 { }
                    54-79 { }
                    81-442 { }
                    444-65535 { }
                }
            }
        }
        no_media_from_the_guests-3 {
            action drop
            description "VyOS firewall name LAN_OUT rule 10 (forward-15.LAN_OUT-10)"
            ip-protocol tcp
            source {
                addresses {
                    192.168.10.0/24 { }
                }
            }
            destination {
                ports {
                    8096-8097 { }
                    32400 { }
                }
            }
        }
        no_media_from_the_guests-3_2 {
            action drop
            description "VyOS firewall name LAN_OUT rule 10 (forward-15.LAN_OUT-10)"
            ip-protocol udp
            source {
                addresses {
                    192.168.10.0/24 { }
                }
            }
            destination {
                ports {
                    8096-8097 { }
                    32400 { }
                }
            }
        }
        Allow_IPv6_ping {
            action accept-decisively
            description "VyOS firewall ipv6-name WANv6_IN rule 30, then ipv6 forward filter default-action accept (ipv6-forward-5.WANv6_IN-30)"
            icmp {
                128 { }
            }
            ip-protocol ipv6-icmp
            source {
                addresses {
                    ::/0 { }
                }
                vlans {
                    /Common/pppoe0
                }
            }
        }
        ipv6-forward-5.default {
            action drop
            description "VyOS firewall ipv6-name WANv6_IN default-action drop"
            source {
                addresses {
                    ::/0 { }
                }
                vlans {
                    /Common/pppoe0
                }
            }
        }
        fwshift_default {
            action accept-decisively
            description "FWSHIFT: what no rule of the policy matches"
        }
    }
}
security firewall policy /Common/FWShift {
    rules {
        FWShift_rules {
            rule-list /Common/FWShift_rules
        }
    }
}
