configure
zone "FWS_out"
  description "out"
exit
zone "FWS_in"
  description "in"
exit
zone "FWS_dmz1"
  description "dmz1"
exit
zone "FWS_lab"
  description "lab"
exit
zone "FWS_labbridge"
  description "labbridge"
exit
address "FWS_global_bad"
  ip 192.0.2.128/25
exit
service "FWS_ssh"
  tcp dst-port 22
exit
service "FWS_https"
  tcp dst-port 443
exit
address "FWS_admins"
  ip 10.10.0.50/32
  ip 10.10.0.60/32
exit
address "FWS_firewall_all"
  ip 10.10.0.254/32
  ip 10.20.0.254/32
  ip 10.30.0.254/32
  ip 203.0.113.2/32
exit
address "FWS_admins_v6" ipv6
  ip 2001:db8:10::60/128
exit
address "FWS_Network_internals"
  ip 10.10.0.0/24
  ip 10.20.0.0/24
  ip 10.30.0.0/24
exit
address "FWS_blocked"
  ip 198.51.100.0/24
exit
service "FWS_web_ports"
  tcp dst-port 80
  tcp dst-port 443
  tcp dst-port 8080 8090
exit
address "FWS_not-Network_internals"
  range 0.0.0.0 10.9.255.255
  range 10.10.1.0 10.19.255.255
  range 10.20.1.0 10.29.255.255
  range 10.30.1.0 255.255.255.255
exit
service "FWS__rule__dns_udp-udp"
  udp dst-port 53
exit
address "FWS_lan"
  ip 10.10.0.0/24
exit
service "FWS_ident"
  tcp dst-port 113
exit
service "FWS_http"
  tcp dst-port 80
exit
address "FWS_web_pub"
  ip 203.0.113.3/32
exit
service "FWS_smtp"
  tcp dst-port 25
exit
address "FWS_dmz_servers"
  ip 10.20.0.10/32
  ip 10.20.0.25/32
exit
service "FWS_lab_tools"
  tcp dst-port 5000 5010
  udp dst-port 5000 5010
exit
address "FWS_lab_net"
  ip 10.30.0.0/24
exit
service "FWS__rule__ipproto-proto_200"
  protocol 200
exit
address "FWS_not-lan"
  range 0.0.0.0 10.9.255.255
  range 10.10.1.0 255.255.255.255
exit
address "FWS_updates.example.com"
  host "updates.example.com"
exit
address "FWS_lan6_v6" ipv6
  ip 2001:db8:10::/64
exit
service "FWS_web_alt"
  tcp dst-port 8080 8090
exit
address "FWS_www.example.org"
  host "www.example.org"
exit
policy-global
  rule id 10000
    name "FWS_global_1"
    action deny
    src-addr "FWS_global_bad"
    dst-addr "Any"
    service "Any"
    log policy-deny
    description "blocked company-wide"
  exit
  rule id 10001
    name "FWS_local_1"
    action permit
    src-zone "FWS_in"
    src-addr "FWS_admins"
    dst-addr "FWS_firewall_all"
    service "FWS_ssh"
    service "FWS_https"
    log session-end
    description "admin access"
  exit
  rule id 10002
    name "FWS_local_2"
    action permit
    src-addr "FWS_Network_internals"
    dst-addr "FWS_firewall_all"
    service "ICMP"
    log session-end
    description "ping the firewall"
  exit
  rule id 10003
    name "FWS_local_3"
    action deny
    src-addr "Any"
    dst-addr "FWS_blocked"
    service "Any"
    log policy-deny
    description "known bad"
  exit
  rule id 10004
    name "FWS_local_4"
    action permit
    src-addr "FWS_Network_internals"
    dst-addr "FWS_not-Network_internals"
    service "FWS_web_ports"
    log session-start
    log session-end
    description "web"
  exit
  rule id 10005
    name "FWS_local_5"
    action permit
    src-zone "FWS_in"
    src-addr "FWS_lan"
    dst-addr "Any"
    service "FWS__rule__dns_udp-udp"
    log session-end
    description "dns"
  exit
  rule id 10006
    name "FWS_local_6"
    action deny
    src-addr "FWS_Network_internals"
    dst-addr "Any"
    service "FWS_ident"
    log policy-deny
  exit
  rule id 10007
    name "FWS_local_8"
    action permit
    src-zone "FWS_out"
    src-addr "Any"
    dst-addr "FWS_web_pub"
    service "FWS_http"
    service "FWS_https"
    log session-start
    log session-end
    description "public web, as it arrives"
  exit
  rule id 10008
    name "FWS_local_9"
    action permit
    src-zone "FWS_out"
    src-addr "Any"
    dst-addr "FWS_dmz_servers"
    service "FWS_smtp"
    log session-end
  exit
  rule id 10009
    name "FWS_local_10"
    action permit
    src-zone "FWS_lab"
    src-addr "FWS_lab_net"
    dst-addr "Any"
    service "FWS_lab_tools"
    log session-end
  exit
  rule id 10010
    disable
    name "FWS_local_11"
    action permit
    src-addr "FWS_lan"
    dst-addr "FWS_dmz_servers"
    service "FWS_web_ports"
    log session-end
  exit
  rule id 10011
    name "FWS_local_12"
    action permit
    src-addr "FWS_lab_net"
    dst-addr "Any"
    service "FWS__rule__ipproto-proto_200"
    log session-end
  exit
  rule id 10012
    name "FWS_local_13"
    action permit
    src-addr "FWS_not-lan"
    dst-addr "FWS_updates.example.com"
    service "FWS_https"
    log session-end
  exit
  rule id 10013
    name "FWS_local_14_v6"
    action permit
    src-addr "FWS_lan6_v6"
    dst-addr "IPv6-any"
    service "Any"
    log session-end
  exit
  rule id 10014
    name "FWS_local_15"
    action permit
    src-addr "FWS_lan"
    dst-addr "FWS_www.example.org"
    service "FWS_http"
    service "FWS_web_alt"
    log session-end
  exit
  rule id 10015
    name "FWS_local_16"
    action deny
    src-addr "Any"
    dst-addr "Any"
    service "Any"
    log policy-deny
    description "Block all"
  exit
  rule id 10016
    name "FWS_local_16_v6"
    action deny
    src-addr "IPv6-any"
    dst-addr "IPv6-any"
    service "Any"
    log policy-deny
    description "Block all"
  exit
exit
end
