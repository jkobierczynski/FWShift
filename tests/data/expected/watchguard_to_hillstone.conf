configure
zone "FWS_External"
  description "External"
exit
zone "FWS_Trusted"
  description "Trusted"
exit
zone "FWS_DMZ"
  description "DMZ"
exit
zone "FWS_Guests"
  description "Guests"
exit
zone "FWS_Lab"
  description "Lab"
exit
address "FWS_Bad-Nets.1.alm"
  ip 203.0.113.0/25
exit
address "FWS_Bad-Nets.2.alm"
  ip 192.0.2.66/32
exit
service "FWS_SSH"
  tcp dst-port 22
exit
address "FWS_Admins.1.alm"
  range 10.10.5.10 10.10.5.20
exit
service "FWS_Web_Out"
  tcp dst-port 80
  tcp dst-port 443
  tcp dst-port 8000 8010
exit
service "FWS_HTTPS"
  tcp dst-port 443
exit
address "FWS_Web-Public.1.snat"
  ip 198.51.100.10/32
exit
service "FWS_SMTP"
  tcp dst-port 25
exit
address "FWS_Mail-Public.1.snat"
  ip 198.51.100.11/32
exit
address "FWS_Update-Site.1.alm"
  host "updates.example.com"
exit
service "FWS_DNS"
  tcp dst-port 53
  udp dst-port 53
exit
service "FWS_Staff_Only"
  tcp dst-port 3389
exit
address "FWS_Web-Server.1.alm"
  ip 10.20.0.10/32
exit
service "FWS_Ping"
  icmp type 8
exit
service "FWS_Lab_Tunnel"
  protocol 47
exit
address "FWS_Web-Public.2.snat"
  ip 10.20.0.10/32
exit
address "FWS_Mail-Public.2.snat"
  ip 10.20.0.25/32
exit
policy-global
  rule id 10000
    name "FWS_Block_Bad_1"
    action deny
    src-zone "FWS_Trusted"
    src-addr "Any"
    dst-addr "FWS_Bad-Nets.1.alm"
    dst-addr "FWS_Bad-Nets.2.alm"
    service "Any"
    log policy-deny
  exit
  rule id 10001
    name "FWS_Block_Bad_2"
    action deny
    src-zone "FWS_Guests"
    src-addr "Any"
    dst-addr "FWS_Bad-Nets.1.alm"
    dst-addr "FWS_Bad-Nets.2.alm"
    service "Any"
    log policy-deny
  exit
  rule id 10002
    name "FWS_Admin_SSH"
    action permit
    src-zone "FWS_Trusted"
    dst-zone "FWS_External"
    src-addr "FWS_Admins.1.alm"
    dst-addr "Any"
    service "FWS_SSH"
    log session-end
  exit
  rule id 10003
    name "FWS_Web_Out_1"
    action permit
    src-zone "FWS_Trusted"
    dst-zone "FWS_External"
    src-addr "Any"
    dst-addr "Any"
    service "FWS_Web_Out"
    log session-end
  exit
  rule id 10004
    name "FWS_Web_Out_2"
    action permit
    src-zone "FWS_Guests"
    dst-zone "FWS_External"
    src-addr "Any"
    dst-addr "Any"
    service "FWS_Web_Out"
    log session-end
  exit
  rule id 10005
    name "FWS_Web_Out_3"
    action permit
    src-zone "FWS_DMZ"
    dst-zone "FWS_External"
    src-addr "Any"
    dst-addr "Any"
    service "FWS_Web_Out"
    log session-end
  exit
  rule id 10006
    name "FWS_Web_Out_v6_4"
    action permit
    src-zone "FWS_Trusted"
    dst-zone "FWS_External"
    src-addr "IPv6-any"
    dst-addr "IPv6-any"
    service "FWS_Web_Out"
    log session-end
  exit
  rule id 10007
    name "FWS_Web_Out_v6_5"
    action permit
    src-zone "FWS_Guests"
    dst-zone "FWS_External"
    src-addr "IPv6-any"
    dst-addr "IPv6-any"
    service "FWS_Web_Out"
    log session-end
  exit
  rule id 10008
    name "FWS_Web_Out_v6_6"
    action permit
    src-zone "FWS_DMZ"
    dst-zone "FWS_External"
    src-addr "IPv6-any"
    dst-addr "IPv6-any"
    service "FWS_Web_Out"
    log session-end
  exit
  rule id 10009
    name "FWS_Web_In"
    action permit
    src-zone "FWS_External"
    src-addr "Any"
    dst-addr "FWS_Web-Public.1.snat"
    service "FWS_HTTPS"
    log session-end
  exit
  rule id 10010
    name "FWS_Mail_In"
    action permit
    src-zone "FWS_External"
    src-addr "Any"
    dst-addr "FWS_Mail-Public.1.snat"
    service "FWS_SMTP"
    log session-end
  exit
  rule id 10011
    disable
    name "FWS_DMZ_Updates"
    action permit
    src-zone "FWS_DMZ"
    src-addr "Any"
    dst-addr "FWS_Update-Site.1.alm"
    service "FWS_HTTPS"
    log session-end
  exit
  rule id 10012
    disable
    name "FWS_Guests_Out"
    action permit
    src-zone "FWS_Guests"
    dst-zone "FWS_External"
    src-addr "Any"
    dst-addr "Any"
    service "FWS_DNS"
    log session-end
  exit
  rule id 10013
    disable
    name "FWS_Guests_Out_v6"
    action permit
    src-zone "FWS_Guests"
    dst-zone "FWS_External"
    src-addr "IPv6-any"
    dst-addr "IPv6-any"
    service "FWS_DNS"
    log session-end
  exit
  rule id 10014
    disable
    name "FWS_Staff_Only_2"
    action permit
    src-zone "FWS_Trusted"
    src-addr "Any"
    dst-addr "FWS_Web-Server.1.alm"
    service "FWS_Staff_Only"
    log session-end
  exit
  rule id 10015
    name "FWS_Ping_1"
    action permit
    src-zone "FWS_Trusted"
    src-addr "Any"
    dst-addr "Any"
    service "FWS_Ping"
    log session-end
  exit
  rule id 10016
    name "FWS_Ping_2"
    action permit
    src-zone "FWS_Guests"
    src-addr "Any"
    dst-addr "Any"
    service "FWS_Ping"
    log session-end
  exit
  rule id 10017
    name "FWS_Ping_v6_3"
    action permit
    src-zone "FWS_Trusted"
    src-addr "IPv6-any"
    dst-addr "IPv6-any"
    service "FWS_Ping"
    log session-end
  exit
  rule id 10018
    name "FWS_Ping_v6_4"
    action permit
    src-zone "FWS_Guests"
    src-addr "IPv6-any"
    dst-addr "IPv6-any"
    service "FWS_Ping"
    log session-end
  exit
  rule id 10019
    name "FWS_Lab_Tunnel_2"
    action permit
    src-zone "FWS_Lab"
    dst-zone "FWS_External"
    src-addr "Any"
    dst-addr "Any"
    service "FWS_Lab_Tunnel"
    log session-end
  exit
  rule id 10020
    name "FWS_Lab_Tunnel_v6"
    action permit
    src-zone "FWS_Lab"
    dst-zone "FWS_External"
    src-addr "IPv6-any"
    dst-addr "IPv6-any"
    service "FWS_Lab_Tunnel"
    log session-end
  exit
exit
ip vrouter "trust-vr"
  dnatrule id 10000 from "Any" to "FWS_Web-Public.1.snat" service "FWS_HTTPS" trans-to "FWS_Web-Public.2.snat"
  dnatrule id 10001 from "Any" to "FWS_Mail-Public.1.snat" service "FWS_SMTP" trans-to "FWS_Mail-Public.2.snat" port 2525
exit
end
