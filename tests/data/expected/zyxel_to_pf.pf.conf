# The interface (or interface group) of each zone.
fws_if_WAN = "WAN"
fws_if_LAN1 = "LAN1"
fws_if_DMZ = "DMZ"
fws_if_LAB = "LAB"

# Tables.
table <fws_SERVERS> const { 10.30.0.10 10.30.0.25 }
table <fws_ALL_INTERNAL> const { 10.10.0.0/24 10.20.0.0/24 10.30.0.10 10.30.0.25 }
table <fws_ADMIN_PCS> const { 10.10.0.50/31 10.10.0.52/30 10.10.0.56/30 }
table <fws_V6_ADMINS> const { 2001:db8:10::50/125 2001:db8:10::58/127 }

# What arrives on the interface of a zone is marked with the zone.
match in on $fws_if_WAN tag fws_WAN
match in on $fws_if_LAN1 tag fws_LAN1
match in on $fws_if_DMZ tag fws_DMZ
match in on $fws_if_LAB tag fws_LAB

# Destination NAT, first match, and what the rules may allow is let in: they decide when it leaves.
pass in quick on $fws_if_WAN inet proto tcp from any to 198.51.100.10 port 443 rdr-to 10.30.0.10 port 8443 label "virtual-server WEB_VS"
pass in quick on $fws_if_WAN inet proto tcp from any to 198.51.100.11 port 25 rdr-to 10.30.0.25 label "virtual-server MAIL_VS"
pass in quick on $fws_if_WAN inet proto tcp from any to any port 8080:8089 rdr-to 10.30.0.12 label "virtual-server ALT_VS"
pass in quick on { $fws_if_WAN $fws_if_LAN1 $fws_if_DMZ $fws_if_LAB } from any to 198.51.100.30 rdr-to 10.30.0.30 label "virtual-server ONE2ONE inbound"
pass in quick on { $fws_if_WAN $fws_if_LAN1 $fws_if_DMZ $fws_if_LAB } from any to 198.51.100.20/30 rdr-to 10.30.0.20/30 bitmask label "virtual-server MANY2ONE inbound"
# disabled in the source: pass in quick on $fws_if_WAN inet proto udp from any to 198.51.100.40 port 5060 rdr-to 10.30.0.40 label "virtual-server OLD_VS"
pass in quick on $fws_if_LAN1 inet from <fws_ALL_INTERNAL> to ! self label "LAN1_Outgoing"
pass in quick on $fws_if_WAN inet proto tcp from any to 10.30.0.10 port { 80 443 8080:8089 8443 } label "WAN_to_Web"
pass in quick on $fws_if_WAN inet proto tcp from any to 10.30.0.25 port 25 label "WAN_to_Mail"
pass in quick on $fws_if_LAN1 proto tcp from <fws_ADMIN_PCS> to <fws_SERVERS> port { 22 80 443 8080:8089 8443 } label "Admin_Mgmt"
pass in quick on { $fws_if_WAN $fws_if_LAN1 $fws_if_DMZ $fws_if_LAB } inet proto icmp from 192.0.2.0/24 to ! self icmp-type 8 label "Monitor_Ping"
pass in quick on $fws_if_LAN1 inet proto udp from any port 1024:65535 to ! self port 53 label "DNS_From_Port"
pass in quick on $fws_if_LAN1 inet proto tcp from any to portal.example.com port 443 label "Portal_Access"
pass in quick on $fws_if_DMZ inet proto 50 from 10.30.0.20/30 to ! self label "ESP_Out"
pass in quick on $fws_if_LAN1 inet6 from 2001:db8:10::/64 to ! self label "V6_LAN_Out"
pass in quick on $fws_if_LAN1 proto tcp from <fws_V6_ADMINS> to 2001:db8:30::10 port { 22 80 443 8080:8089 8443 } label "V6_Admin_Web"
pass in quick on { $fws_if_WAN $fws_if_LAN1 $fws_if_DMZ $fws_if_LAB } inet6 proto icmp6 from any to ! self icmp6-type 128 label "V6_Ping"

# The rules, first match, when the traffic leaves: the tag says the zone it came from.
block drop out quick on $fws_if_DMZ from any to any tagged fws_DMZ label "block intra-zone DMZ"
match out on $fws_if_WAN inet from <fws_ALL_INTERNAL> to any tagged fws_LAN1 tag fws_ok_LAN1 label "LAN1_Outgoing"
block drop out quick on $fws_if_DMZ proto tcp from 203.0.113.0/25 to <fws_SERVERS> port 22 tagged fws_WAN label "Block_Partner_SSH"
match out on $fws_if_DMZ inet proto tcp from any to 10.30.0.10 port { 80 443 8080:8089 8443 } tagged fws_WAN tag fws_ok_WAN label "WAN_to_Web"
match out on $fws_if_DMZ inet proto tcp from any to 10.30.0.25 port 25 tagged fws_WAN tag fws_ok_WAN label "WAN_to_Mail"
match out on $fws_if_DMZ proto tcp from <fws_ADMIN_PCS> to <fws_SERVERS> port { 22 80 443 8080:8089 8443 } tagged fws_LAN1 tag fws_ok_LAN1 label "Admin_Mgmt"
block return out quick on $fws_if_DMZ inet from any to any tagged fws_LAN1 label "LAN1_to_DMZ_Reject"
match out inet proto icmp from 192.0.2.0/24 to any icmp-type 8 tagged fws_WAN tag fws_ok_WAN label "Monitor_Ping"
match out inet proto icmp from 192.0.2.0/24 to any icmp-type 8 tagged fws_LAN1 tag fws_ok_LAN1 label "Monitor_Ping"
match out inet proto icmp from 192.0.2.0/24 to any icmp-type 8 tagged fws_DMZ tag fws_ok_DMZ label "Monitor_Ping"
match out inet proto icmp from 192.0.2.0/24 to any icmp-type 8 tagged fws_LAB tag fws_ok_LAB label "Monitor_Ping"
