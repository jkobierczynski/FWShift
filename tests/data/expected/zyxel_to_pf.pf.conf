# FWSHIFT disabled, see the report: "Country_Block" from WAN to any; source COUNTRY_X; destination 0.0.0.0/0; service any; action drop
match out on $fws_if_WAN inet proto tcp from any to portal.example.com port 443 tagged fws_LAN1 tag fws_ok_LAN1 label "Portal_Access"
# FWSHIFT disabled, see the report: "VS_Only" from WAN to DMZ; source 0.0.0.0/0; destination 0.0.0.0/0; service any; action allow
match out on $fws_if_WAN inet proto 50 from 10.30.0.20/30 to any tagged fws_DMZ tag fws_ok_DMZ label "ESP_Out"
match out on $fws_if_WAN inet6 from 2001:db8:10::/64 to any tagged fws_LAN1 tag fws_ok_LAN1 label "V6_LAN_Out"
match out on $fws_if_DMZ proto tcp from <fws_V6_ADMINS> to 2001:db8:30::10 port { 22 80 443 8080:8089 8443 } tagged fws_LAN1 tag fws_ok_LAN1 label "V6_Admin_Web"
match out inet6 proto icmp6 from any to any icmp6-type 128 tagged fws_WAN tag fws_ok_WAN label "V6_Ping"
match out inet6 proto icmp6 from any to any icmp6-type 128 tagged fws_LAN1 tag fws_ok_LAN1 label "V6_Ping"
match out inet6 proto icmp6 from any to any icmp6-type 128 tagged fws_DMZ tag fws_ok_DMZ label "V6_Ping"
match out inet6 proto icmp6 from any to any icmp6-type 128 tagged fws_LAB tag fws_ok_LAB label "V6_Ping"

# What no rule decided: the default of the source.
block drop out quick tagged fws_WAN
block drop out quick tagged fws_LAN1
block drop out quick tagged fws_DMZ
block drop out quick tagged fws_LAB

# Source NAT, first match, of what the rules allowed.
match out on $fws_if_WAN inet from 10.30.0.30 to any tagged fws_ok_WAN nat-to 198.51.100.30 static-port tag fws_nat label "virtual-server ONE2ONE"
match out on $fws_if_WAN inet from 10.30.0.30 to any tagged fws_ok_LAN1 nat-to 198.51.100.30 static-port tag fws_nat label "virtual-server ONE2ONE"
match out on $fws_if_WAN inet from 10.30.0.30 to any tagged fws_ok_DMZ nat-to 198.51.100.30 static-port tag fws_nat label "virtual-server ONE2ONE"
match out on $fws_if_WAN inet from 10.30.0.30 to any tagged fws_ok_LAB nat-to 198.51.100.30 static-port tag fws_nat label "virtual-server ONE2ONE"
match out on $fws_if_WAN inet from 10.30.0.20/30 to any tagged fws_ok_WAN nat-to 198.51.100.20/30 bitmask tag fws_nat label "virtual-server MANY2ONE"
match out on $fws_if_WAN inet from 10.30.0.20/30 to any tagged fws_ok_LAN1 nat-to 198.51.100.20/30 bitmask tag fws_nat label "virtual-server MANY2ONE"
match out on $fws_if_WAN inet from 10.30.0.20/30 to any tagged fws_ok_DMZ nat-to 198.51.100.20/30 bitmask tag fws_nat label "virtual-server MANY2ONE"
match out on $fws_if_WAN inet from 10.30.0.20/30 to any tagged fws_ok_LAB nat-to 198.51.100.20/30 bitmask tag fws_nat label "virtual-server MANY2ONE"
match out on $fws_if_WAN inet from 10.10.0.0/24 to any tagged fws_ok_LAN1 nat-to ($fws_if_WAN) tag fws_nat label "policy-route 2"
match out inet from <fws_SERVERS> to any tagged fws_ok_DMZ nat-to 198.51.100.20/30 tag fws_nat label "policy-route 3"

# Pass what the rules allowed.
pass out quick tagged fws_ok_WAN
pass out quick tagged fws_ok_LAN1
pass out quick tagged fws_ok_DMZ
pass out quick tagged fws_ok_LAB
