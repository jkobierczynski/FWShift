configure
zone "FWS_internal"
  description "internal"
exit
zone "FWS_external"
  description "external"
exit
service "FWS_tcp-8443"
  tcp dst-port 8443
exit
address "FWS_mguard-extern"
  ip 203.0.113.2/32
exit
service "FWS_udp-47808"
  udp dst-port 47808
exit
address "FWS_vendor_vpn"
  ip 198.51.100.64/27
exit
service "FWS_tcp-502"
  tcp dst-port 502
exit
address "FWS_scada"
  ip 198.51.100.0/28
  host "historian.example.com"
exit
address "FWS_plc_cell1"
  range 192.168.10.20 192.168.10.29
  ip 192.168.10.40/32
exit
service "FWS_tcp-web"
  tcp dst-port 80
  tcp dst-port 443
exit
service "FWS_udp-161"
  udp dst-port 161
exit
service "FWS_tcp-22"
  tcp dst-port 22
exit
service "FWS_tcp-s7_iso"
  tcp dst-port 102
  tcp dst-port 20000 20010
exit
service "FWS_gre"
  protocol 47
exit
service "FWS_tcp-8000-8080-from-1024-65535"
  tcp dst-port 8000 8080 src-port 1024 65535
exit
service "FWS_udp-53"
  udp dst-port 53
exit
service "FWS_tcp-102"
  tcp dst-port 102
exit
service "FWS_tcp-1433"
  tcp dst-port 1433
exit
address "FWS_nat-portforward-1-dnat"
  ip 192.168.10.30/32
exit
address "FWS_nat-portforward-2-to"
  ip 203.0.113.3/32
exit
address "FWS_nat-portforward-2-dnat"
  ip 172.16.30.20/32
exit
address "FWS_nat-1to1-1-inside"
  ip 192.168.10.48/29
exit
address "FWS_nat-1to1-1-outside"
  ip 203.0.113.8/29
exit
address "FWS_nat-masquerade-1-from"
  ip 192.168.10.0/24
exit
address "FWS_nat-masquerade-2-from"
  ip 172.16.30.0/24
exit
policy-global
  rule id 10000
    name "FWS_portforward-1"
    action permit
    src-zone "FWS_external"
    dst-zone "FWS_internal"
    src-addr "Any"
    dst-addr "FWS_mguard-extern"
    service "FWS_tcp-8443"
    log session-end
    description "port forwarding portforward-1: it skips the packet filter"
  exit
  rule id 10001
    name "FWS_portforward-2"
    action permit
    src-zone "FWS_external"
    dst-zone "dmz"
    src-addr "FWS_vendor_vpn"
    dst-ip 203.0.113.3/32
    service "FWS_udp-47808"
    description "port forwarding portforward-2: it skips the packet filter"
  exit
  rule id 10002
    name "FWS_incoming-1"
    action permit
    src-zone "FWS_external"
    dst-zone "FWS_internal"
    src-addr "FWS_scada"
    dst-addr "FWS_plc_cell1"
    service "FWS_tcp-502"
    log session-end
    description "Modbus/TCP from SCADA to the PLCs"
  exit
  rule id 10003
    name "FWS_incoming-2"
    action permit
    src-zone "FWS_external"
    dst-zone "FWS_internal"
    src-ip 198.51.100.0/24
    dst-ip 192.168.10.0/24
    dst-ip 203.0.113.8/29
    service "ICMP"
    description "ping from the control centre"
  exit
  rule id 10004
    name "FWS_incoming-3"
    action deny
    src-zone "FWS_external"
    dst-zone "FWS_internal"
    src-addr "Any"
    dst-ip 192.168.10.0/24
    dst-ip 203.0.113.8/29
    service "FWS_tcp-web"
    log policy-deny
    description "no web from outside"
  exit
  rule id 10005
    name "FWS_incoming-4"
    action deny
    src-zone "FWS_external"
    dst-zone "FWS_internal"
    src-addr "Any"
    dst-addr "Any"
    service "FWS_udp-161"
    description "SNMP refused"
  exit
  rule id 10006
    disable
    name "FWS_incoming-5.maintenance-1"
    action permit
    src-zone "FWS_external"
    dst-zone "FWS_internal"
    src-addr "Any"
    dst-ip 192.168.10.0/24
    dst-ip 203.0.113.8/29
    service "FWS_tcp-22"
    log session-end
    description "SSH while the key switch is on"
  exit
  rule id 10007
    name "FWS_incoming-6.vendor-1"
    action permit
    src-zone "FWS_external"
    dst-zone "FWS_internal"
    src-addr "FWS_vendor_vpn"
    dst-ip 192.168.10.0/24
    dst-ip 203.0.113.8/29
    service "FWS_tcp-s7_iso"
    description "S7 for the vendor"
  exit
  rule id 10008
    name "FWS_incoming-6.vendor-2"
    action deny
    src-zone "FWS_external"
    dst-zone "FWS_internal"
    src-addr "FWS_vendor_vpn"
    dst-addr "Any"
    service "Any"
    log policy-deny
    description "nothing else from the vendor"
  exit
  rule id 10009
    name "FWS_incoming-7"
    action permit
    src-zone "FWS_external"
    dst-zone "FWS_internal"
    src-ip 198.51.100.7/32
    dst-ip 192.168.10.5/32
    service "FWS_gre"
    description "GRE of a legacy tunnel; the port is ignored"
  exit
  rule id 10010
    name "FWS_incoming-8"
    action permit
    src-zone "FWS_external"
    dst-zone "FWS_internal"
    src-ip 198.51.100.0/24
    dst-ip 192.168.10.50/32
    dst-ip 203.0.113.10/32
    service "FWS_tcp-8000-8080-from-1024-65535"
    description "HMI web, published by 1:1 NAT (the rule names the real address)"
  exit
  rule id 10011
    disable
    name "FWS_incoming-9"
    action permit
    src-zone "FWS_external"
    dst-zone "FWS_internal"
    src-addr "Any"
    dst-ip 192.168.10.0/24
    dst-ip 203.0.113.8/29
    service "Any"
    description "names a group the profile does not have"
  exit
  rule id 10012
    name "FWS_outgoing-1_1"
    action deny
    src-zone "FWS_internal"
    dst-zone "FWS_external"
    src-addr "FWS_plc_cell1"
    dst-addr "Any"
    service "Any"
    log policy-deny
    description "the PLCs do not talk out"
  exit
  rule id 10013
    name "FWS_outgoing-1_2"
    action deny
    src-zone "FWS_internal"
    dst-zone "FWS_internal"
    src-addr "FWS_plc_cell1"
    dst-addr "Any"
    service "Any"
    log policy-deny
    description "the PLCs do not talk out"
  exit
  rule id 10014
    name "FWS_outgoing-2_1"
    action permit
    src-zone "FWS_internal"
    dst-zone "FWS_external"
    src-ip 192.168.10.0/24
    dst-ip 192.168.10.1/32
    service "FWS_udp-53"
    description "DNS"
  exit
  rule id 10015
    name "FWS_outgoing-2_2"
    action permit
    src-zone "FWS_internal"
    dst-zone "FWS_internal"
    src-ip 192.168.10.0/24
    dst-ip 192.168.10.1/32
    service "FWS_udp-53"
    description "DNS"
  exit
  rule id 10016
    name "FWS_outgoing-3_1"
    action permit
    src-zone "FWS_internal"
    dst-zone "FWS_external"
    src-ip 192.168.10.0/24
    dst-addr "Any"
    service "FWS_tcp-web"
    description "web out"
  exit
  rule id 10017
    name "FWS_outgoing-3_2"
    action permit
    src-zone "FWS_internal"
    dst-zone "FWS_internal"
    src-ip 192.168.10.0/24
    dst-addr "Any"
    service "FWS_tcp-web"
    description "web out"
  exit
  rule id 10018
    name "FWS_outgoing-4_1"
    action permit
    src-zone "FWS_internal"
    dst-zone "FWS_external"
    src-ip 192.168.20.0/24
    dst-ip 192.168.10.0/24
    service "FWS_tcp-102"
    description "engineering VLAN 20 to the S7 PLCs"
  exit
  rule id 10019
    name "FWS_outgoing-4_2"
    action permit
    src-zone "FWS_internal"
    dst-zone "FWS_internal"
    src-ip 192.168.20.0/24
    dst-ip 192.168.10.0/24
    service "FWS_tcp-102"
    description "engineering VLAN 20 to the S7 PLCs"
  exit
  rule id 10020
    name "FWS_wan-dmz-1"
    action permit
    src-zone "FWS_external"
    dst-zone "dmz"
    src-addr "Any"
    dst-ip 172.16.30.10/32
    service "FWS_tcp-web"
    description "the DMZ web server"
  exit
  rule id 10021
    name "FWS_dmz-lan-1"
    action permit
    src-zone "dmz"
    dst-zone "FWS_internal"
    src-ip 172.16.30.10/32
    dst-ip 192.168.10.60/32
    service "FWS_tcp-1433"
    description "web server to the historian database"
  exit
  rule id 10022
    name "FWS_lan-dmz-1"
    action permit
    src-zone "FWS_internal"
    dst-zone "dmz"
    src-addr "Any"
    dst-addr "Any"
    service "Any"
    description "LAN to DMZ: everything (the factory rule)"
  exit
exit
ip vrouter "trust-vr"
  dnatrule id 10000 from "Any" to "FWS_mguard-extern" service "FWS_tcp-8443" trans-to "FWS_nat-portforward-1-dnat" port 443
  dnatrule id 10001 from "FWS_vendor_vpn" to "FWS_nat-portforward-2-to" service "FWS_udp-47808" trans-to "FWS_nat-portforward-2-dnat"
  snatrule id 10000 from "FWS_nat-1to1-1-inside" to "Any" service "Any" trans-to address-book "FWS_nat-1to1-1-outside" mode static
  dnatrule id 10002 from "Any" to "FWS_nat-1to1-1-outside" service "Any" trans-to "FWS_nat-1to1-1-inside"
  snatrule id 10001 from "FWS_nat-masquerade-1-from" to "Any" service "Any" eif ext1 trans-to eif-ip mode dynamicport
  snatrule id 10002 from "FWS_nat-masquerade-2-from" to "Any" service "Any" eif int trans-to eif-ip mode dynamicport
exit
end
