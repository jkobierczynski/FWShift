# Generated by FWShift - review the conversion report before loading this.
# A ruleset for the pf anchor "fwshift" (OpenBSD; FreeBSD 15 and later). Check it with
# 'pfctl -vnf FILE -a fwshift', load it with 'pfctl -a fwshift -f FILE': nothing outside the anchor changes.
# The main ruleset decides where the anchor is evaluated: it needs a line 'anchor "fwshift"'.

# The interface (or interface group) of each zone.
fws_if_LAN = "LAN"
fws_if_WAN = "WAN"
fws_if_DMZ = "DMZ"
fws_if_OT = "OT"
fws_if_VPN = "VPN"

# Tables.
table <fws_admin_range> const { 10.10.5.10/31 10.10.5.12/30 10.10.5.16/30 10.10.5.20 }
table <fws_dmz_servers> const { 10.20.0.10 10.20.0.25 }
table <fws_LAN_SSH_out_2_src> const { 10.10.0.0/22 10.10.4.0/24 10.10.5.0/29 10.10.5.8/31 10.10.5.21 10.10.5.22/31 10.10.5.24/29 10.10.5.32/27 10.10.5.64/26 10.10.5.128/25 10.10.6.0/23 10.10.8.0/21 10.10.16.0/20 10.10.32.0/19 10.10.64.0/18 10.10.128.0/17 10.11.0.0/16 }
table <fws_update_sites> const { mirror.example.net updates.example.com }

# What arrives on the interface of a zone is marked with the zone.
match in on $fws_if_LAN tag fws_LAN
match in on $fws_if_WAN tag fws_WAN
match in on $fws_if_DMZ tag fws_DMZ
match in on $fws_if_OT tag fws_OT
match in on $fws_if_VPN tag fws_VPN

# Destination NAT, first match, and what the rules may allow is let in: they decide when it leaves.
pass in quick on $fws_if_WAN inet proto tcp from any to 198.51.100.10 port 443 rdr-to 10.20.0.10 label "Publish web"
pass in quick on $fws_if_WAN inet proto tcp from any to 198.51.100.25 port 2525 rdr-to 10.20.0.25 port 25 label "Publish mail"
pass in quick on $fws_if_LAN inet proto tcp from 10.10.0.0/15 to ! self port { 80 443 53 } label "LAN to Internet web"
pass in quick on $fws_if_LAN inet proto udp from 10.10.0.0/15 to ! self port 53 label "LAN to Internet web"
pass in quick on $fws_if_LAN inet proto tcp from 10.10.0.0/15 to ! self port 80 label "LAN web again"
pass in quick on $fws_if_LAN proto tcp from <fws_admin_range> to <fws_dmz_servers> port 22 label "Admins to DMZ"
pass in quick on $fws_if_LAN inet proto icmp from <fws_admin_range> to <fws_dmz_servers> icmp-type 8 label "Admins to DMZ"
pass in quick on $fws_if_LAN inet proto tcp from 10.10.0.0/15 to ! 10.20.0.25 port { 80 443 } label "LAN to DMZ web not mail"
pass in quick on $fws_if_LAN inet proto tcp from 10.10.0.0/15 to ! self port 22 label "LAN SSH out"
pass in quick on $fws_if_LAN inet proto tcp from <fws_LAN_SSH_out_2_src> to ! self port 22 label "LAN SSH out-2"
pass in quick on $fws_if_WAN inet proto tcp from any to 10.20.0.10 port 443 label "Internet to web"
pass in quick on $fws_if_WAN inet proto tcp from any to 10.20.0.25 port 25 label "Internet to mail"
pass in quick on $fws_if_OT proto tcp from 10.30.1.0/24 to 10.10.7.15 port 502 label "OT to SCADA"
pass in quick on $fws_if_OT proto udp from 10.30.1.0/24 port 1024:65535 to 10.10.7.15 port 514 label "OT to SCADA"
pass in quick on $fws_if_DMZ proto tcp from <fws_dmz_servers> to <fws_update_sites> port 443 label "DMZ updates"
pass in quick on $fws_if_LAN inet6 proto tcp from 2001:db8:10::/48 to ! self port { 80 443 } label "LAN6 to Internet"
pass in quick on $fws_if_LAN inet6 proto icmp6 from 2001:db8:10::/48 to ! self icmp6-type 128 label "LAN6 to Internet"

# The rules, first match, when the traffic leaves: the tag says the zone it came from.
# FWSHIFT disabled, see the report: "Block countries" from WAN to any; source Blocked countries; destination 0.0.0.0/0; service any; action drop
match out on $fws_if_WAN inet proto tcp from 10.10.0.0/15 to any port { 80 443 53 } tagged fws_LAN tag fws_ok_LAN label "LAN to Internet web"
match out on $fws_if_WAN inet proto udp from 10.10.0.0/15 to any port 53 tagged fws_LAN tag fws_ok_LAN label "LAN to Internet web"
match out on $fws_if_WAN inet proto tcp from 10.10.0.0/15 to any port 80 tagged fws_LAN tag fws_ok_LAN label "LAN web again"
match out on $fws_if_DMZ proto tcp from <fws_admin_range> to <fws_dmz_servers> port 22 tagged fws_LAN tag fws_ok_LAN label "Admins to DMZ"
match out on $fws_if_DMZ inet proto icmp from <fws_admin_range> to <fws_dmz_servers> icmp-type 8 tagged fws_LAN tag fws_ok_LAN label "Admins to DMZ"
match out on $fws_if_DMZ inet proto tcp from 10.10.0.0/15 to ! 10.20.0.25 port { 80 443 } tagged fws_LAN tag fws_ok_LAN label "LAN to DMZ web not mail"
match out on $fws_if_OT inet proto tcp from 10.10.0.0/15 to any port 22 tagged fws_LAN tag fws_ok_LAN label "LAN SSH out"
match out on { $fws_if_DMZ $fws_if_OT } inet proto tcp from <fws_LAN_SSH_out_2_src> to any port 22 tagged fws_LAN tag fws_ok_LAN label "LAN SSH out-2"
match out on $fws_if_DMZ inet proto tcp from any to 10.20.0.10 port 443 tagged fws_WAN tag fws_ok_WAN label "Internet to web"
match out on $fws_if_DMZ inet proto tcp from any to 10.20.0.25 port 25 tagged fws_WAN tag fws_ok_WAN label "Internet to mail"
match out on $fws_if_LAN proto tcp from 10.30.1.0/24 to 10.10.7.15 port 502 tagged fws_OT tag fws_ok_OT label "OT to SCADA"
match out on $fws_if_LAN proto udp from 10.30.1.0/24 port 1024:65535 to 10.10.7.15 port 514 tagged fws_OT tag fws_ok_OT label "OT to SCADA"
match out on $fws_if_WAN proto tcp from <fws_dmz_servers> to <fws_update_sites> port 443 tagged fws_DMZ tag fws_ok_DMZ label "DMZ updates"
# FWSHIFT disabled, see the report: "Finance to app" from LAN to DMZ; source 0.0.0.0/0; destination web-1; service app-ports; action allow
# FWSHIFT disabled, see the report: "DNS in office hours" from OT to LAN; source 0.0.0.0/0; destination dns-servers; service basic-net; action allow
# disabled in the source: "Old test rule" from any to any; source 0.0.0.0/0; destination any; service GRE,TIMESTAMP; action allow
block return out quick inet from any to any tagged fws_LAN label "Reject the rest from LAN"
match out on $fws_if_WAN inet6 proto tcp from 2001:db8:10::/48 to any port { 80 443 } tagged fws_LAN tag fws_ok_LAN label "LAN6 to Internet"
match out on $fws_if_WAN inet6 proto icmp6 from 2001:db8:10::/48 to any icmp6-type 128 tagged fws_LAN tag fws_ok_LAN label "LAN6 to Internet"

# What no rule decided: the default of the source.
block drop out quick tagged fws_LAN
block drop out quick tagged fws_WAN
block drop out quick tagged fws_DMZ
block drop out quick tagged fws_OT
block drop out quick tagged fws_VPN

# Source NAT, first match, of what the rules allowed.
match out on $fws_if_WAN inet from 10.20.0.25 to any tagged fws_ok_LAN nat-to 198.51.100.25 static-port tag fws_nat label "Mail server out"
match out on $fws_if_WAN inet from 10.20.0.25 to any tagged fws_ok_WAN nat-to 198.51.100.25 static-port tag fws_nat label "Mail server out"
match out on $fws_if_WAN inet from 10.20.0.25 to any tagged fws_ok_DMZ nat-to 198.51.100.25 static-port tag fws_nat label "Mail server out"
match out on $fws_if_WAN inet from 10.20.0.25 to any tagged fws_ok_OT nat-to 198.51.100.25 static-port tag fws_nat label "Mail server out"
match out on $fws_if_WAN inet from 10.20.0.25 to any tagged fws_ok_VPN nat-to 198.51.100.25 static-port tag fws_nat label "Mail server out"
match out inet from 10.10.0.0/15 to 10.99.0.0/16 tagged fws_ok_LAN tag fws_nat label "No NAT to partner"
match out inet from 10.10.0.0/15 to 10.99.0.0/16 tagged fws_ok_WAN tag fws_nat label "No NAT to partner"
match out inet from 10.10.0.0/15 to 10.99.0.0/16 tagged fws_ok_DMZ tag fws_nat label "No NAT to partner"
match out inet from 10.10.0.0/15 to 10.99.0.0/16 tagged fws_ok_OT tag fws_nat label "No NAT to partner"
match out inet from 10.10.0.0/15 to 10.99.0.0/16 tagged fws_ok_VPN tag fws_nat label "No NAT to partner"
match out on $fws_if_WAN inet proto tcp from 10.10.0.0/15 to any port { 80 443 53 } tagged fws_ok_LAN nat-to ($fws_if_WAN) tag fws_nat label "NAT of LAN to Internet web"
match out on $fws_if_WAN inet proto udp from 10.10.0.0/15 to any port 53 tagged fws_ok_LAN nat-to ($fws_if_WAN) tag fws_nat label "NAT of LAN to Internet web"
match out on $fws_if_WAN inet from any to any tagged fws_ok_LAN nat-to ($fws_if_WAN) tag fws_nat label "Default SNAT IPv4"
match out on $fws_if_WAN inet6 from any to any tagged fws_ok_LAN nat-to ($fws_if_WAN) tag fws_nat label "Default SNAT IPv4"
match out on $fws_if_WAN inet from any to any tagged fws_ok_WAN nat-to ($fws_if_WAN) tag fws_nat label "Default SNAT IPv4"
match out on $fws_if_WAN inet6 from any to any tagged fws_ok_WAN nat-to ($fws_if_WAN) tag fws_nat label "Default SNAT IPv4"
match out on $fws_if_WAN inet from any to any tagged fws_ok_DMZ nat-to ($fws_if_WAN) tag fws_nat label "Default SNAT IPv4"
match out on $fws_if_WAN inet6 from any to any tagged fws_ok_DMZ nat-to ($fws_if_WAN) tag fws_nat label "Default SNAT IPv4"
match out on $fws_if_WAN inet from any to any tagged fws_ok_OT nat-to ($fws_if_WAN) tag fws_nat label "Default SNAT IPv4"
match out on $fws_if_WAN inet6 from any to any tagged fws_ok_OT nat-to ($fws_if_WAN) tag fws_nat label "Default SNAT IPv4"
match out on $fws_if_WAN inet from any to any tagged fws_ok_VPN nat-to ($fws_if_WAN) tag fws_nat label "Default SNAT IPv4"
match out on $fws_if_WAN inet6 from any to any tagged fws_ok_VPN nat-to ($fws_if_WAN) tag fws_nat label "Default SNAT IPv4"

# Pass what the rules allowed.
pass out quick tagged fws_ok_LAN
pass out quick tagged fws_ok_WAN
pass out quick tagged fws_ok_DMZ
pass out quick tagged fws_ok_OT
pass out quick tagged fws_ok_VPN
pass out quick tagged fws_nat
