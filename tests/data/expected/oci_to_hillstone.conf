policy-global
  rule id 10000
    name "FWS_db-subnet-stateless-in"
    action deny
    src-ip 10.30.2.0/24
    dst-ip 10.30.3.0/24
    service "FWS_svc-tcp5432"
    description "let in by a stateless rule of db-subnet, and the replies are not let through"
  exit
  rule id 10001
    name "FWS_db-subnet-stateless-in-2"
    action deny
    src-ip 10.30.9.10/32
    dst-ip 10.30.3.0/24
    service "FWS_svc-tcp1-65535-tcp1-65535"
    description "let in by a stateless rule of db-subnet, and the replies are not let through"
  exit
  rule id 10002
    name "FWS_db-subnet-stateless-in-3"
    action deny
    src-ip 10.30.0.0/16
    dst-ip 10.30.3.0/24
    service "FWS_icmp-8"
    description "let in by a stateless rule of db-subnet, and the replies are not let through"
  exit
