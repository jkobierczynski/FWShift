ip vrouter "trust-vr"
  snatrule id 10000 from "FWS_nat-public-203.0.113.10-inside" to "Any" service "Any" trans-to address-book "FWS_nat-public-203.0.113.10-outside" mode static
  dnatrule id 10000 from "Any" to "FWS_nat-public-203.0.113.10-outside" service "Any" trans-to "FWS_nat-public-203.0.113.10-inside"
  snatrule id 10001 from "FWS_nat-public-203.0.113.11-inside" to "Any" service "Any" trans-to address-book "FWS_nat-public-203.0.113.11-outside" mode static
  dnatrule id 10001 from "Any" to "FWS_nat-public-203.0.113.11-outside" service "Any" trans-to "FWS_nat-public-203.0.113.11-inside"
  snatrule id 10002 from "FWS_nat-public-203.0.113.50-inside" to "Any" service "Any" trans-to address-book "FWS_nat-public-203.0.113.50-outside" mode static
  dnatrule id 10002 from "Any" to "FWS_nat-public-203.0.113.50-outside" service "Any" trans-to "FWS_nat-public-203.0.113.50-inside"
