# Put the interfaces in their zones (this changes traffic at once):
#   firewall zone name FWS_em0 / add interface em0
#   firewall zone name FWS_em1 / add interface em1
#   firewall zone name FWS_em2 / add interface em2
# Written disabled:
#   antispoof em1 network: references 'em1 network': the network of em1 is not in pf.conf; give it with --interface-address INTERFACE=ADDRESS/BITS; 'em1 network' holds members only its platform knows
#   antispoof em1 address: references 'em1 address': the address of em1 is not in pf.conf; give it with --interface-address INTERFACE=ADDRESS/BITS; 'em1 address' holds members only its platform knows
#   brute force: references 'bruteforce': it has no addresses in pf.conf: they are added at run time (pfctl -T add, overload); 'bruteforce' holds members only its platform knows
#   line 49: references 'spamd': its addresses are read from '/etc/mail/spamd.list' when the rules are loaded, which is not in pf.conf; 'spamd' holds members only its platform knows
#   admin ssh: references 'em2 network': the network of em2 is not in pf.conf; give it with --interface-address INTERFACE=ADDRESS/BITS; 'em2 network' holds members only its platform knows
#   line 92: not converted: the user of the socket (user proxy), which only traffic of the firewall itself has
#   line 91: references 'egress address': the address of egress is not in pf.conf; give it with --interface-address INTERFACE=ADDRESS/BITS; 'egress address' holds members only its platform knows
#   line 90: not converted: a mark set by another rule (tagged INTERNAL)
#   line 85: host name object www.example.com: written with addresses only
