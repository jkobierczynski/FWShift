                port-lists {
                    /Common/tcp_80_443
                }
            }
        }
        historian {
            action accept-decisively
            description "historian"
            ip-protocol tcp
            log yes
            source {
                addresses {
                    10.10.20.15 { }
                }
                vlans {
                    /Common/vlan10-office
                    /Common/vlan20-servers
                    /Common/vlan30-ot-cell
                }
            }
            destination {
                address-lists {
                    /Common/VLAN_30_
                }
                addresses {
                    172.16.40.0/24 { }
                }
                port-lists {
                    /Common/tcp_4840
                }
            }
        }
        eng_ws_to_plc {
            action accept-decisively
            description "eng ws to plc"
            ip-protocol tcp
            log yes
            source {
                address-lists {
                    /Common/eng-ws
