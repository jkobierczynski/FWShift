security firewall rule-list /Common/FWShift_rules {
    rules {
        inside_a_VLAN {
            action accept-decisively
            description "FWSHIFT disabled, see the report. traffic inside one VLAN does not pass the MX"
            source {
                vlans {
                    /Common/vlan10-office
                }
            }
            status disabled
        }
        inside_a_VLAN_2 {
            action accept-decisively
            description "FWSHIFT disabled, see the report. traffic inside one VLAN does not pass the MX"
            source {
                vlans {
                    /Common/vlan20-servers
                }
            }
            status disabled
        }
        inside_a_VLAN_3 {
            action accept-decisively
            description "FWSHIFT disabled, see the report. traffic inside one VLAN does not pass the MX"
            source {
                vlans {
                    /Common/vlan30-ot-cell
                }
            }
            status disabled
        }
        layer_7_rule_2 {
            action drop
            description "layer 7: port 23"
            ip-protocol tcp
            source {
                vlans {
                    /Common/vlan10-office
                    /Common/vlan20-servers
                    /Common/vlan30-ot-cell
                }
            }
            destination {
                port-lists {
                    /Common/tcp_23
                }
            }
        }
        layer_7_rule_2_2 {
            action drop
            description "layer 7: port 23"
            ip-protocol udp
            source {
                vlans {
                    /Common/vlan10-office
                    /Common/vlan20-servers
                    /Common/vlan30-ot-cell
                }
            }
            destination {
                port-lists {
                    /Common/udp_23
                }
            }
        }
        layer_7_rule_3 {
            action drop
            description "layer 7: ipRange 198.51.100.0/24"
            source {
                vlans {
                    /Common/vlan10-office
                    /Common/vlan20-servers
                    /Common/vlan30-ot-cell
                }
            }
            destination {
                addresses {
                    198.51.100.0/24 { }
                }
            }
        }
        office_to_servers_web {
            action accept-decisively
            description "office to servers web"
            ip-protocol tcp
            source {
                address-lists {
                    /Common/VLAN_10_
                }
                vlans {
                    /Common/vlan10-office
                    /Common/vlan20-servers
                    /Common/vlan30-ot-cell
                }
            }
            destination {
                addresses {
                    10.10.20.0/24 { }
