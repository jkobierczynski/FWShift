configure
zone "FWS_WAN"
  description "WAN"
exit
zone "FWS_LAN1"
  description "LAN1"
exit
zone "FWS_DMZ"
  description "DMZ"
exit
zone "FWS_LAB"
  description "LAB"
exit
address "FWS_ALL_INTERNAL"
  ip 10.10.0.0/24
  ip 10.20.0.0/24
  ip 10.30.0.10/32
  ip 10.30.0.25/32
exit
service "FWS_SSH"
  tcp dst-port 22
exit
address "FWS_PARTNER_NET"
  ip 203.0.113.0/25
exit
address "FWS_SERVERS"
  ip 10.30.0.10/32
  ip 10.30.0.25/32
exit
service "FWS_WEB"
  tcp dst-port 80
  tcp dst-port 443
  tcp dst-port 8080 8089
  tcp dst-port 8443
exit
address "FWS_WEB_SRV"
  ip 10.30.0.10/32
exit
address "FWS_PUBLIC_WEB"
  ip 198.51.100.10/32
exit
service "FWS_SMTP"
  tcp dst-port 25
exit
address "FWS_MAIL_SRV"
  ip 10.30.0.25/32
exit
service "FWS_MGMT"
  tcp dst-port 22
  tcp dst-port 80
  tcp dst-port 443
  tcp dst-port 8080 8089
  tcp dst-port 8443
exit
address "FWS_ADMIN_PCS"
  range 10.10.0.50 10.10.0.59
exit
service "FWS_PING"
  icmp type 8
exit
address "FWS_MONITOR"
  ip 192.0.2.0/24
exit
service "FWS_GRE"
  protocol 47
exit
service "FWS_HTTPS"
  tcp dst-port 443
exit
service "FWS_DNS-sourceport-1024-65535"
  udp dst-port 53 src-port 1024 65535
exit
address "FWS_PORTAL"
  host "portal.example.com"
exit
service "FWS_ESP"
  protocol 50
exit
address "FWS_INSIDE_RANGE"
  ip 10.30.0.20/30
exit
address "FWS_V6_LAN_v6" ipv6
  ip 2001:db8:10::/64
exit
address "FWS_V6_ADMINS_v6" ipv6
  range 2001:db8:10::50 2001:db8:10::59
exit
address "FWS_V6_DMZ_WEB_v6" ipv6
  ip 2001:db8:30::10/128
exit
address "FWS_nat-virtual-server_MAIL_VS-to"
  ip 198.51.100.11/32
exit
service "FWS_WEB_ALT"
  tcp dst-port 8080 8089
exit
address "FWS_nat-virtual-server_ALT_VS-dnat"
  ip 10.30.0.12/32
exit
address "FWS_nat-virtual-server_ONE2ONE-inside"
  ip 10.30.0.30/32
exit
address "FWS_nat-virtual-server_ONE2ONE-outside"
  ip 198.51.100.30/32
exit
address "FWS_nat-virtual-server_MANY2ONE-inside"
  ip 10.30.0.20/30
exit
address "FWS_nat-virtual-server_MANY2ONE-outside"
  ip 198.51.100.20/30
exit
address "FWS_LAN1_SUBNET"
  ip 10.10.0.0/24
exit
address "FWS_PUBLIC_RANGE"
  ip 198.51.100.20/30
exit
policy-global
  rule id 10000
    name "FWS_block_intra-zone_DMZ"
    action deny
    src-zone "FWS_DMZ"
    dst-zone "FWS_DMZ"
    src-addr "Any"
    dst-addr "Any"
    service "Any"
    description "zone DMZ blocks traffic between its members (block)"
  exit
  rule id 10001
    name "FWS_block_intra-zone_DMZ_v6"
    action deny
    src-zone "FWS_DMZ"
    dst-zone "FWS_DMZ"
    src-addr "IPv6-any"
    dst-addr "IPv6-any"
    service "Any"
    description "zone DMZ blocks traffic between its members (block)"
  exit
  rule id 10002
    name "FWS_LAN1_Outgoing"
    action permit
    src-zone "FWS_LAN1"
    dst-zone "FWS_WAN"
    src-addr "FWS_ALL_INTERNAL"
    dst-addr "Any"
    service "Any"
    log session-end
    description "LAN1 to the internet"
  exit
  rule id 10003
    name "FWS_Block_Partner_SSH"
    action deny
    src-zone "FWS_WAN"
    dst-zone "FWS_DMZ"
    src-addr "FWS_PARTNER_NET"
    dst-addr "FWS_SERVERS"
    service "FWS_SSH"
    log policy-deny
  exit
  rule id 10004
    name "FWS_WAN_to_Web"
    action permit
    src-zone "FWS_WAN"
    dst-zone "FWS_DMZ"
    src-addr "Any"
    dst-addr "FWS_WEB_SRV"
    dst-addr "FWS_PUBLIC_WEB"
    service "FWS_WEB"
  exit
  rule id 10005
    name "FWS_WAN_to_Mail"
    action permit
    src-zone "FWS_WAN"
    dst-zone "FWS_DMZ"
    src-addr "Any"
    dst-addr "FWS_MAIL_SRV"
    dst-ip 198.51.100.11/32
    service "FWS_SMTP"
    log session-end
  exit
  rule id 10006
    name "FWS_Admin_Mgmt"
    action permit
    src-zone "FWS_LAN1"
    dst-zone "FWS_DMZ"
    src-addr "FWS_ADMIN_PCS"
    dst-addr "FWS_SERVERS"
    service "FWS_MGMT"
  exit
  rule id 10007
    name "FWS_LAN1_to_DMZ_Reject"
    action deny
    src-zone "FWS_LAN1"
    dst-zone "FWS_DMZ"
    src-addr "Any"
    dst-addr "Any"
    service "Any"
    log policy-deny
  exit
  rule id 10008
    name "FWS_Monitor_Ping"
    action permit
    src-addr "FWS_MONITOR"
    dst-addr "Any"
    service "FWS_PING"
  exit
  rule id 10009
    disable
    name "FWS_Old_Rule"
    action permit
    src-zone "FWS_LAN1"
    dst-zone "FWS_LAB"
    src-addr "Any"
    dst-addr "Any"
    service "FWS_GRE"
  exit
  rule id 10010
    disable
    name "FWS_Alice_Workhours"
    action permit
    src-zone "FWS_LAN1"
    dst-zone "FWS_WAN"
    src-addr "Any"
    dst-addr "Any"
    service "FWS_HTTPS"
  exit
  rule id 10011
    name "FWS_DNS_From_Port"
    action permit
    src-zone "FWS_LAN1"
    dst-zone "FWS_WAN"
    src-addr "Any"
    dst-addr "Any"
    service "FWS_DNS-sourceport-1024-65535"
  exit
  rule id 10012
    disable
    name "FWS_Country_Block"
    action deny
    src-zone "FWS_WAN"
    src-ip 0.0.0.0/32
    dst-addr "Any"
    service "Any"
  exit
  rule id 10013
    name "FWS_Portal_Access"
    action permit
    src-zone "FWS_LAN1"
    dst-zone "FWS_WAN"
    src-addr "Any"
    dst-addr "FWS_PORTAL"
    service "FWS_HTTPS"
  exit
  rule id 10014
    disable
    name "FWS_VS_Only"
    action permit
    src-zone "FWS_WAN"
    dst-zone "FWS_DMZ"
    src-addr "Any"
    dst-addr "Any"
    service "Any"
  exit
  rule id 10015
    name "FWS_ESP_Out"
    action permit
    src-zone "FWS_DMZ"
    dst-zone "FWS_WAN"
    src-addr "FWS_INSIDE_RANGE"
    dst-addr "Any"
    service "FWS_ESP"
  exit
  rule id 10016
    name "FWS_V6_LAN_Out_v6"
    action permit
    src-zone "FWS_LAN1"
    dst-zone "FWS_WAN"
    src-addr "FWS_V6_LAN_v6"
    dst-addr "IPv6-any"
    service "Any"
  exit
  rule id 10017
    name "FWS_V6_Admin_Web_v6"
    action permit
    src-zone "FWS_LAN1"
    dst-zone "FWS_DMZ"
    src-addr "FWS_V6_ADMINS_v6"
    dst-addr "FWS_V6_DMZ_WEB_v6"
    service "FWS_MGMT"
  exit
  rule id 10018
    disable
    name "FWS_V6_Ping_v6"
    action permit
    src-addr "IPv6-any"
    dst-addr "IPv6-any"
    service "Any"
  exit
exit
ip vrouter "trust-vr"
  dnatrule id 10000 from "Any" to "FWS_PUBLIC_WEB" service "FWS_HTTPS" trans-to "FWS_WEB_SRV" port 8443
  dnatrule id 10001 from "Any" to "FWS_nat-virtual-server_MAIL_VS-to" service "FWS_SMTP" trans-to "FWS_MAIL_SRV"
  dnatrule id 10002 from "Any" to "Any" service "FWS_WEB_ALT" trans-to "FWS_nat-virtual-server_ALT_VS-dnat"
  snatrule id 10000 from "FWS_nat-virtual-server_ONE2ONE-inside" to "Any" service "Any" trans-to address-book "FWS_nat-virtual-server_ONE2ONE-outside" mode static
  dnatrule id 10003 from "Any" to "FWS_nat-virtual-server_ONE2ONE-outside" service "Any" trans-to "FWS_nat-virtual-server_ONE2ONE-inside"
  snatrule id 10001 from "FWS_nat-virtual-server_MANY2ONE-inside" to "Any" service "Any" trans-to address-book "FWS_nat-virtual-server_MANY2ONE-outside" mode static
  dnatrule id 10004 from "Any" to "FWS_nat-virtual-server_MANY2ONE-outside" service "Any" trans-to "FWS_nat-virtual-server_MANY2ONE-inside"
  snatrule id 10002 from "FWS_LAN1_SUBNET" to "Any" service "Any" eif ge1 trans-to eif-ip mode dynamicport
  snatrule id 10003 from "FWS_SERVERS" to "Any" service "Any" trans-to address-book "FWS_PUBLIC_RANGE" mode dynamicport
exit
end
