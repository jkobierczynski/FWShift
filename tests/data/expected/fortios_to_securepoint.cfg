# Securepoint UTM: commands of its CLI (spcli), written by FWShift. They add network objects, services and the
# rule group 'fwshift' with its rules, and delete nothing. Lines that start with '#' are not commands: leave them
# out when loading (grep -v '^#'). Nothing applies until 'system update rule', nothing is kept over a restart until
# 'system config save': run both yourself after reading the report (section 10 of the manual).
service new name "HTTP" proto "tcp" dst-ports [ "80" ] src-ports [ ]
service new name "HTTPS" proto "tcp" dst-ports [ "443" ] src-ports [ ]
service new name "DNS-tcp-53" proto "tcp" dst-ports [ "53" ] src-ports [ ]
service new name "DNS-udp-53" proto "udp" dst-ports [ "53" ] src-ports [ ]
service group new name "LAN to Internet" services [ "HTTP" "HTTPS" "DNS-tcp-53" "DNS-udp-53" ]
node new name "lan-net" address "10.10.0.0/15" zone "lan"
node new name "any-v4-wan1" address "0.0.0.0/0" zone "wan1"
node new name "any-v6-wan1" address "::/0" zone "wan1"
node group new name "any-wan1" nodes [ "any-v4-wan1" "any-v6-wan1" ]
service new name "PING" proto "icmp" icmp-types [ "8" ]
service group new name "basic-net" services [ "DNS-tcp-53" "DNS-udp-53" "PING" ]
node new name "net-0.0.0.0_0" address "0.0.0.0/0" zone "lan"
service new name "app-ports-tcp-8080" proto "tcp" dst-ports [ "8080" ] src-ports [ ]
service new name "app-ports-tcp-8443" proto "tcp" dst-ports [ "8443" ] src-ports [ ]
service new name "app-ports-tcp-9000-9010" proto "tcp" dst-ports [ "9000-9010" ] src-ports [ ]
service group new name "app-ports" services [ "app-ports-tcp-8080" "app-ports-tcp-8443" "app-ports-tcp-9000-9010" ]
node new name "net-10.20.0.10_32" address "10.20.0.10/32" zone "dmz"
service new name "SMTP" proto "tcp" dst-ports [ "25" ] src-ports [ ]
node new name "net-10.20.0.25_32" address "10.20.0.25/32" zone "dmz"
service new name "MODBUS" proto "tcp" dst-ports [ "502" ] src-ports [ ]
node new name "scada-server" address "10.10.7.15/32" zone "lan"
node new name "plc-net" address "10.30.1.0/24" zone "ot"
node new name "net-0.0.0.0_0-ot" address "0.0.0.0/0" zone "ot"
service new name "GRE" proto "gre" 
service new name "syslog-from-high" proto "udp" dst-ports [ "514" ] src-ports [ "1024-65535" ]
service group new name "Partner tunnel" services [ "GRE" "syslog-from-high" ]
node new name "10.99.0.0_16" address "10.99.0.0/16" zone "wan1"
node new name "lan6-net" address "2001:db8:10::/48" zone "lan"
service new name "TIMESTAMP" proto "icmp" icmp-types [ "13" ]
node new name "admin-range-1" address "10.10.5.10/31" zone "lan"
node new name "admin-range-2" address "10.10.5.12/30" zone "lan"
node new name "admin-range-3" address "10.10.5.16/30" zone "lan"
node new name "admin-range-4" address "10.10.5.20/32" zone "lan"
node group new name "admin-range" nodes [ "admin-range-1" "admin-range-2" "admin-range-3" "admin-range-4" ]
node group new name "dmz-servers" nodes [ "net-10.20.0.10_32" "net-10.20.0.25_32" ]
node new name "vip-web" address "203.0.113.10/32" zone "firewall-wan1"
node new name "vip-mail" address "203.0.113.25/32" zone "firewall-wan1"
node new name "any-v6-lan" address "::/0" zone "lan"
node group new name "any-lan" nodes [ "net-0.0.0.0_0" "any-v6-lan" ]
rule group new name "fwshift"
rule new group "fwshift" src "lan-net" dst "any-wan1" service "LAN to Internet" comment "LAN to Internet" flags [ "ACCEPT" "LOG_ALL" ]
rule new group "fwshift" src "net-0.0.0.0_0" dst "any-wan1" service "basic-net" comment "LAN basics" flags [ "ACCEPT" ]
rule new group "fwshift" src "any-wan1" dst "net-10.20.0.10_32" service "app-ports" comment "Inbound web" flags [ "ACCEPT" "LOG_ALL" ]
rule new group "fwshift" src "any-wan1" dst "net-10.20.0.25_32" service "SMTP" comment "Inbound mail" flags [ "ACCEPT" ]
# not written: Admins to DMZ (not converted: groups netadmins)
# not written: Block geo (references 'geo-blocked': FortiOS address type 'geography')
# not written: DMZ out via pool (the destination holds host name 'updates.example.com'; that a network object of the UTM takes a host name is not documented)
rule new group "fwshift" src "scada-server" dst "plc-net" service "MODBUS" comment "SCADA to PLCs" flags [ "ACCEPT" "LOG_ALL" ]
rule new group "fwshift" src "net-0.0.0.0_0-ot" dst "any-wan1" service "any" comment "OT no internet" flags [ "DROP" "LOG_ALL" ]
rule new group "fwshift" src "lan-net" dst "10.99.0.0_16" service "Partner tunnel" comment "Partner tunnel" flags [ "ACCEPT" ]
rule new group "fwshift" src "lan6-net" dst "any-wan1" service "HTTPS" comment "LAN v6 out" flags [ "ACCEPT" ]
# not written: policy-12 (schedule 'office-hours' is not converted; the rule would apply at all times)
# not written: Not web (a negated service: a rule of the UTM cannot negate its service)
rule new group "fwshift" src "admin-range" dst "dmz-servers" service "TIMESTAMP" comment "Timestamp probes" flags [ "ACCEPT" ]
rule new group "fwshift" src "any-wan1" dst "net-10.20.0.10_32" service "app-ports-tcp-8443" comment "vip-web" flags [ "DROP" "DESTNAT" ] nat_node "vip-web" nat_service "HTTPS"
rule new group "fwshift" src "any-wan1" dst "net-10.20.0.25_32" service "any" comment "vip-mail" flags [ "DROP" "DESTNAT" ] nat_node "vip-mail" nat_service "any"
rule new group "fwshift" src "lan-net" dst "any-wan1" service "any" comment "snat-1" flags [ "DROP" "HIDENAT" ] nat_node "wan1-interface"
rule new group "fwshift" src "any-lan" dst "any-wan1" service "any" comment "snat-2" flags [ "DROP" "HIDENAT" ] nat_node "wan1-interface"
