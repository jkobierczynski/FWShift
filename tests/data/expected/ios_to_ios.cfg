!
! Put each interface in its zone; this changes traffic at once (between zones only what the policies let
! through passes; between an interface in a zone and one in none nothing does):
! interface GigabitEthernet0/0/0
!  zone-member security FWS-OUTSIDE
! interface GigabitEthernet0/0/1
!  zone-member security FWS-INSIDE
! interface GigabitEthernet0/0/2
!  zone-member security FWS-DMZ
! interface GigabitEthernet0/0/3
!  zone-member security FWS-LAB
! interface GigabitEthernet0
!  zone-member security FWS-MGMT
!
! NAT, which changes traffic at once on interfaces with ip nat inside or outside:
! ip nat inside source static 10.20.0.10 203.0.113.3
! ip nat inside source static tcp 10.20.0.25 25 203.0.113.2 25 extendable
! ip access-list extended FWS-NAT1
!  permit ip 10.10.0.0 0.0.63.255 any
!  permit ip 10.10.64.0 0.0.31.255 any
!  permit ip 10.10.96.0 0.0.1.255 any
!  permit ip 10.10.98.0 0.0.0.255 any
!  permit ip 10.10.100.0 0.0.3.255 any
!  permit ip 10.10.104.0 0.0.7.255 any
!  permit ip 10.10.112.0 0.0.15.255 any
!  permit ip 10.10.128.0 0.0.127.255 any
! ip nat inside source list FWS-NAT1 interface GigabitEthernet0/0/0 overload
! (the interfaces of zone FWS-INSIDE: ip nat inside)
! (the interfaces of zone FWS-DMZ: ip nat inside)
! (the interfaces of zone FWS-OUTSIDE: ip nat inside)
! (the interfaces of zone FWS-OUTSIDE: ip nat outside)
!
! Not written:
!   WAN-IN-130 (OUTSIDE to OUTSIDE): not converted: time-range OFFICE: active only part of the time
!   WAN-IN-130 (OUTSIDE to INSIDE): not converted: time-range OFFICE: active only part of the time
!   WAN-IN-130 (OUTSIDE to DMZ): not converted: time-range OFFICE: active only part of the time
!   WAN-IN-130 (OUTSIDE to LAB): not converted: time-range OFFICE: active only part of the time
!   WAN-IN-130 (OUTSIDE to MGMT): not converted: time-range OFFICE: active only part of the time
!   110-40 (LAB to OUTSIDE): not converted: 'fragments' is not converted
!   110-40 (LAB to INSIDE): not converted: 'fragments' is not converted
!   110-40 (LAB to DMZ): not converted: 'fragments' is not converted
!   110-40 (LAB to LAB): not converted: 'fragments' is not converted
!   110-40 (LAB to MGMT): not converted: 'fragments' is not converted
end
