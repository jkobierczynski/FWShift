# The interface (or interface group) of each zone.
fws_if_WAN = "WAN"
fws_if_LAN = "LAN"
fws_if_DMZ = "DMZ"
fws_if_GUEST = "GUEST"

# Tables.
table <fws_Automatic_outbound_NAT_on_W> const { 192.168.10.0/24 192.168.20.0/24 192.168.30.0/24 10.50.0.0/16 }
