table <fws_Updates> const { updates.example.com mirror.example.org 203.0.113.80 }

# What arrives on the interface of a zone is marked with the zone.
match in on $fws_if_WAN tag fws_WAN
match in on $fws_if_LAN tag fws_LAN
match in on $fws_if_DMZ tag fws_DMZ
match in on $fws_if_GUEST tag fws_GUEST

# Destination NAT, first match, and what the rules may allow is let in: they decide when it leaves.
pass in quick on { $fws_if_WAN $fws_if_LAN $fws_if_DMZ $fws_if_GUEST } inet proto tcp from any to 198.51.100.10 port 443 rdr-to 192.168.20.10 label "Web server HTTPS"
pass in quick on $fws_if_WAN inet proto tcp from 203.0.113.0/24 to 198.51.100.2 port 2222 rdr-to 192.168.20.25 port 22 label "SSH for the partner"
pass in quick on $fws_if_WAN inet from any to 198.51.100.11 rdr-to 192.168.20.25 label "Mail server - inbound"
pass in quick on $fws_if_WAN proto tcp from 203.0.113.0/24 to 192.168.20.25 port 22 label "SSH for the partner - pass"
pass in quick on { $fws_if_LAN $fws_if_DMZ } inet proto icmp from any to ! self icmp-type 8 label "Ping from the inside"
pass in quick on { $fws_if_LAN $fws_if_GUEST } proto { tcp udp } from any to <fws_DNS_from_the_firewall_dst> port 53 label "DNS from the firewall"
pass in quick on $fws_if_WAN inet proto tcp from any to 192.168.20.10 port 443 label "NAT Web server HTTPS"
pass in quick on $fws_if_WAN inet proto tcp from any to 192.168.20.11 port 9000:9010 label "NAT Application ports"
pass in quick on $fws_if_WAN inet proto tcp from any to 192.168.20.25 port { 25 465 587 } label "Mail in"
pass in quick on $fws_if_WAN inet6 proto tcp from any to 2001:db8:20::10 port 443 label "Web server over IPv6"
pass in quick on $fws_if_WAN inet proto icmp from any to 198.51.100.2 icmp-type { 8 11 3 } label "Ping and errors to the firewall"
pass in quick on $fws_if_LAN proto tcp from <fws_Admins> to <fws_DmzServers> port 22 label "Administrators to the servers"
pass in quick on $fws_if_LAN proto tcp from 192.168.10.0/24 to <fws_WebServers> port { 80 443 8080:8090 } label "Users to the web servers"
pass in quick on $fws_if_LAN proto tcp from 192.168.10.0/24 to 198.51.100.10 port 443 label "Users to the web server by its outside address"
pass in quick on $fws_if_LAN inet from 192.168.10.0/24 to ! self label "Default allow LAN to any rule"
pass in quick on $fws_if_LAN inet6 from 2001:db8:10::/64 to ! self label "Default allow LAN IPv6 to any rule"
pass in quick on $fws_if_DMZ proto tcp from <fws_DmzServers_IPv4> to <fws_Updates> port { 80 443 8080:8090 } label "Servers fetch their updates"
pass in quick on $fws_if_GUEST inet proto tcp from 192.168.30.0/24 to ! self port { 80 443 8080:8090 } label "Guests browse"

# The rules, first match, when the traffic leaves: the tag says the zone it came from.
block drop out log quick on $fws_if_WAN inet from any to 203.0.113.128/25 tagged fws_WAN label "Nothing leaves towards the sinkhole"
block drop out log quick on $fws_if_WAN inet from any to 203.0.113.128/25 tagged fws_LAN label "Nothing leaves towards the sinkhole"
block drop out log quick on $fws_if_WAN inet from any to 203.0.113.128/25 tagged fws_DMZ label "Nothing leaves towards the sinkhole"
block drop out log quick on $fws_if_WAN inet from any to 203.0.113.128/25 tagged fws_GUEST label "Nothing leaves towards the sinkhole"
match out proto tcp from 203.0.113.0/24 to 192.168.20.25 port 22 tagged fws_WAN tag fws_ok_WAN label "SSH for the partner - pass"
block drop out log quick from <fws_Block_private_networks_from> to any tagged fws_WAN label "Block private networks from WAN"
match out inet proto icmp from any to any icmp-type 8 tagged fws_LAN tag fws_ok_LAN label "Ping from the inside"
match out inet proto icmp from any to any icmp-type 8 tagged fws_DMZ tag fws_ok_DMZ label "Ping from the inside"
match out proto { tcp udp } from any to <fws_DNS_from_the_firewall_dst> port 53 tagged fws_LAN tag fws_ok_LAN label "DNS from the firewall"
match out proto { tcp udp } from any to <fws_DNS_from_the_firewall_dst> port 53 tagged fws_GUEST tag fws_ok_GUEST label "DNS from the firewall"
match out inet proto tcp from any to 192.168.20.10 port 443 tagged fws_WAN tag fws_ok_WAN label "NAT Web server HTTPS"
match out inet proto tcp from any to 192.168.20.11 port 9000:9010 tagged fws_WAN tag fws_ok_WAN label "NAT Application ports"
match out inet proto tcp from any to 192.168.20.25 port { 25 465 587 } tagged fws_WAN tag fws_ok_WAN label "Mail in"
match out inet6 proto tcp from any to 2001:db8:20::10 port 443 tagged fws_WAN tag fws_ok_WAN label "Web server over IPv6"
match out inet proto icmp from any to 198.51.100.2 icmp-type { 8 11 3 } tagged fws_WAN tag fws_ok_WAN label "Ping and errors to the firewall"
match out log proto tcp from <fws_Admins> to <fws_DmzServers> port 22 tagged fws_LAN tag fws_ok_LAN label "Administrators to the servers"
match out proto tcp from 192.168.10.0/24 to <fws_WebServers> port { 80 443 8080:8090 } tagged fws_LAN tag fws_ok_LAN label "Users to the web servers"
match out proto tcp from 192.168.10.0/24 to 198.51.100.10 port 443 tagged fws_LAN tag fws_ok_LAN label "Users to the web server by its outside address"
block return out quick from 192.168.10.0/24 to <fws_No_other_private_network_fr> tagged fws_LAN label "No other private network from the LAN"
match out inet from 192.168.10.0/24 to any tagged fws_LAN tag fws_ok_LAN label "Default allow LAN to any rule"
match out inet6 from 2001:db8:10::/64 to any tagged fws_LAN tag fws_ok_LAN label "Default allow LAN IPv6 to any rule"
match out proto tcp from <fws_DmzServers_IPv4> to <fws_Updates> port { 80 443 8080:8090 } tagged fws_DMZ tag fws_ok_DMZ label "Servers fetch their updates"
# FWSHIFT disabled, see the report: "Mail out, not to the inside" from DMZ to any; source 192.168.20.25; destination not Private; service tcp-25; action allow
# FWSHIFT disabled, see the report: "Syslog to the collector" from DMZ to any; source DMZ net; destination 192.168.10.5; service udp-514; action allow
# FWSHIFT disabled, see the report: "Nothing from the list" from DMZ to any; source Blocklist; destination 0.0.0.0/0; service any; action drop
# disabled in the source: "Tunnel of the old application" from DMZ to any; source 192.168.20.70; destination 203.0.113.7; service esp; action allow
block drop out log quick from 192.168.30.0/24 to <fws_No_other_private_network_fr> tagged fws_GUEST label "Guests reach nothing private"
match out inet proto tcp from 192.168.30.0/24 to any port { 80 443 8080:8090 } tagged fws_GUEST tag fws_ok_GUEST label "Guests browse"
# FWSHIFT disabled, see the report: "Phones of the guests" from GUEST to any; source GUEST net; destination 203.0.113.40; service udp-5060-5061; action allow
block drop out log quick inet proto tcp from any to any port 23 tagged fws_WAN label "Telnet unless a rule says otherwise"
block drop out log quick inet proto tcp from any to any port 23 tagged fws_LAN label "Telnet unless a rule says otherwise"
block drop out log quick inet proto tcp from any to any port 23 tagged fws_DMZ label "Telnet unless a rule says otherwise"
block drop out log quick inet proto tcp from any to any port 23 tagged fws_GUEST label "Telnet unless a rule says otherwise"

# What no rule decided: the default of the source.
block drop out quick tagged fws_WAN
block drop out quick tagged fws_LAN
block drop out quick tagged fws_DMZ
block drop out quick tagged fws_GUEST

# Source NAT, first match, of what the rules allowed.
match out on $fws_if_WAN inet from 192.168.20.25 to any tagged fws_ok_WAN nat-to 198.51.100.11 static-port tag fws_nat label "Mail server - outbound"
match out on $fws_if_WAN inet from 192.168.20.25 to any tagged fws_ok_LAN nat-to 198.51.100.11 static-port tag fws_nat label "Mail server - outbound"
match out on $fws_if_WAN inet from 192.168.20.25 to any tagged fws_ok_DMZ nat-to 198.51.100.11 static-port tag fws_nat label "Mail server - outbound"
match out on $fws_if_WAN inet from 192.168.20.25 to any tagged fws_ok_GUEST nat-to 198.51.100.11 static-port tag fws_nat label "Mail server - outbound"
match out on $fws_if_WAN inet from 192.168.20.0/24 to any tagged fws_ok_WAN nat-to 198.51.100.10 tag fws_nat label "DMZ leaves with the web address"
match out on $fws_if_WAN inet from 192.168.20.0/24 to any tagged fws_ok_LAN nat-to 198.51.100.10 tag fws_nat label "DMZ leaves with the web address"
match out on $fws_if_WAN inet from 192.168.20.0/24 to any tagged fws_ok_DMZ nat-to 198.51.100.10 tag fws_nat label "DMZ leaves with the web address"
match out on $fws_if_WAN inet from 192.168.20.0/24 to any tagged fws_ok_GUEST nat-to 198.51.100.10 tag fws_nat label "DMZ leaves with the web address"
match out on $fws_if_WAN inet from 192.168.10.0/24 to 203.0.113.0/24 tagged fws_ok_WAN tag fws_nat label "No NAT towards the partner"
match out on $fws_if_WAN inet from 192.168.10.0/24 to 203.0.113.0/24 tagged fws_ok_LAN tag fws_nat label "No NAT towards the partner"
match out on $fws_if_WAN inet from 192.168.10.0/24 to 203.0.113.0/24 tagged fws_ok_DMZ tag fws_nat label "No NAT towards the partner"
match out on $fws_if_WAN inet from 192.168.10.0/24 to 203.0.113.0/24 tagged fws_ok_GUEST tag fws_nat label "No NAT towards the partner"
match out on $fws_if_WAN inet from <fws_Automatic_outbound_NAT_on_W> to any tagged fws_ok_WAN nat-to ($fws_if_WAN) tag fws_nat label "Automatic outbound NAT on WAN"
match out on $fws_if_WAN inet from <fws_Automatic_outbound_NAT_on_W> to any tagged fws_ok_LAN nat-to ($fws_if_WAN) tag fws_nat label "Automatic outbound NAT on WAN"
match out on $fws_if_WAN inet from <fws_Automatic_outbound_NAT_on_W> to any tagged fws_ok_DMZ nat-to ($fws_if_WAN) tag fws_nat label "Automatic outbound NAT on WAN"
match out on $fws_if_WAN inet from <fws_Automatic_outbound_NAT_on_W> to any tagged fws_ok_GUEST nat-to ($fws_if_WAN) tag fws_nat label "Automatic outbound NAT on WAN"

# Pass what the rules allowed.
pass out quick tagged fws_ok_WAN
pass out quick tagged fws_ok_LAN
pass out quick tagged fws_ok_DMZ
