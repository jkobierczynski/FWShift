# Securepoint UTM: commands of its CLI (spcli), written by FWShift. They add network objects, services and the
# rule group 'fwshift' with its rules, and delete nothing. Lines that start with '#' are not commands: leave them
# out when loading (grep -v '^#'). Nothing applies until 'system update rule', nothing is kept over a restart until
# 'system config save': run both yourself after reading the report (section 10 of the manual).
node new name "iot-net" address "10.41.0.0/24" zone "inside_zone"
node new name "office-lan" address "10.40.0.0/24" zone "inside_zone"
node new name "nas-public" address "192.0.2.10/32" zone "inside_zone"
node group new name "Block_IoT_to_office-dst" nodes [ "office-lan" "nas-public" ]
service new name "HTTP" proto "tcp" dst-ports [ "80" ] src-ports [ ]
service new name "HTTPS" proto "tcp" dst-ports [ "443" ] src-ports [ ]
service new name "DNS_over_UDP" proto "udp" dst-ports [ "53" ] src-ports [ ]
service group new name "Inside_Outside_web" services [ "HTTP" "HTTPS" "DNS_over_UDP" ]
node new name "any-v4-outside_zone" address "0.0.0.0/0" zone "outside_zone"
node new name "any-v6-outside_zone" address "::/0" zone "outside_zone"
node group new name "any-outside_zone" nodes [ "any-v4-outside_zone" "any-v6-outside_zone" ]
service new name "nas-web" proto "tcp" dst-ports [ "5001" ] src-ports [ ]
node new name "nas" address "10.40.0.10/32" zone "inside_zone"
node group new name "NAS_from_Internet-dst" nodes [ "nas" "nas-public" ]
service new name "rdp" proto "tcp" dst-ports [ "3389" ] src-ports [ ]
service new name "echo-request" proto "icmp" icmp-types [ "8" ]
service new name "gre" proto "gre" 
service group new name "Head_office_v6" services [ "rdp" "echo-request" "gre" ]
node new name "head-office-v6" address "2001:db8:1::/48" zone "outside_zone"
node new name "nas-outside_zone" address "10.40.0.10/32" zone "outside_zone"
node new name "printers-1" address "10.40.0.200/29" zone "outside_zone"
node new name "printers-2" address "10.40.0.208/29" zone "outside_zone"
node new name "printers-3" address "10.40.0.216/30" zone "outside_zone"
node new name "printers-4" address "10.40.0.220/32" zone "outside_zone"
node new name "nas-public-outside_zone" address "192.0.2.10/32" zone "outside_zone"
node group new name "Head_office_v6-dst" nodes [ "nas-outside_zone" "printers-1" "printers-2" "printers-3" "printers-4" "nas-public-outside_zone" ]
node new name "printers-1-inside_zone" address "10.40.0.200/29" zone "inside_zone"
node new name "printers-2-inside_zone" address "10.40.0.208/29" zone "inside_zone"
node new name "printers-3-inside_zone" address "10.40.0.216/30" zone "inside_zone"
node new name "printers-4-inside_zone" address "10.40.0.220/32" zone "inside_zone"
node group new name "Head_office_v6-dst-inside_zone" nodes [ "nas" "printers-1-inside_zone" "printers-2-inside_zone" "printers-3-inside_zone" "printers-4-inside_zone" "nas-public" ]
node new name "nas-iot" address "10.40.0.10/32" zone "iot"
node new name "printers-1-iot" address "10.40.0.200/29" zone "iot"
node new name "printers-2-iot" address "10.40.0.208/29" zone "iot"
node new name "printers-3-iot" address "10.40.0.216/30" zone "iot"
node new name "printers-4-iot" address "10.40.0.220/32" zone "iot"
node new name "nas-public-iot" address "192.0.2.10/32" zone "iot"
node group new name "Head_office_v6-dst-iot" nodes [ "nas-iot" "printers-1-iot" "printers-2-iot" "printers-3-iot" "printers-4-iot" "nas-public-iot" ]
service new name "udp-src-53-dst-1024-65535" proto "udp" dst-ports [ "1024-65535" ] src-ports [ "53" ]
node new name "any-v4-inside_zone" address "0.0.0.0/0" zone "inside_zone"
node new name "any-v6-inside_zone" address "::/0" zone "inside_zone"
node group new name "any-inside_zone" nodes [ "any-v4-inside_zone" "any-v6-inside_zone" ]
service new name "nas-external" proto "tcp" dst-ports [ "8443" ] src-ports [ ]
node new name "outside-interface" address "192.0.2.2/32" zone "firewall-outside_zone"
rule group new name "fwshift"
rule new group "fwshift" src "iot-net" dst "Block_IoT_to_office-dst" service "any" comment "Block_IoT_to_office" flags [ "DROP" "LOG_ALL" ]
rule new group "fwshift" src "office-lan" dst "any-outside_zone" service "Inside_Outside_web" comment "Inside_Outside_web" flags [ "ACCEPT" "LOG_ALL" ]
# not written: IoT_telemetry (the destination holds host name 'telemetry.example.net'; that a network object of the UTM takes a host name is not documented)
rule new group "fwshift" src "any-outside_zone" dst "NAS_from_Internet-dst" service "nas-web" comment "NAS_from_Internet" flags [ "ACCEPT" "LOG_ALL" ]
rule new group "fwshift" src "head-office-v6" dst "Head_office_v6-dst" service "Head_office_v6" comment "Head_office_v6" flags [ "ACCEPT" ]
rule new group "fwshift" src "head-office-v6" dst "Head_office_v6-dst-inside_zone" service "Head_office_v6" comment "Head_office_v6" flags [ "ACCEPT" ]
rule new group "fwshift" src "head-office-v6" dst "Head_office_v6-dst-iot" service "Head_office_v6" comment "Head_office_v6" flags [ "ACCEPT" ]
rule new group "fwshift" src "any-outside_zone" dst "any-inside_zone" service "udp-src-53-dst-1024-65535" comment "DNS_answers" flags [ "ACCEPT" ]
# not written: Staff_streaming (not converted: an application condition)
# not written: Guests_by_time (schedule 'office-hours' is not converted; the rule would apply at all times; ICMP type 3 code 3: a service of the UTM names ICMP types, not codes)
rule new group "fwshift" src "any-outside_zone" dst "nas" service "nas-web" comment "NAS_published" flags [ "DROP" "DESTNAT" ] nat_node "outside-interface" nat_service "nas-external"
rule new group "fwshift" src "any-v4-inside_zone" dst "any-outside_zone" service "any" comment "InsideOutsideNatRule" flags [ "DROP" "HIDENAT" ] nat_node "outside_zone-interface"
