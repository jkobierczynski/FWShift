# rule new group "fwshift" src "Monitoring-eth1" dst "OT-Cell" service "standard.ping" comment "Monitoring to OT-Cell - standard.ping" flags [ "ACCEPT" ]
# rule new group "fwshift" src "Monitoring-eth2" dst "OT-Cell" service "standard.ping" comment "Monitoring to OT-Cell - standard.ping" flags [ "ACCEPT" ]
# rule new group "fwshift" src "Monitoring-eth3" dst "OT-Cell" service "standard.ping" comment "Monitoring to OT-Cell - standard.ping" flags [ "ACCEPT" ]
# rule new group "fwshift" src "Monitoring-eth4" dst "OT-Cell" service "standard.ping" comment "Monitoring to OT-Cell - standard.ping" flags [ "ACCEPT" ]
rule new group "fwshift" src "LAN" dst "Mailserver" service "internet.smtp" comment "LAN to Mailserver - internet.smtp" flags [ "ACCEPT" ]
# not written: Branch Sites to LAN - remote.rdp (not converted: 'Branch Sites' is a VPN object, which is not converted)
# not written: LAN to Lab-v6 - internet.http (not converted: desktop object 'Lab-v6' cannot be read: attribute 'ipv6', which this parser does not read)
rule new group "fwshift" src "DMZ" dst "Internet" service "GRE-Tunnel" comment "DMZ to Internet - GRE-Tunnel" flags [ "ACCEPT" ]
# not written: DMZ to Internet - standard.ssh (not converted: action 'drop', which is not a direction (LANCOM documents no rule that blocks))
# not written: Internet to ? - internet.https (not converted: desktop object '0e5f1a2b-0000-4000-8000-000000000999' is not in the input)
rule new group "fwshift" src "LAN" dst "DMZ" service "Web" comment "LAN to DMZ - Web" flags [ "ACCEPT" ]
rule new group "fwshift" src "DMZ" dst "LAN" service "Web" comment "DMZ to LAN - Web" flags [ "ACCEPT" ]
rule new group "fwshift" src "DMZ" dst "LAN" service "vpn.ipsec" comment "DMZ to LAN - vpn.ipsec" flags [ "ACCEPT" "LOG_ALL" ]
# not written: Printer to DMZ - internet.http (not converted: desktop object 'Printer' cannot be read: a host that names no interface)
rule new group "fwshift" src "LAN" dst "Internet" service "internet.http" comment "LAN to Internet - internet.http (NAT)" flags [ "DROP" "HIDENAT" ] nat_node "WAN-interface"
rule new group "fwshift" src "LAN" dst "Internet" service "internet.https" comment "LAN to Internet - internet.https (NAT)" flags [ "DROP" "HIDENAT" ] nat_node "WAN-interface"
rule new group "fwshift" src "LAN" dst "Internet" service "standard.dns" comment "LAN to Internet - standard.dns (NAT)" flags [ "DROP" "HIDENAT" ] nat_node "WAN-interface"
rule new group "fwshift" src "LAN" dst "Internet" service "standard.ping" comment "LAN to Internet - standard.ping (NAT)" flags [ "DROP" "HIDENAT" ] nat_node "WAN-interface"
rule new group "fwshift" src "DMZ" dst "Internet" service "GRE-Tunnel" comment "DMZ to Internet - GRE-Tunnel (NAT)" flags [ "DROP" "HIDENAT" ] nat_node "WAN-interface"
