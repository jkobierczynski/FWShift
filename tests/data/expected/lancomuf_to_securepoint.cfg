node new name "Monitoring-1-eth4" address "198.51.100.10/31" zone "eth4"
node new name "Monitoring-2-eth4" address "198.51.100.12/30" zone "eth4"
node new name "Monitoring-3-eth4" address "198.51.100.16/30" zone "eth4"
node new name "Monitoring-4-eth4" address "198.51.100.20/32" zone "eth4"
node group new name "Monitoring-eth4" nodes [ "Monitoring-1-eth4" "Monitoring-2-eth4" "Monitoring-3-eth4" "Monitoring-4-eth4" ]
service new name "internet.smtp" proto "tcp" dst-ports [ "25" ] src-ports [ ]
service new name "GRE-Tunnel" proto "gre" 
node new name "DMZ" address "172.16.20.0/24" zone "eth2"
service group new name "Web" services [ "internet.http" "internet.https" ]
service new name "vpn.ipsec-udp-500" proto "udp" dst-ports [ "500" ] src-ports [ ]
service new name "vpn.ipsec-udp-4500" proto "udp" dst-ports [ "4500" ] src-ports [ ]
service new name "vpn.ipsec-esp-" proto "esp" 
service group new name "vpn.ipsec" services [ "vpn.ipsec-udp-500" "vpn.ipsec-udp-4500" "vpn.ipsec-esp-" ]
rule group new name "fwshift"
rule new group "fwshift" src "LAN" dst "Internet" service "internet.http" comment "LAN to Internet - internet.http" flags [ "ACCEPT" "LOG_ALL" ]
rule new group "fwshift" src "LAN" dst "Internet" service "internet.https" comment "LAN to Internet - internet.https" flags [ "ACCEPT" "LOG_ALL" ]
rule new group "fwshift" src "LAN" dst "Internet" service "standard.dns" comment "LAN to Internet - standard.dns" flags [ "ACCEPT" ]
rule new group "fwshift" src "LAN" dst "Internet" service "standard.ping" comment "LAN to Internet - standard.ping" flags [ "ACCEPT" ]
rule new group "fwshift" src "Internet" dst "Webserver" service "internet.https" comment "Internet to Webserver - internet.https" flags [ "ACCEPT" ]
rule new group "fwshift" src "Admin-PCs" dst "Servers" service "standard.ssh" comment "Admin-PCs to Servers - standard.ssh" flags [ "ACCEPT" ]
rule new group "fwshift" src "Admin-PCs" dst "Servers" service "remote.rdp" comment "Admin-PCs to Servers - remote.rdp" flags [ "ACCEPT" ]
rule new group "fwshift" src "Servers" dst "Admin-PCs" service "remote.rdp" comment "Servers to Admin-PCs - remote.rdp" flags [ "ACCEPT" ]
rule new group "fwshift" src "net-192.168.10.5_32" dst "OT-Cell" service "Modbus-TCP" comment "Jump-Hosts to OT-Cell - Modbus-TCP (eth1 to eth3)" flags [ "ACCEPT" "LOG_ALL" ]
rule new group "fwshift" src "net-10.30.0.5_32" dst "OT-Cell" service "Modbus-TCP" comment "Jump-Hosts to OT-Cell - Modbus-TCP (eth3 to eth3)" flags [ "ACCEPT" "LOG_ALL" ]
# not written: HMI to OT-Cell - OPC-UA (schedule 'Mon 06:00:00 - Mon 22:00:00; Tue 06:00:00 - Tue 22:00:00; Wed 06:00:00 - Wed 22:00:00; Thu 06:00:00 - Thu 22:00:00; Fri 06:00:00 - Fri 22:00:00' is not converted; the rule would apply at all times)
# not written: OT-Cell to HMI - OPC-UA (schedule 'Mon 06:00:00 - Mon 22:00:00; Tue 06:00:00 - Tue 22:00:00; Wed 06:00:00 - Wed 22:00:00; Thu 06:00:00 - Thu 22:00:00; Fri 06:00:00 - Fri 22:00:00' is not converted; the rule would apply at all times)
