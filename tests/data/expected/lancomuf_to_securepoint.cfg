# Securepoint UTM: commands of its CLI (spcli), written by FWShift. They add network objects, services and the
# rule group 'fwshift' with its rules, and delete nothing. Lines that start with '#' are not commands: leave them
# out when loading (grep -v '^#'). Nothing applies until 'system update rule', nothing is kept over a restart until
# 'system config save': run both yourself after reading the report (section 10 of the manual).
service new name "internet.http" proto "tcp" dst-ports [ "80" ] src-ports [ ]
node new name "LAN" address "192.168.10.0/24" zone "eth1"
node new name "Internet" address "0.0.0.0/0" zone "WAN"
service new name "internet.https" proto "tcp" dst-ports [ "443" ] src-ports [ ]
service new name "standard.dns-tcp-53" proto "tcp" dst-ports [ "53" ] src-ports [ ]
service new name "standard.dns-udp-53" proto "udp" dst-ports [ "53" ] src-ports [ ]
service group new name "standard.dns" services [ "standard.dns-tcp-53" "standard.dns-udp-53" ]
service new name "standard.ping" proto "icmp" icmp-types [ "any" ]
node new name "Webserver" address "172.16.20.10/32" zone "eth2"
service new name "standard.ssh" proto "tcp" dst-ports [ "22" ] src-ports [ ]
node new name "Admin-PCs-1" address "192.168.10.200/29" zone "eth1"
node new name "Admin-PCs-2" address "192.168.10.208/29" zone "eth1"
node new name "Admin-PCs-3" address "192.168.10.216/30" zone "eth1"
node new name "Admin-PCs-4" address "192.168.10.220/32" zone "eth1"
node group new name "Admin-PCs" nodes [ "Admin-PCs-1" "Admin-PCs-2" "Admin-PCs-3" "Admin-PCs-4" ]
node new name "Mailserver" address "172.16.20.25/32" zone "eth2"
node group new name "Servers" nodes [ "Webserver" "Mailserver" ]
service new name "remote.rdp" proto "tcp" dst-ports [ "3389" ] src-ports [ ]
service new name "Modbus-TCP" proto "tcp" dst-ports [ "502" ] src-ports [ ]
node new name "net-192.168.10.5_32" address "192.168.10.5/32" zone "eth1"
node new name "OT-Cell" address "10.30.0.0/24" zone "eth3"
node new name "net-10.30.0.5_32" address "10.30.0.5/32" zone "eth3"
node new name "Monitoring-1" address "198.51.100.10/31" zone "WAN"
node new name "Monitoring-2" address "198.51.100.12/30" zone "WAN"
node new name "Monitoring-3" address "198.51.100.16/30" zone "WAN"
node new name "Monitoring-4" address "198.51.100.20/32" zone "WAN"
node group new name "Monitoring" nodes [ "Monitoring-1" "Monitoring-2" "Monitoring-3" "Monitoring-4" ]
node new name "Monitoring-1-eth1" address "198.51.100.10/31" zone "eth1"
node new name "Monitoring-2-eth1" address "198.51.100.12/30" zone "eth1"
node new name "Monitoring-3-eth1" address "198.51.100.16/30" zone "eth1"
node new name "Monitoring-4-eth1" address "198.51.100.20/32" zone "eth1"
node group new name "Monitoring-eth1" nodes [ "Monitoring-1-eth1" "Monitoring-2-eth1" "Monitoring-3-eth1" "Monitoring-4-eth1" ]
node new name "Monitoring-1-eth2" address "198.51.100.10/31" zone "eth2"
node new name "Monitoring-2-eth2" address "198.51.100.12/30" zone "eth2"
node new name "Monitoring-3-eth2" address "198.51.100.16/30" zone "eth2"
node new name "Monitoring-4-eth2" address "198.51.100.20/32" zone "eth2"
node group new name "Monitoring-eth2" nodes [ "Monitoring-1-eth2" "Monitoring-2-eth2" "Monitoring-3-eth2" "Monitoring-4-eth2" ]
node new name "Monitoring-1-eth3" address "198.51.100.10/31" zone "eth3"
node new name "Monitoring-2-eth3" address "198.51.100.12/30" zone "eth3"
node new name "Monitoring-3-eth3" address "198.51.100.16/30" zone "eth3"
node new name "Monitoring-4-eth3" address "198.51.100.20/32" zone "eth3"
