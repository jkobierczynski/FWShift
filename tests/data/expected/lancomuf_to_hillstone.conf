configure
zone "FWS_WAN"
  description "WAN"
exit
zone "FWS_eth1"
  description "eth1"
exit
zone "FWS_eth2"
  description "eth2"
exit
zone "FWS_eth3"
  description "eth3"
exit
zone "FWS_eth4"
  description "eth4"
exit
service "FWS_internet.http"
  tcp dst-port 80
exit
address "FWS_LAN"
  ip 192.168.10.0/24
exit
address "FWS_Internet"
  ip 0.0.0.0/0
exit
service "FWS_internet.https"
  tcp dst-port 443
exit
service "FWS_standard.dns"
  tcp dst-port 53
  udp dst-port 53
exit
address "FWS_Webserver"
  ip 172.16.20.10/32
exit
service "FWS_standard.ssh"
  tcp dst-port 22
exit
address "FWS_Admin-PCs"
  range 192.168.10.200 192.168.10.220
exit
address "FWS_Servers"
  ip 172.16.20.10/32
  ip 172.16.20.25/32
exit
service "FWS_remote.rdp"
  tcp dst-port 3389
exit
service "FWS_Modbus-TCP"
  tcp dst-port 502
exit
address "FWS_Jump-Hosts__eth1_"
  ip 192.168.10.5/32
exit
address "FWS_OT-Cell"
  ip 10.30.0.0/24
exit
address "FWS_Jump-Hosts__eth3_"
  ip 10.30.0.5/32
exit
service "FWS_OPC-UA"
  tcp dst-port 4840 4843
exit
address "FWS_HMI"
  ip 10.30.0.50/32
exit
address "FWS_Monitoring"
  range 198.51.100.10 198.51.100.20
exit
service "FWS_internet.smtp"
  tcp dst-port 25
exit
address "FWS_Mailserver"
  ip 172.16.20.25/32
exit
service "FWS_GRE-Tunnel"
  protocol 47
exit
address "FWS_DMZ"
  ip 172.16.20.0/24
exit
service "FWS_Web"
  tcp dst-port 80
  tcp dst-port 443
exit
service "FWS_vpn.ipsec"
  udp dst-port 500
  udp dst-port 4500
  protocol 50
exit
policy-global
  rule id 10000
    name "FWS_LAN_to_Internet_-_internet.http"
    action permit
    src-zone "FWS_eth1"
    dst-zone "FWS_WAN"
    src-addr "FWS_LAN"
    dst-addr "FWS_Internet"
    service "FWS_internet.http"
    log session-end
  exit
  rule id 10001
    name "FWS_LAN_to_Internet_-_internet.https"
    action permit
    src-zone "FWS_eth1"
    dst-zone "FWS_WAN"
    src-addr "FWS_LAN"
    dst-addr "FWS_Internet"
    service "FWS_internet.https"
    log session-end
  exit
  rule id 10002
    name "FWS_LAN_to_Internet_-_standard.dns"
    action permit
    src-zone "FWS_eth1"
    dst-zone "FWS_WAN"
    src-addr "FWS_LAN"
    dst-addr "FWS_Internet"
    service "FWS_standard.dns"
  exit
  rule id 10003
    name "FWS_LAN_to_Internet_-_standard.ping"
    action permit
    src-zone "FWS_eth1"
    dst-zone "FWS_WAN"
    src-addr "FWS_LAN"
    dst-addr "FWS_Internet"
    service "ICMP"
  exit
  rule id 10004
    name "FWS_Internet_to_Webserver_-_internet.https"
    action permit
    src-zone "FWS_WAN"
    dst-zone "FWS_eth2"
    src-addr "FWS_Internet"
    dst-addr "FWS_Webserver"
    service "FWS_internet.https"
  exit
  rule id 10005
    name "FWS_Admin-PCs_to_Servers_-_standard.ssh"
    action permit
    src-zone "FWS_eth1"
    dst-zone "FWS_eth2"
    src-addr "FWS_Admin-PCs"
    dst-addr "FWS_Servers"
    service "FWS_standard.ssh"
  exit
  rule id 10006
    name "FWS_Admin-PCs_to_Servers_-_remote.rdp"
    action permit
    src-zone "FWS_eth1"
    dst-zone "FWS_eth2"
    src-addr "FWS_Admin-PCs"
    dst-addr "FWS_Servers"
    service "FWS_remote.rdp"
  exit
  rule id 10007
    name "FWS_Servers_to_Admin-PCs_-_remote.rdp"
    action permit
    src-zone "FWS_eth2"
    dst-zone "FWS_eth1"
    src-addr "FWS_Servers"
    dst-addr "FWS_Admin-PCs"
    service "FWS_remote.rdp"
  exit
  rule id 10008
    name "FWS_Jump-Hosts_to_OT-Cell_-_Modbus-TCP__eth1_to_eth3_"
    action permit
    src-zone "FWS_eth1"
    dst-zone "FWS_eth3"
    src-addr "FWS_Jump-Hosts__eth1_"
    dst-addr "FWS_OT-Cell"
    service "FWS_Modbus-TCP"
    log session-end
  exit
  rule id 10009
    name "FWS_Jump-Hosts_to_OT-Cell_-_Modbus-TCP__eth3_to_eth3_"
    action permit
    src-zone "FWS_eth3"
    dst-zone "FWS_eth3"
    src-addr "FWS_Jump-Hosts__eth3_"
    dst-addr "FWS_OT-Cell"
    service "FWS_Modbus-TCP"
    log session-end
  exit
  rule id 10010
    disable
    name "FWS_HMI_to_OT-Cell_-_OPC-UA"
    action permit
    src-zone "FWS_eth3"
    dst-zone "FWS_eth3"
    src-addr "FWS_HMI"
    dst-addr "FWS_OT-Cell"
    service "FWS_OPC-UA"
  exit
  rule id 10011
    disable
    name "FWS_OT-Cell_to_HMI_-_OPC-UA"
    action permit
    src-zone "FWS_eth3"
    dst-zone "FWS_eth3"
    src-addr "FWS_OT-Cell"
    dst-addr "FWS_HMI"
    service "FWS_OPC-UA"
  exit
  rule id 10012
    disable
    name "FWS_Monitoring_to_OT-Cell_-_standard.ping"
    action permit
    dst-zone "FWS_eth3"
    src-addr "FWS_Monitoring"
    dst-addr "FWS_OT-Cell"
    service "ICMP"
  exit
  rule id 10013
    name "FWS_LAN_to_Mailserver_-_internet.smtp"
    action permit
    src-zone "FWS_eth1"
    dst-zone "FWS_eth2"
    src-addr "FWS_LAN"
    dst-addr "FWS_Mailserver"
    service "FWS_internet.smtp"
  exit
  rule id 10014
    disable
    name "FWS_Branch_Sites_to_LAN_-_remote.rdp"
    action permit
    dst-zone "FWS_eth1"
    src-addr "Any"
    dst-addr "FWS_LAN"
    service "FWS_remote.rdp"
  exit
  rule id 10015
    disable
    name "FWS_LAN_to_Lab-v6_-_internet.http"
    action permit
    src-zone "FWS_eth1"
    src-addr "FWS_LAN"
    dst-addr "Any"
    service "FWS_internet.http"
  exit
  rule id 10016
    name "FWS_DMZ_to_Internet_-_GRE-Tunnel"
    action permit
    src-zone "FWS_eth2"
    dst-zone "FWS_WAN"
    src-addr "FWS_DMZ"
    dst-addr "FWS_Internet"
    service "FWS_GRE-Tunnel"
  exit
  rule id 10017
    disable
    name "FWS_DMZ_to_Internet_-_Legacy-App"
    action permit
    src-zone "FWS_eth2"
    dst-zone "FWS_WAN"
    src-addr "FWS_DMZ"
    dst-addr "FWS_Internet"
    service "Any"
  exit
  rule id 10018
    disable
    name "FWS_DMZ_to_Internet_-_standard.ssh"
    action permit
    src-zone "FWS_eth2"
    dst-zone "FWS_WAN"
    src-addr "FWS_DMZ"
    dst-addr "FWS_Internet"
    service "FWS_standard.ssh"
  exit
  rule id 10019
    disable
    name "FWS_Internet_to___-_internet.https"
    action permit
    src-zone "FWS_WAN"
    src-addr "FWS_Internet"
    dst-addr "Any"
    service "FWS_internet.https"
  exit
  rule id 10020
    name "FWS_LAN_to_DMZ_-_Web"
    action permit
    src-zone "FWS_eth1"
    dst-zone "FWS_eth2"
    src-addr "FWS_LAN"
    dst-addr "FWS_DMZ"
    service "FWS_Web"
  exit
  rule id 10021
    name "FWS_DMZ_to_LAN_-_Web"
    action permit
    src-zone "FWS_eth2"
    dst-zone "FWS_eth1"
    src-addr "FWS_DMZ"
    dst-addr "FWS_LAN"
    service "FWS_Web"
  exit
  rule id 10022
    name "FWS_DMZ_to_LAN_-_vpn.ipsec"
    action permit
    src-zone "FWS_eth2"
    dst-zone "FWS_eth1"
    src-addr "FWS_DMZ"
    dst-addr "FWS_LAN"
    service "FWS_vpn.ipsec"
    log session-end
  exit
  rule id 10023
    disable
    name "FWS_Printer_to_DMZ_-_internet.http"
    action permit
    dst-zone "FWS_eth2"
    src-addr "Any"
    dst-addr "FWS_DMZ"
    service "FWS_internet.http"
  exit
exit
ip vrouter "trust-vr"
  snatrule id 10000 from "FWS_LAN" to "Any" service "FWS_internet.http" eif WAN trans-to eif-ip mode dynamicport
  snatrule id 10001 from "FWS_LAN" to "Any" service "FWS_internet.https" eif WAN trans-to eif-ip mode dynamicport
  snatrule id 10002 from "FWS_LAN" to "Any" service "FWS_standard.dns" eif WAN trans-to eif-ip mode dynamicport
  snatrule id 10003 from "FWS_LAN" to "Any" service "ICMP" eif WAN trans-to eif-ip mode dynamicport
  snatrule id 10004 from "FWS_DMZ" to "Any" service "FWS_GRE-Tunnel" eif WAN trans-to eif-ip mode dynamicport
exit
end
