configure
zone "FWS_lan"
  description "lan"
exit
zone "FWS_wan"
  description "wan"
exit
zone "FWS_guest"
  description "guest"
exit
service "FWS_http-all"
  tcp dst-port 80
  tcp dst-port 443
exit
address "FWS_wan_ip"
  ip 203.0.113.10/32
exit
service "FWS_smtp-in"
  tcp dst-port 25
exit
service "FWS_web-ports"
  tcp dst-port 80
  tcp dst-port 443
  tcp dst-port 8080 8090
exit
address "FWS_pub_pool"
  ip 203.0.113.20/30
exit
service "FWS_dns-all"
  tcp dst-port 53
  udp dst-port 53
exit
address "FWS_guest_net"
  ip 10.30.0.0/24
exit
address "FWS_dmz_net"
  ip 172.16.20.0/24
exit
service "FWS_mgmt"
  tcp dst-port 22
  tcp dst-port 443
exit
address "FWS_admin_hosts"
  range 192.168.10.5 192.168.10.6
  ip 192.168.10.32/28
exit
address "FWS_servers"
  ip 172.16.20.25/32
  ip 172.16.20.80/32
exit
address "FWS_lan_net"
  ip 192.168.10.0/24
exit
service "FWS_https"
  tcp dst-port 443
exit
address "FWS_updates"
  host "updates.example.com"
exit
service "FWS_syslog"
  udp dst-port 514 src-port 1024 65535
exit
service "FWS_gre"
  protocol 47
exit
service "FWS_ftp-alg"
  tcp dst-port 21
exit
address "FWS_lan_net6_v6" ipv6
  ip 2001:db8:10::/64
exit
address "FWS_v6_web_v6" ipv6
  ip 2001:db8:20::80/128
exit
address "FWS_wan_ip2"
  ip 203.0.113.12/32
exit
address "FWS_web_srv"
  ip 172.16.20.80/32
exit
address "FWS_mail_srv"
  ip 172.16.20.25/32
exit
address "FWS_nat-allow_pool_sat_pool-dnat"
  ip 172.16.20.100/30
exit
address "FWS_nat-lan_web-pool"
  ip 203.0.113.11/32
exit
policy-global
  rule id 10000
    disable
    name "FWS_drop_netbios"
    action deny
    src-addr "Any"
    dst-addr "Any"
    service "Any"
  exit
  rule id 10001
    name "FWS_allow_web_sat_web"
    action permit
    src-zone "FWS_wan"
    dst-zone "dmz"
    src-addr "Any"
    dst-addr "FWS_wan_ip"
    service "FWS_http-all"
    log session-end
    description "Completes sat_web"
  exit
  rule id 10002
    name "FWS_block_bad_mail_sat_mail"
    action deny
    src-zone "FWS_wan"
    dst-zone "dmz"
    src-ip 198.51.100.0/24
    dst-addr "FWS_wan_ip"
    service "FWS_smtp-in"
    log policy-deny
  exit
  rule id 10003
    name "FWS_nat_mail_sat_mail_1"
    action permit
    src-zone "FWS_lan"
    dst-zone "dmz"
    src-addr "Any"
    dst-addr "FWS_wan_ip"
    service "FWS_smtp-in"
    log session-end
  exit
  rule id 10004
    name "FWS_nat_mail_sat_mail_2"
    action permit
    src-zone "FWS_guest"
    dst-zone "dmz"
    src-addr "Any"
    dst-addr "FWS_wan_ip"
    service "FWS_smtp-in"
    log session-end
  exit
  rule id 10005
    name "FWS_allow_mail_sat_mail"
    action permit
    src-zone "FWS_wan"
    dst-zone "dmz"
    src-addr "Any"
    dst-addr "FWS_wan_ip"
    service "FWS_smtp-in"
    log session-end
  exit
  rule id 10006
    name "FWS_allow_pool_sat_pool"
    action permit
    src-zone "FWS_wan"
    dst-zone "dmz"
    src-addr "Any"
    dst-addr "FWS_pub_pool"
    service "FWS_web-ports"
    log session-end
  exit
  rule id 10007
    name "FWS_to_guest_guest_dns"
    action permit
    src-zone "FWS_guest"
    dst-zone "FWS_wan"
    src-addr "FWS_guest_net"
    dst-addr "Any"
    service "FWS_dns-all"
    log session-end
  exit
  rule id 10008
    name "FWS_to_guest_guest_web"
    action permit
    src-zone "FWS_guest"
    dst-zone "FWS_wan"
    src-addr "FWS_guest_net"
    dst-addr "Any"
    service "FWS_http-all"
    log session-end
  exit
  rule id 10009
    disable
    name "FWS_to_guest_guest_never"
    action permit
    src-zone "FWS_guest"
    dst-zone "dmz"
    src-addr "FWS_guest_net"
    dst-addr "FWS_dmz_net"
    service "Any"
    log session-end
  exit
  rule id 10010
    name "FWS_admin_mgmt"
    action permit
    src-zone "FWS_lan"
    dst-zone "dmz"
    src-addr "FWS_admin_hosts"
    dst-addr "FWS_servers"
    service "FWS_mgmt"
    log session-end
  exit
  rule id 10011
    name "FWS_lan_dns"
    action permit
    src-zone "FWS_lan"
    dst-zone "FWS_wan"
    src-addr "FWS_lan_net"
    dst-addr "Any"
    service "FWS_dns-all"
    log session-end
  exit
  rule id 10012
    name "FWS_lan_web"
    action permit
    src-zone "FWS_lan"
    dst-zone "FWS_wan"
    src-addr "FWS_lan_net"
    dst-addr "Any"
    service "FWS_web-ports"
    log session-end
  exit
  rule id 10013
    name "FWS_lan_updates"
    action permit
    src-zone "FWS_lan"
    dst-zone "FWS_wan"
    src-addr "FWS_lan_net"
    dst-addr "FWS_updates"
    service "FWS_https"
    log session-end
  exit
  rule id 10014
    name "FWS_lan_to_dmz"
    action permit
    src-zone "FWS_lan"
    dst-zone "dmz"
    src-addr "FWS_lan_net"
    dst-addr "FWS_dmz_net"
    service "Any"
    log session-end
  exit
  rule id 10015
    name "FWS_syslog_fast"
    action permit
    src-zone "dmz"
    dst-zone "FWS_lan"
    src-addr "FWS_dmz_net"
    dst-ip 192.168.10.50/32
    service "FWS_syslog"
  exit
  rule id 10016
    disable
    name "FWS_gre_tunnel"
    action permit
    src-zone "dmz"
    dst-zone "FWS_wan"
    src-ip 172.16.20.9/32
    dst-ip 198.51.100.7/32
    service "FWS_gre"
    log session-end
  exit
  rule id 10017
    disable
    name "FWS_old_rule"
    action permit
    src-zone "FWS_wan"
    dst-zone "dmz"
    src-addr "Any"
    dst-addr "FWS_servers"
    service "FWS_ftp-alg"
    log session-end
  exit
  rule id 10018
    name "FWS_lan6_web_v6"
    action permit
    src-zone "FWS_lan"
    dst-zone "dmz"
    src-addr "FWS_lan_net6_v6"
    dst-addr "FWS_v6_web_v6"
    service "FWS_http-all"
    log session-end
  exit
  rule id 10019
    disable
    name "FWS_lan6_ping_v6"
    action permit
    src-zone "FWS_lan"
    src-addr "FWS_lan_net6_v6"
    dst-addr "IPv6-any"
    service "Any"
    log session-end
  exit
  rule id 10020
    name "FWS_pol_dmz_https"
    action permit
    src-zone "FWS_wan"
    dst-zone "dmz"
    src-addr "Any"
    dst-addr "FWS_wan_ip2"
    service "FWS_https"
    log session-end
  exit
  rule id 10021
    name "FWS_pol_dmz_out"
    action permit
    src-zone "dmz"
    dst-zone "FWS_wan"
    src-addr "FWS_dmz_net"
    dst-addr "Any"
    service "FWS_http-all"
    log session-end
  exit
  rule id 10022
    name "FWS_pol_block_ftp"
    action deny
    dst-zone "dmz"
    src-addr "Any"
    dst-addr "FWS_dmz_net"
    service "FWS_ftp-alg"
    log policy-deny
  exit
  rule id 10023
    name "FWS_DropAll"
    action deny
    src-addr "Any"
    dst-addr "Any"
    service "Any"
    log policy-deny
  exit
  rule id 10024
    name "FWS_DropAll6_v6"
    action deny
    src-addr "IPv6-any"
    dst-addr "IPv6-any"
    service "Any"
    log policy-deny
  exit
exit
ip vrouter "trust-vr"
  dnatrule id 10000 from "Any" to "FWS_wan_ip" service "FWS_http-all" trans-to "FWS_web_srv"
  dnatrule id 10001 from "Any" to "FWS_wan_ip" service "FWS_smtp-in" trans-to "FWS_mail_srv"
  snatrule id 10000 from "Any" to "FWS_wan_ip" service "FWS_smtp-in" eif wan trans-to eif-ip mode dynamicport
  dnatrule id 10002 from "Any" to "FWS_wan_ip" service "FWS_smtp-in" trans-to "FWS_mail_srv"
  dnatrule id 10003 from "Any" to "FWS_pub_pool" service "FWS_web-ports" trans-to "FWS_nat-allow_pool_sat_pool-dnat"
  snatrule id 10001 from "FWS_guest_net" to "Any" service "FWS_dns-all" eif wan trans-to eif-ip mode dynamicport
  snatrule id 10002 from "FWS_guest_net" to "Any" service "FWS_http-all" eif wan trans-to eif-ip mode dynamicport
  snatrule id 10003 from "FWS_lan_net" to "Any" service "FWS_dns-all" eif wan trans-to eif-ip mode dynamicport
  snatrule id 10004 from "FWS_lan_net" to "Any" service "FWS_web-ports" eif wan trans-to address-book "FWS_nat-lan_web-pool" mode dynamicport
  dnatrule id 10004 from "Any" to "FWS_wan_ip2" service "FWS_https" trans-to "FWS_web_srv" port 8443
  snatrule id 10005 from "FWS_dmz_net" to "Any" service "FWS_http-all" eif wan trans-to eif-ip mode dynamicport
exit
end
