# Generated by FWShift - review the conversion report before loading this.
# A ruleset for the pf anchor "fwshift" (OpenBSD; FreeBSD 15 and later). Check it with
# 'pfctl -vnf FILE -a fwshift', load it with 'pfctl -a fwshift -f FILE': nothing outside the anchor changes.
# The main ruleset decides where the anchor is evaluated: it needs a line 'anchor "fwshift"'.

# The interface (or interface group) of each zone.
fws_if_eth1 = "eth1"
fws_if_eth0 = "eth0"
fws_if_eth2 = "eth2"
fws_if_eth3 = "eth3"

# Tables.
table <fws_blocked> const { 192.0.2.128/25 198.51.100.66 }
table <fws_admins> const { 10.10.5.10/31 10.10.5.12/30 10.10.5.16/30 10.10.5.20 }
table <fws_dmz_v6> const { 2001:db8:20::10 2001:db8:20::25 }

# What arrives on the interface of a zone is marked with the zone.
match in on $fws_if_eth1 tag fws_eth1
match in on $fws_if_eth0 tag fws_eth0
match in on $fws_if_eth2 tag fws_eth2
match in on $fws_if_eth3 tag fws_eth3

# Destination NAT, first match, and what the rules may allow is let in: they decide when it leaves.
pass in quick on $fws_if_eth0 inet proto tcp from any to 203.0.113.10 port 443 rdr-to 10.20.0.10 port 8443 label "Web DNAT"
pass in quick on $fws_if_eth0 inet from any to 203.0.113.25 rdr-to 10.20.0.25 label "Mail DNAT"
pass in quick on $fws_if_eth1 proto tcp from any to ! self port { 80 443 } label "LAN web"
pass in quick on $fws_if_eth1 proto { tcp udp } from any to ! self port 53 label "LAN DNS"
pass in quick on $fws_if_eth1 proto 47 from any to ! self label "Partner tunnel"
pass in quick on $fws_if_eth1 proto tcp from <fws_admins> to 10.20.0.0/24 port { 22 3389 } label "Admins"
pass in quick on $fws_if_eth1 inet proto icmp from any to ! self icmp-type 8 label "Ping the DMZ"
pass in quick on $fws_if_eth1 proto tcp from 10.10.7.15 to 10.30.1.0/24 port 502 label "SCADA to PLCs"
pass in quick on $fws_if_eth0 proto tcp from any to 10.20.0.10 port 8443 label "Inbound web"
pass in quick on $fws_if_eth0 proto tcp from any to 10.20.0.25 port 25 label "Inbound mail"
pass in quick on $fws_if_eth0 proto tcp from any to <fws_dmz_v6> port { 25 443 } label "Inbound IPv6"
pass in quick on $fws_if_eth2 inet proto tcp from any to ! 10.0.0.0/8 port { 80 443 } label "DMZ updates"
pass in quick on { $fws_if_eth1 $fws_if_eth0 $fws_if_eth2 $fws_if_eth3 } inet6 proto icmp6 from any to ! self icmp6-type { 128 135 136 } label "ICMPv6 basics"

# The rules, first match, when the traffic leaves: the tag says the zone it came from.
# FWSHIFT disabled, see the report: "Banned by fail2ban" from any to any; source 0.0.0.0/0; destination any; service any; action drop
block drop out quick from <fws_blocked> to any tagged fws_eth1 label "Block bad hosts"
block drop out quick from <fws_blocked> to any tagged fws_eth0 label "Block bad hosts"
block drop out quick from <fws_blocked> to any tagged fws_eth2 label "Block bad hosts"
block drop out quick from <fws_blocked> to any tagged fws_eth3 label "Block bad hosts"
block drop out quick on $fws_if_eth0 from 10.10.200.0/24 to any tagged fws_eth1 label "Guests stay in"
match out on $fws_if_eth0 proto tcp from any to any port { 80 443 } tagged fws_eth1 tag fws_ok_eth1 label "LAN web"
match out on $fws_if_eth0 proto { tcp udp } from any to any port 53 tagged fws_eth1 tag fws_ok_eth1 label "LAN DNS"
# FWSHIFT disabled, see the report: "Rate limited mail" from eth1 to eth0; source any; destination any; service tcp-25; action allow
match out on $fws_if_eth0 proto 47 from any to any tagged fws_eth1 tag fws_ok_eth1 label "Partner tunnel"
match out on $fws_if_eth2 proto tcp from <fws_admins> to 10.20.0.0/24 port { 22 3389 } tagged fws_eth1 tag fws_ok_eth1 label "Admins"
match out on $fws_if_eth2 inet proto icmp from any to any icmp-type 8 tagged fws_eth1 tag fws_ok_eth1 label "Ping the DMZ"
match out on $fws_if_eth3 proto tcp from 10.10.7.15 to 10.30.1.0/24 port 502 tagged fws_eth1 tag fws_ok_eth1 label "SCADA to PLCs"
block return out log quick on $fws_if_eth0 from any to any tagged fws_eth3 label "OT no internet"
match out on $fws_if_eth2 proto tcp from any to 10.20.0.10 port 8443 tagged fws_eth0 tag fws_ok_eth0 label "Inbound web"
match out on $fws_if_eth2 proto tcp from any to 10.20.0.25 port 25 tagged fws_eth0 tag fws_ok_eth0 label "Inbound mail"
match out on $fws_if_eth2 proto tcp from any to <fws_dmz_v6> port { 25 443 } tagged fws_eth0 tag fws_ok_eth0 label "Inbound IPv6"
match out on $fws_if_eth0 inet proto tcp from any to ! 10.0.0.0/8 port { 80 443 } tagged fws_eth2 tag fws_ok_eth2 label "DMZ updates"
match out inet6 proto icmp6 from any to any icmp6-type { 128 135 136 } tagged fws_eth1 tag fws_ok_eth1 label "ICMPv6 basics"
match out inet6 proto icmp6 from any to any icmp6-type { 128 135 136 } tagged fws_eth0 tag fws_ok_eth0 label "ICMPv6 basics"
match out inet6 proto icmp6 from any to any icmp6-type { 128 135 136 } tagged fws_eth2 tag fws_ok_eth2 label "ICMPv6 basics"
match out inet6 proto icmp6 from any to any icmp6-type { 128 135 136 } tagged fws_eth3 tag fws_ok_eth3 label "ICMPv6 basics"

# What no rule decided: the default of the source.
block drop out quick tagged fws_eth1
block drop out quick tagged fws_eth0
block drop out quick tagged fws_eth2
block drop out quick tagged fws_eth3

# Source NAT, first match, of what the rules allowed.
match out on $fws_if_eth0 inet from 10.10.0.0/16 to 10.99.0.0/16 tagged fws_ok_eth1 tag fws_nat label "No NAT to partner"
match out on $fws_if_eth0 inet from 10.10.0.0/16 to 10.99.0.0/16 tagged fws_ok_eth0 tag fws_nat label "No NAT to partner"
match out on $fws_if_eth0 inet from 10.10.0.0/16 to 10.99.0.0/16 tagged fws_ok_eth2 tag fws_nat label "No NAT to partner"
match out on $fws_if_eth0 inet from 10.10.0.0/16 to 10.99.0.0/16 tagged fws_ok_eth3 tag fws_nat label "No NAT to partner"
match out on $fws_if_eth0 inet from 10.20.0.0/24 to any tagged fws_ok_eth1 nat-to 198.51.100.20/30 tag fws_nat label "DMZ out"
match out on $fws_if_eth0 inet from 10.20.0.0/24 to any tagged fws_ok_eth0 nat-to 198.51.100.20/30 tag fws_nat label "DMZ out"
match out on $fws_if_eth0 inet from 10.20.0.0/24 to any tagged fws_ok_eth2 nat-to 198.51.100.20/30 tag fws_nat label "DMZ out"
match out on $fws_if_eth0 inet from 10.20.0.0/24 to any tagged fws_ok_eth3 nat-to 198.51.100.20/30 tag fws_nat label "DMZ out"
match out on $fws_if_eth0 inet from 10.10.0.0/16 to any tagged fws_ok_eth1 nat-to ($fws_if_eth0) tag fws_nat label "LAN out"
match out on $fws_if_eth0 inet from 10.10.0.0/16 to any tagged fws_ok_eth0 nat-to ($fws_if_eth0) tag fws_nat label "LAN out"
match out on $fws_if_eth0 inet from 10.10.0.0/16 to any tagged fws_ok_eth2 nat-to ($fws_if_eth0) tag fws_nat label "LAN out"
match out on $fws_if_eth0 inet from 10.10.0.0/16 to any tagged fws_ok_eth3 nat-to ($fws_if_eth0) tag fws_nat label "LAN out"

# Pass what the rules allowed.
pass out quick tagged fws_ok_eth1
pass out quick tagged fws_ok_eth0
pass out quick tagged fws_ok_eth2
pass out quick tagged fws_ok_eth3
pass out quick tagged fws_nat
