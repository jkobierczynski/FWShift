configure
zone "FWS_outside"
  description "outside"
exit
zone "FWS_inside"
  description "inside"
exit
service "FWS_backup"
  tcp dst-port 10000
exit
address "FWS_lan-net"
  ip 10.10.0.0/24
exit
address "FWS_mail-srv"
  ip 10.20.0.25/32
exit
address "FWS_mail-srv-pub"
  ip 203.0.113.25/32
exit
address "FWS_IPv4-Private-10.0.0.0-8"
  ip 10.0.0.0/8
exit
service "FWS_gre"
  protocol 47
exit
address "FWS_partner-net"
  ip 198.51.100.0/24
exit
address "FWS_web-srv"
  ip 10.20.0.10/32
exit
address "FWS_web-srv-pub"
  ip 203.0.113.10/32
exit
service "FWS_ipinip"
  protocol 4
exit
service "FWS_proto-41"
  protocol 41
exit
service "FWS_udp-3544"
  udp dst-port 3544
exit
address "FWS_ot-net"
  ip 10.30.0.0/24
exit
service "FWS_web"
  tcp dst-port 80
  tcp dst-port 443
  tcp dst-port 8080 8081
exit
service "FWS_DNS_over_UDP"
  udp dst-port 53
exit
service "FWS_DNS_over_TCP"
  tcp dst-port 53
exit
service "FWS_NTP-UDP"
  udp dst-port 123
exit
service "FWS_HTTPS"
  tcp dst-port 443
exit
address "FWS_updates"
  host "updates.example.com"
exit
service "FWS_HTTP"
  tcp dst-port 80
exit
service "FWS_smtp"
  tcp dst-port 25
exit
service "FWS_mgmt"
  tcp dst-port 22
  icmp type 8
exit
address "FWS_admin-pcs"
  range 10.10.0.100 10.10.0.120
exit
address "FWS_servers"
  ip 10.20.0.10/32
  ip 10.20.0.25/32
  ip 10.20.0.30/32
exit
service "FWS_tcp-3389"
  tcp dst-port 3389
exit
service "FWS_ipsec-esp"
  protocol 50
exit
service "FWS_tcp-8443"
  tcp dst-port 8443
exit
service "FWS_tcp-21"
  tcp dst-port 21
exit
service "FWS_udp-src-53-dst-1024-65535"
  udp dst-port 1024 65535 src-port 53
exit
address "FWS_branch-v6_v6" ipv6
  ip 2001:db8:10::/48
exit
service "FWS_echo"
  icmp type 8
exit
address "FWS_outside-interface"
  ip 203.0.113.2/32
exit
address "FWS_nat-pool"
  range 203.0.113.100 203.0.113.110
exit
address "FWS_nat-nat-mail-srv-inside"
  ip 10.20.0.25/32
exit
address "FWS_nat-nat-mail-srv-outside"
  ip 203.0.113.25/32
exit
address "FWS_dmz-net"
  ip 10.20.0.0/24
exit
address "FWS_internal"
  ip 10.10.0.0/24
  ip 10.20.0.0/24
exit
policy-global
  rule id 10000
    name "FWS_pre-backup"
    action permit
    src-zone "FWS_inside"
    dst-zone "dmz"
    src-addr "FWS_lan-net"
    dst-addr "FWS_mail-srv"
    dst-addr "FWS_mail-srv-pub"
    service "FWS_backup"
  exit
  rule id 10001
    name "FWS_pre-spoofed"
    action deny
    src-zone "FWS_outside"
    src-addr "FWS_IPv4-Private-10.0.0.0-8"
    dst-addr "Any"
    service "Any"
    log session-start
    log policy-deny
  exit
  rule id 10002
    name "FWS_pre-partner-gre"
    action permit
    src-zone "FWS_outside"
    dst-zone "dmz"
    src-addr "FWS_partner-net"
    dst-addr "FWS_web-srv"
    dst-addr "FWS_web-srv-pub"
    service "FWS_gre"
  exit
  rule id 10003
    name "FWS_pre-partner-gre-reverse"
    action permit
    src-zone "dmz"
    dst-zone "FWS_outside"
    src-addr "FWS_web-srv"
    dst-addr "FWS_partner-net"
    service "FWS_gre"
  exit
  rule id 10004
    name "FWS_prefilter-default-block-tunnels"
    action deny
    src-addr "Any"
    dst-addr "Any"
    service "FWS_gre"
    service "FWS_ipinip"
    service "FWS_proto-41"
    service "FWS_udp-3544"
    description "Default action of the prefilter policy: block tunnel traffic."
  exit
  rule id 10005
    name "FWS_prefilter-default-block-tunnels_v6"
    action deny
    src-addr "IPv6-any"
    dst-addr "IPv6-any"
    service "FWS_gre"
    service "FWS_ipinip"
    service "FWS_proto-41"
    service "FWS_udp-3544"
    description "Default action of the prefilter policy: block tunnel traffic."
  exit
  rule id 10006
    name "FWS_Block_OT_outbound"
    action deny
    src-zone "FWS_inside"
    dst-zone "FWS_outside"
    src-addr "FWS_ot-net"
    dst-addr "Any"
    service "Any"
    log session-start
    log policy-deny
    description "No production cell talks to the Internet"
  exit
  rule id 10007
    name "FWS_LAN_web"
    action permit
    src-zone "FWS_inside"
    dst-zone "FWS_outside"
    src-addr "FWS_lan-net"
    dst-addr "Any"
    service "FWS_web"
    log session-end
  exit
  rule id 10008
    name "FWS_LAN_DNS_and_NTP"
    action permit
    src-zone "FWS_inside"
    dst-zone "FWS_outside"
    src-addr "FWS_lan-net"
    dst-addr "Any"
    service "FWS_DNS_over_UDP"
    service "FWS_DNS_over_TCP"
    service "FWS_NTP-UDP"
  exit
  rule id 10009
    name "FWS_Updates_1"
    action permit
    src-zone "FWS_inside"
    dst-zone "FWS_outside"
    src-addr "Any"
    dst-addr "FWS_updates"
    service "FWS_HTTPS"
    log session-end
  exit
  rule id 10010
    name "FWS_Updates_2"
    action permit
    src-zone "dmz"
    dst-zone "FWS_outside"
    src-addr "Any"
    dst-addr "FWS_updates"
    service "FWS_HTTPS"
    log session-end
  exit
  rule id 10011
    name "FWS_Inbound_web"
    action permit
    src-zone "FWS_outside"
    dst-zone "dmz"
    src-addr "Any"
    dst-addr "FWS_web-srv"
    dst-addr "FWS_web-srv-pub"
    service "FWS_HTTP"
    service "FWS_HTTPS"
    log session-end
  exit
  rule id 10012
    name "FWS_Inbound_mail"
    action permit
    src-zone "FWS_outside"
    dst-zone "dmz"
    src-addr "Any"
    dst-addr "FWS_mail-srv"
    dst-addr "FWS_mail-srv-pub"
    service "FWS_smtp"
    log session-start
    log session-end
  exit
  rule id 10013
    name "FWS_Admin_access"
    action permit
    src-zone "FWS_inside"
    dst-zone "dmz"
    src-addr "FWS_admin-pcs"
    dst-addr "FWS_servers"
    dst-addr "FWS_mail-srv-pub"
    service "FWS_mgmt"
    log session-end
  exit
  rule id 10014
    disable
    name "FWS_Helpdesk_RDP"
    action permit
    src-zone "FWS_inside"
    dst-zone "dmz"
    src-addr "Any"
    dst-addr "FWS_servers"
    dst-addr "FWS_mail-srv-pub"
    service "FWS_tcp-3389"
    log session-end
  exit
  rule id 10015
    disable
    name "FWS_Staff_social_media"
    action deny
    src-zone "FWS_inside"
    dst-zone "FWS_outside"
    src-addr "Any"
    dst-addr "Any"
    service "Any"
    log policy-deny
  exit
  rule id 10016
    disable
    name "FWS_Staff_social_media_v6"
    action deny
    src-zone "FWS_inside"
    dst-zone "FWS_outside"
    src-addr "IPv6-any"
    dst-addr "IPv6-any"
    service "Any"
    log policy-deny
  exit
  rule id 10017
    name "FWS_Partner_service"
    action permit
    src-zone "FWS_outside"
    dst-zone "dmz"
    src-addr "FWS_partner-net"
    dst-addr "FWS_web-srv"
    dst-addr "FWS_web-srv-pub"
    service "FWS_ipsec-esp"
    service "FWS_tcp-8443"
    log session-end
  exit
  rule id 10018
    name "FWS_Uncategorised_web"
    action deny
    src-zone "FWS_inside"
    dst-zone "FWS_outside"
    src-range 10.10.0.200 10.10.0.250
    dst-addr "Any"
    service "FWS_HTTP"
    service "FWS_HTTPS"
    log policy-deny
  exit
  rule id 10019
    disable
    name "FWS_Old_FTP"
    action permit
    src-zone "FWS_inside"
    dst-zone "FWS_outside"
    src-addr "Any"
    dst-addr "Any"
    service "FWS_tcp-21"
    log session-end
  exit
  rule id 10020
    disable
    name "FWS_Old_FTP_v6"
    action permit
    src-zone "FWS_inside"
    dst-zone "FWS_outside"
    src-addr "IPv6-any"
    dst-addr "IPv6-any"
    service "FWS_tcp-21"
    log session-end
  exit
  rule id 10021
    name "FWS_DNS_answers_to_resolver"
    action permit
    src-zone "FWS_outside"
    dst-zone "dmz"
    src-addr "Any"
    dst-ip 10.20.0.53/32
    service "FWS_udp-src-53-dst-1024-65535"
  exit
  rule id 10022
    disable
    name "FWS_Branch_IPv6_v6"
    action permit
    src-zone "FWS_outside"
    dst-zone "dmz"
    src-addr "FWS_branch-v6_v6"
    dst-ip 2001:db8:20::10/128
    service "Any"
    log session-end
  exit
  rule id 10023
    name "FWS_Ping_out_1"
    action permit
    src-zone "FWS_inside"
    src-addr "Any"
    dst-addr "Any"
    service "FWS_echo"
  exit
  rule id 10024
    name "FWS_Ping_out_2"
    action permit
    src-zone "dmz"
    src-addr "Any"
    dst-addr "Any"
    service "FWS_echo"
  exit
  rule id 10025
    name "FWS_Ping_out_v6_3"
    action permit
    src-zone "FWS_inside"
    src-addr "IPv6-any"
    dst-addr "IPv6-any"
    service "FWS_echo"
  exit
  rule id 10026
    name "FWS_Ping_out_v6_4"
    action permit
    src-zone "dmz"
    src-addr "IPv6-any"
    dst-addr "IPv6-any"
    service "FWS_echo"
  exit
  rule id 10027
    name "FWS_Reset_the_rest_from_inside"
    action deny
    src-zone "FWS_inside"
    src-addr "Any"
    dst-addr "Any"
    service "Any"
    log session-start
    log policy-deny
  exit
  rule id 10028
    name "FWS_Reset_the_rest_from_inside_v6"
    action deny
    src-zone "FWS_inside"
    src-addr "IPv6-any"
    dst-addr "IPv6-any"
    service "Any"
    log session-start
    log policy-deny
  exit
exit
ip vrouter "trust-vr"
  dnatrule id 10000 from "FWS_lan-net" to "FWS_partner-net" service "Any" no-trans
  snatrule id 10000 from "FWS_lan-net" to "FWS_partner-net" service "Any" no-trans
  dnatrule id 10001 from "Any" to "FWS_web-srv-pub" service "Any" trans-to "FWS_web-srv"
  dnatrule id 10002 from "Any" to "FWS_outside-interface" service "FWS_tcp-8443" trans-to "FWS_web-srv" port 8080
  snatrule id 10001 from "FWS_lan-net" to "Any" service "Any" eif outside trans-to address-book "FWS_nat-pool" mode dynamicport
  snatrule id 10002 from "FWS_nat-nat-mail-srv-inside" to "Any" service "Any" trans-to address-book "FWS_nat-nat-mail-srv-outside" mode static
  dnatrule id 10003 from "Any" to "FWS_nat-nat-mail-srv-outside" service "Any" trans-to "FWS_nat-nat-mail-srv-inside"
  snatrule id 10003 from "FWS_dmz-net" to "Any" service "Any" eif outside trans-to eif-ip mode dynamicport
  snatrule id 10004 from "FWS_internal" to "Any" service "Any" eif outside trans-to eif-ip mode dynamicport
exit
end
