# Generated by FWShift - review the conversion report before loading this.
# A ruleset for the pf anchor "fwshift" (OpenBSD; FreeBSD 15 and later). Check it with
# 'pfctl -vnf FILE -a fwshift', load it with 'pfctl -a fwshift -f FILE': nothing outside the anchor changes.
# The main ruleset decides where the anchor is evaluated: it needs a line 'anchor "fwshift"'.

# The interface (or interface group) of each zone.
fws_if_lan = "lan"
fws_if_wan1 = "wan1"
fws_if_dmz = "dmz"
fws_if_ot = "ot"

# Tables.
table <fws_dmz_servers> const { 10.20.0.10 10.20.0.25 }
table <fws_admin_range> const { 10.10.5.10/31 10.10.5.12/30 10.10.5.16/30 10.10.5.20 }

# What arrives on the interface of a zone is marked with the zone.
match in on $fws_if_lan tag fws_lan
match in on $fws_if_wan1 tag fws_wan1
match in on $fws_if_dmz tag fws_dmz
match in on $fws_if_ot tag fws_ot

# Destination NAT, first match, and what the rules may allow is let in: they decide when it leaves.
pass in quick on $fws_if_wan1 inet proto tcp from any to 203.0.113.10 port 443 rdr-to 10.20.0.10 port 8443 label "vip-web"
pass in quick on $fws_if_wan1 inet from any to 203.0.113.25 rdr-to 10.20.0.25 label "vip-mail"
pass in quick on $fws_if_lan proto tcp from 10.10.0.0/15 to ! self port { 80 443 53 } label "LAN to Internet"
pass in quick on $fws_if_lan proto udp from 10.10.0.0/15 to ! self port 53 label "LAN to Internet"
pass in quick on $fws_if_lan inet proto { tcp udp } from any to ! self port 53 label "LAN basics"
pass in quick on $fws_if_lan inet proto icmp from any to ! self icmp-type 8 label "LAN basics"
pass in quick on $fws_if_wan1 proto tcp from any to 10.20.0.10 port { 8080 8443 9000:9010 } label "Inbound web"
pass in quick on $fws_if_wan1 proto tcp from any to 10.20.0.25 port 25 label "Inbound mail"
pass in quick on $fws_if_dmz proto tcp from <fws_dmz_servers> to updates.example.com port 443 label "DMZ out via pool"
pass in quick on $fws_if_lan proto tcp from 10.10.7.15 to 10.30.1.0/24 port 502 label "SCADA to PLCs"
pass in quick on $fws_if_lan proto udp from 10.10.0.0/15 port 1024:65535 to 10.99.0.0/16 port 514 label "Partner tunnel"
pass in quick on $fws_if_lan proto 47 from 10.10.0.0/15 to 10.99.0.0/16 label "Partner tunnel"
pass in quick on $fws_if_lan proto tcp from 2001:db8:10::/48 to ! self port 443 label "LAN v6 out"
pass in quick on $fws_if_lan inet proto icmp from <fws_admin_range> to <fws_dmz_servers> icmp-type 13 label "Timestamp probes"

# The rules, first match, when the traffic leaves: the tag says the zone it came from.
match out on $fws_if_wan1 proto tcp from 10.10.0.0/15 to any port { 80 443 53 } tagged fws_lan tag fws_ok_lan label "LAN to Internet"
match out on $fws_if_wan1 proto udp from 10.10.0.0/15 to any port 53 tagged fws_lan tag fws_ok_lan label "LAN to Internet"
match out on $fws_if_wan1 inet proto { tcp udp } from any to any port 53 tagged fws_lan tag fws_ok_lan label "LAN basics"
match out on $fws_if_wan1 inet proto icmp from any to any icmp-type 8 tagged fws_lan tag fws_ok_lan label "LAN basics"
match out log on $fws_if_dmz proto tcp from any to 10.20.0.10 port { 8080 8443 9000:9010 } tagged fws_wan1 tag fws_ok_wan1 label "Inbound web"
match out on $fws_if_dmz proto tcp from any to 10.20.0.25 port 25 tagged fws_wan1 tag fws_ok_wan1 label "Inbound mail"
# FWSHIFT disabled, see the report: "Admins to DMZ" from lan to dmz; source admin-range; destination dmz-servers; service SSH; action allow
# FWSHIFT disabled, see the report: "Block geo" from any to wan1; source any; destination geo-blocked; service any; action drop
match out on $fws_if_wan1 proto tcp from <fws_dmz_servers> to updates.example.com port 443 tagged fws_dmz tag fws_ok_dmz label "DMZ out via pool"
match out on $fws_if_ot proto tcp from 10.10.7.15 to 10.30.1.0/24 port 502 tagged fws_lan tag fws_ok_lan label "SCADA to PLCs"
block drop out quick on $fws_if_wan1 inet from any to any tagged fws_ot label "OT no internet"
match out on $fws_if_wan1 proto udp from 10.10.0.0/15 port 1024:65535 to 10.99.0.0/16 port 514 tagged fws_lan tag fws_ok_lan label "Partner tunnel"
match out on $fws_if_wan1 proto 47 from 10.10.0.0/15 to 10.99.0.0/16 tagged fws_lan tag fws_ok_lan label "Partner tunnel"
match out on $fws_if_wan1 proto tcp from 2001:db8:10::/48 to any port 443 tagged fws_lan tag fws_ok_lan label "LAN v6 out"
# FWSHIFT disabled, see the report: "policy-12" from lan to dmz; source lan-net; destination web-1; service HTTP; action allow
# disabled in the source: "Not web" from dmz to wan1; source web-1; destination any; service not Web Access; action allow
match out on $fws_if_dmz inet proto icmp from <fws_admin_range> to <fws_dmz_servers> icmp-type 13 tagged fws_lan tag fws_ok_lan label "Timestamp probes"

# What no rule decided: the default of the source.
block drop out quick tagged fws_lan
block drop out quick tagged fws_wan1
block drop out quick tagged fws_dmz
block drop out quick tagged fws_ot

# Source NAT, first match, of what the rules allowed.
match out on $fws_if_wan1 inet from 10.10.0.0/15 to any tagged fws_ok_lan nat-to ($fws_if_wan1) tag fws_nat label "snat-1"
match out on $fws_if_wan1 inet from any to any tagged fws_ok_lan nat-to ($fws_if_wan1) tag fws_nat label "snat-2"
match out on $fws_if_wan1 inet6 from any to any tagged fws_ok_lan nat-to ($fws_if_wan1) tag fws_nat label "snat-2"
match out on $fws_if_wan1 inet from <fws_dmz_servers> to updates.example.com tagged fws_ok_dmz nat-to 198.51.100.20/30 tag fws_nat label "snat-7"

# Pass what the rules allowed.
pass out quick tagged fws_ok_lan
pass out quick tagged fws_ok_wan1
pass out quick tagged fws_ok_dmz
pass out quick tagged fws_ok_ot
pass out quick tagged fws_nat
