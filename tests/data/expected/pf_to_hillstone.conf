  snatrule id 10000 from "FWS_nat-line_36_nat-from" to "Any" service "Any" eif em0 trans-to eif-ip mode dynamicport
  snatrule id 10001 from "FWS_nat-line_37_nat-from" to "Any" service "Any" eif em0 trans-to address-book "FWS_nat-line_37_nat-pool" mode dynamicip
  dnatrule id 10000 from "Any" to "FWS_nat-line_39_rdr-to" service "FWS_tcp-80_443" trans-to "FWS_nat-line_39_rdr-dnat"
