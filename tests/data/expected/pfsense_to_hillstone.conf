configure
zone "FWS_WAN"
  description "WAN"
exit
zone "FWS_LAN"
  description "LAN"
exit
zone "FWS_DMZ"
  description "DMZ"
exit
zone "FWS_GUEST"
  description "GUEST"
exit
service "FWS_tcp-22"
  tcp dst-port 22
exit
address "FWS_WAN_address"
  ip 198.51.100.2/32
exit
service "FWS_icmp-echoreq"
  icmp type 8
exit
service "FWS_tcp-udp-53"
  tcp dst-port 53
  udp dst-port 53
exit
address "FWS_This_Firewall"
  ip 192.168.10.1/32
  ip 192.168.20.1/32
  ip 192.168.30.1/32
  ip 198.51.100.2/32
  ip 198.51.100.10/31
exit
address "FWS_This_Firewall_IPv6_v6" ipv6
  ip 2001:db8:10::1/128
  ip 2001:db8:20::1/128
  ip 2001:db8:ffff::2/128
exit
service "FWS_tcp-443"
  tcp dst-port 443
exit
service "FWS_tcp-9000-9010"
  tcp dst-port 9000 9010
exit
service "FWS_MailPorts"
  tcp dst-port 25
  tcp dst-port 465
  tcp dst-port 587
exit
service "FWS_icmp-echoreq-timex-unreach"
  icmp type 8
  icmp type 11
  icmp type 3
exit
address "FWS_Admins"
  range 192.168.10.21 192.168.10.22
exit
address "FWS_DmzServers"
  ip 192.168.20.10/31
  ip 192.168.20.25/32
  ip 192.168.20.64/28
exit
address "FWS_DmzServers_v6" ipv6
  ip 2001:db8:20::10/128
exit
service "FWS_WebPorts"
  tcp dst-port 80
  tcp dst-port 443
  tcp dst-port 8080 8090
exit
address "FWS_LAN_net"
  ip 192.168.10.0/24
exit
address "FWS_WebServers"
  ip 192.168.20.10/31
exit
address "FWS_Private"
  ip 10.0.0.0/8
  ip 172.16.0.0/12
  ip 192.168.0.0/16
exit
address "FWS_LAN_net_IPv6_v6" ipv6
  ip 2001:db8:10::/64
exit
address "FWS_DmzServers_IPv4"
  ip 192.168.20.10/31
  ip 192.168.20.25/32
  ip 192.168.20.64/28
exit
address "FWS_Updates"
  ip 203.0.113.80/32
  host "updates.example.com"
  host "mirror.example.org"
exit
service "FWS_tcp-25"
  tcp dst-port 25
exit
address "FWS_not-Private"
  range 0.0.0.0 9.255.255.255
  range 11.0.0.0 172.15.255.255
  range 172.32.0.0 192.167.255.255
  range 192.169.0.0 255.255.255.255
exit
service "FWS_udp-514"
  udp dst-port 514
exit
address "FWS_DMZ_net"
  ip 192.168.20.0/24
exit
service "FWS_esp"
  protocol 50
exit
address "FWS_GUEST_net"
  ip 192.168.30.0/24
exit
service "FWS_udp-5060-5061"
  udp dst-port 5060 5061
exit
service "FWS_tcp-23"
  tcp dst-port 23
exit
address "FWS_nat-Web_server_HTTPS-to"
  ip 198.51.100.10/32
exit
address "FWS_nat-Web_server_HTTPS-dnat"
  ip 192.168.20.10/32
exit
service "FWS_tcp-2222"
  tcp dst-port 2222
exit
address "FWS_nat-SSH_for_the_partner-from"
  ip 203.0.113.0/24
exit
address "FWS_nat-SSH_for_the_partner-dnat"
  ip 192.168.20.25/32
exit
address "FWS_nat-Mail_server_-_inbound-to"
  ip 198.51.100.11/32
exit
address "FWS_nat-DMZ_leaves_with_the_web_address-from"
  ip 192.168.20.0/24
exit
address "FWS_nat-No_NAT_towards_the_partner-from"
  ip 192.168.10.0/24
exit
address "FWS_nat-Automatic_outbound_NAT_on_WAN-from"
  ip 10.50.0.0/16
  ip 192.168.10.0/24
  ip 192.168.20.0/24
  ip 192.168.30.0/24
exit
policy-global
  rule id 10000
    name "FWS_Nothing_leaves_towards_the_sinkhole"
    action deny
    dst-zone "FWS_WAN"
    src-addr "Any"
    dst-ip 203.0.113.128/25
    service "Any"
    log session-start
    log policy-deny
  exit
  rule id 10001
    name "FWS_SSH_for_the_partner_-_pass"
    action permit
    src-zone "FWS_WAN"
    src-ip 203.0.113.0/24
    dst-ip 192.168.20.25/32
    dst-addr "FWS_WAN_address"
    dst-ip 198.51.100.11/32
    service "FWS_tcp-22"
    description "what the port forward passes by itself (filter rule association 'Pass')"
  exit
  rule id 10002
    name "FWS_Block_private_networks_from_WAN"
    action deny
    src-zone "FWS_WAN"
    src-ip 10.0.0.0/8
    src-ip 127.0.0.0/8
    src-ip 172.16.0.0/12
    src-ip 192.168.0.0/16
    dst-addr "Any"
    service "Any"
    log session-start
    log policy-deny
    description "what 'Block private networks and loopback addresses' of the interface does on pfSense"
  exit
  rule id 10003
    name "FWS_Block_private_networks_from_WAN_v6"
    action deny
    src-zone "FWS_WAN"
    src-ip fc00::/7
    dst-addr "IPv6-any"
    service "Any"
    log session-start
    log policy-deny
    description "what 'Block private networks and loopback addresses' of the interface does on pfSense"
  exit
  rule id 10004
    name "FWS_Ping_from_the_inside_1"
    action permit
    src-zone "FWS_LAN"
    src-addr "Any"
    dst-addr "Any"
    service "FWS_icmp-echoreq"
  exit
  rule id 10005
    name "FWS_Ping_from_the_inside_2"
    action permit
    src-zone "FWS_DMZ"
    src-addr "Any"
    dst-addr "Any"
    service "FWS_icmp-echoreq"
  exit
  rule id 10006
    name "FWS_DNS_from_the_firewall_1"
    action permit
    src-zone "FWS_LAN"
    src-addr "Any"
    dst-addr "FWS_This_Firewall"
    service "FWS_tcp-udp-53"
  exit
  rule id 10007
    name "FWS_DNS_from_the_firewall_2"
    action permit
    src-zone "FWS_GUEST"
    src-addr "Any"
    dst-addr "FWS_This_Firewall"
    service "FWS_tcp-udp-53"
  exit
  rule id 10008
    name "FWS_DNS_from_the_firewall_v6_3"
    action permit
    src-zone "FWS_LAN"
    src-addr "IPv6-any"
    dst-addr "FWS_This_Firewall_IPv6_v6"
    service "FWS_tcp-udp-53"
  exit
  rule id 10009
    name "FWS_DNS_from_the_firewall_v6_4"
    action permit
    src-zone "FWS_GUEST"
    src-addr "IPv6-any"
    dst-addr "FWS_This_Firewall_IPv6_v6"
    service "FWS_tcp-udp-53"
  exit
  rule id 10010
    name "FWS_NAT_Web_server_HTTPS"
    action permit
    src-zone "FWS_WAN"
    src-addr "Any"
    dst-ip 192.168.20.10/32
    dst-ip 198.51.100.10/32
    service "FWS_tcp-443"
  exit
  rule id 10011
    name "FWS_NAT_Application_ports"
    action permit
    src-zone "FWS_WAN"
    src-addr "Any"
    dst-ip 192.168.20.11/32
    service "FWS_tcp-9000-9010"
  exit
  rule id 10012
    name "FWS_Mail_in"
    action permit
    src-zone "FWS_WAN"
    src-addr "Any"
    dst-ip 192.168.20.25/32
    dst-ip 198.51.100.11/32
    service "FWS_MailPorts"
  exit
  rule id 10013
    name "FWS_Web_server_over_IPv6_v6"
    action permit
    src-zone "FWS_WAN"
    src-addr "IPv6-any"
    dst-ip 2001:db8:20::10/128
    service "FWS_tcp-443"
  exit
  rule id 10014
    name "FWS_Ping_and_errors_to_the_firewall"
    action permit
    src-zone "FWS_WAN"
    src-addr "Any"
    dst-addr "FWS_WAN_address"
    service "FWS_icmp-echoreq-timex-unreach"
  exit
  rule id 10015
    name "FWS_Administrators_to_the_servers"
    action permit
    src-zone "FWS_LAN"
    src-addr "FWS_Admins"
    dst-addr "FWS_DmzServers"
    service "FWS_tcp-22"
    log session-start
    log session-end
  exit
  rule id 10016
    name "FWS_Users_to_the_web_servers"
    action permit
    src-zone "FWS_LAN"
    src-addr "FWS_LAN_net"
    dst-addr "FWS_WebServers"
    dst-ip 198.51.100.10/32
    service "FWS_WebPorts"
  exit
  rule id 10017
    name "FWS_Users_to_the_web_server_by_its_outside_address"
    action permit
    src-zone "FWS_LAN"
    src-addr "FWS_LAN_net"
    dst-ip 198.51.100.10/32
    service "FWS_tcp-443"
  exit
  rule id 10018
    name "FWS_No_other_private_network_from_the_LAN"
    action deny
    src-zone "FWS_LAN"
    src-addr "FWS_LAN_net"
    dst-addr "FWS_Private"
    dst-ip 198.51.100.10/32
    service "Any"
  exit
  rule id 10019
    name "FWS_Default_allow_LAN_to_any_rule"
    action permit
    src-zone "FWS_LAN"
    src-addr "FWS_LAN_net"
    dst-addr "Any"
    service "Any"
  exit
  rule id 10020
    name "FWS_Default_allow_LAN_IPv6_to_any_rule_v6"
    action permit
    src-zone "FWS_LAN"
    src-addr "FWS_LAN_net_IPv6_v6"
    dst-addr "IPv6-any"
    service "Any"
  exit
  rule id 10021
    name "FWS_Servers_fetch_their_updates"
    action permit
    src-zone "FWS_DMZ"
    src-addr "FWS_DmzServers_IPv4"
    dst-addr "FWS_Updates"
    service "FWS_WebPorts"
  exit
  rule id 10022
    disable
    name "FWS_Mail_out__not_to_the_inside"
    action permit
    src-zone "FWS_DMZ"
    src-ip 192.168.20.25/32
    dst-addr "FWS_not-Private"
    service "FWS_tcp-25"
  exit
  rule id 10023
    disable
    name "FWS_Syslog_to_the_collector"
    action permit
    src-zone "FWS_DMZ"
    src-addr "FWS_DMZ_net"
    dst-ip 192.168.10.5/32
    service "FWS_udp-514"
  exit
  rule id 10024
    disable
    name "FWS_Nothing_from_the_list"
    action deny
    src-zone "FWS_DMZ"
    src-ip 0.0.0.0/32
    dst-addr "Any"
    service "Any"
  exit
  rule id 10025
    disable
    name "FWS_Tunnel_of_the_old_application"
    action permit
    src-zone "FWS_DMZ"
    src-ip 192.168.20.70/32
    dst-ip 203.0.113.7/32
    service "FWS_esp"
  exit
  rule id 10026
    name "FWS_Guests_reach_nothing_private"
    action deny
    src-zone "FWS_GUEST"
    src-addr "FWS_GUEST_net"
    dst-addr "FWS_Private"
    dst-ip 198.51.100.10/32
    service "Any"
    log session-start
    log policy-deny
  exit
  rule id 10027
    name "FWS_Guests_browse"
    action permit
    src-zone "FWS_GUEST"
    src-addr "FWS_GUEST_net"
    dst-addr "Any"
    service "FWS_WebPorts"
  exit
  rule id 10028
    disable
    name "FWS_Phones_of_the_guests"
    action permit
    src-zone "FWS_GUEST"
    src-addr "FWS_GUEST_net"
    dst-ip 203.0.113.40/32
    service "FWS_udp-5060-5061"
  exit
  rule id 10029
    name "FWS_Telnet_unless_a_rule_says_otherwise"
    action deny
    src-addr "Any"
    dst-addr "Any"
    service "FWS_tcp-23"
    log session-start
    log policy-deny
  exit
exit
ip vrouter "trust-vr"
  dnatrule id 10000 from "Any" to "FWS_nat-Web_server_HTTPS-to" service "FWS_tcp-443" trans-to "FWS_nat-Web_server_HTTPS-dnat"
  dnatrule id 10001 from "FWS_nat-SSH_for_the_partner-from" to "FWS_WAN_address" service "FWS_tcp-2222" trans-to "FWS_nat-SSH_for_the_partner-dnat" port 22
  dnatrule id 10002 from "Any" to "FWS_nat-Mail_server_-_inbound-to" service "Any" trans-to "FWS_nat-SSH_for_the_partner-dnat"
  snatrule id 10000 from "FWS_nat-SSH_for_the_partner-dnat" to "Any" service "Any" eif wan trans-to address-book "FWS_nat-Mail_server_-_inbound-to" mode static
  snatrule id 10001 from "FWS_nat-DMZ_leaves_with_the_web_address-from" to "Any" service "Any" eif wan trans-to address-book "FWS_nat-Web_server_HTTPS-to" mode dynamicport
  dnatrule id 10003 from "FWS_nat-No_NAT_towards_the_partner-from" to "FWS_nat-SSH_for_the_partner-from" service "Any" no-trans
  snatrule id 10002 from "FWS_nat-No_NAT_towards_the_partner-from" to "FWS_nat-SSH_for_the_partner-from" service "Any" no-trans
  snatrule id 10003 from "FWS_nat-Automatic_outbound_NAT_on_WAN-from" to "Any" service "Any" eif wan trans-to eif-ip mode dynamicport
exit
end
