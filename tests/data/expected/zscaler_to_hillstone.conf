exit
service "FWS_ESP_PROTOCOL"
  protocol 50
exit
service "FWS_TCP_ANY"
  tcp dst-port 0 65535
exit
service "FWS_UDP_ANY"
  udp dst-port 0 65535
exit
service "FWS_HTTP"
  tcp dst-port 80
exit
