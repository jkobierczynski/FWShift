configure
service "FWS_tcp-443"
  tcp dst-port 443
exit
service "FWS_tcp-2222"
  tcp dst-port 2222
exit
service "FWS_tcp-23"
  tcp dst-port 23
exit
service "FWS_tcp-udp-53"
  tcp dst-port 53
  udp dst-port 53
exit
address "FWS_ipg-dns"
  ip 10.10.8.8/31
exit
service "FWS_tcp-22"
  tcp dst-port 22
exit
service "FWS_tcp-1433"
  tcp dst-port 1433
exit
service "FWS_udp-123"
  udp dst-port 123
exit
address "FWS_ipg-servers"
  ip 10.10.1.0/24
  range 10.10.2.10 10.10.2.20
exit
address "FWS_time.example.org"
  host "time.example.org"
exit
service "FWS_tcp-8000-8080_9000"
  tcp dst-port 8000 8080
  tcp dst-port 9000
exit
address "FWS__.example.com"
  host "*.example.com"
exit
address "FWS_updates.example.net"
  host "updates.example.net"
exit
service "FWS_tcp-80_443"
  tcp dst-port 80
  tcp dst-port 443
exit
address "FWS_nat-dnat-web_web-https-to"
  ip 203.0.113.10/32
exit
address "FWS_nat-dnat-web_web-https-dnat"
  ip 10.10.1.4/32
exit
address "FWS_nat-dnat-web_ssh-admin-from"
  ip 198.51.100.0/24
exit
address "FWS_nat-dnat-web_ssh-admin-dnat"
  ip 10.10.1.5/32
exit
policy-global
  rule id 10000
    name "FWS_dnat-web_web-https__DNAT_"
    action permit
    src-addr "Any"
    dst-ip 203.0.113.10/32
    service "FWS_tcp-443"
  exit
  rule id 10001
    name "FWS_dnat-web_ssh-admin__DNAT_"
    action permit
    src-ip 198.51.100.0/24
    dst-ip 203.0.113.10/32
    service "FWS_tcp-2222"
    description "Admin SSH on a high port"
  exit
  rule id 10002
    name "FWS_base-deny_deny-telnet"
    action deny
    src-addr "Any"
    dst-addr "Any"
    service "FWS_tcp-23"
    description "Telnet nowhere"
  exit
  rule id 10003
    name "FWS_base-allow-dns_dns-out"
    action permit
    src-ip 10.10.0.0/16
    dst-addr "FWS_ipg-dns"
    service "FWS_tcp-udp-53"
  exit
  rule id 10004
    name "FWS_net-partner_every-protocol-to-partner"
    action permit
    src-ip 10.10.4.0/24
    dst-ip 192.0.2.0/24
    service "Any"
  exit
  rule id 10005
    name "FWS_net-partner_dns-any-protocol"
    action permit
    src-ip 10.10.0.0/16
    dst-ip 10.10.8.53/32
    service "FWS_tcp-udp-53"
  exit
  rule id 10006
    disable
    name "FWS_net-partner_v6-ssh"
    action permit
    src-ip 0.0.0.0/32
    dst-ip 10.10.5.0/24
    service "FWS_tcp-22"
  exit
  rule id 10007
    name "FWS_net-allow-web_web-to-db"
    action permit
    src-ip 10.10.1.0/24
    dst-ip 10.10.2.0/24
    service "FWS_tcp-1433"
  exit
  rule id 10008
    name "FWS_net-allow-web_icmp-mgmt"
    action permit
    src-ip 10.10.9.0/24
    dst-ip 10.10.0.0/16
    service "ICMP"
  exit
  rule id 10009
    name "FWS_net-allow-web_ntp-out"
    action permit
    src-addr "FWS_ipg-servers"
    dst-addr "FWS_time.example.org"
    service "FWS_udp-123"
  exit
  rule id 10010
    disable
    name "FWS_net-allow-web_storage"
    action permit
    src-ip 10.10.0.0/16
    dst-ip 0.0.0.0/32
    service "FWS_tcp-443"
  exit
  rule id 10011
    name "FWS_net-allow-web_app-ports"
    action permit
    src-range 10.10.1.10 10.10.1.20
    dst-ip 10.10.3.0/24
    service "FWS_tcp-8000-8080_9000"
  exit
  rule id 10012
    disable
    name "FWS_net-allow-web_partner-sftp"
    action permit
    src-ip 0.0.0.0/32
    dst-ip 10.10.1.6/32
    service "FWS_tcp-22"
  exit
  rule id 10013
    name "FWS_net-deny-lateral_block-lateral"
    action deny
    src-ip 10.10.0.0/16
    dst-ip 10.10.0.0/16
    service "Any"
  exit
  rule id 10014
    disable
    name "FWS_app-out_allow-updates"
    action permit
    src-ip 10.10.1.0/24
    dst-addr "FWS__.example.com"
    dst-addr "FWS_updates.example.net"
    service "FWS_tcp-443"
  exit
  rule id 10015
    disable
    name "FWS_app-out_allow-wsus"
    action permit
    src-addr "FWS_ipg-servers"
    dst-addr "Any"
    service "FWS_tcp-80_443"
  exit
  rule id 10016
    disable
    name "FWS_app-deny_no-gambling"
    action deny
    src-addr "Any"
    dst-addr "Any"
    service "FWS_tcp-80_443"
  exit
exit
ip vrouter "trust-vr"
  dnatrule id 10000 from "Any" to "FWS_nat-dnat-web_web-https-to" service "FWS_tcp-443" trans-to "FWS_nat-dnat-web_web-https-dnat"
  dnatrule id 10001 from "FWS_nat-dnat-web_ssh-admin-from" to "FWS_nat-dnat-web_web-https-to" service "FWS_tcp-2222" trans-to "FWS_nat-dnat-web_ssh-admin-dnat" port 22
exit
end
