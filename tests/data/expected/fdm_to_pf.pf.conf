# Generated by FWShift - review the conversion report before loading this.
# A ruleset for the pf anchor "fwshift" (OpenBSD; FreeBSD 15 and later). Check it with
# 'pfctl -vnf FILE -a fwshift', load it with 'pfctl -a fwshift -f FILE': nothing outside the anchor changes.
# The main ruleset decides where the anchor is evaluated: it needs a line 'anchor "fwshift"'.

# The interface (or interface group) of each zone.
fws_if_outside_zone = "outside_zone"
fws_if_inside_zone = "inside_zone"
fws_if_iot = "iot"

# Tables.
table <fws_office_devices> const { 10.40.0.10 10.40.0.200/29 10.40.0.208/29 10.40.0.216/30 10.40.0.220 }

# What arrives on the interface of a zone is marked with the zone.
match in on $fws_if_outside_zone tag fws_outside_zone
match in on $fws_if_inside_zone tag fws_inside_zone
match in on $fws_if_iot tag fws_iot

# Destination NAT, first match, and what the rules may allow is let in: they decide when it leaves.
pass in quick on $fws_if_outside_zone inet proto tcp from any to 192.0.2.2 port 8443 rdr-to 10.40.0.10 port 5001 label "NAS_published"
pass in quick on { $fws_if_outside_zone $fws_if_inside_zone $fws_if_iot } from any to 192.0.2.10 rdr-to 10.40.0.10 label "nas_static inbound"
pass in quick on $fws_if_inside_zone proto tcp from 10.40.0.0/24 to ! self port { 80 443 } label "Inside_Outside_web"
pass in quick on $fws_if_inside_zone proto udp from 10.40.0.0/24 to ! self port 53 label "Inside_Outside_web"
pass in quick on $fws_if_inside_zone proto tcp from 10.41.0.0/24 to telemetry.example.net port 443 label "IoT_telemetry"
pass in quick on $fws_if_outside_zone proto tcp from any to 10.40.0.10 port 5001 label "NAS_from_Internet"
pass in quick on $fws_if_outside_zone proto tcp from 2001:db8:1::/48 to <fws_office_devices> port 3389 label "Head_office_v6"
pass in quick on $fws_if_outside_zone proto 47 from 2001:db8:1::/48 to <fws_office_devices> label "Head_office_v6"
pass in quick on $fws_if_outside_zone proto udp from any port 53 to ! self port 1024:65535 label "DNS_answers"

# The rules, first match, when the traffic leaves: the tag says the zone it came from.
block drop out log quick on $fws_if_inside_zone from 10.41.0.0/24 to 10.40.0.0/24 tagged fws_inside_zone label "Block_IoT_to_office"
match out on $fws_if_outside_zone proto tcp from 10.40.0.0/24 to any port { 80 443 } tagged fws_inside_zone tag fws_ok_inside_zone label "Inside_Outside_web"
match out on $fws_if_outside_zone proto udp from 10.40.0.0/24 to any port 53 tagged fws_inside_zone tag fws_ok_inside_zone label "Inside_Outside_web"
match out on $fws_if_outside_zone proto tcp from 10.41.0.0/24 to telemetry.example.net port 443 tagged fws_inside_zone tag fws_ok_inside_zone label "IoT_telemetry"
match out on $fws_if_inside_zone proto tcp from any to 10.40.0.10 port 5001 tagged fws_outside_zone tag fws_ok_outside_zone label "NAS_from_Internet"
match out proto tcp from 2001:db8:1::/48 to <fws_office_devices> port 3389 tagged fws_outside_zone tag fws_ok_outside_zone label "Head_office_v6"
match out proto 47 from 2001:db8:1::/48 to <fws_office_devices> tagged fws_outside_zone tag fws_ok_outside_zone label "Head_office_v6"
match out on $fws_if_inside_zone proto udp from any port 53 to any port 1024:65535 tagged fws_outside_zone tag fws_ok_outside_zone label "DNS_answers"
# FWSHIFT disabled, see the report: "Staff_streaming" from inside_zone to outside_zone; source any; destination any; service any; action drop
# FWSHIFT disabled, see the report: "Guests_by_time" from inside_zone to outside_zone; source printers; destination any; service port-unreachable; action allow

# What no rule decided: the default of the source.
block drop out quick tagged fws_outside_zone
block drop out quick tagged fws_inside_zone
block drop out quick tagged fws_iot

# Source NAT, first match, of what the rules allowed.
match out on $fws_if_outside_zone inet from 10.40.0.10 to any tagged fws_ok_inside_zone nat-to 192.0.2.10 static-port tag fws_nat label "nas_static"
match out on $fws_if_outside_zone inet from any to any tagged fws_ok_inside_zone nat-to ($fws_if_outside_zone) tag fws_nat label "InsideOutsideNatRule"
# disabled in the source: match out on $fws_if_outside_zone inet from 10.41.0.0/24 to any tagged fws_ok_iot nat-to ($fws_if_outside_zone) tag fws_nat label "IoT_out"

# Pass what the rules allowed.
pass out quick tagged fws_ok_outside_zone
pass out quick tagged fws_ok_inside_zone
pass out quick tagged fws_ok_iot
pass out quick tagged fws_nat
