match out on $fws_if_untrust proto udp from 10.30.0.0/24 to any port 53 tagged fws_lab tag fws_ok_lab label "lab-out"
match out on $fws_if_dmz inet proto icmp from any to any tagged fws_trust tag fws_ok_trust label "ping-dmz"
match out on $fws_if_untrust from 2001:db8:10::/64 to any tagged fws_trust tag fws_ok_trust label "ipv6-out"
# FWSHIFT disabled, see the report: "video" from trust to untrust; source any; destination any; service any; action deny
