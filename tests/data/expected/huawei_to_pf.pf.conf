match out on $fws_if_trust from any to any tagged fws_trust tag fws_ok_trust label "intrazone default"
match out on $fws_if_untrust from any to any tagged fws_untrust tag fws_ok_untrust label "intrazone default"
match out on $fws_if_dmz from any to any tagged fws_dmz tag fws_ok_dmz label "intrazone default"
match out on $fws_if_lab from any to any tagged fws_lab tag fws_ok_lab label "intrazone default"

# What no rule decided: the default of the source.
block drop out quick tagged fws_trust
block drop out quick tagged fws_untrust
block drop out quick tagged fws_dmz
block drop out quick tagged fws_lab

# Source NAT, first match, of what the rules allowed.
match out inet from 10.20.0.25 to any tagged fws_ok_trust nat-to 203.0.113.6 static-port tag fws_nat label "nat-server-mail"
match out inet from 10.20.0.25 to any tagged fws_ok_untrust nat-to 203.0.113.6 static-port tag fws_nat label "nat-server-mail"
match out inet from 10.20.0.25 to any tagged fws_ok_dmz nat-to 203.0.113.6 static-port tag fws_nat label "nat-server-mail"
match out inet from 10.20.0.25 to any tagged fws_ok_lab nat-to 203.0.113.6 static-port tag fws_nat label "nat-server-mail"
match out on $fws_if_untrust inet from any to 192.0.2.0/24 tagged fws_ok_trust tag fws_nat label "no-nat-vpn"
match out on $fws_if_untrust inet from 10.10.0.0/24 to any tagged fws_ok_trust nat-to 203.0.113.4/31 tag fws_nat label "office-pat"
match out on $fws_if_untrust inet from 10.30.0.0/24 to any tagged fws_ok_lab nat-to ($fws_if_untrust) tag fws_nat label "lab-easy-ip"

# Pass what the rules allowed.
pass out quick tagged fws_ok_trust
pass out quick tagged fws_ok_untrust
pass out quick tagged fws_ok_dmz
pass out quick tagged fws_ok_lab
pass out quick tagged fws_nat
