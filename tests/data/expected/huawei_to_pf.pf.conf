pass in quick on { $fws_if_trust $fws_if_untrust $fws_if_dmz $fws_if_lab } from any to 203.0.113.6 rdr-to 10.20.0.25 label "nat-server-mail inbound"
pass in quick on $fws_if_untrust proto tcp from any to 10.20.0.10/31 port { 80 443 } label "web-in"
pass in quick on $fws_if_untrust proto tcp from any to 10.20.0.25 port 25 label "mail-in"
pass in quick on $fws_if_trust proto tcp from <fws_office_out_src> to ! self port { 80 443 53 } label "office-out"
pass in quick on $fws_if_trust proto udp from <fws_office_out_src> to ! self port { 53 123 } label "office-out"
pass in quick on $fws_if_trust proto tcp from <fws_office_lan> to <fws_dmz_servers> port { 80 443 25 8080 8443 } label "office-dmz"
pass in quick on $fws_if_trust proto tcp from 10.10.0.50/31 to ! self port 22 label "admin-ssh"
pass in quick on $fws_if_dmz proto udp from any to 10.10.0.60 port 514 label "dmz-syslog"
pass in quick on $fws_if_lab proto tcp from 10.30.0.0/24 to ! self port 443 label "lab-out"
pass in quick on $fws_if_lab proto udp from 10.30.0.0/24 to ! self port 53 label "lab-out"
pass in quick on $fws_if_trust inet proto icmp from any to ! self label "ping-dmz"
pass in quick on $fws_if_trust from 2001:db8:10::/64 to ! self label "ipv6-out"
pass in quick on { $fws_if_trust $fws_if_untrust $fws_if_dmz $fws_if_lab } from any to ! self label "intrazone default"

# The rules, first match, when the traffic leaves: the tag says the zone it came from.
block return out quick from 198.51.100.0/24 to any tagged fws_untrust label "block-bad-nets"
match out on $fws_if_dmz proto tcp from any to 10.20.0.10/31 port { 80 443 } tagged fws_untrust tag fws_ok_untrust label "web-in"
match out on $fws_if_dmz proto tcp from any to 10.20.0.25 port 25 tagged fws_untrust tag fws_ok_untrust label "mail-in"
match out on $fws_if_untrust proto tcp from <fws_office_out_src> to any port { 80 443 53 } tagged fws_trust tag fws_ok_trust label "office-out"
match out on $fws_if_untrust proto udp from <fws_office_out_src> to any port { 53 123 } tagged fws_trust tag fws_ok_trust label "office-out"
match out on $fws_if_dmz proto tcp from <fws_office_lan> to <fws_dmz_servers> port { 80 443 25 8080 8443 } tagged fws_trust tag fws_ok_trust label "office-dmz"
match out on { $fws_if_dmz $fws_if_lab } proto tcp from 10.10.0.50/31 to any port 22 tagged fws_trust tag fws_ok_trust label "admin-ssh"
match out on $fws_if_trust proto udp from any to 10.10.0.60 port 514 tagged fws_dmz tag fws_ok_dmz label "dmz-syslog"
# FWSHIFT disabled, see the report: "lab-tools" from trust to lab; source 10.10.0.0/24; destination lab-net; service lab-all; action allow
