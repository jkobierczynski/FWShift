# The interface (or interface group) of each zone.
fws_if_trust = "trust"
fws_if_untrust = "untrust"
fws_if_dmz = "dmz"
fws_if_lab = "lab"

# Tables.
table <fws_office_out_src> const { 10.10.0.0/25 10.10.0.128/26 10.10.0.192/29 10.10.0.221 10.10.0.222/31 10.10.0.224/27 2001:db8:10::/64 }
