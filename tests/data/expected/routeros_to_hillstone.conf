configure
zone "FWS_DMZ"
  description "DMZ"
exit
zone "FWS_LAN"
  description "LAN"
exit
zone "FWS_GUEST"
  description "GUEST"
exit
zone "FWS_WAN"
  description "WAN"
exit
service "FWS_tcp-22"
  tcp dst-port 22
exit
address "FWS_admins"
  range 192.168.10.50 192.168.10.59
exit
address "FWS_dmz-web"
  ip 172.16.20.10/31
exit
service "FWS_tcp-80_443_8000-8080"
  tcp dst-port 80
  tcp dst-port 443
  tcp dst-port 8000 8080
exit
address "FWS_not-admins"
  range 0.0.0.0 192.168.10.49
  range 192.168.10.60 255.255.255.255
exit
service "FWS_icmp-8-0"
  icmp type 8 code 0 0
exit
address "FWS_partners"
  ip 198.51.100.0/24
exit
service "FWS_tcp-0-21_23-65535"
  tcp dst-port 0 21
  tcp dst-port 23 65535
exit
address "FWS_not-172.16.20.0_25"
  range 0.0.0.0 172.16.19.255
  range 172.16.20.128 255.255.255.255
exit
service "FWS_tcp-80_443"
  tcp dst-port 80
  tcp dst-port 443
exit
address "FWS_mirrors"
  ip 192.0.2.80/32
  host "updates.example.com"
exit
service "FWS_udp-53"
  udp dst-port 53
exit
service "FWS_udp-any-from-53"
  udp dst-port 0 65535 src-port 53
exit
service "FWS_tcp-8443"
  tcp dst-port 8443
exit
service "FWS_tcp-25"
  tcp dst-port 25
exit
service "FWS_tcp-443"
  tcp dst-port 443
exit
address "FWS_partners-ipv6_v6" ipv6
  ip 2001:db8:99::/48
exit
address "FWS_lan6_v6" ipv6
  ip 2001:db8:10::/64
exit
address "FWS_nat-publish_web-to"
  ip 203.0.113.3/32
exit
address "FWS_nat-publish_web-dnat"
  ip 172.16.20.10/32
exit
address "FWS_nat-publish_mail-to"
  ip 203.0.113.4/32
exit
address "FWS_nat-publish_mail-dnat"
  ip 172.16.20.11/32
exit
policy-global
  rule id 10000
    disable
    name "FWS_defconf__accept_in_ipsec_policy"
    action permit
    src-addr "Any"
    dst-addr "Any"
    service "Any"
  exit
  rule id 10001
    disable
    name "FWS_banned_scanners"
    action deny
    src-addr "Any"
    dst-addr "Any"
    service "Any"
  exit
  rule id 10002
    name "FWS_ssh_from_the_admins"
    action permit
    dst-zone "FWS_DMZ"
    src-addr "FWS_admins"
    dst-addr "FWS_dmz-web"
    service "FWS_tcp-22"
  exit
  rule id 10003
    name "FWS_web_for_everyone"
    action permit
    dst-zone "FWS_DMZ"
    src-addr "FWS_admins"
    dst-addr "FWS_dmz-web"
    dst-ip 203.0.113.3/32
    service "FWS_tcp-80_443_8000-8080"
  exit
  rule id 10004
    name "FWS_web_for_everyone-2"
    action permit
    dst-zone "FWS_DMZ"
    src-addr "FWS_not-admins"
    dst-addr "FWS_dmz-web"
    dst-ip 203.0.113.3/32
    service "FWS_tcp-80_443_8000-8080"
    description "RouterOS /ip firewall filter rule forward-6.to-dmz-3"
  exit
  rule id 10005
    name "FWS_ping__echo__only"
    action permit
    dst-zone "FWS_DMZ"
    src-addr "FWS_admins"
    dst-addr "Any"
    service "FWS_icmp-8-0"
  exit
  rule id 10006
    name "FWS_ping__echo__only-2"
    action permit
    dst-zone "FWS_DMZ"
    src-addr "FWS_not-admins"
    dst-addr "Any"
    service "FWS_icmp-8-0"
    description "RouterOS /ip firewall filter rule forward-6.to-dmz-4"
  exit
  rule id 10007
    disable
    name "FWS_old_partner_access"
    action permit
    dst-zone "FWS_DMZ"
    src-addr "FWS_partners"
    dst-addr "Any"
    service "Any"
  exit
  rule id 10008
    disable
    name "FWS_old_partner_access-2"
    action permit
    dst-zone "FWS_DMZ"
    src-addr "FWS_partners"
    dst-addr "Any"
    service "FWS_tcp-0-21_23-65535"
    description "RouterOS /ip firewall filter rule forward-6.to-dmz-5"
  exit
  rule id 10009
    disable
    name "FWS_nothing_but_TCP"
    action deny
    dst-zone "FWS_DMZ"
    src-addr "FWS_admins"
    dst-addr "Any"
    service "Any"
  exit
  rule id 10010
    disable
    name "FWS_nothing_but_TCP-2"
    action deny
    dst-zone "FWS_DMZ"
    src-addr "FWS_not-admins"
    dst-addr "Any"
    service "Any"
    description "RouterOS /ip firewall filter rule forward-6.to-dmz-6"
  exit
  rule id 10011
    disable
    name "FWS_rest_of_the_DMZ"
    action deny
    dst-zone "FWS_DMZ"
    src-addr "FWS_admins"
    dst-addr "FWS_not-172.16.20.0_25"
    service "Any"
  exit
  rule id 10012
    disable
    name "FWS_rest_of_the_DMZ-2"
    action deny
    dst-zone "FWS_DMZ"
    src-range 0.0.0.0 192.168.10.49
    src-range 192.168.10.60 255.255.255.255
    dst-addr "FWS_not-172.16.20.0_25"
    service "Any"
    description "RouterOS /ip firewall filter rule forward-6.to-dmz-7"
  exit
  rule id 10013
    disable
    name "FWS_rest_of_the_DMZ-3"
    action deny
    dst-zone "FWS_DMZ"
    src-range 0.0.0.0 192.168.10.49
    src-range 192.168.10.60 255.255.255.255
    dst-addr "FWS_not-172.16.20.0_25"
    service "FWS_tcp-0-21_23-65535"
    description "RouterOS /ip firewall filter rule forward-6.to-dmz-7"
  exit
  rule id 10014
    name "FWS_LAN_to_the_package_mirrors"
    action permit
    src-zone "FWS_LAN"
    src-addr "Any"
    dst-addr "FWS_mirrors"
    service "FWS_tcp-80_443"
  exit
  rule id 10015
    name "FWS_no_other_web_from_guests"
    action deny
    src-zone "FWS_GUEST"
    src-addr "Any"
    dst-addr "Any"
    service "FWS_tcp-80_443"
  exit
  rule id 10016
    name "FWS_guest_DNS__either_port"
    action permit
    src-zone "FWS_GUEST"
    dst-zone "FWS_WAN"
    src-addr "Any"
    dst-addr "Any"
    service "FWS_udp-53"
  exit
  rule id 10017
    name "FWS_guest_DNS__either_port-2"
    action permit
    src-zone "FWS_GUEST"
    dst-zone "FWS_WAN"
    src-addr "Any"
    dst-addr "Any"
    service "FWS_udp-any-from-53"
    description "RouterOS /ip firewall filter rule forward-9"
  exit
  rule id 10018
    name "FWS_guests_to_the_internet"
    action permit
    src-zone "FWS_GUEST"
    dst-zone "FWS_WAN"
    src-addr "Any"
    dst-addr "Any"
    service "Any"
    log session-start
    log session-end
  exit
  rule id 10019
    disable
    name "FWS_office_hours_for_staff"
    action permit
    src-zone "FWS_LAN"
    dst-zone "FWS_WAN"
    src-ip 192.168.10.0/25
    dst-addr "Any"
    service "Any"
  exit
  rule id 10020
    name "FWS_no_guests_elsewhere"
    action deny
    src-zone "FWS_GUEST"
    src-addr "Any"
    dst-addr "Any"
    service "Any"
    log session-start
    log policy-deny
  exit
  rule id 10021
    name "FWS_defconf__drop_all_from_WAN_not_DSTNATed__allows_publish_web"
    action permit
    src-zone "FWS_WAN"
    src-addr "Any"
    dst-ip 203.0.113.3/32
    service "FWS_tcp-8443"
    description "what RouterOS rule forward-15 does not block: connections that destination NAT rule dstnat-1 translates"
  exit
  rule id 10022
    name "FWS_defconf__drop_all_from_WAN_not_DSTNATed__allows_publish_mai"
    action permit
    src-zone "FWS_WAN"
    src-addr "Any"
    dst-ip 203.0.113.4/32
    service "FWS_tcp-25"
    description "what RouterOS rule forward-15 does not block: connections that destination NAT rule dstnat-2 translates"
  exit
  rule id 10023
    name "FWS_defconf__drop_all_from_WAN_not_DSTNATed"
    action deny
    src-zone "FWS_WAN"
    src-addr "Any"
    dst-addr "Any"
    service "Any"
  exit
  rule id 10024
    disable
    name "FWS_ICMPv6_echo_v6"
    action permit
    src-addr "IPv6-any"
    dst-addr "IPv6-any"
    service "Any"
  exit
  rule id 10025
    name "FWS_the_partners_reach_the_web_servers_of_the_LAN_by_HTTPS_and_"
    action permit
    src-addr "FWS_partners-ipv6_v6"
    dst-addr "FWS_lan6_v6"
    service "FWS_tcp-443"
  exit
  rule id 10026
    name "FWS_drop_everything_else_not_coming_from_LAN_v6_1"
    action deny
    src-zone "FWS_DMZ"
    src-addr "IPv6-any"
    dst-addr "IPv6-any"
    service "Any"
  exit
  rule id 10027
    name "FWS_drop_everything_else_not_coming_from_LAN_v6_2"
    action deny
    src-zone "FWS_GUEST"
    src-addr "IPv6-any"
    dst-addr "IPv6-any"
    service "Any"
  exit
  rule id 10028
    name "FWS_drop_everything_else_not_coming_from_LAN_v6_3"
    action deny
    src-zone "FWS_WAN"
    src-addr "IPv6-any"
    dst-addr "IPv6-any"
    service "Any"
  exit
  default-action permit
exit
ip vrouter "trust-vr"
  dnatrule id 10000 from "Any" to "FWS_nat-publish_web-to" service "FWS_tcp-8443" trans-to "FWS_nat-publish_web-dnat" port 443
  dnatrule id 10001 from "Any" to "FWS_nat-publish_mail-to" service "FWS_tcp-25" trans-to "FWS_nat-publish_mail-dnat"
  snatrule id 10000 from "Any" to "Any" service "Any" eif ether1 trans-to eif-ip mode dynamicport
exit
end
