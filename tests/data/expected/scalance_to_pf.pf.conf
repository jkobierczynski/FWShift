match in on $fws_if_vlan1 tag fws_vlan1
match in on $fws_if_vlan2 tag fws_vlan2
match in on $fws_if_vlan3 tag fws_vlan3
match in on $fws_if_ipsecALL tag fws_ipsecALL

# Destination NAT, first match, and what the rules may allow is let in: they decide when it leaves.
pass in quick on $fws_if_vlan2 inet proto tcp from any to 198.51.100.2 port 8443 rdr-to 192.168.30.10 port 443 label "napt 1"
pass in quick on $fws_if_vlan2 inet proto udp from any to 198.51.100.5 port 4840 rdr-to 192.168.10.20 label "napt 2"
