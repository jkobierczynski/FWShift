# The interface (or interface group) of each zone.
fws_if_vlan1 = "vlan1"
fws_if_vlan2 = "vlan2"
fws_if_vlan3 = "vlan3"
fws_if_ipsecALL = "ipsecALL"

# Tables.
table <fws_ipv4rule_3_src> const { 198.51.100.40/29 198.51.100.48/31 }

