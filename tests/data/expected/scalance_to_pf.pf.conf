pass in quick on $fws_if_vlan1 proto udp from 192.168.10.0/24 to 198.51.100.200 port 514 label "ipv4rule 4"
pass in quick on $fws_if_vlan2 proto tcp from 198.51.100.10 to 192.168.10.20 port 4840 label "ipv4rule 1"
pass in quick on $fws_if_vlan2 proto tcp from <fws_ipv4rule_3_src> to 192.168.10.30 port 502 label "ipv4rule 3"
pass in quick on $fws_if_vlan1 inet proto icmp from 192.168.10.0/24 to ! self icmp-type 8 code 0 label "ipv4rule 5"
pass in quick on $fws_if_vlan2 inet proto tcp from any to 192.168.30.10 port 443 label "ipv4rule 6"
pass in quick on $fws_if_vlan2 inet proto tcp from any port 1024:65535 to 192.168.30.64/30 port 8000:8100 label "ipv4rule 7"
pass in quick on $fws_if_vlan1 proto 47 from 192.168.10.0/24 to 192.168.30.0/24 label "ipv4rule 9"
pass in quick on $fws_if_ipsecALL proto tcp from 10.30.0.0/16 to 192.168.10.0/24 port 102 label "ipv4rule 13"
pass in quick on $fws_if_vlan3 inet proto icmp from 192.168.30.0/24 to ! self icmp-type 3 code 4 label "ipv4rule 15"
pass in quick on $fws_if_vlan2 proto tcp from 2001:db8:2::/64 to 2001:db8:1::10 port 4840 label "ipv6rule 1"
pass in quick on $fws_if_vlan1 inet6 proto icmp6 from 2001:db8:1::/64 to ! self icmp6-type 128 code 0 label "ipv6rule 2"
pass in quick on $fws_if_vlan1 from any to ! self label "default"
pass in quick on $fws_if_vlan2 from any to ! self label "default"
pass in quick on $fws_if_vlan3 from any to ! self label "default"
pass in quick on $fws_if_ipsecALL from any to ! self label "default"

# The rules, first match, when the traffic leaves: the tag says the zone it came from.
match out on $fws_if_vlan2 proto udp from 192.168.10.0/24 to 198.51.100.200 port 514 tagged fws_vlan1 tag fws_ok_vlan1 label "ipv4rule 4"
block drop out quick on $fws_if_vlan1 proto tcp from 198.51.100.0/24 to 192.168.10.0/24 port 102 tagged fws_vlan2 label "ipv4rule 2"
match out on $fws_if_vlan1 proto tcp from 198.51.100.10 to 192.168.10.20 port 4840 tagged fws_vlan2 tag fws_ok_vlan2 label "ipv4rule 1"
match out on $fws_if_vlan1 proto tcp from <fws_ipv4rule_3_src> to 192.168.10.30 port 502 tagged fws_vlan2 tag fws_ok_vlan2 label "ipv4rule 3"
match out on $fws_if_vlan2 inet proto icmp from 192.168.10.0/24 to any icmp-type 8 code 0 tagged fws_vlan1 tag fws_ok_vlan1 label "ipv4rule 5"
match out on $fws_if_vlan3 inet proto tcp from any to 192.168.30.10 port 443 tagged fws_vlan2 tag fws_ok_vlan2 label "ipv4rule 6"
match out on $fws_if_vlan3 inet proto tcp from any port 1024:65535 to 192.168.30.64/30 port 8000:8100 tagged fws_vlan2 tag fws_ok_vlan2 label "ipv4rule 7"
block return out quick on $fws_if_vlan1 from 192.168.30.0/24 to 192.168.10.0/24 tagged fws_vlan3 label "ipv4rule 8"
match out on $fws_if_vlan3 proto 47 from 192.168.10.0/24 to 192.168.30.0/24 tagged fws_vlan1 tag fws_ok_vlan1 label "ipv4rule 9"
# FWSHIFT disabled, see the report: "ipv4rule 11" from vlan2 to vlan1; source any; destination 192.168.10.40; service MODBUS; action allow
# FWSHIFT disabled, see the report: "ipv4rule 12" from vlan2 to vlan1; source 0.0.0.0/0; destination 192.168.10.50; service ENIP; action allow
match out on $fws_if_vlan1 proto tcp from 10.30.0.0/16 to 192.168.10.0/24 port 102 tagged fws_ipsecALL tag fws_ok_ipsecALL label "ipv4rule 13"
# FWSHIFT disabled, see the report: "ipv4rule 14" from vlan2 to vlan1; source 198.51.100.77; destination 192.168.10.60; service OPC-UA; action allow
match out on $fws_if_vlan2 inet proto icmp from 192.168.30.0/24 to any icmp-type 3 code 4 tagged fws_vlan3 tag fws_ok_vlan3 label "ipv4rule 15"
match out on $fws_if_vlan1 proto tcp from 2001:db8:2::/64 to 2001:db8:1::10 port 4840 tagged fws_vlan2 tag fws_ok_vlan2 label "ipv6rule 1"
match out on $fws_if_vlan2 inet6 proto icmp6 from 2001:db8:1::/64 to any icmp6-type 128 code 0 tagged fws_vlan1 tag fws_ok_vlan1 label "ipv6rule 2"

# What no rule decided: the default of the source.
match out on $fws_if_vlan1 tagged fws_vlan1 tag fws_ok_vlan1
block drop out quick tagged fws_vlan1
match out on $fws_if_vlan2 tagged fws_vlan2 tag fws_ok_vlan2
block drop out quick tagged fws_vlan2
match out on $fws_if_vlan3 tagged fws_vlan3 tag fws_ok_vlan3
block drop out quick tagged fws_vlan3
match out on $fws_if_ipsecALL tagged fws_ipsecALL tag fws_ok_ipsecALL
block drop out quick tagged fws_ipsecALL

# Source NAT, first match, of what the rules allowed.
match out on $fws_if_vlan2 inet from 192.168.10.0/24 to any tagged fws_ok_vlan1 nat-to 198.51.100.3 tag fws_nat label "src-nat 1"
match out on $fws_if_vlan2 inet from any to any tagged fws_ok_vlan1 nat-to ($fws_if_vlan2) tag fws_nat label "masquerading 1"
match out on $fws_if_vlan2 inet6 from any to any tagged fws_ok_vlan1 nat-to ($fws_if_vlan2) tag fws_nat label "masquerading 1"
match out on $fws_if_vlan2 inet from any to any tagged fws_ok_vlan2 nat-to ($fws_if_vlan2) tag fws_nat label "masquerading 1"
match out on $fws_if_vlan2 inet6 from any to any tagged fws_ok_vlan2 nat-to ($fws_if_vlan2) tag fws_nat label "masquerading 1"
match out on $fws_if_vlan2 inet from any to any tagged fws_ok_vlan3 nat-to ($fws_if_vlan2) tag fws_nat label "masquerading 1"
match out on $fws_if_vlan2 inet6 from any to any tagged fws_ok_vlan3 nat-to ($fws_if_vlan2) tag fws_nat label "masquerading 1"
match out on $fws_if_vlan2 inet from any to any tagged fws_ok_ipsecALL nat-to ($fws_if_vlan2) tag fws_nat label "masquerading 1"
match out on $fws_if_vlan2 inet6 from any to any tagged fws_ok_ipsecALL nat-to ($fws_if_vlan2) tag fws_nat label "masquerading 1"

# Pass what the rules allowed.
pass out quick tagged fws_ok_vlan1
pass out quick tagged fws_ok_vlan2
pass out quick tagged fws_ok_vlan3
pass out quick tagged fws_ok_ipsecALL
