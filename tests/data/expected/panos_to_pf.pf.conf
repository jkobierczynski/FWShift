# The interface (or interface group) of each zone.
fws_if_trust = "trust"
fws_if_untrust = "untrust"
fws_if_dmz = "dmz"
fws_if_ot = "ot"

# Tables.
table <fws_dmz_servers> const { 10.20.0.10 10.20.0.25 }
table <fws_dns_servers> const { 192.0.2.53 192.0.2.54 }
table <fws_App_Server_Ports_src> const { 10.10.0.0/16 2001:db8:10::/48 }
table <fws_all_servers> const { 10.20.0.10 10.20.0.25 192.0.2.53 192.0.2.54 }

# What arrives on the interface of a zone is marked with the zone.
match in on $fws_if_trust tag fws_trust
match in on $fws_if_untrust tag fws_untrust
match in on $fws_if_dmz tag fws_dmz
match in on $fws_if_ot tag fws_ot

# Destination NAT, first match, and what the rules may allow is let in: they decide when it leaves.
pass in quick on $fws_if_untrust inet proto tcp from any to 203.0.113.10 port 443 rdr-to 10.20.0.10 port 8443 label "Inbound-Web-DNAT"
pass in quick on { $fws_if_trust $fws_if_untrust $fws_if_dmz $fws_if_ot } from any to 203.0.113.25 rdr-to 10.20.0.25 label "Mail-Static inbound"
pass in quick on $fws_if_trust proto tcp from 10.10.0.0/16 to ! self port { 80 443 } label "Allow-Web-Out"
pass in quick on { $fws_if_trust $fws_if_dmz } proto { tcp udp } from any to <fws_dns_servers> port 53 label "Allow-DNS"
pass in quick on $fws_if_untrust proto tcp from any to 10.20.0.10 port 8443 label "Inbound-Web"
pass in quick on $fws_if_untrust proto tcp from any to 10.20.0.25 port 25 label "Inbound-Mail"
pass in quick on $fws_if_trust proto tcp from 10.10.7.15 to 10.30.1.0/24 port { 502 102 } label "Engineering to PLCs"
pass in quick on $fws_if_trust proto tcp from <fws_App_Server_Ports_src> to 10.20.0.10 port { 80 8080 443 8443 9000:9010 } label "App-Server-Ports"
pass in quick on $fws_if_trust inet proto icmp from ! 10.10.200.0/24 to <fws_all_servers> icmp-type 8 label "Not-From-Guests"
pass in quick on $fws_if_trust from any to ! self label "default"
pass in quick on $fws_if_untrust from any to ! self label "default"
pass in quick on $fws_if_dmz from any to ! self label "default"
pass in quick on $fws_if_ot from any to ! self label "default"

# The rules, first match, when the traffic leaves: the tag says the zone it came from.
match out on $fws_if_untrust proto tcp from 10.10.0.0/16 to any port { 80 443 } tagged fws_trust tag fws_ok_trust label "Allow-Web-Out"
match out on $fws_if_untrust proto { tcp udp } from any to <fws_dns_servers> port 53 tagged fws_trust tag fws_ok_trust label "Allow-DNS"
match out on $fws_if_untrust proto { tcp udp } from any to <fws_dns_servers> port 53 tagged fws_dmz tag fws_ok_dmz label "Allow-DNS"
match out log on $fws_if_dmz proto tcp from any to 10.20.0.10 port 8443 tagged fws_untrust tag fws_ok_untrust label "Inbound-Web"
match out on $fws_if_dmz proto tcp from any to 10.20.0.25 port 25 tagged fws_untrust tag fws_ok_untrust label "Inbound-Mail"
# FWSHIFT disabled, see the report: "Admin-SSH" from trust to dmz; source admin-range; destination dmz-servers; service application-default; action allow
match out on $fws_if_ot proto tcp from 10.10.7.15 to 10.30.1.0/24 port { 502 102 } tagged fws_trust tag fws_ok_trust label "Engineering to PLCs"
block return out quick on $fws_if_untrust from any to any tagged fws_ot label "Block-OT-Outbound"
# FWSHIFT disabled, see the report: "Block-Torrents" from trust to untrust; source any; destination any; service application-default; action deny
# FWSHIFT disabled, see the report: "Block-Region" from any to untrust; source any; destination KP,198.51.100.200; service any; action drop
match out on $fws_if_dmz proto tcp from <fws_App_Server_Ports_src> to 10.20.0.10 port { 80 8080 443 8443 9000:9010 } tagged fws_trust tag fws_ok_trust label "App-Server-Ports"
# FWSHIFT disabled, see the report: "Tagged-Servers-Updates" from dmz to untrust; source tagged-servers; destination updates.example.com; service application-default; action allow
match out on $fws_if_dmz inet proto icmp from ! 10.10.200.0/24 to <fws_all_servers> icmp-type 8 tagged fws_trust tag fws_ok_trust label "Not-From-Guests"
block return out quick on $fws_if_dmz from any to any tagged fws_dmz label "DMZ-Intrazone"
# FWSHIFT disabled, see the report: "Old-Rule" from trust to untrust; source odd-hosts; destination any; service udp-syslog-src; action allow

# What no rule decided: the default of the source.
match out on $fws_if_trust tagged fws_trust tag fws_ok_trust
block drop out quick tagged fws_trust
match out on $fws_if_untrust tagged fws_untrust tag fws_ok_untrust
block drop out quick tagged fws_untrust
match out on $fws_if_dmz tagged fws_dmz tag fws_ok_dmz
block drop out quick tagged fws_dmz
match out on $fws_if_ot tagged fws_ot tag fws_ok_ot
block drop out quick tagged fws_ot

# Source NAT, first match, of what the rules allowed.
match out on $fws_if_untrust inet from 10.10.0.0/16 to 10.99.0.0/16 tagged fws_ok_trust tag fws_nat label "No-NAT-Partner"
match out on $fws_if_untrust inet from 10.20.0.25 to any tagged fws_ok_dmz nat-to 203.0.113.25 static-port tag fws_nat label "Mail-Static"
match out on $fws_if_untrust inet from <fws_dmz_servers> to any tagged fws_ok_dmz nat-to 198.51.100.20/30 tag fws_nat label "DMZ-Out-Pool"
match out on $fws_if_untrust inet from any to any tagged fws_ok_trust nat-to ($fws_if_untrust) tag fws_nat label "Outbound-PAT"
match out on $fws_if_untrust inet6 from any to any tagged fws_ok_trust nat-to ($fws_if_untrust) tag fws_nat label "Outbound-PAT"

# Pass what the rules allowed.
pass out quick tagged fws_ok_trust
pass out quick tagged fws_ok_untrust
pass out quick tagged fws_ok_dmz
pass out quick tagged fws_ok_ot
pass out quick tagged fws_nat
