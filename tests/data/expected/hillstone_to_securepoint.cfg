# Securepoint UTM: commands of its CLI (spcli), written by FWShift. They add network objects, services and the
# rule group 'fwshift' with its rules, and delete nothing. Lines that start with '#' are not commands: leave them
# out when loading (grep -v '^#'). Nothing applies until 'system update rule', nothing is kept over a restart until
# 'system config save': run both yourself after reading the report (section 10 of the manual).
service new name "PING" proto "icmp" icmp-types [ "8" ]
node new name "net-0.0.0.0_0" address "0.0.0.0/0" zone "trust"
service new name "HTTP" proto "tcp" dst-ports [ "80" ] src-ports [ ]
service new name "HTTPS" proto "tcp" dst-ports [ "443" ] src-ports [ ]
service new name "tcp-8080" proto "tcp" dst-ports [ "8080" ] src-ports [ ]
service new name "DNS-tcp-53" proto "tcp" dst-ports [ "53" ] src-ports [ ]
service new name "DNS-udp-53" proto "udp" dst-ports [ "53" ] src-ports [ ]
service group new name "inside-to-web" services [ "HTTP" "HTTPS" "tcp-8080" "DNS-tcp-53" "DNS-udp-53" ]
node new name "inside-net" address "10.10.0.0/24" zone "trust"
node new name "net-0.0.0.0_0-untrust" address "0.0.0.0/0" zone "untrust"
node new name "pub-web" address "203.0.113.10/32" zone "dmz"
node new name "net-0.0.0.0_0-lab" address "0.0.0.0/0" zone "lab"
service new name "SSH" proto "tcp" dst-ports [ "22" ] src-ports [ ]
service group new name "inside-to-servers" services [ "HTTP" "HTTPS" "tcp-8080" "SSH" "PING" ]
node new name "net-10.10.0.0_25" address "10.10.0.0/25" zone "trust"
node new name "net-10.10.0.128_26" address "10.10.0.128/26" zone "trust"
node new name "net-10.10.0.192_29" address "10.10.0.192/29" zone "trust"
node new name "net-10.10.0.210_31" address "10.10.0.210/31" zone "trust"
node new name "net-10.10.0.212_30" address "10.10.0.212/30" zone "trust"
node new name "net-10.10.0.216_29" address "10.10.0.216/29" zone "trust"
node new name "net-10.10.0.224_27" address "10.10.0.224/27" zone "trust"
node group new name "inside-no-printers" nodes [ "net-10.10.0.0_25" "net-10.10.0.128_26" "net-10.10.0.192_29" "net-10.10.0.210_31" "net-10.10.0.212_30" "net-10.10.0.216_29" "net-10.10.0.224_27" ]
node new name "net-10.20.0.40_31" address "10.20.0.40/31" zone "dmz"
node new name "web-srv" address "10.20.0.10/32" zone "dmz"
node new name "mail-srv" address "10.20.0.25/32" zone "dmz"
node group new name "servers" nodes [ "net-10.20.0.40_31" "web-srv" "mail-srv" ]
service group new name "v6-out" services [ "HTTPS" "PING" ]
node new name "v6-inside" address "2001:db8:10::/64" zone "trust"
node new name "net-___0" address "::/0" zone "untrust"
node group new name "any-untrust" nodes [ "net-0.0.0.0_0-untrust" "net-___0" ]
node new name "inside-net-untrust" address "10.10.0.0/24" zone "untrust"
node new name "inside-net-dmz" address "10.10.0.0/24" zone "dmz"
node new name "inside-net-lab" address "10.10.0.0/24" zone "lab"
rule group new name "fwshift"
rule new group "fwshift" src "net-0.0.0.0_0" dst "net-0.0.0.0_0" service "PING" comment "inside-ping" flags [ "ACCEPT" ]
rule new group "fwshift" src "inside-net" dst "net-0.0.0.0_0-untrust" service "inside-to-web" comment "inside-to-web" flags [ "ACCEPT" "LOG_ALL" ]
rule new group "fwshift" src "net-0.0.0.0_0-untrust" dst "pub-web" service "HTTP" comment "publish-web" flags [ "ACCEPT" ]
# not written: block-country (references 'blocked-country': address entry blocked-country: country XX, which the configuration does not resolve to addresses)
rule new group "fwshift" src "net-0.0.0.0_0-lab" dst "net-0.0.0.0_0" service "any" comment "lab-to-inside" flags [ "REJECT" "LOG_ALL" ]
rule new group "fwshift" src "inside-no-printers" dst "servers" service "inside-to-servers" comment "inside-to-servers" flags [ "ACCEPT" ]
# not written: lab-updates (the destination holds host name 'updates.example.com'; that a network object of the UTM takes a host name is not documented)
# not written: app-clients (schedule 'office-hours' is not converted; the rule would apply at all times; the destination holds host name 'files.example.org'; that a network object of the UTM takes a host name is not documented)
# not written: p2p (not converted: application BitTorrent: application identification narrows the match)
rule new group "fwshift" src "v6-inside" dst "net-___0" service "v6-out" comment "v6-out" flags [ "ACCEPT" ]
# not written: tunnels-to-partners (the destination holds host name 'partner.example.net'; that a network object of the UTM takes a host name is not documented)
# not written: to-branch-vpn (not converted: action tunnel vpn-to-branch: traffic of a VPN tunnel only)
# not written: contractors-out (references 'wild-hosts': address entry wild-hosts: wildcard address '10.10.0.5 0.0.255.0'; source user match role contractors is not converted)
rule new group "fwshift" src "inside-net" dst "net-0.0.0.0_0-lab" service "any" comment "rule 13" flags [ "ACCEPT" ]
rule new group "fwshift" src "inside-net" dst "any-untrust" service "any" comment "snatrule 2" flags [ "DROP" "HIDENAT" ] nat_node "untrust-interface"
rule new group "fwshift" src "inside-net-untrust" dst "any-untrust" service "any" comment "snatrule 2" flags [ "DROP" "HIDENAT" ] nat_node "untrust-interface"
rule new group "fwshift" src "inside-net-dmz" dst "any-untrust" service "any" comment "snatrule 2" flags [ "DROP" "HIDENAT" ] nat_node "untrust-interface"
rule new group "fwshift" src "inside-net-lab" dst "any-untrust" service "any" comment "snatrule 2" flags [ "DROP" "HIDENAT" ] nat_node "untrust-interface"
