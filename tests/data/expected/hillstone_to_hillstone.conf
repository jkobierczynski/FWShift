configure
zone "FWS_lab"
  description "lab"
exit
service "FWS_web-group"
  tcp dst-port 80
  tcp dst-port 443
  tcp dst-port 8080
exit
address "FWS_inside-net"
  ip 10.10.0.0/24
exit
address "FWS_pub-web"
  ip 203.0.113.10/32
exit
service "FWS_admin-group"
  tcp dst-port 80
  tcp dst-port 443
  tcp dst-port 8080
  tcp dst-port 22
exit
service "FWS_ping-reply"
  icmp type 8 code 0 0
exit
address "FWS_inside-no-printers"
  range 10.10.0.0 10.10.0.199
  range 10.10.0.210 10.10.0.255
exit
address "FWS_servers"
  ip 10.20.0.10/32
  ip 10.20.0.25/32
  ip 10.20.0.40/31
exit
address "FWS_lab-pool"
  range 10.30.0.100 10.30.0.150
exit
address "FWS_update-site"
  host "updates.example.com"
exit
service "FWS_app-ports"
  tcp dst-port 8000 8010 src-port 1024 65535
  udp dst-port 5000 5001
exit
address "FWS_files.example.org"
  host "files.example.org"
exit
address "FWS_v6-inside_v6" ipv6
  ip 2001:db8:10::/64
exit
service "FWS_gre-tunnel"
  protocol 47
exit
address "FWS_partners"
  ip 198.51.100.0/24
  host "partner.example.net"
exit
address "FWS_web-srv"
  ip 10.20.0.10/32
exit
address "FWS_nat-dnatrule_2-to"
  ip 203.0.113.11/32
exit
address "FWS_nat-dnatrule_2-dnat"
  ip 10.20.0.25/32
exit
address "FWS_snat-pool"
  ip 203.0.113.20/31
exit
policy-global
  rule id 10000
    name "FWS_inside-ping"
    action permit
    src-zone "trust"
    dst-zone "trust"
    src-addr "Any"
    dst-addr "Any"
    service "PING"
  exit
  rule id 10001
    name "FWS_inside-to-web"
    action permit
    src-zone "trust"
    dst-zone "untrust"
    src-addr "FWS_inside-net"
    dst-addr "Any"
    service "FWS_web-group"
    service "DNS"
    log session-end
  exit
  rule id 10002
    name "FWS_publish-web"
    action permit
    src-zone "untrust"
    dst-zone "dmz"
    src-addr "Any"
    dst-addr "FWS_pub-web"
    service "HTTP"
    description "web server published by dnatrule 1"
  exit
  rule id 10003
    disable
    name "FWS_block-country"
    action deny
    src-zone "trust"
    dst-zone "untrust"
    src-addr "Any"
    dst-ip 0.0.0.0/32
    service "Any"
    log policy-deny
  exit
  rule id 10004
    name "FWS_lab-to-inside"
    action deny
    src-zone "FWS_lab"
    dst-zone "trust"
    src-addr "Any"
    dst-addr "Any"
    service "Any"
    log policy-deny
  exit
  rule id 10005
    name "FWS_inside-to-servers"
    action permit
    src-zone "trust"
    dst-zone "dmz"
    src-addr "FWS_inside-no-printers"
    dst-addr "FWS_servers"
    service "FWS_admin-group"
    service "FWS_ping-reply"
  exit
  rule id 10006
    disable
    name "FWS_lab-updates"
    action permit
    src-zone "FWS_lab"
    dst-zone "untrust"
    src-addr "FWS_lab-pool"
    dst-addr "FWS_update-site"
    service "HTTPS"
  exit
  rule id 10007
    disable
    name "FWS_app-clients"
    action permit
    src-zone "trust"
    dst-zone "untrust"
    src-ip 10.10.0.50/32
    src-range 10.10.0.60 10.10.0.69
    dst-addr "FWS_files.example.org"
    service "FWS_app-ports"
  exit
  rule id 10008
    disable
    name "FWS_p2p"
    action permit
    src-zone "trust"
    dst-zone "untrust"
    src-addr "FWS_inside-net"
    dst-addr "Any"
    service "Any"
  exit
  rule id 10009
    name "FWS_v6-out_v6"
    action permit
    src-zone "trust"
    dst-zone "untrust"
    src-addr "FWS_v6-inside_v6"
    dst-addr "IPv6-any"
    service "HTTPS"
    service "PING"
  exit
  rule id 10010
    name "FWS_tunnels-to-partners_1"
    action permit
    src-zone "FWS_lab"
    dst-zone "untrust"
    src-addr "Any"
    dst-addr "FWS_partners"
    service "FWS_gre-tunnel"
  exit
  rule id 10011
    name "FWS_tunnels-to-partners_2"
    action permit
    src-zone "dmz"
    dst-zone "untrust"
    src-addr "Any"
    dst-addr "FWS_partners"
    service "FWS_gre-tunnel"
  exit
  rule id 10012
    disable
    name "FWS_to-branch-vpn"
    action permit
    src-zone "trust"
    dst-zone "untrust"
    src-addr "FWS_inside-net"
    dst-addr "Any"
    service "Any"
  exit
  rule id 10013
    disable
    name "FWS_contractors-out"
    action permit
    src-zone "trust"
    dst-zone "untrust"
    src-ip 0.0.0.0/32
    dst-addr "Any"
    service "Any"
  exit
  rule id 10014
    name "FWS_rule_13"
    action permit
    src-zone "trust"
    dst-zone "FWS_lab"
    src-addr "FWS_inside-net"
    dst-addr "Any"
    service "Any"
  exit
exit
ip vrouter "trust-vr"
  dnatrule id 10000 from "Any" to "FWS_pub-web" service "HTTP" trans-to "FWS_web-srv" port 8080
  dnatrule id 10001 from "Any" to "FWS_nat-dnatrule_2-to" service "Any" trans-to "FWS_nat-dnatrule_2-dnat"
  snatrule id 10000 from "FWS_inside-net" to "Any" service "Any" eif ethernet0/0 trans-to eif-ip mode dynamicport
  snatrule id 10001 from "FWS_lab-pool" to "Any" service "Any" eif ethernet0/0 trans-to address-book "FWS_snat-pool" mode dynamicport
exit
end
