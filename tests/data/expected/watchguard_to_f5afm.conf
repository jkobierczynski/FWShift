security firewall rule-list /Common/FWShift_rules {
    rules {
        Block_Bad {
            action drop
            log yes
            source {
                vlans {
                    /Common/Trusted
                    /Common/Guests
                }
            }
            destination {
                address-lists {
                    /Common/Bad-Nets.1.alm
                    /Common/Bad-Nets.2.alm
                }
            }
        }
        Admin_SSH {
            action accept-decisively
            description "FWSHIFT disabled, see the report."
            ip-protocol tcp
            log yes
            source {
                address-lists {
                    /Common/Admins.1.alm
                }
                vlans {
                    /Common/Trusted
                }
            }
            destination {
                port-lists {
                    /Common/SSH
                }
            }
            status disabled
        }
        Web_Out {
            action accept-decisively
            description "FWSHIFT disabled, see the report."
            ip-protocol tcp
            log yes
            source {
                vlans {
                    /Common/Trusted
                    /Common/Guests
                    /Common/DMZ
