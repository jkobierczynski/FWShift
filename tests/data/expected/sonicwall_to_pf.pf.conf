# Generated by FWShift - review the conversion report before loading this.
# A ruleset for the pf anchor "fwshift" (OpenBSD; FreeBSD 15 and later). Check it with
# 'pfctl -vnf FILE -a fwshift', load it with 'pfctl -a fwshift -f FILE': nothing outside the anchor changes.
# The main ruleset decides where the anchor is evaluated: it needs a line 'anchor "fwshift"'.

# The interface (or interface group) of each zone.
fws_if_LAN = "LAN"
fws_if_WAN = "WAN"
fws_if_DMZ = "DMZ"
fws_if_Servers = "Servers"
fws_if_VPN = "VPN"

# Tables.
table <fws_Admin_PCs> const { 10.10.5.10/31 10.10.5.12/30 10.10.5.16/30 10.10.5.20 }
table <fws_Bad_Networks> const { 203.0.113.0/25 192.0.2.66 }
table <fws_Partners> const { 192.0.2.128/26 203.0.113.0/25 192.0.2.66 }

# What arrives on the interface of a zone is marked with the zone.
match in on $fws_if_LAN tag fws_LAN
match in on $fws_if_WAN tag fws_WAN
match in on $fws_if_DMZ tag fws_DMZ
match in on $fws_if_Servers tag fws_Servers
match in on $fws_if_VPN tag fws_VPN

# Destination NAT, first match, and what the rules may allow is let in: they decide when it leaves.
pass in quick on $fws_if_WAN inet proto tcp from any to 198.51.100.10 port 443 rdr-to 10.20.0.10 label "Web server"
pass in quick on $fws_if_WAN inet proto tcp from any to 198.51.100.11 port 2525 rdr-to 10.20.0.25 port 25 label "Mail on another port"
pass in quick on $fws_if_WAN inet from any to 198.51.100.32/28 rdr-to 10.30.0.0/28 bitmask label "Servers one to one (reflexive)"
pass in quick on $fws_if_LAN inet proto tcp from <fws_Admin_PCs> to ! self port 22 label "Admins out by SSH"
pass in quick on $fws_if_LAN inet proto tcp from any to ! self port { 80 443 8443 } label "LAN to WAN #3"
pass in quick on $fws_if_LAN inet from any to ! self label "LAN to WAN #5"
pass in quick on $fws_if_WAN inet proto tcp from any to 10.20.0.10 port 443 label "Web server from the internet"
pass in quick on $fws_if_WAN proto tcp from <fws_Partners> to 10.20.0.25 port 25 label "Mail from partners"
pass in quick on $fws_if_DMZ proto udp from 10.20.0.10 to 10.30.0.5 port 16384:16484 label "Web server to the database"
pass in quick on $fws_if_LAN inet6 from any to ! self label "IPv6 out"
pass in quick on $fws_if_LAN from any to ! self label "default LAN to DMZ"
pass in quick on $fws_if_DMZ from any to ! self label "default DMZ to WAN"
pass in quick on $fws_if_Servers from any to ! self label "default Servers to WAN"
pass in quick on $fws_if_Servers from any to ! self label "default Servers to DMZ"

# The rules, first match, when the traffic leaves: the tag says the zone it came from.
block return out quick on $fws_if_WAN inet from any to <fws_Bad_Networks> tagged fws_LAN label "LAN to WAN #1"
match out on $fws_if_WAN inet proto tcp from <fws_Admin_PCs> to any port 22 tagged fws_LAN tag fws_ok_LAN label "Admins out by SSH"
match out on $fws_if_WAN inet proto tcp from any to any port { 80 443 8443 } tagged fws_LAN tag fws_ok_LAN label "LAN to WAN #3"
# disabled in the source: "LAN to WAN #4" from LAN to WAN; source 0.0.0.0/0; destination 0.0.0.0/0; service GRE Tunnel; action allow
match out on $fws_if_WAN inet from any to any tagged fws_LAN tag fws_ok_LAN label "LAN to WAN #5"
match out on $fws_if_DMZ inet proto tcp from any to 10.20.0.10 port 443 tagged fws_WAN tag fws_ok_WAN label "Web server from the internet"
match out on $fws_if_DMZ proto tcp from <fws_Partners> to 10.20.0.25 port 25 tagged fws_WAN tag fws_ok_WAN label "Mail from partners"
block return out quick on $fws_if_DMZ inet from any to any tagged fws_WAN label "WAN to DMZ #3"
block return out quick on $fws_if_LAN inet from any to any tagged fws_WAN label "WAN to LAN #1"
match out on $fws_if_Servers proto udp from 10.20.0.10 to 10.30.0.5 port 16384:16484 tagged fws_DMZ tag fws_ok_DMZ label "Web server to the database"
# FWSHIFT disabled, see the report: "Mail server pings the LAN" from DMZ to LAN; source Mail Server; destination 0.0.0.0/0; service Echo Object; action allow
# FWSHIFT disabled, see the report: "Administrators to the DMZ" from LAN to DMZ; source 0.0.0.0/0; destination 0.0.0.0/0; service any; action allow
# FWSHIFT disabled, see the report: "Updates in working hours" from Servers to WAN; source 0.0.0.0/0; destination Update Site; service HTTPS; action allow
match out on $fws_if_WAN inet6 from any to any tagged fws_LAN tag fws_ok_LAN label "IPv6 out"
match out on $fws_if_DMZ from any to any tagged fws_LAN tag fws_ok_LAN label "default LAN to DMZ"
match out on $fws_if_WAN from any to any tagged fws_DMZ tag fws_ok_DMZ label "default DMZ to WAN"
match out on $fws_if_WAN from any to any tagged fws_Servers tag fws_ok_Servers label "default Servers to WAN"
match out on $fws_if_DMZ from any to any tagged fws_Servers tag fws_ok_Servers label "default Servers to DMZ"

# What no rule decided: the default of the source.
block drop out quick tagged fws_LAN
block drop out quick tagged fws_WAN
block drop out quick tagged fws_DMZ
block drop out quick tagged fws_Servers
block drop out quick tagged fws_VPN

# Source NAT, first match, of what the rules allowed.
match out on $fws_if_WAN inet from 10.10.0.0/16 to any tagged fws_ok_LAN nat-to ($fws_if_WAN) tag fws_nat label "Default NAT"
match out on $fws_if_WAN inet from 10.10.0.0/16 to any tagged fws_ok_WAN nat-to ($fws_if_WAN) tag fws_nat label "Default NAT"
match out on $fws_if_WAN inet from 10.10.0.0/16 to any tagged fws_ok_DMZ nat-to ($fws_if_WAN) tag fws_nat label "Default NAT"
match out on $fws_if_WAN inet from 10.10.0.0/16 to any tagged fws_ok_Servers nat-to ($fws_if_WAN) tag fws_nat label "Default NAT"
match out on $fws_if_WAN inet from 10.10.0.0/16 to any tagged fws_ok_VPN nat-to ($fws_if_WAN) tag fws_nat label "Default NAT"
match out on $fws_if_WAN inet from 10.30.0.0/28 to any tagged fws_ok_LAN nat-to 198.51.100.32/28 bitmask tag fws_nat label "Servers one to one"
match out on $fws_if_WAN inet from 10.30.0.0/28 to any tagged fws_ok_WAN nat-to 198.51.100.32/28 bitmask tag fws_nat label "Servers one to one"
match out on $fws_if_WAN inet from 10.30.0.0/28 to any tagged fws_ok_DMZ nat-to 198.51.100.32/28 bitmask tag fws_nat label "Servers one to one"
match out on $fws_if_WAN inet from 10.30.0.0/28 to any tagged fws_ok_Servers nat-to 198.51.100.32/28 bitmask tag fws_nat label "Servers one to one"
match out on $fws_if_WAN inet from 10.30.0.0/28 to any tagged fws_ok_VPN nat-to 198.51.100.32/28 bitmask tag fws_nat label "Servers one to one"
# disabled in the source: match out on $fws_if_WAN inet from <fws_Admin_PCs> to any tagged fws_ok_LAN nat-to 198.51.100.10 tag fws_nat label "Old admin NAT"
# disabled in the source: match out on $fws_if_WAN inet from <fws_Admin_PCs> to any tagged fws_ok_WAN nat-to 198.51.100.10 tag fws_nat label "Old admin NAT"
# disabled in the source: match out on $fws_if_WAN inet from <fws_Admin_PCs> to any tagged fws_ok_DMZ nat-to 198.51.100.10 tag fws_nat label "Old admin NAT"
# disabled in the source: match out on $fws_if_WAN inet from <fws_Admin_PCs> to any tagged fws_ok_Servers nat-to 198.51.100.10 tag fws_nat label "Old admin NAT"
# disabled in the source: match out on $fws_if_WAN inet from <fws_Admin_PCs> to any tagged fws_ok_VPN nat-to 198.51.100.10 tag fws_nat label "Old admin NAT"

# Pass what the rules allowed.
pass out quick tagged fws_ok_LAN
pass out quick tagged fws_ok_WAN
pass out quick tagged fws_ok_DMZ
pass out quick tagged fws_ok_Servers
pass out quick tagged fws_ok_VPN
pass out quick tagged fws_nat
