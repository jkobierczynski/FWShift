configure
zone "FWS_LAN"
  description "LAN"
exit
zone "FWS_WAN"
  description "WAN"
exit
zone "FWS_DMZ"
  description "DMZ"
exit
zone "FWS_OT"
  description "OT"
exit
zone "FWS_VPN"
  description "VPN"
exit
service "FWS_Web_Access"
  tcp dst-port 80
  tcp dst-port 443
exit
service "FWS_DNS"
  tcp dst-port 53
  udp dst-port 53
exit
address "FWS_lan-net"
  ip 10.10.0.0/15
exit
service "FWS_HTTP"
  tcp dst-port 80
exit
service "FWS_SSH"
  tcp dst-port 22
exit
service "FWS_PING"
  icmp type 8
exit
address "FWS_admin-range"
  range 10.10.5.10 10.10.5.20
exit
address "FWS_dmz-servers"
  ip 10.20.0.10/32
  ip 10.20.0.25/32
exit
address "FWS_not-mail-1"
  range 0.0.0.0 10.20.0.24
  range 10.20.0.26 255.255.255.255
exit
service "FWS_HTTPS"
  tcp dst-port 443
exit
address "FWS_web-public"
  ip 198.51.100.10/32
exit
service "FWS_smtp-alt"
  tcp dst-port 2525
exit
address "FWS_mail-public"
  ip 198.51.100.25/32
exit
service "FWS_MODBUS"
  tcp dst-port 502
exit
service "FWS_syslog-from-high"
  udp dst-port 514 src-port 1024 65535
exit
address "FWS_plc-net"
  ip 10.30.1.0/24
exit
address "FWS_scada-server"
  ip 10.10.7.15/32
exit
address "FWS_update-sites"
  host "mirror.example.net"
  host "updates.example.com"
exit
service "FWS_app-ports"
  tcp dst-port 8080
  tcp dst-port 8443
  tcp dst-port 9000 9010
exit
address "FWS_web-1"
  ip 10.20.0.10/32
exit
service "FWS_basic-net"
  tcp dst-port 53
  udp dst-port 53
  icmp type 8
exit
address "FWS_dns-servers"
  ip 10.10.0.53/32
  ip 10.11.0.53/32
exit
service "FWS_GRE"
  protocol 47
exit
service "FWS_TIMESTAMP"
  icmp type 13
exit
address "FWS_lan6-net_v6" ipv6
  ip 2001:db8:10::/48
exit
address "FWS_mail-1"
  ip 10.20.0.25/32
exit
address "FWS_partner-net"
  ip 10.99.0.0/16
exit
service "FWS_NAT_of_LAN_to_Internet_web_services"
  tcp dst-port 80
  tcp dst-port 443
  tcp dst-port 53
  udp dst-port 53
exit
policy-global
  rule id 10000
    disable
    name "FWS_Block_countries"
    action deny
    src-zone "FWS_WAN"
    src-ip 0.0.0.0/32
    dst-addr "Any"
    service "Any"
    log policy-deny
    description "Geo block"
  exit
  rule id 10001
    name "FWS_LAN_to_Internet_web"
    action permit
    src-zone "FWS_LAN"
    dst-zone "FWS_WAN"
    src-addr "FWS_lan-net"
    dst-addr "Any"
    service "FWS_Web_Access"
    service "FWS_DNS"
    log session-end
    description "Browsing, with a linked NAT rule"
  exit
  rule id 10002
    name "FWS_LAN_web_again"
    action permit
    src-zone "FWS_LAN"
    dst-zone "FWS_WAN"
    src-addr "FWS_lan-net"
    dst-addr "Any"
    service "FWS_HTTP"
    description "Never matches: the rule above takes it"
  exit
  rule id 10003
    name "FWS_Admins_to_DMZ"
    action permit
    src-zone "FWS_LAN"
    dst-zone "FWS_DMZ"
    src-addr "FWS_admin-range"
    dst-addr "FWS_dmz-servers"
    service "FWS_SSH"
    service "FWS_PING"
    log session-end
  exit
  rule id 10004
    name "FWS_LAN_to_DMZ_web_not_mail"
    action permit
    src-zone "FWS_LAN"
    dst-zone "FWS_DMZ"
    src-addr "FWS_lan-net"
    dst-addr "FWS_not-mail-1"
    service "FWS_Web_Access"
    log session-end
    description "Exclusion of one kind"
  exit
  rule id 10005
    name "FWS_LAN_SSH_out"
    action permit
    src-zone "FWS_LAN"
    dst-zone "FWS_OT"
    src-addr "FWS_lan-net"
    dst-addr "Any"
    service "FWS_SSH"
    log session-end
    description "Exclusions of two kinds: skipped for the admins when they go to the DMZ"
  exit
  rule id 10006
    name "FWS_LAN_SSH_out-2_1"
    action permit
    src-zone "FWS_LAN"
    dst-zone "FWS_DMZ"
    src-range 10.10.0.0 10.10.5.9
    src-range 10.10.5.21 10.11.255.255
    dst-addr "Any"
    service "FWS_SSH"
    log session-end
    description "Exclusions of two kinds: skipped for the admins when they go to the DMZ"
  exit
  rule id 10007
    name "FWS_LAN_SSH_out-2_2"
    action permit
    src-zone "FWS_LAN"
    dst-zone "FWS_OT"
    src-range 10.10.0.0 10.10.5.9
    src-range 10.10.5.21 10.11.255.255
    dst-addr "Any"
    service "FWS_SSH"
    log session-end
    description "Exclusions of two kinds: skipped for the admins when they go to the DMZ"
  exit
  rule id 10008
    name "FWS_Internet_to_web"
    action permit
    src-zone "FWS_WAN"
    dst-zone "FWS_DMZ"
    src-addr "Any"
    dst-addr "FWS_web-public"
    service "FWS_HTTPS"
    log session-end
    description "Published web server"
  exit
  rule id 10009
    name "FWS_Internet_to_mail"
    action permit
    src-zone "FWS_WAN"
    dst-zone "FWS_DMZ"
    src-addr "Any"
    dst-addr "FWS_mail-public"
    service "FWS_smtp-alt"
    log session-end
    description "Mail arrives on port 2525"
  exit
  rule id 10010
    name "FWS_OT_to_SCADA"
    action permit
    src-zone "FWS_OT"
    dst-zone "FWS_LAN"
    src-addr "FWS_plc-net"
    dst-addr "FWS_scada-server"
    service "FWS_MODBUS"
    service "FWS_syslog-from-high"
  exit
  rule id 10011
    name "FWS_DMZ_updates"
    action permit
    src-zone "FWS_DMZ"
    dst-zone "FWS_WAN"
    src-addr "FWS_dmz-servers"
    dst-addr "FWS_update-sites"
    service "FWS_HTTPS"
    log session-end
  exit
  rule id 10012
    disable
    name "FWS_Finance_to_app"
    action permit
    src-zone "FWS_LAN"
    dst-zone "FWS_DMZ"
    src-addr "Any"
    dst-addr "FWS_web-1"
    service "FWS_app-ports"
    log session-end
    description "Matches known users"
  exit
  rule id 10013
    disable
    name "FWS_DNS_in_office_hours"
    action permit
    src-zone "FWS_OT"
    dst-zone "FWS_LAN"
    src-addr "Any"
    dst-addr "FWS_dns-servers"
    service "FWS_basic-net"
    log session-end
  exit
  rule id 10014
    disable
    name "FWS_Old_test_rule"
    action permit
    src-addr "Any"
    dst-addr "Any"
    service "FWS_GRE"
    service "FWS_TIMESTAMP"
    description "Switched off"
  exit
  rule id 10015
    name "FWS_Reject_the_rest_from_LAN"
    action deny
    src-zone "FWS_LAN"
    src-addr "Any"
    dst-addr "Any"
    service "Any"
    log policy-deny
  exit
  rule id 10016
    disable
    name "FWS_LAN6_to_Internet_v6"
    action permit
    src-zone "FWS_LAN"
    dst-zone "FWS_WAN"
    src-addr "FWS_lan6-net_v6"
    dst-addr "IPv6-any"
    service "Any"
    log session-end
    description "IPv6 rulebase"
  exit
exit
ip vrouter "trust-vr"
  dnatrule id 10000 from "Any" to "FWS_web-public" service "FWS_HTTPS" trans-to "FWS_web-1"
  dnatrule id 10001 from "Any" to "FWS_mail-public" service "FWS_smtp-alt" trans-to "FWS_mail-1" port 25
  snatrule id 10000 from "FWS_mail-1" to "Any" service "Any" eif Port2 trans-to address-book "FWS_mail-public" mode static
  dnatrule id 10002 from "FWS_lan-net" to "FWS_partner-net" service "Any" no-trans
  snatrule id 10001 from "FWS_lan-net" to "FWS_partner-net" service "Any" no-trans
  snatrule id 10002 from "FWS_lan-net" to "Any" service "FWS_NAT_of_LAN_to_Internet_web_services" eif Port2 trans-to eif-ip mode dynamicport
  snatrule id 10003 from "Any" to "Any" service "Any" eif Port2 trans-to eif-ip mode dynamicport
exit
end
