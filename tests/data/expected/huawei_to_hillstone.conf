configure
zone "FWS_lab"
  description "lab"
exit
address "FWS_blocked-nets"
  ip 198.51.100.0/24
exit
service "FWS_http"
  tcp dst-port 80
exit
service "FWS_https"
  tcp dst-port 443
exit
address "FWS_web-servers"
  ip 10.20.0.10/31
exit
service "FWS_smtp"
  tcp dst-port 25
exit
address "FWS_mail-server"
  ip 10.20.0.25/32
exit
service "FWS_dns"
  tcp dst-port 53
  udp dst-port 53
exit
service "FWS_ntp"
  udp dst-port 123
exit
service "FWS_web-alt"
  tcp dst-port 8080
  tcp dst-port 8443
exit
address "FWS_office-lan"
  ip 10.10.0.0/24
exit
address "FWS_dmz-servers"
  ip 10.20.0.10/31
  ip 10.20.0.25/32
exit
address "FWS_office-lan_v6" ipv6
  ip 2001:db8:10::/64
exit
service "FWS_ssh"
  tcp dst-port 22
exit
address "FWS_admin-hosts"
  ip 10.10.0.50/31
exit
service "FWS_syslog"
  udp dst-port 514
exit
service "FWS_lab-all"
  tcp dst-port 5000 5010
  udp dst-port 6000 src-port 1024 65535
  icmp type 8 code 0 0
  tcp dst-port 8080
  tcp dst-port 8443
exit
address "FWS_lab-net"
  ip 10.30.0.0/24
exit
service "FWS_udp-destination-port-53"
  udp dst-port 53
exit
service "FWS_ftp"
  tcp dst-port 21
exit
address "FWS_nat-nat-server-web-to"
  ip 203.0.113.3/32
exit
address "FWS_nat-nat-server-web-dnat"
  ip 10.20.0.10/32
exit
address "FWS_nat-nat-server-mail-inside"
  ip 10.20.0.25/32
exit
address "FWS_nat-nat-server-mail-outside"
  ip 203.0.113.6/32
exit
address "FWS_nat-no-nat-vpn-to"
  ip 192.0.2.0/24
exit
address "FWS_nat-office-pat-from"
  ip 10.10.0.0/24
exit
address "FWS_nat-office-pat-pool"
  ip 203.0.113.4/31
exit
address "FWS_nat-lab-easy-ip-from"
  ip 10.30.0.0/24
exit
policy-global
  rule id 10000
    name "FWS_block-bad-nets"
    action deny
    src-zone "untrust"
    src-addr "FWS_blocked-nets"
    dst-addr "Any"
    service "Any"
  exit
  rule id 10001
    name "FWS_web-in"
    action permit
    src-zone "untrust"
    dst-zone "dmz"
    src-addr "Any"
    dst-addr "FWS_web-servers"
    dst-ip 203.0.113.3/32
    service "FWS_http"
    service "FWS_https"
    description "published web servers"
  exit
  rule id 10002
    name "FWS_mail-in"
    action permit
    src-zone "untrust"
    dst-zone "dmz"
    src-addr "Any"
    dst-addr "FWS_mail-server"
    dst-ip 203.0.113.6/32
    service "FWS_smtp"
    log session-end
  exit
  rule id 10003
    name "FWS_office-out"
    action permit
    src-zone "trust"
    dst-zone "untrust"
    src-range 10.10.0.0 10.10.0.199
    src-range 10.10.0.221 10.10.0.255
    dst-addr "Any"
    service "FWS_http"
    service "FWS_https"
    service "FWS_dns"
    service "FWS_ntp"
  exit
  rule id 10004
    name "FWS_office-out_v6"
    action permit
    src-zone "trust"
    dst-zone "untrust"
    src-ip 2001:db8:10::/64
    dst-addr "IPv6-any"
    service "FWS_http"
    service "FWS_https"
    service "FWS_dns"
    service "FWS_ntp"
  exit
  rule id 10005
    name "FWS_office-dmz"
    action permit
    src-zone "trust"
    dst-zone "dmz"
    src-addr "FWS_office-lan"
    dst-addr "FWS_dmz-servers"
    dst-ip 203.0.113.6/32
    service "FWS_http"
    service "FWS_https"
    service "FWS_smtp"
    service "FWS_web-alt"
  exit
  rule id 10006
    name "FWS_admin-ssh_1"
    action permit
    src-zone "trust"
    dst-zone "dmz"
    src-addr "FWS_admin-hosts"
    dst-addr "Any"
    service "FWS_ssh"
  exit
  rule id 10007
    name "FWS_admin-ssh_2"
    action permit
    src-zone "trust"
    dst-zone "FWS_lab"
    src-addr "FWS_admin-hosts"
    dst-addr "Any"
    service "FWS_ssh"
  exit
  rule id 10008
    name "FWS_dmz-syslog"
    action permit
    src-zone "dmz"
    dst-zone "trust"
    src-addr "Any"
    dst-ip 10.10.0.60/32
    service "FWS_syslog"
  exit
  rule id 10009
    disable
    name "FWS_lab-tools"
    action permit
    src-zone "trust"
    dst-zone "FWS_lab"
    src-ip 10.10.0.0/24
    dst-addr "FWS_lab-net"
    service "FWS_lab-all"
  exit
  rule id 10010
    name "FWS_lab-out"
    action permit
    src-zone "FWS_lab"
    dst-zone "untrust"
    src-addr "FWS_lab-net"
    dst-addr "Any"
    service "FWS_https"
    service "FWS_udp-destination-port-53"
  exit
  rule id 10011
    name "FWS_ping-dmz"
    action permit
    src-zone "trust"
    dst-zone "dmz"
    src-addr "Any"
    dst-addr "Any"
    service "ICMP"
  exit
  rule id 10012
    name "FWS_ping-dmz_v6"
    action permit
    src-zone "trust"
    dst-zone "dmz"
    src-addr "IPv6-any"
    dst-addr "IPv6-any"
    service "ICMP"
  exit
  rule id 10013
    name "FWS_ipv6-out_v6"
    action permit
    src-zone "trust"
    dst-zone "untrust"
    src-ip 2001:db8:10::/64
    dst-addr "IPv6-any"
    service "Any"
  exit
  rule id 10014
    disable
    name "FWS_video"
    action deny
    src-zone "trust"
    dst-zone "untrust"
    src-addr "Any"
    dst-addr "Any"
    service "Any"
  exit
  rule id 10015
    disable
    name "FWS_video_v6"
    action deny
    src-zone "trust"
    dst-zone "untrust"
    src-addr "IPv6-any"
    dst-addr "IPv6-any"
    service "Any"
  exit
  rule id 10016
    disable
    name "FWS_old-ftp"
    action permit
    src-zone "trust"
    dst-zone "dmz"
    src-addr "Any"
    dst-addr "Any"
    service "FWS_ftp"
  exit
  rule id 10017
    disable
    name "FWS_old-ftp_v6"
    action permit
    src-zone "trust"
    dst-zone "dmz"
    src-addr "IPv6-any"
    dst-addr "IPv6-any"
    service "FWS_ftp"
  exit
  rule id 10018
    name "FWS_lab-deny"
    action deny
    src-zone "FWS_lab"
    src-addr "Any"
    dst-addr "Any"
    service "Any"
  exit
  rule id 10019
    name "FWS_lab-deny_v6"
    action deny
    src-zone "FWS_lab"
    src-addr "IPv6-any"
    dst-addr "IPv6-any"
    service "Any"
  exit
  rule id 10020
    name "FWS_intrazone_default_1"
    action permit
    src-zone "trust"
    dst-zone "trust"
    src-addr "Any"
    dst-addr "Any"
    service "Any"
    description "traffic inside a zone that no rule matches passes (default packet-filter intrazone enable is not set)"
  exit
  rule id 10021
    name "FWS_intrazone_default_2"
    action permit
    src-zone "untrust"
    dst-zone "untrust"
    src-addr "Any"
    dst-addr "Any"
    service "Any"
    description "traffic inside a zone that no rule matches passes (default packet-filter intrazone enable is not set)"
  exit
  rule id 10022
    name "FWS_intrazone_default_3"
    action permit
    src-zone "dmz"
    dst-zone "dmz"
    src-addr "Any"
    dst-addr "Any"
    service "Any"
    description "traffic inside a zone that no rule matches passes (default packet-filter intrazone enable is not set)"
  exit
  rule id 10023
    name "FWS_intrazone_default_4"
    action permit
    src-zone "FWS_lab"
    dst-zone "FWS_lab"
    src-addr "Any"
    dst-addr "Any"
    service "Any"
    description "traffic inside a zone that no rule matches passes (default packet-filter intrazone enable is not set)"
  exit
  rule id 10024
    name "FWS_intrazone_default_v6_5"
    action permit
    src-zone "trust"
    dst-zone "trust"
    src-addr "IPv6-any"
    dst-addr "IPv6-any"
    service "Any"
    description "traffic inside a zone that no rule matches passes (default packet-filter intrazone enable is not set)"
  exit
  rule id 10025
    name "FWS_intrazone_default_v6_6"
    action permit
    src-zone "untrust"
    dst-zone "untrust"
    src-addr "IPv6-any"
    dst-addr "IPv6-any"
    service "Any"
    description "traffic inside a zone that no rule matches passes (default packet-filter intrazone enable is not set)"
  exit
  rule id 10026
    name "FWS_intrazone_default_v6_7"
    action permit
    src-zone "dmz"
    dst-zone "dmz"
    src-addr "IPv6-any"
    dst-addr "IPv6-any"
    service "Any"
    description "traffic inside a zone that no rule matches passes (default packet-filter intrazone enable is not set)"
  exit
  rule id 10027
    name "FWS_intrazone_default_v6_8"
    action permit
    src-zone "FWS_lab"
    dst-zone "FWS_lab"
    src-addr "IPv6-any"
    dst-addr "IPv6-any"
    service "Any"
    description "traffic inside a zone that no rule matches passes (default packet-filter intrazone enable is not set)"
  exit
exit
ip vrouter "trust-vr"
  dnatrule id 10000 from "Any" to "FWS_nat-nat-server-web-to" service "FWS_http" trans-to "FWS_nat-nat-server-web-dnat" port 80
  dnatrule id 10001 from "Any" to "FWS_nat-nat-server-web-to" service "FWS_https" trans-to "FWS_nat-nat-server-web-dnat" port 443
  snatrule id 10000 from "FWS_nat-nat-server-mail-inside" to "Any" service "Any" trans-to address-book "FWS_nat-nat-server-mail-outside" mode static
  dnatrule id 10002 from "Any" to "FWS_nat-nat-server-mail-outside" service "Any" trans-to "FWS_nat-nat-server-mail-inside"
  dnatrule id 10003 from "Any" to "FWS_nat-no-nat-vpn-to" service "Any" no-trans
  snatrule id 10001 from "Any" to "FWS_nat-no-nat-vpn-to" service "Any" no-trans
  snatrule id 10002 from "FWS_nat-office-pat-from" to "Any" service "Any" eif GigabitEthernet1/0/0 trans-to address-book "FWS_nat-office-pat-pool" mode dynamicport
  snatrule id 10003 from "FWS_nat-lab-easy-ip-from" to "Any" service "Any" eif GigabitEthernet1/0/0 trans-to eif-ip mode dynamicport
exit
end
