configure
zone "FWS_pppoe0"
  description "pppoe0"
exit
zone "FWS_eth1"
  description "eth1"
exit
zone "FWS_eth1.10"
  description "eth1.10"
exit
service "FWS_tcp-32400"
  tcp dst-port 32400
exit
service "FWS_icmp-8"
  icmp type 8
exit
address "FWS_NAS"
  ip 192.168.1.20/31
exit
service "FWS_tcp-any"
  tcp dst-port 0 65535
exit
service "FWS_tcp-25"
  tcp dst-port 25
exit
service "FWS_tcp-8096-8097_32400_udp-8096-8097_32400"
  tcp dst-port 8096 8097
  tcp dst-port 32400
  udp dst-port 8096 8097
  udp dst-port 32400
exit
address "FWS_TRUSTED"
  ip 10.8.0.0/24
  ip 192.168.1.0/25
exit
service "FWS_2-protocols"
  tcp dst-port 0 52
  tcp dst-port 54 79
  tcp dst-port 81 442
  tcp dst-port 444 65535
  udp dst-port 0 52
  udp dst-port 54 79
  udp dst-port 81 442
  udp dst-port 444 65535
exit
address "FWS_nat-plex_from_outside-dnat"
  ip 192.168.1.30/32
exit
service "FWS_tcp-8443"
  tcp dst-port 8443
exit
address "FWS_nat-web_on_8443_to_the_nas-to"
  ip 198.51.100.7/32
exit
address "FWS_nat-web_on_8443_to_the_nas-dnat"
  ip 192.168.1.20/32
exit
policy-global
  rule id 10000
    name "FWS_no_media_from_the_guests"
    action deny
    src-zone "FWS_pppoe0"
    dst-zone "FWS_eth1"
    src-ip 192.168.10.0/24
    dst-ip 192.168.1.30/32
    service "FWS_tcp-32400"
    description "VyOS firewall name LAN_OUT rule 10 (forward-5.WAN_IN-30>forward-15.LAN_OUT-10)"
  exit
  rule id 10001
    name "FWS_plex_to_the_media_box"
    action permit
    src-zone "FWS_pppoe0"
    src-addr "Any"
    dst-ip 192.168.1.30/32
    service "FWS_tcp-32400"
    description "VyOS firewall name WAN_IN rule 30, then ipv4 forward filter default-action accept (forward-5.WAN_IN-30)"
  exit
  rule id 10002
    name "FWS_ping_the_nas"
    action permit
    src-zone "FWS_pppoe0"
    src-addr "Any"
    dst-addr "FWS_NAS"
    service "FWS_icmp-8"
    description "VyOS firewall name WAN_IN rule 40, then ipv4 forward filter default-action accept (forward-5.WAN_IN-40)"
  exit
  rule id 10003
    disable
    name "FWS_old_rule"
    action permit
    src-zone "FWS_pppoe0"
    src-addr "Any"
    dst-ip 192.168.1.40/32
    service "FWS_tcp-any"
    description "VyOS firewall name WAN_IN rule 50 (forward-5.WAN_IN-50)"
  exit
  rule id 10004
    name "FWS_syn_to_the_mail_server"
    action permit
    src-zone "FWS_pppoe0"
    src-addr "Any"
    dst-ip 192.168.1.25/32
    service "FWS_tcp-25"
    description "VyOS firewall name WAN_IN rule 60, then ipv4 forward filter default-action accept (forward-5.WAN_IN-60)"
  exit
  rule id 10005
    disable
    name "FWS_no_media_from_the_guests-2"
    action deny
    src-zone "FWS_pppoe0"
    dst-zone "FWS_eth1"
    src-ip 192.168.10.0/24
    dst-addr "Any"
    service "FWS_tcp-8096-8097_32400_udp-8096-8097_32400"
    description "VyOS firewall name LAN_OUT rule 10 (forward-5.WAN_IN-70>forward-15.LAN_OUT-10)"
  exit
  rule id 10006
    disable
    name "FWS_sessions_of_the_voip_box"
    action permit
    src-zone "FWS_pppoe0"
    src-addr "Any"
    dst-addr "Any"
    service "Any"
    description "VyOS firewall name WAN_IN rule 70, then ipv4 forward filter default-action accept (forward-5.WAN_IN-70)"
  exit
  rule id 10007
    name "FWS_forward-5.default"
    action deny
    src-zone "FWS_pppoe0"
    src-addr "Any"
    dst-addr "Any"
    service "Any"
    description "VyOS firewall name WAN_IN default-action drop"
  exit
  rule id 10008
    name "FWS_no_way_into_the_LAN"
    action deny
    src-zone "FWS_eth1.10"
    src-addr "Any"
    dst-addr "FWS_TRUSTED"
    service "Any"
    log session-start
    log policy-deny
    description "VyOS firewall name GUEST_IN rule 10 (forward-10.GUEST_IN-10)"
  exit
  rule id 10009
    name "FWS_only_web_and_dns_out"
    action deny
    src-zone "FWS_eth1.10"
    src-addr "Any"
    dst-addr "Any"
    service "FWS_2-protocols"
    description "VyOS firewall name GUEST_IN rule 20 (forward-10.GUEST_IN-20)"
  exit
  rule id 10010
    name "FWS_no_media_from_the_guests-3"
    action deny
    dst-zone "FWS_eth1"
    src-ip 192.168.10.0/24
    dst-addr "Any"
    service "FWS_tcp-8096-8097_32400_udp-8096-8097_32400"
    description "VyOS firewall name LAN_OUT rule 10 (forward-15.LAN_OUT-10)"
  exit
  rule id 10011
    disable
    name "FWS_Allow_IPv6_ping_v6"
    action permit
    src-zone "FWS_pppoe0"
    src-addr "IPv6-any"
    dst-addr "IPv6-any"
    service "Any"
    description "VyOS firewall ipv6-name WANv6_IN rule 30, then ipv6 forward filter default-action accept (ipv6-forward-5.WANv6_IN-30)"
  exit
  rule id 10012
    name "FWS_ipv6-forward-5.default_v6"
    action deny
    src-zone "FWS_pppoe0"
    src-addr "IPv6-any"
    dst-addr "IPv6-any"
    service "Any"
    description "VyOS firewall ipv6-name WANv6_IN default-action drop"
  exit
  default-action permit
exit
ip vrouter "trust-vr"
  dnatrule id 10000 from "Any" to "Any" service "FWS_tcp-32400" trans-to "FWS_nat-plex_from_outside-dnat"
  dnatrule id 10001 from "Any" to "FWS_nat-web_on_8443_to_the_nas-to" service "FWS_tcp-8443" trans-to "FWS_nat-web_on_8443_to_the_nas-dnat" port 443
  snatrule id 10000 from "FWS_nat-web_on_8443_to_the_nas-dnat" to "Any" service "Any" eif pppoe0 trans-to address-book "FWS_nat-web_on_8443_to_the_nas-to" mode dynamicport
  snatrule id 10001 from "Any" to "Any" service "Any" eif pppoe0 trans-to eif-ip mode dynamicport
exit
end
