configure
zone "FWS_port1"
  description "port1"
exit
zone "FWS_port2"
  description "port2"
exit
address "FWS_Blocked-Nets__IPv4_"
  ip 198.51.100.0/24
exit
address "FWS_Blocked-Nets__IPv6__v6" ipv6
  ip 2001:db8:bad::/48
exit
service "FWS_SSH"
  tcp dst-port 22
exit
address "FWS_Admin-Hosts__port2_"
  ip 10.10.5.10/31
exit
address "FWS_DMZ-Servers"
  range 10.20.0.16 10.20.0.255
exit
address "FWS_Admin-Hosts__port1_"
  ip 192.0.2.50/32
exit
service "FWS_HTTP_S"
  tcp dst-port 80
  tcp dst-port 443
exit
address "FWS_Office-LAN"
  ip 10.10.0.0/16
exit
address "FWS_Public-Web"
  ip 203.0.113.10/32
exit
service "FWS_Web-Group"
  tcp dst-port 80
  tcp dst-port 443
  tcp dst-port 8080
exit
service "FWS_DNS"
  tcp dst-port 53
  udp dst-port 53
exit
address "FWS_Server-Group"
  ip 10.20.0.25/32
  ip 10.20.0.80/32
exit
address "FWS_Updates__IPv4_"
  host "updates.example.com"
exit
address "FWS_V6-Servers_v6" ipv6
  ip 2001:db8:20::/64
exit
service "FWS_GRE"
  protocol 47
exit
address "FWS_Mail-Server"
  ip 10.20.0.25/32
exit
service "FWS_Odd-Ports"
  tcp dst-port 1000 2000 src-port 1024 65535
exit
policy-global
  rule id 10000
    name "FWS_BLOCK-BAD"
    action deny
    src-addr "FWS_Blocked-Nets__IPv4_"
    dst-addr "Any"
    service "Any"
    log policy-deny
    description "known bad networks"
  exit
  rule id 10001
    name "FWS_BLOCK-BAD-V6_v6"
    action deny
    src-addr "FWS_Blocked-Nets__IPv6__v6"
    dst-addr "IPv6-any"
    service "Any"
    log policy-deny
  exit
  rule id 10002
    name "FWS_ADMIN-SSH__port2_"
    action permit
    src-zone "FWS_port2"
    src-addr "FWS_Admin-Hosts__port2_"
    dst-addr "FWS_DMZ-Servers"
    service "FWS_SSH"
    log session-end
  exit
  rule id 10003
    name "FWS_ADMIN-SSH__port1_"
    action permit
    src-zone "FWS_port1"
    src-addr "FWS_Admin-Hosts__port1_"
    dst-addr "FWS_DMZ-Servers"
    service "FWS_SSH"
    log session-end
  exit
  rule id 10004
    name "FWS_LAN-2-INTERNET"
    action permit
    src-addr "FWS_Office-LAN"
    dst-addr "Any"
    service "FWS_HTTP_S"
    log session-end
  exit
  rule id 10005
    disable
    name "FWS_WEB-IN"
    action permit
    src-addr "Any"
    dst-addr "FWS_Public-Web"
    service "FWS_HTTP_S"
    log session-end
  exit
  rule id 10006
    name "FWS_SERVER-SYNC"
    action permit
    src-addr "FWS_DMZ-Servers"
    dst-addr "FWS_Office-LAN"
    service "FWS_Web-Group"
    log session-end
  exit
  rule id 10007
    name "FWS_SERVER-SYNC__back_"
    action permit
    src-addr "FWS_Office-LAN"
    dst-addr "FWS_DMZ-Servers"
    service "FWS_Web-Group"
    log session-end
  exit
  rule id 10008
    disable
    name "FWS_DNS-OUT"
    action permit
    src-addr "FWS_Server-Group"
    dst-addr "Any"
    service "FWS_DNS"
    log session-end
  exit
  rule id 10009
    name "FWS_PING-ALL"
    action permit
    src-addr "FWS_Office-LAN"
    dst-addr "Any"
    service "ICMP"
    log session-end
  exit
  rule id 10010
    name "FWS_UPDATES"
    action permit
    src-addr "FWS_DMZ-Servers"
    dst-addr "FWS_Updates__IPv4_"
    service "FWS_HTTP_S"
    log session-end
  exit
  rule id 10011
    name "FWS_V6-WEB_v6"
    action permit
    src-addr "IPv6-any"
    dst-addr "FWS_V6-Servers_v6"
    service "FWS_HTTP_S"
    log session-end
  exit
  rule id 10012
    name "FWS_DENY-LAN-DMZ"
    action deny
    src-addr "FWS_Office-LAN"
    dst-addr "FWS_DMZ-Servers"
    service "Any"
    log policy-deny
  exit
  rule id 10013
    name "FWS_GRE-LAB"
    action permit
    src-addr "FWS_Office-LAN"
    dst-addr "FWS_Mail-Server"
    service "FWS_GRE"
    log session-end
  exit
  rule id 10014
    disable
    name "FWS_TO-LAB"
    action deny
    src-addr "FWS_Office-LAN"
    dst-addr "Any"
    service "Any"
    log policy-deny
  exit
  rule id 10015
    disable
    name "FWS_ODD"
    action permit
    src-addr "FWS_Office-LAN"
    dst-addr "Any"
    service "FWS_Odd-Ports"
    log session-end
  exit
  rule id 10016
    name "FWS_BLOCKALL"
    action deny
    src-addr "Any"
    dst-addr "Any"
    service "Any"
    log policy-deny
  exit
exit
end
