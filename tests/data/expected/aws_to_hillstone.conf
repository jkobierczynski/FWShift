policy-global
  rule id 10000
    name "FWS_db-acl-in-db"
    action deny
    src-ip 10.20.1.0/24
    dst-ip 10.20.3.0/24
    service "FWS_db-acl-in-1"
    description "denied by network ACL acl-0db0000000000000a where traffic enters subnet subnet-0300000000000003a"
  exit
  rule id 10001
    name "FWS_db-acl-in-db-2"
    action deny
    src-range 0.0.0.0 10.19.255.255
    src-range 10.21.0.0 255.255.255.255
    dst-ip 10.20.3.0/24
    service "Any"
    description "denied by network ACL acl-0db0000000000000a where traffic enters subnet subnet-0300000000000003a"
  exit
  rule id 10002
    disable
    name "FWS_db-acl-in-db-3"
    action deny
    src-ip 10.20.0.0/24
    src-ip 10.20.2.0/24
    src-range 10.20.4.0 10.20.8.255
    src-range 10.20.10.0 10.20.255.255
    dst-ip 10.20.3.0/24
    service "Any"
    description "denied by network ACL acl-0db0000000000000a where traffic enters subnet subnet-0300000000000003a"
  exit
  rule id 10003
