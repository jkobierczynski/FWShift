  exit
  rule id 10005
    name "FWS_db-acl-out-db"
    action deny
    src-ip 10.20.3.0/24
    dst-range 0.0.0.0 10.19.255.255
    dst-range 10.21.0.0 255.255.255.255
    service "Any"
    description "denied by network ACL acl-0db0000000000000a where traffic leaves subnet subnet-0300000000000003a"
  exit
  rule id 10006
