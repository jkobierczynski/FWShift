configure
zone "FWS_LAN"
  description "LAN"
exit
zone "FWS_WAN"
  description "WAN"
exit
zone "FWS_DMZ"
  description "DMZ"
exit
zone "FWS_Servers"
  description "Servers"
exit
zone "FWS_VPN"
  description "VPN"
exit
address "FWS_Bad_Networks"
  ip 192.0.2.66/32
  ip 203.0.113.0/25
exit
service "FWS_SSH"
  tcp dst-port 22
exit
address "FWS_Admin_PCs"
  range 10.10.5.10 10.10.5.20
exit
service "FWS_Web_Services"
  tcp dst-port 80
  tcp dst-port 443
  tcp dst-port 8443
exit
service "FWS_GRE_Tunnel"
  protocol 47
exit
service "FWS_HTTPS"
  tcp dst-port 443
exit
address "FWS_Web_Public"
  ip 198.51.100.10/32
exit
service "FWS_SMTP_Alt"
  tcp dst-port 2525
exit
address "FWS_Partners"
  ip 192.0.2.66/32
  ip 192.0.2.128/26
  ip 203.0.113.0/25
exit
address "FWS_Mail_Public"
  ip 198.51.100.11/32
exit
service "FWS_Media"
  udp dst-port 16384 16484
exit
address "FWS_Web_Server"
  ip 10.20.0.10/32
exit
address "FWS_Database"
  ip 10.30.0.5/32
exit
address "FWS_Mail_Server"
  ip 10.20.0.25/32
exit
address "FWS_Update_Site"
  host "updates.example.com"
exit
address "FWS_X0_Subnet"
  ip 10.10.0.0/16
exit
address "FWS_Server_Range"
  ip 10.30.0.0/28
exit
address "FWS_Server_Public"
  ip 198.51.100.32/28
exit
policy-global
  rule id 10000
    name "FWS_LAN_to_WAN__1"
    action deny
    src-zone "FWS_LAN"
    dst-zone "FWS_WAN"
    src-addr "Any"
    dst-addr "FWS_Bad_Networks"
    service "Any"
    log policy-deny
    description "nothing to the bad networks"
  exit
  rule id 10001
    name "FWS_Admins_out_by_SSH"
    action permit
    src-zone "FWS_LAN"
    dst-zone "FWS_WAN"
    src-addr "FWS_Admin_PCs"
    dst-addr "Any"
    service "FWS_SSH"
    log session-end
  exit
  rule id 10002
    name "FWS_LAN_to_WAN__3"
    action permit
    src-zone "FWS_LAN"
    dst-zone "FWS_WAN"
    src-addr "Any"
    dst-addr "Any"
    service "FWS_Web_Services"
    log session-end
    description "browsing"
  exit
  rule id 10003
    disable
    name "FWS_LAN_to_WAN__4"
    action permit
    src-zone "FWS_LAN"
    dst-zone "FWS_WAN"
    src-addr "Any"
    dst-addr "Any"
    service "FWS_GRE_Tunnel"
    log session-end
    description "tunnels to partners"
  exit
  rule id 10004
    name "FWS_LAN_to_WAN__5"
    action permit
    src-zone "FWS_LAN"
    dst-zone "FWS_WAN"
    src-addr "Any"
    dst-addr "Any"
    service "Any"
    log session-end
    description "Auto added default rule"
  exit
  rule id 10005
    name "FWS_Web_server_from_the_internet"
    action permit
    src-zone "FWS_WAN"
    dst-zone "FWS_DMZ"
    src-addr "Any"
    dst-addr "FWS_Web_Public"
    service "FWS_HTTPS"
    log session-end
  exit
  rule id 10006
    name "FWS_Mail_from_partners"
    action permit
    src-zone "FWS_WAN"
    dst-zone "FWS_DMZ"
    src-addr "FWS_Partners"
    dst-addr "FWS_Mail_Public"
    service "FWS_SMTP_Alt"
    log session-end
  exit
  rule id 10007
    name "FWS_WAN_to_DMZ__3"
    action deny
    src-zone "FWS_WAN"
    dst-zone "FWS_DMZ"
    src-addr "Any"
    dst-addr "Any"
    service "Any"
    log policy-deny
  exit
  rule id 10008
    name "FWS_WAN_to_LAN__1"
    action deny
    src-zone "FWS_WAN"
    dst-zone "FWS_LAN"
    src-addr "Any"
    dst-addr "Any"
    service "Any"
    log policy-deny
  exit
  rule id 10009
    name "FWS_Web_server_to_the_database"
    action permit
    src-zone "FWS_DMZ"
    dst-zone "FWS_Servers"
    src-addr "FWS_Web_Server"
    dst-addr "FWS_Database"
    service "FWS_Media"
    log session-end
  exit
  rule id 10010
    disable
    name "FWS_Mail_server_pings_the_LAN"
    action permit
    src-zone "FWS_DMZ"
    dst-zone "FWS_LAN"
    src-addr "FWS_Mail_Server"
    dst-addr "Any"
    service "Any"
    log session-end
  exit
  rule id 10011
    disable
    name "FWS_Administrators_to_the_DMZ"
    action permit
    src-zone "FWS_LAN"
    dst-zone "FWS_DMZ"
    src-addr "Any"
    dst-addr "Any"
    service "Any"
    log session-end
  exit
  rule id 10012
    disable
    name "FWS_Updates_in_working_hours"
    action permit
    src-zone "FWS_Servers"
    dst-zone "FWS_WAN"
    src-addr "Any"
    dst-addr "FWS_Update_Site"
    service "FWS_HTTPS"
    log session-end
  exit
  rule id 10013
    name "FWS_IPv6_out_v6"
    action permit
    src-zone "FWS_LAN"
    dst-zone "FWS_WAN"
    src-addr "IPv6-any"
    dst-addr "IPv6-any"
    service "Any"
    log session-end
  exit
  rule id 10014
    name "FWS_default_LAN_to_DMZ"
    action permit
    src-zone "FWS_LAN"
    dst-zone "FWS_DMZ"
    src-addr "Any"
    dst-addr "Any"
    service "Any"
    description "the default access rule of SonicOS from LAN to DMZ"
  exit
  rule id 10015
    name "FWS_default_LAN_to_DMZ_v6"
    action permit
    src-zone "FWS_LAN"
    dst-zone "FWS_DMZ"
    src-addr "IPv6-any"
    dst-addr "IPv6-any"
    service "Any"
    description "the default access rule of SonicOS from LAN to DMZ"
  exit
  rule id 10016
    name "FWS_default_DMZ_to_WAN"
    action permit
    src-zone "FWS_DMZ"
    dst-zone "FWS_WAN"
    src-addr "Any"
    dst-addr "Any"
    service "Any"
    description "the default access rule of SonicOS from DMZ to WAN"
  exit
  rule id 10017
    name "FWS_default_DMZ_to_WAN_v6"
    action permit
    src-zone "FWS_DMZ"
    dst-zone "FWS_WAN"
    src-addr "IPv6-any"
    dst-addr "IPv6-any"
    service "Any"
    description "the default access rule of SonicOS from DMZ to WAN"
  exit
  rule id 10018
    name "FWS_default_Servers_to_WAN"
    action permit
    src-zone "FWS_Servers"
    dst-zone "FWS_WAN"
    src-addr "Any"
    dst-addr "Any"
    service "Any"
    description "the default access rule of SonicOS from Servers to WAN"
  exit
  rule id 10019
    name "FWS_default_Servers_to_WAN_v6"
    action permit
    src-zone "FWS_Servers"
    dst-zone "FWS_WAN"
    src-addr "IPv6-any"
    dst-addr "IPv6-any"
    service "Any"
    description "the default access rule of SonicOS from Servers to WAN"
  exit
  rule id 10020
    name "FWS_default_Servers_to_DMZ"
    action permit
    src-zone "FWS_Servers"
    dst-zone "FWS_DMZ"
    src-addr "Any"
    dst-addr "Any"
    service "Any"
    description "the default access rule of SonicOS from Servers to DMZ"
  exit
  rule id 10021
    name "FWS_default_Servers_to_DMZ_v6"
    action permit
    src-zone "FWS_Servers"
    dst-zone "FWS_DMZ"
    src-addr "IPv6-any"
    dst-addr "IPv6-any"
    service "Any"
    description "the default access rule of SonicOS from Servers to DMZ"
  exit
  rule id 10022
    name "FWS_intrazone_LAN"
    action permit
    src-zone "FWS_LAN"
    dst-zone "FWS_LAN"
    src-addr "Any"
    dst-addr "Any"
    service "Any"
  exit
  rule id 10023
    name "FWS_intrazone_LAN_v6"
    action permit
    src-zone "FWS_LAN"
    dst-zone "FWS_LAN"
    src-addr "IPv6-any"
    dst-addr "IPv6-any"
    service "Any"
  exit
  rule id 10024
    name "FWS_intrazone_Servers"
    action permit
    src-zone "FWS_Servers"
    dst-zone "FWS_Servers"
    src-addr "Any"
    dst-addr "Any"
    service "Any"
  exit
  rule id 10025
    name "FWS_intrazone_Servers_v6"
    action permit
    src-zone "FWS_Servers"
    dst-zone "FWS_Servers"
    src-addr "IPv6-any"
    dst-addr "IPv6-any"
    service "Any"
  exit
  rule id 10026
    name "FWS_intrazone_VPN"
    action permit
    src-zone "FWS_VPN"
    dst-zone "FWS_VPN"
    src-addr "Any"
    dst-addr "Any"
    service "Any"
  exit
  rule id 10027
    name "FWS_intrazone_VPN_v6"
    action permit
    src-zone "FWS_VPN"
    dst-zone "FWS_VPN"
    src-addr "IPv6-any"
    dst-addr "IPv6-any"
    service "Any"
  exit
exit
ip vrouter "trust-vr"
  dnatrule id 10000 from "Any" to "FWS_Web_Public" service "FWS_HTTPS" trans-to "FWS_Web_Server"
  dnatrule id 10001 from "Any" to "FWS_Mail_Public" service "FWS_SMTP_Alt" trans-to "FWS_Mail_Server" port 25
  snatrule id 10000 from "FWS_Server_Range" to "Any" service "Any" trans-to address-book "FWS_Server_Public" mode static
  dnatrule id 10002 from "Any" to "FWS_Server_Public" service "Any" trans-to "FWS_Server_Range"
exit
end
