# Securepoint UTM: commands of its CLI (spcli), written by FWShift. They add network objects, services and the
# rule group 'fwshift' with its rules, and delete nothing. Lines that start with '#' are not commands: leave them
# out when loading (grep -v '^#'). Nothing applies until 'system update rule', nothing is kept over a restart until
# 'system config save': run both yourself after reading the report (section 10 of the manual).
node new name "any-v4-Trusted" address "0.0.0.0/0" zone "Trusted"
node new name "any-v6-Trusted" address "::/0" zone "Trusted"
node group new name "any-Trusted" nodes [ "any-v4-Trusted" "any-v6-Trusted" ]
node new name "Bad-Nets.1.alm" address "203.0.113.0/25" zone "External"
node new name "Bad-Nets.2.alm" address "192.0.2.66/32" zone "External"
node group new name "Block Bad-dst" nodes [ "Bad-Nets.1.alm" "Bad-Nets.2.alm" ]
node new name "Bad-Nets.1.alm-Trusted" address "203.0.113.0/25" zone "Trusted"
node new name "Bad-Nets.2.alm-Trusted" address "192.0.2.66/32" zone "Trusted"
node group new name "Block Bad-dst-Trusted" nodes [ "Bad-Nets.1.alm-Trusted" "Bad-Nets.2.alm-Trusted" ]
node new name "Bad-Nets.1.alm-DMZ" address "203.0.113.0/25" zone "DMZ"
node new name "Bad-Nets.2.alm-DMZ" address "192.0.2.66/32" zone "DMZ"
node group new name "Block Bad-dst-DMZ" nodes [ "Bad-Nets.1.alm-DMZ" "Bad-Nets.2.alm-DMZ" ]
node new name "Bad-Nets.1.alm-Guests" address "203.0.113.0/25" zone "Guests"
node new name "Bad-Nets.2.alm-Guests" address "192.0.2.66/32" zone "Guests"
node group new name "Block Bad-dst-Guests" nodes [ "Bad-Nets.1.alm-Guests" "Bad-Nets.2.alm-Guests" ]
node new name "Bad-Nets.1.alm-Lab" address "203.0.113.0/25" zone "Lab"
node new name "Bad-Nets.2.alm-Lab" address "192.0.2.66/32" zone "Lab"
node group new name "Block Bad-dst-Lab" nodes [ "Bad-Nets.1.alm-Lab" "Bad-Nets.2.alm-Lab" ]
node new name "any-v4-Guests" address "0.0.0.0/0" zone "Guests"
node new name "any-v6-Guests" address "::/0" zone "Guests"
node group new name "any-Guests" nodes [ "any-v4-Guests" "any-v6-Guests" ]
service new name "SSH" proto "tcp" dst-ports [ "22" ] src-ports [ ]
node new name "Admins.1.alm-1" address "10.10.5.10/31" zone "Trusted"
node new name "Admins.1.alm-2" address "10.10.5.12/30" zone "Trusted"
node new name "Admins.1.alm-3" address "10.10.5.16/30" zone "Trusted"
node new name "Admins.1.alm-4" address "10.10.5.20/32" zone "Trusted"
node group new name "Admins.1.alm" nodes [ "Admins.1.alm-1" "Admins.1.alm-2" "Admins.1.alm-3" "Admins.1.alm-4" ]
node new name "any-v4-External" address "0.0.0.0/0" zone "External"
node new name "any-v6-External" address "::/0" zone "External"
node group new name "any-External" nodes [ "any-v4-External" "any-v6-External" ]
service new name "Web Out-tcp-80" proto "tcp" dst-ports [ "80" ] src-ports [ ]
service new name "Web Out-tcp-443" proto "tcp" dst-ports [ "443" ] src-ports [ ]
service new name "Web Out-tcp-8000-8010" proto "tcp" dst-ports [ "8000-8010" ] src-ports [ ]
service group new name "Web Out" services [ "Web Out-tcp-80" "Web Out-tcp-443" "Web Out-tcp-8000-8010" ]
node new name "any-v4-DMZ" address "0.0.0.0/0" zone "DMZ"
node new name "any-v6-DMZ" address "::/0" zone "DMZ"
node group new name "any-DMZ" nodes [ "any-v4-DMZ" "any-v6-DMZ" ]
node new name "Web-Public.1.snat" address "198.51.100.10/32" zone "External"
node new name "Web-Public.1.snat-Trusted" address "198.51.100.10/32" zone "Trusted"
node new name "Web-Public.1.snat-DMZ" address "198.51.100.10/32" zone "DMZ"
node new name "Web-Public.1.snat-Guests" address "198.51.100.10/32" zone "Guests"
node new name "Web-Public.1.snat-Lab" address "198.51.100.10/32" zone "Lab"
service new name "SMTP" proto "tcp" dst-ports [ "25" ] src-ports [ ]
node new name "Mail-Public.1.snat" address "198.51.100.11/32" zone "External"
node new name "Mail-Public.1.snat-Trusted" address "198.51.100.11/32" zone "Trusted"
node new name "Mail-Public.1.snat-DMZ" address "198.51.100.11/32" zone "DMZ"
node new name "Mail-Public.1.snat-Guests" address "198.51.100.11/32" zone "Guests"
node new name "Mail-Public.1.snat-Lab" address "198.51.100.11/32" zone "Lab"
service new name "DNS-tcp-53" proto "tcp" dst-ports [ "53" ] src-ports [ ]
service new name "DNS-udp-53" proto "udp" dst-ports [ "53" ] src-ports [ ]
service group new name "DNS" services [ "DNS-tcp-53" "DNS-udp-53" ]
service new name "Ping" proto "icmp" icmp-types [ "8" ]
node new name "any-v4-Lab" address "0.0.0.0/0" zone "Lab"
node new name "any-v6-Lab" address "::/0" zone "Lab"
node group new name "any-Lab" nodes [ "any-v4-Lab" "any-v6-Lab" ]
service new name "Lab Tunnel" proto "gre" 
rule group new name "fwshift"
rule new group "fwshift" src "any-Trusted" dst "Block Bad-dst" service "any" comment "Block Bad" flags [ "DROP" "LOG_ALL" ]
rule new group "fwshift" src "any-Trusted" dst "Block Bad-dst-Trusted" service "any" comment "Block Bad" flags [ "DROP" "LOG_ALL" ]
rule new group "fwshift" src "any-Trusted" dst "Block Bad-dst-DMZ" service "any" comment "Block Bad" flags [ "DROP" "LOG_ALL" ]
rule new group "fwshift" src "any-Trusted" dst "Block Bad-dst-Guests" service "any" comment "Block Bad" flags [ "DROP" "LOG_ALL" ]
rule new group "fwshift" src "any-Trusted" dst "Block Bad-dst-Lab" service "any" comment "Block Bad" flags [ "DROP" "LOG_ALL" ]
rule new group "fwshift" src "any-Guests" dst "Block Bad-dst" service "any" comment "Block Bad" flags [ "DROP" "LOG_ALL" ]
rule new group "fwshift" src "any-Guests" dst "Block Bad-dst-Trusted" service "any" comment "Block Bad" flags [ "DROP" "LOG_ALL" ]
rule new group "fwshift" src "any-Guests" dst "Block Bad-dst-DMZ" service "any" comment "Block Bad" flags [ "DROP" "LOG_ALL" ]
rule new group "fwshift" src "any-Guests" dst "Block Bad-dst-Guests" service "any" comment "Block Bad" flags [ "DROP" "LOG_ALL" ]
rule new group "fwshift" src "any-Guests" dst "Block Bad-dst-Lab" service "any" comment "Block Bad" flags [ "DROP" "LOG_ALL" ]
rule new group "fwshift" src "Admins.1.alm" dst "any-External" service "SSH" comment "Admin SSH" flags [ "ACCEPT" "LOG_ALL" ]
rule new group "fwshift" src "any-Trusted" dst "any-External" service "Web Out" comment "Web Out" flags [ "ACCEPT" "LOG_ALL" ]
rule new group "fwshift" src "any-Guests" dst "any-External" service "Web Out" comment "Web Out" flags [ "ACCEPT" "LOG_ALL" ]
rule new group "fwshift" src "any-DMZ" dst "any-External" service "Web Out" comment "Web Out" flags [ "ACCEPT" "LOG_ALL" ]
rule new group "fwshift" src "any-External" dst "Web-Public.1.snat" service "Web Out-tcp-443" comment "Web In" flags [ "ACCEPT" "LOG_ALL" ]
rule new group "fwshift" src "any-External" dst "Web-Public.1.snat-Trusted" service "Web Out-tcp-443" comment "Web In" flags [ "ACCEPT" "LOG_ALL" ]
rule new group "fwshift" src "any-External" dst "Web-Public.1.snat-DMZ" service "Web Out-tcp-443" comment "Web In" flags [ "ACCEPT" "LOG_ALL" ]
rule new group "fwshift" src "any-External" dst "Web-Public.1.snat-Guests" service "Web Out-tcp-443" comment "Web In" flags [ "ACCEPT" "LOG_ALL" ]
rule new group "fwshift" src "any-External" dst "Web-Public.1.snat-Lab" service "Web Out-tcp-443" comment "Web In" flags [ "ACCEPT" "LOG_ALL" ]
rule new group "fwshift" src "any-External" dst "Mail-Public.1.snat" service "SMTP" comment "Mail In" flags [ "ACCEPT" "LOG_ALL" ]
rule new group "fwshift" src "any-External" dst "Mail-Public.1.snat-Trusted" service "SMTP" comment "Mail In" flags [ "ACCEPT" "LOG_ALL" ]
rule new group "fwshift" src "any-External" dst "Mail-Public.1.snat-DMZ" service "SMTP" comment "Mail In" flags [ "ACCEPT" "LOG_ALL" ]
rule new group "fwshift" src "any-External" dst "Mail-Public.1.snat-Guests" service "SMTP" comment "Mail In" flags [ "ACCEPT" "LOG_ALL" ]
rule new group "fwshift" src "any-External" dst "Mail-Public.1.snat-Lab" service "SMTP" comment "Mail In" flags [ "ACCEPT" "LOG_ALL" ]
