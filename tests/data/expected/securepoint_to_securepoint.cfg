# Securepoint UTM: commands of its CLI (spcli), written by FWShift. They add network objects, services and the
# rule group 'fwshift' with its rules, and delete nothing. Lines that start with '#' are not commands: leave them
# out when loading (grep -v '^#'). Nothing applies until 'system update rule', nothing is kept over a restart until
# 'system config save': run both yourself after reading the report (section 10 of the manual).
service new name "http_2" proto "tcp" dst-ports [ "80" ] src-ports [ ]
service new name "https_2" proto "tcp" dst-ports [ "443" ] src-ports [ ]
service new name "domain-udp_2" proto "udp" dst-ports [ "53" ] src-ports [ ]
service new name "icmp-echo-req_2" proto "icmp" icmp-types [ "8" ]
service new name "ftp_2" proto "tcp" dst-ports [ "21" ] src-ports [ ]
service group new name "default-internet_2" services [ "http_2" "https_2" "domain-udp_2" "icmp-echo-req_2" "ftp_2" ]
node new name "internal-network_2" address "192.168.10.0/24" zone "internal"
node new name "internet_2" address "0.0.0.0/0" zone "external"
service group new name "web" services [ "http_2" "https_2" ]
node new name "lan6" address "2001:db8:10::/64" zone "internal"
node new name "internet6" address "::/0" zone "external"
node new name "partner-net" address "10.20.0.0/16" zone "vpn-ipsec"
node new name "admin-pc" address "192.168.10.50/32" zone "internal"
node group new name "any-external" nodes [ "internet_2" "internet6" ]
node new name "any-v4-internal" address "0.0.0.0/0" zone "internal"
node new name "any-v6-internal" address "::/0" zone "internal"
node group new name "any-internal" nodes [ "any-v4-internal" "any-v6-internal" ]
node new name "any-v4-dmz1" address "0.0.0.0/0" zone "dmz1"
node new name "any-v6-dmz1" address "::/0" zone "dmz1"
node group new name "any-dmz1" nodes [ "any-v4-dmz1" "any-v6-dmz1" ]
node new name "any-v4-vpn-ipsec" address "0.0.0.0/0" zone "vpn-ipsec"
node new name "any-v6-vpn-ipsec" address "::/0" zone "vpn-ipsec"
node group new name "any-vpn-ipsec" nodes [ "any-v4-vpn-ipsec" "any-v6-vpn-ipsec" ]
service new name "icmpv6-echo" proto "icmpv6" icmp-types [ "128" ]
node new name "webserver" address "172.16.20.10/32" zone "dmz1"
node new name "external-interface_2" address "203.0.113.2/32" zone "dmz1"
node group new name "rule-18-dst" nodes [ "webserver" "external-interface_2" ]
service new name "smtp_2" proto "tcp" dst-ports [ "25" ] src-ports [ ]
node new name "mailserver" address "172.16.20.25/32" zone "dmz1"
service new name "ssh_2" proto "tcp" dst-ports [ "22" ] src-ports [ ]
node group new name "servers" nodes [ "webserver" "mailserver" ]
node new name "dmz1-network_2" address "172.16.20.0/24" zone "dmz1"
service new name "app-ports" proto "tcp" dst-ports [ "8000-8010" ] src-ports [ ]
node new name "printers-1" address "192.168.10.200/29" zone "internal"
node new name "printers-2" address "192.168.10.208/29" zone "internal"
node new name "printers-3" address "192.168.10.216/30" zone "internal"
node new name "printers-4" address "192.168.10.220/32" zone "internal"
node group new name "printers" nodes [ "printers-1" "printers-2" "printers-3" "printers-4" ]
service new name "extern-https" proto "tcp" dst-ports [ "8443" ] src-ports [ ]
node new name "external-interface-firewall-external" address "203.0.113.2/32" zone "firewall-external"
node new name "public-mail" address "203.0.113.5/32" zone "firewall-external"
rule group new name "fwshift"
rule new group "fwshift" src "internal-network_2" dst "internet_2" service "default-internet_2" comment "rule-1" flags [ "ACCEPT" "LOG_ALL" ]
rule new group "fwshift" src "lan6" dst "internet6" service "web" comment "rule-4" flags [ "ACCEPT" ]
rule new group "fwshift" src "partner-net" dst "internal-network_2" service "any" comment "rule-10" flags [ "ACCEPT" ]
# not written: rule-11 (the destination holds host name 'updates.example.com'; that a network object of the UTM takes a host name is not documented)
rule new group "fwshift" src "admin-pc" dst "any-external" service "icmp-echo-req_2" comment "rule-13" flags [ "ACCEPT" ]
rule new group "fwshift" src "admin-pc" dst "any-internal" service "icmp-echo-req_2" comment "rule-13" flags [ "ACCEPT" ]
rule new group "fwshift" src "admin-pc" dst "any-dmz1" service "icmp-echo-req_2" comment "rule-13" flags [ "ACCEPT" ]
rule new group "fwshift" src "admin-pc" dst "any-vpn-ipsec" service "icmp-echo-req_2" comment "rule-13" flags [ "ACCEPT" ]
# not written: rule-14 (not converted: NETMAP on the rule: which addresses its packet filter rule names is not documented)
rule new group "fwshift" src "lan6" dst "internet6" service "icmpv6-echo" comment "rule-15" flags [ "ACCEPT" ]
rule new group "fwshift" src "internet_2" dst "rule-18-dst" service "https_2" comment "rule-18" flags [ "DROP" ]
rule new group "fwshift" src "internet_2" dst "webserver" service "https_2" comment "rule-2" flags [ "ACCEPT" "LOG_ALL" ]
rule new group "fwshift" src "internet_2" dst "mailserver" service "smtp_2" comment "rule-6" flags [ "ACCEPT" ]
rule new group "fwshift" src "admin-pc" dst "servers" service "ssh_2" comment "rule-7" flags [ "ACCEPT" "LOG_ALL" ]
rule new group "fwshift" src "partner-net" dst "servers" service "ssh_2" comment "rule-7-2" flags [ "ACCEPT" "LOG_ALL" ]
rule new group "fwshift" src "dmz1-network_2" dst "internet_2" service "any" comment "rule-8" flags [ "ACCEPT" ]
rule new group "fwshift" src "internal-network_2" dst "dmz1-network_2" service "app-ports" comment "rule-12" flags [ "ACCEPT" ]
# not written: rule-16 (not converted: flag 'MIRROR' is not one FWShift reads)
rule new group "fwshift" src "printers" dst "internet_2" service "any" comment "rule-3" flags [ "DROP" ]
# not written: rule-9 (references 'blocked-region': address 'geoip:XX' is not a form FWShift reads)
rule new group "fwshift" src "internal-network_2" dst "mailserver" service "smtp_2" comment "rule-17" flags [ "DROP" ]
rule new group "fwshift" src "internal-network_2" dst "internet_2" service "default-internet_2" comment "rule-1-nat" flags [ "DROP" "HIDENAT" ] nat_node "external-interface"
rule new group "fwshift" src "partner-net" dst "internal-network_2" service "any" comment "rule-10-nat" flags [ "DROP" "HIDENAT_EXCLUDE" ]
rule new group "fwshift" src "internet_2" dst "webserver" service "https_2" comment "rule-2-nat" flags [ "DROP" "DESTNAT" ] nat_node "external-interface-firewall-external" nat_service "extern-https"
rule new group "fwshift" src "internet_2" dst "mailserver" service "smtp_2" comment "rule-6-nat" flags [ "DROP" "DESTNAT" ] nat_node "public-mail" nat_service "smtp_2"
rule new group "fwshift" src "dmz1-network_2" dst "internet_2" service "any" comment "rule-8-nat" flags [ "DROP" "HIDENAT" ] nat_node "external-interface"
