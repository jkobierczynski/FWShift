# Generated by FWShift: a network firewall policy for BIG-IP AFM. Read the report first: what is written
# disabled or not converted is listed there. Copy the file to the BIG-IP, then:
#
#   tmsh load sys config merge file /var/tmp/THIS_FILE verify     checks it, changes nothing
#   tmsh load sys config merge file /var/tmp/THIS_FILE            creates the objects and the policy
#
# It creates address lists, port lists, the rule list /Common/FWShift_rules and the policy /Common/FWShift, and
# enforces the policy nowhere. Objects of the same name are changed by the merge: check that none exists.
# Attach the policy to a context yourself, for example:
#   tmsh modify security firewall global-rules enforced-policy /Common/FWShift
#   tmsh modify net route-domain /Common/0 fw-enforced-policy /Common/FWShift
#   tmsh modify ltm virtual /Common/VS fw-enforced-policy /Common/FWShift
# The BIG-IP lets through only traffic that a virtual server takes.
security firewall address-list /Common/time.example.org {
    fqdns {
        time.example.org { }
    }
}
security firewall address-list /Common/x_.example.com {
    fqdns {
        *.example.com { }
    }
}
security firewall address-list /Common/updates.example.net {
    fqdns {
        updates.example.net { }
    }
}
security firewall address-list /Common/ipg-dns {
    addresses {
        10.10.8.8/31 { }
    }
    description "IP group /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-hub/providers/Microsoft.Network/ipGroups/ipg-dns"
}
