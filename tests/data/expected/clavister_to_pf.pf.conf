# Generated by FWShift - review the conversion report before loading this.
# A ruleset for the pf anchor "fwshift" (OpenBSD; FreeBSD 15 and later). Check it with
# 'pfctl -vnf FILE -a fwshift', load it with 'pfctl -a fwshift -f FILE': nothing outside the anchor changes.
# The main ruleset decides where the anchor is evaluated: it needs a line 'anchor "fwshift"'.

# The interface (or interface group) of each zone.
fws_if_lan = "lan"
fws_if_dmz = "dmz"
fws_if_wan = "wan"
fws_if_guest = "guest"

# Tables.
table <fws_admin_hosts> const { 192.168.10.5 192.168.10.6 192.168.10.32/28 }
table <fws_servers> const { 172.16.20.80 172.16.20.25 }

# What arrives on the interface of a zone is marked with the zone.
match in on $fws_if_lan tag fws_lan
match in on $fws_if_dmz tag fws_dmz
match in on $fws_if_wan tag fws_wan
match in on $fws_if_guest tag fws_guest

# Destination NAT, first match, and what the rules may allow is let in: they decide when it leaves.
pass in quick on $fws_if_wan inet proto tcp from any to 203.0.113.10 port { 80 443 } rdr-to 172.16.20.80 label "allow_web+sat_web"
pass in quick on { $fws_if_lan $fws_if_guest } inet proto tcp from any to 203.0.113.10 port 25 rdr-to 172.16.20.25 label "nat_mail+sat_mail"
pass in quick on $fws_if_wan inet proto tcp from any to 203.0.113.10 port 25 rdr-to 172.16.20.25 label "allow_mail+sat_mail"
pass in quick on $fws_if_wan inet proto tcp from any to 203.0.113.20/30 port { 80 443 8080:8090 } rdr-to 172.16.20.100/30 bitmask label "allow_pool+sat_pool"
pass in quick on $fws_if_wan inet proto tcp from any to 203.0.113.12 port 443 rdr-to 172.16.20.80 port 8443 label "pol_dmz_https"
# disabled in the source: pass in quick on $fws_if_wan inet proto tcp from any to 203.0.113.10 port 21 rdr-to 172.16.20.21 label "sat_unused"
pass in quick on $fws_if_wan inet proto tcp from any to 172.16.20.80 port { 80 443 } label "allow_web+sat_web"
pass in quick on { $fws_if_lan $fws_if_guest } inet proto tcp from any to 172.16.20.25 port 25 label "nat_mail+sat_mail"
pass in quick on $fws_if_wan inet proto tcp from any to 172.16.20.25 port 25 label "allow_mail+sat_mail"
pass in quick on $fws_if_wan inet proto tcp from any to 172.16.20.100/30 port { 80 443 8080:8090 } label "allow_pool+sat_pool"
pass in quick on $fws_if_guest inet proto { tcp udp } from 10.30.0.0/24 to ! self port 53 label "to_guest/guest_dns"
pass in quick on $fws_if_guest inet proto tcp from 10.30.0.0/24 to ! self port { 80 443 } label "to_guest/guest_web"
pass in quick on $fws_if_lan proto tcp from <fws_admin_hosts> to <fws_servers> port { 22 443 } label "admin_mgmt"
pass in quick on $fws_if_lan inet proto { tcp udp } from 192.168.10.0/24 to ! self port 53 label "lan_dns"
pass in quick on $fws_if_lan inet proto tcp from 192.168.10.0/24 to ! self port { 80 443 8080:8090 } label "lan_web"
pass in quick on $fws_if_lan proto tcp from 192.168.10.0/24 to updates.example.com port 443 label "lan_updates"
pass in quick on $fws_if_lan from 192.168.10.0/24 to 172.16.20.0/24 label "lan_to_dmz"
pass in quick on $fws_if_dmz proto udp from 172.16.20.0/24 port 1024:65535 to 192.168.10.50 port 514 label "syslog_fast"
pass in quick on $fws_if_lan proto tcp from 2001:db8:10::/64 to 2001:db8:20::80 port { 80 443 } label "lan6_web"
pass in quick on $fws_if_lan inet6 proto icmp6 from 2001:db8:10::/64 to ! self icmp6-type 128 label "lan6_ping"
pass in quick on $fws_if_wan inet proto tcp from any to 172.16.20.80 port 8443 label "pol_dmz_https"
pass in quick on $fws_if_dmz inet proto tcp from 172.16.20.0/24 to ! self port { 80 443 } label "pol_dmz_out"

# The rules, first match, when the traffic leaves: the tag says the zone it came from.
# FWSHIFT disabled, see the report: "drop_netbios" from any to any; source 0.0.0.0/0; destination 0.0.0.0/0; service netbios-all; action drop
match out on $fws_if_dmz inet proto tcp from any to 172.16.20.80 port { 80 443 } tagged fws_wan tag fws_ok_wan label "allow_web+sat_web"
block return-rst out quick on $fws_if_dmz proto tcp from 198.51.100.0/24 to 172.16.20.25 port 25 tagged fws_wan label "block_bad_mail+sat_mail"
match out on $fws_if_dmz inet proto tcp from any to 172.16.20.25 port 25 tagged fws_lan tag fws_ok_lan label "nat_mail+sat_mail"
match out on $fws_if_dmz inet proto tcp from any to 172.16.20.25 port 25 tagged fws_guest tag fws_ok_guest label "nat_mail+sat_mail"
match out on $fws_if_dmz inet proto tcp from any to 172.16.20.25 port 25 tagged fws_wan tag fws_ok_wan label "allow_mail+sat_mail"
match out on $fws_if_dmz inet proto tcp from any to 172.16.20.100/30 port { 80 443 8080:8090 } tagged fws_wan tag fws_ok_wan label "allow_pool+sat_pool"
match out on $fws_if_wan inet proto { tcp udp } from 10.30.0.0/24 to any port 53 tagged fws_guest tag fws_ok_guest label "to_guest/guest_dns"
match out on $fws_if_wan inet proto tcp from 10.30.0.0/24 to any port { 80 443 } tagged fws_guest tag fws_ok_guest label "to_guest/guest_web"
# disabled in the source: "to_guest/guest_never" from guest to dmz; source guest_net; destination dmz_net; service any; action allow
match out on $fws_if_dmz proto tcp from <fws_admin_hosts> to <fws_servers> port { 22 443 } tagged fws_lan tag fws_ok_lan label "admin_mgmt"
match out on $fws_if_wan inet proto { tcp udp } from 192.168.10.0/24 to any port 53 tagged fws_lan tag fws_ok_lan label "lan_dns"
match out on $fws_if_wan inet proto tcp from 192.168.10.0/24 to any port { 80 443 8080:8090 } tagged fws_lan tag fws_ok_lan label "lan_web"
match out on $fws_if_wan proto tcp from 192.168.10.0/24 to updates.example.com port 443 tagged fws_lan tag fws_ok_lan label "lan_updates"
match out on $fws_if_dmz from 192.168.10.0/24 to 172.16.20.0/24 tagged fws_lan tag fws_ok_lan label "lan_to_dmz"
match out on $fws_if_lan proto udp from 172.16.20.0/24 port 1024:65535 to 192.168.10.50 port 514 tagged fws_dmz tag fws_ok_dmz label "syslog_fast"
# FWSHIFT disabled, see the report: "gre_tunnel" from dmz to wan; source 172.16.20.9/32; destination 198.51.100.7/32; service gre; action allow
# disabled in the source: "old_rule" from wan to dmz; source 0.0.0.0/0; destination servers; service ftp-alg; action allow
match out on $fws_if_dmz proto tcp from 2001:db8:10::/64 to 2001:db8:20::80 port { 80 443 } tagged fws_lan tag fws_ok_lan label "lan6_web"
match out inet6 proto icmp6 from 2001:db8:10::/64 to any icmp6-type 128 tagged fws_lan tag fws_ok_lan label "lan6_ping"
match out on $fws_if_dmz inet proto tcp from any to 172.16.20.80 port 8443 tagged fws_wan tag fws_ok_wan label "pol_dmz_https"
match out on $fws_if_wan inet proto tcp from 172.16.20.0/24 to any port { 80 443 } tagged fws_dmz tag fws_ok_dmz label "pol_dmz_out"
block return-rst out quick on $fws_if_dmz inet proto tcp from any to 172.16.20.0/24 port 21 tagged fws_lan label "pol_block_ftp"
block return-rst out quick on $fws_if_dmz inet proto tcp from any to 172.16.20.0/24 port 21 tagged fws_dmz label "pol_block_ftp"
block return-rst out quick on $fws_if_dmz inet proto tcp from any to 172.16.20.0/24 port 21 tagged fws_wan label "pol_block_ftp"
block return-rst out quick on $fws_if_dmz inet proto tcp from any to 172.16.20.0/24 port 21 tagged fws_guest label "pol_block_ftp"
block drop out quick inet from any to any tagged fws_lan label "DropAll"
block drop out quick inet from any to any tagged fws_dmz label "DropAll"
block drop out quick inet from any to any tagged fws_wan label "DropAll"
block drop out quick inet from any to any tagged fws_guest label "DropAll"
block drop out quick inet6 from any to any tagged fws_lan label "DropAll6"
block drop out quick inet6 from any to any tagged fws_dmz label "DropAll6"
block drop out quick inet6 from any to any tagged fws_wan label "DropAll6"
block drop out quick inet6 from any to any tagged fws_guest label "DropAll6"

# What no rule decided: the default of the source.
block drop out quick tagged fws_lan
block drop out quick tagged fws_dmz
block drop out quick tagged fws_wan
block drop out quick tagged fws_guest

# Source NAT, first match, of what the rules allowed.
match out inet proto tcp from any to 172.16.20.25 port 25 tagged fws_ok_lan nat-to ($fws_if_dmz) tag fws_nat label "nat_mail+sat_mail"
match out inet proto tcp from any to 172.16.20.25 port 25 tagged fws_ok_guest nat-to ($fws_if_dmz) tag fws_nat label "nat_mail+sat_mail"
match out on $fws_if_wan inet proto { tcp udp } from 10.30.0.0/24 to any port 53 tagged fws_ok_guest nat-to ($fws_if_wan) tag fws_nat label "to_guest/guest_dns"
match out on $fws_if_wan inet proto tcp from 10.30.0.0/24 to any port { 80 443 } tagged fws_ok_guest nat-to ($fws_if_wan) tag fws_nat label "to_guest/guest_web"
match out on $fws_if_wan inet proto { tcp udp } from 192.168.10.0/24 to any port 53 tagged fws_ok_lan nat-to ($fws_if_wan) tag fws_nat label "lan_dns"
match out on $fws_if_wan inet proto tcp from 192.168.10.0/24 to any port { 80 443 8080:8090 } tagged fws_ok_lan nat-to 203.0.113.11 tag fws_nat label "lan_web"
match out on $fws_if_wan inet proto tcp from 192.168.10.0/24 to updates.example.com port 443 tagged fws_ok_lan nat-to ($fws_if_wan) tag fws_nat label "lan_updates"
match out on $fws_if_wan inet proto tcp from 172.16.20.0/24 to any port { 80 443 } tagged fws_ok_dmz nat-to ($fws_if_wan) tag fws_nat label "pol_dmz_out"

# Pass what the rules allowed.
pass out quick tagged fws_ok_lan
pass out quick tagged fws_ok_dmz
pass out quick tagged fws_ok_wan
pass out quick tagged fws_ok_guest
pass out quick tagged fws_nat
