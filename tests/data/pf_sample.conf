# FWShift sample: a synthetic pf.conf (OpenBSD syntax) for the parser tests and the golden conversions.
# Documentation addresses only (RFC 1918, RFC 5737, RFC 3849); no real network.

# -- macros --------------------------------------------------------------------
ext_if = "em0"
int_if = "em1"
dmz_if = "em2"
lan_net = "10.10.0.0/16"
dmz_net = "10.20.1.0/24"
web_srv = "10.20.1.10"
mail_srv = "10.20.1.25"
public_web = "203.0.113.10"
public_mail = "203.0.113.25"
web_ports = "{ 80, 443 }"
admin_hosts = "{ 10.10.5.10, 10.10.5.11 }"
all_inside = "{" $int_if $dmz_if "}"

# -- tables --------------------------------------------------------------------
table <bogons> const { 0.0.0.0/8, 127.0.0.0/8, 169.254.0.0/16, 192.0.2.0/24, \
                       240.0.0.0/4 }
table <partners> const { 198.51.100.0/24, !198.51.100.128/25, 2001:db8:100::/48 }
table <bruteforce> persist
table <spamd> persist file "/etc/mail/spamd.list"

# -- options -------------------------------------------------------------------
set skip on lo
set block-policy return
set limit states 100000
set optimization normal

# -- normalisation and queues: they decide nothing --------------------------------
match in all scrub (no-df random-id max-mss 1440)

# -- translation ---------------------------------------------------------------
# The inside networks leave behind the address of the outside interface.
match out on $ext_if inet from $lan_net to any nat-to ($ext_if)
match out on $ext_if inet from $dmz_net to any nat-to 203.0.113.5 static-port
# The published web server: the rules below see its inside address.
match in on $ext_if inet proto tcp from any to $public_web port $web_ports rdr-to $web_srv
# The published mail server: translated when this pass rule decides.
pass in quick on $ext_if inet proto tcp from <partners> to $public_mail port smtp rdr-to $mail_srv

# -- filter rules: last match wins unless quick -------------------------------------
antispoof quick for $int_if inet

block all
block in quick from <bogons> label "bogons"
block in quick on $ext_if from <bruteforce> label "brute force"
block in quick on $ext_if from <spamd>
pass out quick on $ext_if keep state

# The inside may go out; X11 ports are blocked (a later rule, so it wins over the pass).
pass in on $int_if from $lan_net to any
block in on $int_if proto tcp from any to any port 6000:6010

# Web server, reached on its inside address after rdr-to.
pass in on $ext_if inet proto tcp from any to $web_srv port $web_ports flags S/SA \
    keep state (max-src-conn 100, max-src-conn-rate 15/5, overload <bruteforce> flush global)

# Admins reach the DMZ network by SSH, decided at once.
pass in quick on $int_if inet proto tcp from $admin_hosts to $dmz_if:network port ssh label "admin ssh"

# DNS from the web server; ping between the inside interfaces; ICMPv6 echo from the LAN.
pass in on $dmz_if proto udp from $web_srv to any port domain
pass in on $all_inside inet proto icmp icmp-type { echoreq, unreach code needfrag }
pass in on $int_if inet6 proto icmp6 icmp6-type echoreq

# Everyone but the admins reaches the mail server's SSH: '!' before a list element.
pass in on $int_if proto tcp from { ! 10.10.5.10, ! 10.10.5.11 } to $mail_srv port 22

# What leaves towards the DMZ: everything, but never telnet to the mail server.
block out quick on $dmz_if proto tcp from any to $mail_srv port telnet
block out on $dmz_if proto tcp to any port 3306
pass out on $dmz_if keep state
block out on $dmz_if proto udp to $dmz_net port { 137:139 }

# Port operators and ranges.
pass in on $int_if proto tcp from $lan_net to 10.20.0.0/16 port != 25
pass in on $int_if proto udp from $lan_net to 10.20.2.0/24 port 1000 >< 1010
pass in on $int_if proto tcp from $lan_net to 10.20.3.0/24 port 1024 <> 2048
block return-rst in on $int_if proto tcp to port 113

# Stateless GRE, a host name, an IPv6 range, an older-style redirect of traffic.
pass in log on $int_if proto gre from $lan_net to 198.51.100.7 no state
pass in on $int_if proto tcp from $lan_net to www.example.com port https
pass in on $int_if inet6 from 2001:db8:10::/48 to 2001:db8:20::1 - 2001:db8:20::ff
pass in on $int_if proto tcp from $lan_net to 198.51.100.80 port 3128 route-to (em3 10.30.0.1)

# Things that cannot be converted.
pass in on $int_if proto tcp from $lan_net to port 8080 tagged INTERNAL
pass in on $int_if proto tcp from $lan_net to (egress) port 8443
pass in on $int_if proto tcp from $lan_net to port 9000 user proxy

anchor "relayd/*"
