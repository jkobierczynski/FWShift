! Synthetic configuration for FWShift tests (ZLD 5.x style, USG FLEX). No real network.
! RFC 1918, RFC 5737 and RFC 3849 addresses only.
!
interface ge1
 ip address 198.51.100.2 255.255.255.0
 type external
!
interface ge3
 ip address 10.10.0.1 255.255.255.0
 type internal
!
interface ge4
 ip address 10.20.0.1/24
 type internal
!
interface ge5
 ip address 10.30.0.1 255.255.255.0
 type internal
!
interface ge6
 ip address dhcp
 type internal
!
interface ge7
 ip address 10.40.0.1 255.255.255.0
!
zone WAN
 interface ge1
!
zone LAN1
 interface ge3
 interface ge4
!
zone DMZ
 interface ge5
 block
!
zone LAB
 interface ge6
!
address-object LAN1_SUBNET interface-subnet ge3
address-object LAN2_SUBNET interface-subnet ge4
address-object LAB_SUBNET interface-subnet ge6
address-object WAN_IP interface-ip ge1
address-object WEB_SRV 10.30.0.10
address-object MAIL_SRV 10.30.0.25
address-object ADMIN_PCS 10.10.0.50-10.10.0.59
address-object PARTNER_NET 203.0.113.0 255.255.255.128
address-object MONITOR 192.0.2.0/24
address-object PUBLIC_WEB 198.51.100.10
address-object PUBLIC_RANGE 198.51.100.20-198.51.100.23
address-object INSIDE_RANGE 10.30.0.20-10.30.0.23
address-object PORTAL fqdn portal.example.com
address-object COUNTRY_X geography XX
address6-object V6_LAN 2001:db8:10::/64
address6-object V6_DMZ_WEB 2001:db8:30::10
address6-object V6_ADMIN 2001:db8:10::50-2001:db8:10::59
!
object-group address SERVERS
 description DMZ servers
 address-object WEB_SRV
 address-object MAIL_SRV
!
object-group address ALL_INTERNAL
 address-object LAN1_SUBNET
 address-object LAN2_SUBNET
 object-group SERVERS
!
object-group address6 V6_ADMINS
 address6-object V6_ADMIN
!
service-object HTTP tcp eq 80
service-object HTTPS tcp eq 443
service-object SSH tcp eq 22
service-object DNS_UDP udp eq 53
service-object DNS_TCP tcp eq 53
service-object SMTP tcp eq 25
service-object WEB_ALT tcp range 8080 8089
service-object HTTPS_8443 tcp eq 8443
service-object Any_TCP tcp range 1 65535
service-object PING icmp echo
service-object TRACE icmp 11
service-object PING6 icmpv6 echo-request
service-object GRE protocol 47
service-object ESP protocol 50
!
object-group service DNS
 service-object DNS_UDP
 service-object DNS_TCP
!
object-group service WEB
 service-object HTTP
 service-object HTTPS
 service-object WEB_ALT
 service-object HTTPS_8443
!
object-group service MGMT
 service-object SSH
 object-group WEB
!
schedule-object WORKHOURS 08:00 18:00 mon tue wed thu fri
!
username alice user-type user
!
secure-policy activate
secure-policy default-rule action deny log
secure-policy6 default-rule action deny no log
!
secure-policy 1
 name LAN1_Outgoing
 description "LAN1 to the internet"
 from LAN1
 to WAN
 sourceip ALL_INTERNAL
 destinationip any
 service any
 user any
 schedule none
 action allow
 log
 activate
!
secure-policy 2
 name Block_Partner_SSH
 from WAN
 to DMZ
 sourceip PARTNER_NET
 destinationip SERVERS
 service SSH
 action deny
 log alert
 activate
!
secure-policy 3
 name WAN_to_Web
 from WAN
 to DMZ
 sourceip any
 destinationip WEB_SRV
 service WEB
 action allow
 activate
!
secure-policy 4
 name WAN_to_Mail
 from WAN
 to DMZ
 destinationip MAIL_SRV
 service SMTP
 action allow
 log
 activate
!
secure-policy 5
 name Admin_Mgmt
 from LAN1
 to DMZ
 sourceip ADMIN_PCS
 destinationip SERVERS
 service MGMT
 action allow
 av-profile default_av log by-profile activate
 activate
!
secure-policy 6
 name LAN1_to_DMZ_Reject
 from LAN1
 to DMZ
 action reject
 log
 activate
!
secure-policy 7
 name Monitor_Ping
 from any
 to any
 sourceip MONITOR
 service PING
 action allow
 activate
!
secure-policy 8
 name Old_Rule
 from LAN1
 to LAB
 service GRE
 action allow
 no activate
!
secure-policy 9
 name Alice_Workhours
 from LAN1
 to WAN
 user alice
 schedule WORKHOURS
 service HTTPS
 action allow
 activate
!
secure-policy 10
 name DNS_From_Port
 from LAN1
 to WAN
 sourceport udp range 1024 65535
 service DNS
 action allow
 activate
!
secure-policy 11
 name Country_Block
 from WAN
 to any
 sourceip COUNTRY_X
 action deny
 activate
!
secure-policy 12
 name Portal_Access
 from LAN1
 to WAN
 destinationip PORTAL
 service HTTPS
 action allow
 activate
!
secure-policy 13
 name VS_Only
 from WAN
 to DMZ
 ctmatch dnat
 action allow
 activate
!
secure-policy 14
 name LAN1_to_Device
 from LAN1
 to ZyWALL
 service MGMT
 action allow
 activate
!
secure-policy 15
 name ESP_Out
 from DMZ
 to WAN
 sourceip INSIDE_RANGE
 service ESP
 action allow
 activate
!
secure-policy6 1
 name V6_LAN_Out
 from LAN1
 to WAN
 sourceip6 V6_LAN
 action allow
 activate
!
secure-policy6 2
 name V6_Admin_Web
 from LAN1
 to DMZ
 sourceip6 V6_ADMINS
 destinationip6 V6_DMZ_WEB
 service MGMT
 action allow
 activate
!
secure-policy6 3
 name V6_Ping
 from any
 to any
 service PING6
 action allow
 activate
!
ip virtual-server WEB_VS interface ge1 original-ip PUBLIC_WEB map-to WEB_SRV map-type port protocol tcp original-port 443 mapped-port 8443 nat-loopback
ip virtual-server MAIL_VS interface ge1 original-ip 198.51.100.11 map-to MAIL_SRV map-type port protocol tcp original-port 25 mapped-port 25
ip virtual-server ALT_VS interface ge1 original-ip any map-to 10.30.0.12 map-type ports protocol tcp original-port-begin 8080 original-port-end 8089 mapped-port-begin 8080
ip virtual-server ONE2ONE interface ge1 original-ip 198.51.100.30 map-to 10.30.0.30 map-type any nat-1-1-map
ip virtual-server MANY2ONE interface ge1 original-ip PUBLIC_RANGE map-to INSIDE_RANGE map-type any nat-1-1-map
ip virtual-server OLD_VS interface ge1 original-ip 198.51.100.40 map-to 10.30.0.40 map-type port protocol udp original-port 5060 mapped-port 5060 deactivate
!
policy 1
 description "lab traffic routed as is"
 interface ge6
 source LAB_SUBNET
 destination any
 next-hop auto
!
policy 2
 description "LAN1 out with the WAN address"
 interface ge3
 source LAN1_SUBNET
 destination any
 service any
 next-hop interface ge1
 snat outgoing-interface
!
policy 3
 description "DMZ out with a pool"
 interface ge5
 source SERVERS
 next-hop auto
 snat pool PUBLIC_RANGE
!
policy 4
 description "routing only, after the last SNAT"
 interface ge4
 next-hop auto
!
