#config-version=FGT60F-7.2.8-FW-build1639-240313:opmode=0:vdom=0:user=admin
#conf_file_ver=1
# Synthetic FortiOS configuration for fwshift tests. Not taken from any real network.
# Addresses come from RFC 1918, RFC 5737 and RFC 3849 documentation ranges.
config system global
    set hostname "fw-sample"
end
config system interface
    edit "wan1"
        set vdom "root"
        set ip 198.51.100.1 255.255.255.0
        set type physical
    next
    edit "internal1"
        set vdom "root"
        set ip 10.10.0.1 255.255.0.0
    next
    edit "internal2"
        set vdom "root"
        set ip 10.11.0.1 255.255.0.0
    next
    edit "dmz"
        set vdom "root"
        set ip 10.20.0.1 255.255.255.0
    next
    edit "ot"
        set vdom "root"
        set ip 10.30.1.1 255.255.255.0
    next
end
config system zone
    edit "lan"
        set interface "internal1" "internal2"
    next
end
config router static
    edit 1
        set gateway 198.51.100.254
        set device "wan1"
    next
end
config firewall address
    edit "all"
    next
    edit "lan-net"
        set subnet 10.10.0.0 255.254.0.0
        set comment "Office \"LAN\" networks"
    next
    edit "web-1"
        set subnet 10.20.0.10 255.255.255.255
    next
    edit "mail-1"
        set subnet 10.20.0.25 255.255.255.255
    next
    edit "admin-range"
        set type iprange
        set start-ip 10.10.5.10
        set end-ip 10.10.5.20
    next
    edit "updates.example.com"
        set type fqdn
        set fqdn "updates.example.com"
    next
    edit "geo-blocked"
        set type geography
        set country "KP"
    next
    edit "10.99.0.0/16"
        set subnet 10.99.0.0 255.255.0.0
    next
    edit "scada-server"
        set subnet 10.10.7.15 255.255.255.255
    next
    edit "plc-net"
        set subnet 10.30.1.0 255.255.255.0
    next
end
config firewall address6
    edit "all"
    next
    edit "lan6-net"
        set ip6 2001:db8:10::/48
    next
end
config firewall addrgrp
    edit "dmz-servers"
        set member "web-1" "mail-1"
    next
    edit "internal-all"
        set member "lan-net" "dmz-servers"
        set comment "Nested group"
    next
end
config firewall service custom
    edit "ALL"
        set category "General"
        set protocol IP
    next
    edit "ALL_ICMP"
        set category "General"
        set protocol ICMP
        unset icmptype
    next
    edit "PING"
        set category "Network Services"
        set protocol ICMP
        set icmptype 8
        unset icmpcode
    next
    edit "HTTP"
        set category "Web Access"
        set tcp-portrange 80
    next
    edit "HTTPS"
        set category "Web Access"
        set tcp-portrange 443
    next
    edit "DNS"
        set category "Network Services"
        set tcp-portrange 53
        set udp-portrange 53
    next
    edit "SMTP"
        set category "Email"
        set tcp-portrange 25
    next
    edit "SSH"
        set category "Remote Access"
        set tcp-portrange 22
    next
    edit "GRE"
        set category "Tunneling"
        set protocol IP
        set protocol-number 47
    next
    edit "MODBUS"
        set tcp-portrange 502
    next
    edit "app-ports"
        set tcp-portrange 8080 8443 9000-9010
        set comment "Application server"
    next
    edit "syslog-from-high"
        set udp-portrange 514:1024-65535
    next
    edit "TIMESTAMP"
        set protocol ICMP
        set icmptype 13
    next
end
config firewall service group
    edit "Web Access"
        set member "HTTP" "HTTPS"
    next
    edit "basic-net"
        set member "DNS" "PING"
    next
end
config firewall vip
    edit "vip-web"
        set extip 203.0.113.10
        set mappedip "10.20.0.10"
        set extintf "wan1"
        set portforward enable
        set extport 443
        set mappedport 8443
    next
    edit "vip-mail"
        set extip 203.0.113.25
        set mappedip "10.20.0.25"
        set extintf "wan1"
    next
end
config firewall ippool
    edit "dmz-pool"
        set startip 198.51.100.20
        set endip 198.51.100.23
    next
end
config firewall policy
    edit 1
        set name "LAN to Internet"
        set uuid 11111111-1111-4111-8111-111111111111
        set srcintf "lan"
        set dstintf "wan1"
        set action accept
        set srcaddr "lan-net"
        set dstaddr "all"
        set schedule "always"
        set service "Web Access" "DNS"
        set utm-status enable
        set ssl-ssh-profile "certificate-inspection"
        set av-profile "default"
        set logtraffic all
        set nat enable
    next
    edit 2
        set name "LAN basics"
        set srcintf "lan"
        set dstintf "wan1"
        set action accept
        set srcaddr "all"
        set dstaddr "all"
        set schedule "always"
        set service "basic-net"
        set nat enable
    next
    edit 3
        set name "Inbound web"
        set srcintf "wan1"
        set dstintf "dmz"
        set action accept
        set srcaddr "all"
        set dstaddr "vip-web"
        set schedule "always"
        set service "app-ports"
        set logtraffic all
        set logtraffic-start enable
    next
    edit 4
        set name "Inbound mail"
        set srcintf "wan1"
        set dstintf "dmz"
        set action accept
        set srcaddr "all"
        set dstaddr "vip-mail"
        set schedule "always"
        set service "SMTP"
    next
    edit 5
        set name "Admins to DMZ"
        set srcintf "lan"
        set dstintf "dmz"
        set action accept
        set srcaddr "admin-range"
        set dstaddr "dmz-servers"
        set schedule "always"
        set service "SSH"
        set groups "netadmins"
    next
    edit 6
        set name "Block geo"
        set srcintf "any"
        set dstintf "wan1"
        set srcaddr "all"
        set dstaddr "geo-blocked"
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
    edit 7
        set name "DMZ out via pool"
        set srcintf "dmz"
        set dstintf "wan1"
        set action accept
        set srcaddr "dmz-servers"
        set dstaddr "updates.example.com"
        set schedule "always"
        set service "HTTPS"
        set nat enable
        set ippool enable
        set poolname "dmz-pool"
    next
    edit 8
        set name "SCADA to PLCs"
        set srcintf "lan"
        set dstintf "ot"
        set action accept
        set srcaddr "scada-server"
        set dstaddr "plc-net"
        set schedule "always"
        set service "MODBUS"
        set logtraffic all
        set comments "Engineering access to the controllers"
    next
    edit 9
        set name "OT no internet"
        set srcintf "ot"
        set dstintf "wan1"
        set srcaddr "all"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
    edit 10
        set name "Partner tunnel"
        set srcintf "lan"
        set dstintf "wan1"
        set action accept
        set srcaddr "lan-net"
        set dstaddr "10.99.0.0/16"
        set schedule "always"
        set service "GRE" "syslog-from-high"
    next
    edit 11
        set name "LAN v6 out"
        set srcintf "lan"
        set dstintf "wan1"
        set action accept
        set srcaddr6 "lan6-net"
        set dstaddr6 "all"
        set schedule "always"
        set service "HTTPS"
    next
    edit 12
        set srcintf "lan"
        set dstintf "dmz"
        set action accept
        set srcaddr "lan-net"
        set dstaddr "web-1"
        set schedule "office-hours"
        set service "HTTP"
    next
    edit 13
        set name "Not web"
        set srcintf "dmz"
        set dstintf "wan1"
        set action accept
        set srcaddr "web-1"
        set dstaddr "all"
        set schedule "always"
        set service "Web Access"
        set service-negate enable
        set status disable
    next
    edit 14
        set name "Timestamp probes"
        set srcintf "lan"
        set dstintf "dmz"
        set action accept
        set srcaddr "admin-range"
        set dstaddr "dmz-servers"
        set schedule "always"
        set service "TIMESTAMP"
        set fixedport enable
    next
end
