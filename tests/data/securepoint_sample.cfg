# Synthetic Securepoint UTM packet filter, written as commands of its CLI (spcli). Not from a real network.
extc value set application "securepoint_firewall" variable "LASTRULE_LOGGING" value [ "1" ]
interface zone new name "external" interface "eth0"
interface zone new name "firewall-external" interface "eth0" flags [ "INTERFACE" ]
interface zone new name "internal" interface "eth1"
interface zone new name "firewall-internal" interface "eth1" flags [ "INTERFACE" ]
interface zone new name "dmz1" interface "eth2"
interface zone new name "firewall-dmz1" interface "eth2" flags [ "INTERFACE" ]
interface zone new name "vpn-ipsec" interface "" flags [ "POLICY_IPSEC" ]
interface address new device "eth0" address "203.0.113.2/29"
interface address new device "eth1" address "192.168.10.1/24"
interface address new device "eth2" address "172.16.20.1/24"
node new name "internet" address "0.0.0.0/0" zone "external"
node new name "internet6" address "::/0" zone "external"
node new name "internal-network" address "eth1" zone "internal"
node new name "internal-interface" address "eth1" zone "firewall-internal"
node new name "external-interface" address "eth0" zone "firewall-external"
node new name "dmz1-network" address "eth2" zone "dmz1"
node new name "public-mail" address "203.0.113.5/32" zone "firewall-external"
node new name "webserver" address "172.16.20.10/32" zone "dmz1"
node new name "mailserver" address "172.16.20.25/32" zone "dmz1"
node new name "admin-pc" address "192.168.10.50/32" zone "internal"
node new name "printers" address "192.168.10.200-192.168.10.220" zone "internal"
node new name "lan6" address "2001:db8:10::/64" zone "internal"
node new name "partner-net" address "10.20.0.0/16" zone "vpn-ipsec"
node new name "update-host" address "updates.example.com" zone "external"
node new name "blocked-region" address "geoip:XX" zone "external"
node group new name "servers" nodes [ "webserver" "mailserver" ]
node group new name "admins-and-partner" nodes [ "admin-pc" "partner-net" ]
service new name "http" proto "tcp" ct_helper "" dst-ports [ "80" ] src-ports [ ]
service new name "https" proto "tcp" ct_helper "" dst-ports [ "443" ] src-ports [ ]
service new name "extern-https" proto "tcp" ct_helper "" dst-ports [ "8443" ] src-ports [ ]
service new name "smtp" proto "tcp" ct_helper "" dst-ports [ "25" ] src-ports [ ]
service new name "domain-udp" proto "udp" ct_helper "" dst-ports [ "53" ] src-ports [ ]
service new name "ntp-client" proto "udp" ct_helper "" dst-ports [ "123" ] src-ports [ "1024-65535" ]
service new name "app-ports" proto "tcp" ct_helper "" dst-ports [ "8000-8010" ] src-ports [ ]
service new name "icmp-echo-req" proto "icmp" icmp-types [ "8" ]
service new name "icmpv6-echo" proto "icmpv6" icmp-types [ "echo-request" ]
service new name "gre" proto "gre"
service new name "ftp" proto "tcp" ct_helper "ftp" dst-ports [ "21" ] src-ports [ ]
service group new name "web" services [ "http" "https" ]
service group new name "default-internet" services [ "http" "https" "domain-udp" "icmp-echo-req" "ftp" ]
rule group new name "default"
rule group new name "dmz"
rule group new name "blocked"
rule new group "default" src "internal-network" dst "internet" service "default-internet" comment "LAN to the internet" flags [ "ACCEPT" "HIDENAT" "LOG" ] nat_node "external-interface"
rule new group "dmz" src "internet" dst "webserver" service "https" comment "publish the web server" flags [ "ACCEPT" "DESTNAT" "LOG_ALL" ] nat_node "external-interface" nat_service "extern-https"
rule new group "blocked" src "printers" dst "internet" service "any" comment "printers stay inside" flags [ "REJECT" ]
rule new group "default" src "lan6" dst "internet6" service "web" comment "LAN IPv6 web" flags [ "ACCEPT" ]
rule new group "default" src "internal-network" dst "internal-interface" service "domain-udp" comment "DNS of the UTM" flags [ "ACCEPT" ]
rule new group "dmz" src "internet" dst "mailserver" service "smtp" comment "publish the mail server" flags [ "ACCEPT" "DESTNAT" ] nat_node "public-mail" nat_service "smtp"
rule new group "dmz" src "admins-and-partner" dst "servers" service "ssh" comment "administration" flags [ "ACCEPT" "LOG_ALL" ]
rule new group "dmz" src "dmz1-network" dst "internet" service "any" flags [ "ACCEPT" "HIDENAT" ] nat_node "external-interface"
rule new group "blocked" src "internal-network" dst "blocked-region" service "any" comment "a region" flags [ "DROP" "LOG" ]
rule new group "default" src "partner-net" dst "internal-network" service "any" comment "VPN partner, not hidden" flags [ "ACCEPT" "HIDENAT_EXCLUDE" ]
rule new group "default" src "internal-network" dst "update-host" service "https" flags [ "STATELESS" ]
rule new group "dmz" src "internal-network" dst "dmz1-network" service "app-ports" flags [ "QOS" ]
rule new group "default" src "admin-pc" dst "any" service "icmp-echo-req" comment "ping from the admin" flags [ "ACCEPT" ]
rule new group "default" src "internal-network" dst "partner-net" service "ntp-client" flags [ "ACCEPT" "NETMAP" ] nat_node "internal-network"
rule new group "default" src "lan6" dst "internet6" service "icmpv6-echo" flags [ "ACCEPT" ]
rule new group "dmz" src "internal-network" dst "webserver" service "gre" flags [ "ACCEPT" "MIRROR" ]
rule new group "blocked" src "internal-network" dst "mailserver" service "smtp" comment "only the mail server sends" flags [ "DROP" ]
rule new group "default" src "internet" dst "webserver" service "https" comment "a rule above the forward sees the server" flags [ "DROP" ]
rule implied group set implied_group "12" active "1"
