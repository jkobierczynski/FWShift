firewall {
    all-ping enable
    broadcast-ping disable
    group {
        address-group NAS {
            address 192.168.1.20
            address 192.168.1.21
            description "file servers"
        }
        network-group TRUSTED {
            network 192.168.1.0/25
            network 10.8.0.0/24
        }
        port-group MEDIA {
            port 32400
            port 8096-8097
        }
        ipv6-network-group LAN6 {
            ipv6-network 2001:db8:1::/64
        }
    }
    ipv6-name WANv6_IN {
        default-action drop
        description "WAN inbound traffic forwarded to LAN"
        rule 10 {
            action accept
            description "Allow established/related sessions"
            state {
                established enable
                related enable
            }
        }
        rule 20 {
            action drop
            description "Drop invalid state"
            state {
                invalid enable
            }
        }
        rule 30 {
            action accept
            description "Allow IPv6 ping"
            icmpv6 {
                type ping
            }
            protocol icmpv6
        }
    }
    name GUEST_IN {
        default-action accept
        rule 10 {
            action drop
            description "no way into the LAN"
            destination {
                group {
                    network-group TRUSTED
                }
            }
            log enable
            protocol all
        }
        rule 20 {
            action drop
            description "only web and dns out"
            destination {
                port !53,80,443
            }
            protocol tcp_udp
        }
    }
    name LAN_OUT {
        default-action accept
        rule 10 {
            action reject
            description "no media from the guests"
            destination {
                group {
                    port-group MEDIA
                }
            }
            protocol all
            source {
                address 192.168.10.0/24
            }
        }
    }
    name WAN_IN {
        default-action drop
        description "WAN to internal"
        rule 10 {
            action accept
            description "Allow established/related"
            state {
                established enable
                related enable
            }
        }
        rule 20 {
            action drop
            description "Drop invalid state"
            state {
                invalid enable
            }
        }
        rule 30 {
            action accept
            description "plex to the media box"
            destination {
                address 192.168.1.30
                port 32400
            }
            protocol tcp
        }
        rule 40 {
            action accept
            description "ping the nas"
            destination {
                group {
                    address-group NAS
                }
            }
            icmp {
                type-name ping
            }
            protocol icmp
        }
        rule 50 {
            action accept
            description "old rule"
            destination {
                address 192.168.1.40
            }
            disable
            protocol tcp
        }
        rule 60 {
            action accept
            description "syn to the mail server"
            destination {
                address 192.168.1.25
                port 25
            }
            protocol tcp
            tcp {
                flags SYN,!ACK
            }
        }
        rule 70 {
            action accept
            description "sessions of the voip box"
            recent {
                count 5
                time 60
            }
            source {
                mac-address 00:53:00:12:34:56
            }
        }
    }
    name WAN_LOCAL {
        default-action drop
        rule 10 {
            action accept
            state {
                established enable
                related enable
            }
        }
        rule 20 {
            action accept
            destination {
                port 1194
            }
            protocol udp
        }
    }
    options {
        mss-clamp {
            interface-type pppoe
            mss 1452
        }
    }
    receive-redirects disable
    send-redirects enable
    source-validation disable
    syn-cookies enable
}
interfaces {
    ethernet eth0 {
        description Internet
        duplex auto
        pppoe 0 {
            default-route auto
            firewall {
                in {
                    ipv6-name WANv6_IN
                    name WAN_IN
                }
                local {
                    name WAN_LOCAL
                }
            }
            mtu 1492
            name-server auto
        }
        speed auto
    }
    ethernet eth1 {
        address 192.168.1.1/24
        description LAN
        duplex auto
        firewall {
            out {
                name LAN_OUT
            }
        }
        speed auto
        vif 10 {
            address 192.168.10.1/24
            description Guests
            firewall {
                in {
                    name GUEST_IN
                }
            }
        }
    }
    ethernet eth2 {
        disable
        duplex auto
        speed auto
    }
    loopback lo {
    }
}
port-forward {
    auto-firewall enable
    hairpin-nat enable
    lan-interface eth1
    rule 1 {
        description game
        forward-to {
            address 192.168.1.50
            port 27015
        }
        original-port 27015
        protocol udp
    }
    wan-interface pppoe0
}
service {
    gui {
        http-port 80
        https-port 443
        older-ciphers enable
    }
    nat {
        rule 1 {
            description "plex from outside"
            destination {
                port 32400
            }
            inbound-interface pppoe0
            inside-address {
                address 192.168.1.30
            }
            log disable
            protocol tcp
            type destination
        }
        rule 2 {
            description "web on 8443 to the nas"
            destination {
                address 198.51.100.7
                port 8443
            }
            inbound-interface pppoe0
            inside-address {
                address 192.168.1.20
                port 443
            }
            protocol tcp
            type destination
        }
        rule 5000 {
            description "nas leaves as its own address"
            outbound-interface pppoe0
            outside-address {
                address 198.51.100.7
            }
            protocol all
            source {
                address 192.168.1.20
            }
            type source
        }
        rule 5010 {
            description "masquerade for WAN"
            outbound-interface pppoe0
            protocol all
            type masquerade
        }
    }
    ubnt-discover {
        disable
    }
}
system {
    host-name edge-lab
    offload {
        hwnat disable
        ipv4 {
            forwarding enable
            pppoe enable
            vlan enable
        }
    }
}


