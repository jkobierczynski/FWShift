! ---------- EDR-810-VPN-2GSFP ----------
! Synthetic configuration for the FWShift tests: the CLI-based configuration file of a Moxa
! industrial secure router (System > Config Import/Export). Addresses are RFC 1918 and RFC 5737.
hostname edr-line-a
interface lan
 ip address static 192.168.127.254 255.255.255.0
 exit
interface wan 1
 mode enable
 type static 203.0.113.2 255.255.255.0 203.0.113.1
 exit
interface wan 2
 mode enable
 dmz
 type static 198.51.100.2 255.255.255.0 198.51.100.1
 exit
interface trusted-access lan 192.168.127.0 255.255.255.0 enable
settingcheck firewall
settingcheck timer 180
dos syn-flood 300
dos null-scan
! The policies are first match by index; the file need not list them in that order.
firewall 2
 action drop
 protocol tcp
 dst-port single 23
 interface wan1 lan
 exit
firewall 1
 action accept
 protocol tcp
 src-ip range 192.168.127.10 192.168.127.20
 dst-ip single 172.16.40.5
 dst-port single 502
 interface lan wan1
 exit
firewall 3
 action accept
 protocol tcp
 src-ip range 198.51.100.0 198.51.100.255
 dst-ip single 192.168.127.50
 dst-port single 443
 interface wan1 lan
 exit
firewall 4
 action accept
 protocol udp
 src-ip single 192.168.127.30
 src-port range 1024 65535
 dst-port range 20000 20010
 interface lan wan2
 exit
firewall 5
 action accept
 protocol icmp
 interface lan all
 exit
firewall 6
 action accept
 interface wan2 lan
 exit
firewall 6 disable
firewall 7
 action accept
 mode MAC
 src-mac 00:90:e8:00:00:01
 interface lan wan1
 exit
firewall 8
 action accept
 protocol tcp
 dst-ip range 192.168.127.60 192.168.127.69
 dst-port range 8080 8090
 session-limit 50
 interface wan2 lan
 exit
firewall 9
 action drop
 protocol all
 src-ip range 192.168.127.200 192.168.127.250
 interface lan all
 exit
firewall 10
 action accept
 protocol tcp
 dst-ip single 192.168.127.60
 dst-port single 22
 interface wan2 lan
 exit
modbus-filter 1
 action drop
 protocol tcp
 function 6
 interface wan1 lan
 exit
l2-filter 1 enable
ip nat static tcp inside lan 192.168.127.50 443 outside wan 1 8443
ip nat static inside lan 192.168.127.60 outside wan 2 198.51.100.60
ip nat dynamic inside lan 192.168.127.1 192.168.127.199 outside wan 1
ip nat dynamic inside lan 192.168.127.200 192.168.127.250 outside wan auto
ip nat 4 disable
